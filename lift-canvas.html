<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftCanvas">
<title>LiftCanvas（リフトキャンバス）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310284a'/%3E%3Cpolyline points='12,45 25,33 35,38 52,19' fill='none' stroke='%235b9dff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='19' r='5.5' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f8;
  --surface:#ffffff;
  --surface-2:#f6f8fb;
  --line:#e1e6ee;
  --line-strong:#c9d2df;
  --navy:#10284a;
  --navy-2:#24426e;
  --blue:#1d5fd8;
  --blue-press:#174fb6;
  --blue-soft:#eaf1ff;
  --blue-soft-2:#d3e2ff;
  --text:#16202f;
  --muted:#566173;
  --faint:#87919f;
  --ok:#0e8a5d;
  --ok-soft:#e3f6ed;
  --gold:#9a5600;
  --gold-soft:#fff1d6;
  --danger:#c53030;
  --danger-soft:#fdeeee;
  --r-lg:16px;
  --r:12px;
  --shadow:0 1px 2px rgba(16,40,74,.05),0 4px 14px rgba(16,40,74,.05);
  --tabbar-h:64px;
  --timer-h:0px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding-top:calc(var(--timer-h) + var(--safe-top));
  padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 24px);
  transition:padding-top .2s ease;
}
body.timer-on{--timer-h:60px}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid rgba(29,95,216,.45);outline-offset:2px}
svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding:0 16px}
.view[hidden]{display:none}

/* ---------- 見出し ---------- */
.view-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;flex:none}
.brand-mark svg{width:26px;height:26px;stroke:#6aa6ff;stroke-width:3}
.eyebrow{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.06em;line-height:1.2}
h1{font-size:23px;line-height:1.25;color:var(--navy);margin:0;font-weight:800;letter-spacing:.01em}
h2{font-size:18px;color:var(--navy);margin:0;font-weight:800}
h3{font-size:16px;color:var(--navy);margin:0;font-weight:800}
.section{margin:22px 0 0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:48px}
.sub-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.sub-title::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--blue)}
.sub-title.quiet::before{background:var(--line-strong)}
.hint{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.hint.small{font-size:12.5px}
.muted{color:var(--muted)}

/* ---------- カード ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:6px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--muted);padding:24px 16px}
.empty-mini{font-size:14px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:var(--r);padding:12px;margin:0}

/* ---------- ボタン ---------- */
.btn{min-height:48px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--navy);font-weight:700;font-size:16px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.25;transition:background .15s,border-color .15s,transform .05s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:active:not(:disabled){background:var(--blue-press)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-outline{background:var(--surface);border-color:var(--blue-soft-2);color:var(--blue)}
.btn-soft{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-ghost{background:var(--surface);border-color:#efc7c7;color:var(--danger)}
.btn-block{width:100%;display:flex;padding:8px 14px;text-align:center}
.btn-lg{min-height:56px;font-size:17px}
.btn + .btn-block,.btn-block + .btn-block{margin-top:10px}
.btn-icon{width:48px;padding:0}
.icon-btn{width:48px;height:48px;border-radius:var(--r);border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center;flex:none}
.icon-btn:active{background:var(--surface-2)}
.link-btn{min-height:48px;border:0;background:none;color:var(--blue);font-weight:700;font-size:15px;padding:0 4px}
.row{display:flex;gap:10px;align-items:center}
.row > .btn{flex:1}

/* ---------- チップ・セグメント ---------- */
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-scroll::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-weight:700;font-size:14.5px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e7ebf2;border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted);font-size:14.5px;padding:2px 4px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(16,40,74,.14)}
.seg button small{display:block;font-size:10.5px;font-weight:700;opacity:.8}

/* ---------- バッジ ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;line-height:1.4}
.badge-beat{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-soft-2)}
.badge-pr{background:var(--gold-soft);color:var(--gold);border-color:#f4d9a6}
.badge-custom{background:#eef6ff;color:#2a5ca8;border-color:#d1e3fb}
.badge-live{background:var(--ok-soft);color:var(--ok);border-color:#bfe8d4}
.tag{display:inline-flex;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}

/* ---------- フォーム ---------- */
.field{display:block;margin:0 0 18px}
.field-label{display:block;font-size:14px;font-weight:800;color:var(--navy);margin-bottom:8px}
.field-label em{font-style:normal;font-size:11px;color:#fff;background:var(--blue);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.input,textarea.input{width:100%;min-height:48px;border:1px solid var(--line-strong);border-radius:var(--r);padding:10px 14px;font-size:16px;background:var(--surface);color:var(--text)}
textarea.input{resize:vertical;min-height:72px;line-height:1.5}
.input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(29,95,216,.15)}
.search{position:relative;margin:12px 0 10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:42px}
.big-stepper{display:flex;align-items:center;gap:10px}
.big-stepper button{width:56px;height:52px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface-2);font-size:24px;font-weight:700;color:var(--navy)}
.big-stepper input{width:84px;height:52px;text-align:center;font-size:22px;font-weight:800;color:var(--navy);border:1px solid var(--line-strong);border-radius:var(--r)}
.big-stepper span{font-weight:700;color:var(--muted)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-top:1px solid var(--line);padding:6px 0}
.switch-row:first-of-type{border-top:0}
.switch-row .sr-text b{display:block;color:var(--navy);font-size:15.5px}
.switch-row .sr-text span{font-size:13px;color:var(--muted)}
.switch{position:relative;width:56px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#cdd4df;transition:background .2s}
.switch span::after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + span{background:var(--blue)}
.switch input:checked + span::after{transform:translateX(24px)}
.switch input:focus-visible + span{outline:3px solid rgba(29,95,216,.45);outline-offset:2px}

/* ---------- 記録ホーム ---------- */
.hero{background:linear-gradient(135deg,#10284a 0%,#1c4685 100%);color:#fff;border:0}
.hero-date{font-size:15px;font-weight:700;opacity:.9}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hero-stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 8px;text-align:center}
.hero-stats b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-stats b small{font-size:13px;margin-left:2px;font-weight:700;opacity:.85}
.hero-stats span{font-size:12px;opacity:.85}
.hero-note{font-size:11.5px;opacity:.7;margin-top:8px;text-align:right}
.welcome{border-color:var(--blue-soft-2);background:#f7faff}
.welcome ol{margin:8px 0 12px;padding-left:22px;color:var(--text);font-size:14.5px}
.welcome li{margin:4px 0}
.menu-card{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.menu-card-main{flex:1;min-width:0}
.menu-name{font-size:17px}
.menu-meta{font-size:13px;color:var(--muted);margin-top:2px}
.menu-ex{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:8px}
.menu-ex span{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.btn-start{min-width:84px;min-height:52px;flex:none}
.day-card{padding:12px 14px}
.day-head{font-weight:800;color:var(--navy);font-size:14.5px;margin-bottom:4px}
.day-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;border:0;border-top:1px solid var(--line);background:none;padding:6px 0;text-align:left}
.day-row:first-of-type{border-top:0}
.day-row .dr-name{font-weight:700;color:var(--text);font-size:15px}
.day-row .dr-sets{font-size:13px;color:var(--muted)}
.day-row svg{color:var(--faint)}

/* ---------- トレーニング中 ---------- */
.session-head{padding:14px}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-titles{flex:1;min-width:0}
.live{display:flex;align-items:center;gap:6px;color:var(--ok)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,138,93,.18);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(14,138,93,0)}}
.sh-name{font-size:19px;font-weight:800;color:var(--navy);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-tools{display:flex;gap:8px;margin-top:12px}
.date-field{position:relative;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);flex:1;min-width:0;color:var(--muted);overflow:hidden}
.date-field .df-text{font-weight:800;color:var(--navy);font-size:15px;white-space:nowrap;line-height:1.2}
.date-field .df-text small{display:block;font-size:11px;font-weight:700;color:var(--faint)}
.date-field input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;cursor:pointer;font-size:16px}
.date-field:focus-within{border-color:var(--blue)}
.btn-timer{flex:none;padding:0 12px;font-size:15px}
.btn-timer small{font-size:11px;font-weight:700;opacity:.8}
.ex-tabs{position:sticky;top:calc(var(--timer-h) + var(--safe-top));z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;margin:0 -16px 10px;background:rgba(242,244,248,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);scrollbar-width:none;transition:top .2s ease}
.ex-tabs::-webkit-scrollbar{display:none}
.ex-tab{flex:none;min-height:48px;max-width:220px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:4px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;color:var(--muted)}
.ex-tab .n{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:12px;display:grid;place-items:center;flex:none}
.ex-tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-tab .cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.ex-tab.active{border-color:var(--navy);background:var(--navy);color:#fff}
.ex-tab.active .n{background:rgba(255,255,255,.15);border-color:transparent}
.ex-tab.active .cnt{color:rgba(255,255,255,.75)}
.ex-tab.complete:not(.active){border-color:#bfe8d4;background:var(--ok-soft);color:var(--ok)}
.ex-tab.complete .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.ex-tab.add{border-style:dashed;color:var(--blue);border-color:var(--blue-soft-2)}
.ex-panel{padding:16px 14px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.ex-title-row{display:flex;align-items:center;gap:6px;margin:6px 0 2px}
.ex-title{flex:1;font-size:22px;line-height:1.3}
.target-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.target-row .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.mini-stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mini-stepper button{width:44px;height:48px;border:0;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--navy)}
.mini-stepper b{min-width:56px;text-align:center;font-size:17px;color:var(--navy);font-variant-numeric:tabular-nums}
.recent-list{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.recent-list li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.recent-list li:first-child{border-top:0;background:#f8fbff}
.rl-date{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap;padding-top:1px}
.recent-list li:first-child .rl-date{color:var(--blue)}
.rl-sets{font-size:15px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;word-break:break-word}
.rl-memo{grid-column:2;font-size:13px;color:var(--muted)}
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:14px 0 2px;padding:10px 12px;border-radius:var(--r);background:#f4f8ff;border:1px solid var(--blue-soft-2)}
.suggest-badge{font-size:13.5px;font-weight:800;color:var(--blue);background:var(--surface);border:1px solid var(--blue-soft-2);border-radius:999px;padding:3px 10px;white-space:nowrap}
.suggest-why{font-size:12.5px;color:var(--muted);flex:1 1 180px}
.suggest-actions{display:flex;gap:8px;width:100%}
.suggest-actions button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--blue-soft-2);background:var(--surface);color:var(--blue);font-weight:700;font-size:14px}
.suggest-note{width:100%;font-size:11.5px;color:var(--faint)}
.set-head,.set-row{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) 52px;gap:6px;align-items:center}
.set-head{font-size:11.5px;font-weight:700;color:var(--faint);padding:0 2px 4px;text-align:center}
.set-row{padding:5px 2px;border-radius:12px;transition:background .2s}
.set-row.is-done{background:var(--ok-soft)}
.set-no{height:48px;border:0;background:none;font-weight:800;color:var(--muted);font-size:16px;border-radius:8px;padding:0}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);overflow:hidden;height:50px;min-width:0}
.stepper button{width:32px;flex:none;border:0;background:var(--surface-2);color:var(--navy);font-size:20px;font-weight:700;padding:0}
.stepper button:active{background:var(--blue-soft)}
.stepper input{flex:1;min-width:0;width:100%;border:0;text-align:center;font-size:18px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;padding:0;background:transparent}
.stepper input::placeholder{color:#b3bccb;font-weight:700}
.stepper input:focus{outline:none;background:#f4f8ff}
.stepper:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,216,.12)}
.is-done .stepper{border-color:#a9dcc4}
.done-btn{height:50px;width:52px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);color:#c3cad6;display:grid;place-items:center;padding:0}
.done-btn svg{width:26px;height:26px;stroke-width:3}
.done-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.set-badges{display:flex;gap:6px;justify-content:flex-end;padding:2px 4px 6px;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.set-actions{display:flex;gap:8px;margin-top:10px}
.set-actions .btn{flex:1}
.memo-label{display:block;margin-top:16px}
.memo-label span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
.related{background:transparent;border:1px dashed var(--line-strong);box-shadow:none;padding:12px 14px}
.related .sub-title{margin-top:2px}
.rel-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.rel-item:first-of-type{border-top:0}
.rel-main{flex:1;min-width:0}
.rel-name{font-size:14.5px;font-weight:700;color:var(--text)}
.rel-sub{font-size:12.5px;color:var(--faint)}
.rel-item .btn{min-height:44px;padding:0 12px;font-size:13.5px;color:var(--muted);border-color:var(--line)}
.ex-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin:4px 0 12px}
.finish-wrap{margin-top:8px}

/* ---------- 管理 ---------- */
.mm-head{display:flex;align-items:baseline;gap:10px}
.mm-name{font-size:17px;font-weight:800;color:var(--navy);flex:1;min-width:0;word-break:break-word}
.mm-count{font-size:13px;color:var(--muted);white-space:nowrap}
.mm-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;padding:0;list-style:none;counter-reset:mm}
.mm-list li{counter-increment:mm;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--text)}
.mm-list li::before{content:counter(mm) ". ";color:var(--faint);font-weight:700}
.mm-actions{display:flex;gap:8px}
.mm-actions .btn{flex:1;padding:0 8px;font-size:15px;white-space:nowrap}
.mm-actions .btn-icon{flex:none}
.group-title{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:18px 0 8px}
.group-title span{font-size:12px;color:var(--faint);font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list-item{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left}
.list-item:first-child{border-top:0}
.list-item:active{background:var(--surface-2)}
.li-main{flex:1;min-width:0}
.li-title{font-weight:700;font-size:15.5px;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.li-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.list-item > svg{color:var(--faint)}
.list-item.selected{background:#f2f7ff}
.list-item:disabled{opacity:.5}
.check-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none;color:transparent}
.selected .check-circle{background:var(--blue);border-color:var(--blue);color:#fff}
.check-circle svg{width:16px;height:16px;stroke-width:3}
.edit-list{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.edit-list li{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-top:1px solid var(--line);background:var(--surface)}
.edit-list li:first-child{border-top:0}
.edit-list .el-n{width:22px;font-weight:800;color:var(--faint);font-size:13px}
.edit-list .el-name{flex:1;min-width:0;font-weight:700;font-size:15px}
.edit-list .el-name small{display:block;font-weight:600;color:var(--faint);font-size:12px}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:0 0 16px}
.info-grid dt{color:var(--muted);font-weight:700}
.info-grid dd{margin:0;color:var(--text);font-weight:700}

/* ---------- グラフ ---------- */
.ex-select{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-lg);padding:8px 14px;text-align:left;box-shadow:var(--shadow)}
.ex-select .es-main{flex:1;min-width:0}
.ex-select b{display:block;font-size:18px;color:var(--navy);line-height:1.3}
.ex-select svg{color:var(--blue)}
.metric-desc{font-size:12.5px;color:var(--muted);margin:6px 2px 12px}
.chart-card{padding:14px 12px 12px}
.growth{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px;margin:12px 4px 6px}
.growth-label{font-size:12.5px;font-weight:700;color:var(--muted);width:100%}
.growth-val{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--navy)}
.growth-val small{font-size:16px;font-weight:800;margin-left:4px}
.growth-val.up{color:var(--ok)}
.growth-val.down{color:#b5482a}
.growth-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart-wrap{position:relative;height:270px;margin-top:6px}
.chart-wrap canvas{display:block;width:100%;height:100%}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;padding:16px;background:var(--surface-2);border-radius:var(--r)}
.chart-hint{font-size:12px;color:var(--faint);text-align:center;margin:6px 0 0}
.point-detail{margin-top:10px;background:#f4f8ff;border:1px solid var(--blue-soft-2);border-radius:var(--r);padding:10px 12px}
.pd-date{font-size:12.5px;font-weight:800;color:var(--blue)}
.pd-sets{font-size:16px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-word}
.pd-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow)}
.stat-tile span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.stat-tile b{display:block;font-size:21px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.3}
.stat-tile small{display:block;font-size:11.5px;color:var(--faint)}
.hist-item{padding:12px 14px}
.hist-top{display:flex;align-items:center;gap:8px;margin:-6px -8px 0 0}
.hist-date{flex:1;font-weight:800;color:var(--navy);font-size:14.5px}
.hist-sets{font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;word-break:break-word}
.hist-metrics{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.hist-metrics b{color:var(--navy);font-variant-numeric:tabular-nums}
.hist-memo{font-size:13px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.demo-banner{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid #f1d6a0;color:#6b4200;border-radius:var(--r);padding:8px 8px 8px 12px;font-size:13.5px;margin-bottom:12px}
.demo-banner span{flex:1}
.demo-banner .btn{min-height:44px;font-size:13.5px;padding:0 12px;color:#6b4200;border-color:#e8c88c;background:#fff9ec}

/* ---------- バックアップ ---------- */
.data-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.data-stats b{display:block;font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}
.data-stats span{font-size:11.5px;color:var(--muted)}
.last-backup{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:var(--r);background:var(--surface-2);color:var(--muted)}
.last-backup.warn{background:var(--gold-soft);color:#6b4200}
.notice{font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--muted);margin:10px 0}
.details{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.details summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;color:var(--navy);cursor:pointer;list-style:none}
.details summary::-webkit-details-marker{display:none}
.details summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.details[open] summary::after{transform:rotate(-135deg)}
.details-body{padding:4px 14px 14px}
.steps{margin:10px 0;padding-left:20px;font-size:13.5px;color:var(--text)}
.steps li{margin:6px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#e9edf4;border-radius:5px;padding:1px 5px;word-break:break-all}
.danger-zone{border-color:#f0d0d0}
.app-info{text-align:center;font-size:12px;color:var(--faint);margin:20px 0 8px}
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset-grid .chip{border-radius:var(--r);width:100%}

/* ---------- タブバー ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabbar-inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:600px;margin:0 auto}
.tab{position:relative;height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--faint);font-size:11.5px;font-weight:700;padding:0 2px;line-height:1.2}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--blue)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.tab .tab-dot{position:absolute;top:10px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid #fff}

/* ---------- 休憩タイマー ---------- */
.timer-bar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--navy);color:#fff;padding-top:var(--safe-top);box-shadow:0 2px 10px rgba(16,40,74,.25)}
.timer-bar[hidden]{display:none}
.timer-inner{max-width:600px;margin:0 auto;height:60px;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px}
.timer-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;opacity:.9;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:72px;text-align:right}
.timer-btns{display:flex;gap:6px}
.timer-btns button{min-width:48px;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:13px;padding:0 6px;display:grid;place-items:center}
.timer-progress{height:3px;background:#5b9dff;transform-origin:left;transform:scaleX(1);transition:transform .25s linear}
.timer-bar.is-done{background:var(--ok)}
.timer-bar.is-done .timer-progress{background:transparent}
.timer-bar.is-done .t-adj{display:none}

/* ---------- シート ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(12,24,44,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet-backdrop.closing{animation:fadeout .18s ease forwards}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);outline:none;box-shadow:0 -6px 30px rgba(12,24,44,.2)}
.closing .sheet{animation:down .18s ease forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes down{to{transform:translateY(40px)}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 18px;border-bottom:1px solid var(--line);min-height:60px}
.sheet-title{flex:1;font-size:18px;line-height:1.3}
.sheet-body{overflow-y:auto;padding:16px 16px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.sheet-foot{display:flex;gap:10px;padding:12px 16px calc(12px + var(--safe-bottom));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.sheet-foot .btn-primary{flex:1.6}
.sheet-msg{font-size:15px;color:var(--text);margin:0 0 16px}
.sheet-msg p{margin:0 0 8px}
.choice-list{display:flex;flex-direction:column;gap:10px;padding-bottom:var(--safe-bottom)}
.choice{flex-direction:column;align-items:flex-start;text-align:left;padding:12px 16px;gap:2px}
.choice-desc{font-size:12.5px;font-weight:500;opacity:.85}
.choice.btn-outline.danger{color:var(--danger);border-color:#efc7c7}
.import-info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:12px}
.import-info span{color:var(--muted)}
.import-info b{color:var(--navy)}
.picker-top{position:sticky;top:-16px;background:var(--surface);z-index:2;margin:-16px -16px 0;padding:4px 16px 2px;border-bottom:1px solid var(--line)}
.picker-top .search{margin:8px 0}
.summary-hero{text-align:center;padding:8px 0 14px}
.summary-hero .big{font-size:24px;font-weight:800;color:var(--navy)}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.summary-grid div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.summary-grid b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.summary-grid span{font-size:12px;color:var(--muted)}
.sum-ex{border-top:1px solid var(--line);padding:10px 0}
.sum-ex-name{font-weight:800;color:var(--navy);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sum-ex-sets{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.edit-set{display:grid;grid-template-columns:28px 1fr auto 1fr auto 48px;gap:6px;align-items:center;margin-bottom:8px}
.edit-set .input{text-align:center;font-weight:800;font-size:17px;padding:8px 6px}
.edit-set .u{font-size:13px;color:var(--muted)}
.edit-set .no{font-weight:800;color:var(--faint);text-align:center}

/* ---------- トースト・処理中 ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 14px);transform:translate(-50%,20px);z-index:400;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;box-shadow:0 6px 24px rgba(12,24,44,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);width:max-content;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.sheet-open .toast{bottom:auto;top:calc(var(--safe-top) + 14px)}
.toast.ok{background:var(--ok)}
.toast.error{background:var(--danger)}
.busy{position:fixed;inset:0;z-index:500;background:rgba(255,255,255,.75);display:grid;place-items:center}
.busy[hidden]{display:none}
.busy-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-weight:700;color:var(--navy)}
.spinner{width:24px;height:24px;border-radius:50%;border:3px solid var(--blue-soft-2);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:370px){
  .app{padding:0 12px}
  .ex-tabs{margin:0 -12px 10px;padding:10px 12px}
  .ex-panel{padding:14px 10px}
  .stepper button{width:28px}
  .set-head,.set-row{grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) 48px;gap:5px}
  .done-btn{width:48px}
  h1{font-size:21px}
  .mm-actions .btn{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 初期種目マスターデータ（全63種目） ---------- */
const MASTER_EXERCISES = [

const round1 = (v) => Math.round(v * 10) / 10;
const round2 = (v) => Math.round(v * 100) / 100;
function ymd(d = new Date()) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function dayNum(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; }
function fmtDate(s, withYear = false) {
  const d = parseYmd(s);
  const base = (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ')';
  return (withYear || d.getFullYear() !== new Date().getFullYear()) ? d.getFullYear() + '/' + base : base;
}
function fmtDateLong(s) { const d = parseYmd(s); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`; }
function fmtDateTime(ts) { if (!ts) return '-'; const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtNum(v) { if (v == null || !isFinite(v)) return '-'; return String(round2(v)); }
function fmtBig(v) { if (v == null || !isFinite(v)) return '-'; return Math.round(v).toLocaleString('ja-JP'); }
function fmtSec(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); }
function fmtMetric(v, metric) {
  if (metric === 'reps') return fmtNum(v) + '回';
  if (metric === 'volume') return fmtBig(v) + 'kg';
  return fmtNum(round1(v)) + 'kg';
}
function parseNum(str) {
  if (str == null) return null;
  const t = String(str).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[．。，,]/g, '.').replace(/\s/g, '');
  if (t === '') return null;
  const n = Number(t);
  return isFinite(n) && n >= 0 ? n : null;
}

  }));

    if (num(o.stepKg) > 0) x.stepKg = num(o.stepKg);

  }
  if (Array.isArray(d.menus)) {
    out.menus = d.menus.filter((m) => m && m.id).map((m) => ({
      id: String(m.id), name: String(m.name || '種目セット').slice(0, 40),

      sets: arr(r.sets).slice(0, 50).map((s) => {

      }),

  });
  out.sessions = arr(d.sessions).filter((s) => s && s.id).map((s) => ({
    id: String(s.id), name: String(s.name || ''), menuId: s.menuId ? String(s.menuId) : null,
    date: isDate(s.date) ? s.date : '', startedAt: num(s.startedAt) || 0, endedAt: num(s.endedAt) || 0,
    updatedAt: num(s.updatedAt) || num(s.endedAt) || 0
  }));
  const st = obj(d.settings);
  out.settings = {
    restSec: clamp(Math.round(num(st.restSec) || 90), 10, 900),
    autoRest: st.autoRest === undefined ? true : !!st.autoRest,
    sound: st.sound === undefined ? true : !!st.sound,
    googleClientId: typeof st.googleClientId === 'string' ? st.googleClientId.trim() : '',
    lastBackupAt: num(st.lastBackupAt),
    lastBackupVia: typeof st.lastBackupVia === 'string' ? st.lastBackupVia : ''
  };
  const ui = obj(d.ui);
  out.ui = {
    graphExId: ui.graphExId ? String(ui.graphExId) : null,
    metric: METRICS[ui.metric] ? ui.metric : 'maxW',
    period: PERIODS.some((p) => p.key === ui.period) ? ui.period : '3m',
    welcomeDone: !!ui.welcomeDone
  };
  const a = obj(d.active);
  if (a.id && Array.isArray(a.exerciseIds)) {
    out.active = {
      id: String(a.id), name: String(a.name || 'トレーニング'), menuId: a.menuId ? String(a.menuId) : null,
      date: isDate(a.date) ? a.date : ymd(), exerciseIds: a.exerciseIds.map(String),
      idx: Math.max(0, Math.round(num(a.idx) || 0)), startedAt: num(a.startedAt) || Date.now()

  }
  const t = obj(d.timer);
  if (num(t.endAt)) out.timer = { endAt: num(t.endAt), dur: num(t.dur) || 90 };
  return out;
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { storageOK = false; }
  if (!raw) return defaultData();
  try {
    return normalize(JSON.parse(raw));
  } catch (e) {
    console.error('保存データの読み込みに失敗しました', e);
    try { localStorage.setItem(STORAGE_KEY + '_broken', raw); } catch (e2) { /* 容量不足など */ }
    setTimeout(() => toast('保存データが読み込めなかったため、初期状態で起動しました', 'error'), 600);
    return defaultData();
  }
}

let saveErrorShown = false;
function save() {
  DB.updatedAt = Date.now();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    storageOK = true;
  } catch (e) {
    storageOK = false;
    if (!saveErrorShown) { saveErrorShown = true; toast('端末への保存に失敗しました。空き容量やプライベートモードをご確認ください', 'error'); }
  }
}

function cleanupDrafts() {

/* ---------- 種目アクセス ---------- */
function exMap() {
  if (exMapCache) return exMapCache;
  const m = new Map();
  for (const e of MASTER_EXERCISES) m.set(e.id, { ...e, ...(DB.overrides[e.id] || {}), custom: false });
  for (const e of DB.customExercises) m.set(e.id, { ...e, custom: true });
  exMapCache = m;
  return m;
}
function invalidateEx() { exMapCache = null; }
function allEx() { return [...exMap().values()]; }
function getEx(id) {
  return exMap().get(id) || { id, name: '（削除された種目）', part: 'その他', equipment: 'その他', stepKg: 2.5, defaultTargetReps: 10, relatedIds: [], custom: false, missing: true };
}
function relatedOf(ex) {
  const ids = [...(ex.relatedIds || [])];
  for (const c of DB.customExercises) if (c.part === ex.part && c.id !== ex.id && !ids.includes(c.id)) ids.push(c.id);
  return ids.filter((id) => id !== ex.id && exMap().has(id)).slice(0, 6);
}
function autoRelated(part, equipment, selfId) {
  const same = allEx().filter((e) => e.part === part && e.id !== selfId);
  same.sort((a, b) => (b.equipment === equipment) - (a.equipment === equipment));
  return same.slice(0, 4).map((e) => e.id);
}
function setTarget(exId, v) {
  v = clamp(Math.round(v), 1, 30);
  const c = DB.customExercises.find((e) => e.id === exId);
  if (c) { c.defaultTargetReps = v; c.updatedAt = Date.now(); }
  else {
    const base = MASTER_EXERCISES.find((e) => e.id === exId);
    if (!base) return;
    const o = { ...(DB.overrides[exId] || {}) };
    if (v === base.defaultTargetReps) delete o.defaultTargetReps; else o.defaultTargetReps = v;
    if (Object.keys(o).length) DB.overrides[exId] = o; else delete DB.overrides[exId];
  }
  invalidateEx(); save();
}

/* ---------- 統計 ---------- */
function doneSets(rec) { return (rec.sets || []).filter((s) => s.done && s.r > 0 && s.w != null && s.w >= 0); }
function e1rm(w, r) { if (!(w > 0) || !(r > 0)) return 0; return r === 1 ? w : w * (1 + r / 30); }
function setsStats(sets) {
  let maxW = 0, best = 0, vol = 0, maxR = 0, totalR = 0;
  for (const s of sets) {
    maxW = Math.max(maxW, s.w); best = Math.max(best, e1rm(s.w, s.r));
    vol += s.w * s.r; maxR = Math.max(maxR, s.r); totalR += s.r;
  }
  return { maxW, e1rm: best, vol, maxR, totalR, n: sets.length };
}
const byDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.updatedAt || 0) - (a.updatedAt || 0));
function exRecords(exId) { return DB.records.filter((r) => r.exerciseId === exId && doneSets(r).length).sort(byDateDesc); }
function prevRecords(exId, sessionId, date) { return exRecords(exId).filter((r) => r.sessionId !== sessionId && (!date || r.date <= date)); }
function exSummary(exId) {
  const recs = exRecords(exId);
  if (!recs.length) return null;
  let maxW = 0;
  for (const r of recs) maxW = Math.max(maxW, setsStats(doneSets(r)).maxW);
  return { last: recs[0].date, maxW, days: new Set(recs.map((r) => r.date)).size };
}
function exercisesWithRecords() {
  const last = new Map();
  for (const r of DB.records) {
    if (!doneSets(r).length) continue;
    const p = last.get(r.exerciseId);
    if (!p || r.date > p) last.set(r.exerciseId, r.date);
  }
  return [...last.entries()].sort((a, b) => (a[1] < b[1] ? 1 : -1)).map(([id, date]) => ({ id, date }));
}
function fmtSets(sets, ex) {
  const groups = [];
  for (const s of sets) {
    const g = groups[groups.length - 1];
    if (g && g.w === s.w) g.r.push(s.r); else groups.push({ w: s.w, r: [s.r] });
  }
  const bw = ex && ex.equipment === '自重';
  return groups.map((g) => {
    const wl = g.w > 0 ? (bw ? `自重+${fmtNum(g.w)}kg` : `${fmtNum(g.w)}kg`) : '自重';
    return `${wl} × ${g.r.join(', ')}回`;
  }).join(' / ');
}
function beatsPrev(s, p) { if (!p) return false; return (s.w > p.w) || (s.w >= p.w && s.r > p.r); }
function trainingStats() {
  const dates = new Set(DB.records.filter((r) => doneSets(r).length).map((r) => r.date));
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const wk = new Date(now); wk.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const weekStart = ymd(wk);
  const monthStart = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
  let week = 0, month = 0;
  for (const d of dates) { if (d >= weekStart) week++; if (d >= monthStart) month++; }
  return { week, month, total: dates.size };
}

/* ---------- シート（下から出るパネル） ---------- */
const sheets = [];
function openSheet(opt) {
  const back = document.createElement('div');
  back.className = 'sheet-backdrop';
  back.style.zIndex = String(200 + sheets.length * 2);
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(opt.title || '')}" tabindex="-1">
    <div class="sheet-head"><h2 class="sheet-title">${esc(opt.title || '')}</h2><button type="button" class="icon-btn" data-s="__close" aria-label="閉じる">${ICON.close}</button></div>
    <div class="sheet-body"></div>${opt.renderFoot ? '<div class="sheet-foot"></div>' : ''}</div>`;
  const s = { el: back, sheet: back.firstElementChild, body: back.querySelector('.sheet-body'), foot: back.querySelector('.sheet-foot'), state: opt.state || {}, closed: false };
  s.render = () => {
    const top = s.body.scrollTop;
    s.body.innerHTML = opt.render(s);
    if (s.foot) s.foot.innerHTML = opt.renderFoot(s);
    s.body.scrollTop = top;
    if (opt.afterRender) opt.afterRender(s);
  };
  s.renderFoot = () => { if (s.foot) s.foot.innerHTML = opt.renderFoot(s); };
  s.close = (result) => {
    if (s.closed) return;
    s.closed = true;
    back.classList.add('closing');
    const i = sheets.indexOf(s); if (i >= 0) sheets.splice(i, 1);
    setTimeout(() => back.remove(), 170);
    if (!sheets.length) document.body.classList.remove('sheet-open');
    if (opt.onClose) opt.onClose(result, s);
  };
  s.tryClose = async () => {
    if (opt.isDirty && opt.isDirty(s)) {
      const ok = await confirmSheet({ title: '編集内容を破棄しますか？', message: '保存していない変更は失われます。', ok: '破棄する', danger: true });
      if (!ok) return;
    }
    s.close();
  };
  back.addEventListener('click', (e) => {
    if (e.target === back) { if (opt.dismissible !== false) s.tryClose(); return; }
    const t = e.target.closest('[data-s]');
    if (!t || !s.sheet.contains(t) || t.disabled) return;
    const name = t.dataset.s;
    if (name === '__close') { s.tryClose(); return; }
    const fn = opt.actions && opt.actions[name];
    if (fn) fn(t, s, e);
  });
  if (opt.onInput) back.addEventListener('input', (e) => opt.onInput(e.target, s, e));
  if (opt.onChange) back.addEventListener('change', (e) => opt.onChange(e.target, s, e));
  document.body.appendChild(back);
  document.body.classList.add('sheet-open');
  sheets.push(s);
  s.opt = opt;
  s.render();
  requestAnimationFrame(() => { try { s.sheet.focus({ preventScroll: true }); } catch (e) { /* noop */ } });
  return s;
}
function confirmSheet({ title, message = '', ok = 'OK', cancel = 'キャンセル', danger = false }) {
  return new Promise((resolve) => {
    let result = false;
    openSheet({
      title,
      render: () => (message ? `<div class="sheet-msg">${message}</div>` : '') +
        `<div class="choice-list"><button type="button" class="btn btn-block btn-lg ${danger ? 'btn-danger' : 'btn-primary'}" data-s="yes">${esc(ok)}</button>
         <button type="button" class="btn btn-block btn-ghost" data-s="__close">${esc(cancel)}</button></div>`,
      actions: { yes: (t, s) => { result = true; s.close(); } },
      onClose: () => resolve(result)
    });
  });
}
function choiceSheet({ title, message = '', choices = [], cancel = 'キャンセル' }) {
  return new Promise((resolve) => {
    let result = null;
    openSheet({
      title,
      render: () => (message ? `<div class="sheet-msg">${message}</div>` : '') +
        `<div class="choice-list">${choices.map((c) => `<button type="button" class="btn btn-block choice ${c.cls || 'btn-outline'}" data-s="choose" data-k="${esc(c.key)}">
          <span>${esc(c.label)}</span>${c.desc ? `<span class="choice-desc">${esc(c.desc)}</span>` : ''}</button>`).join('')}
          <button type="button" class="btn btn-block btn-ghost" data-s="__close">${esc(cancel)}</button></div>`,
      actions: { choose: (t, s) => { result = t.dataset.k; s.close(); } },
      onClose: () => resolve(result)
    });
  });
}

/* ---------- 休憩タイマー ---------- */
const Timer = {
  h: null, audio: null, hideT: null,
  start(sec) {
    sec = Math.round(sec || DB.settings.restSec);
    DB.timer = { endAt: Date.now() + sec * 1000, dur: sec };
    save(); this.unlockAudio(); this.run();
  },
  run() { clearInterval(this.h); clearTimeout(this.hideT); this.h = setInterval(() => this.tick(), 250); this.tick(); },
  add(d) {
    if (!DB.timer) return;
    DB.timer.endAt = Math.max(Date.now() + 1000, DB.timer.endAt + d * 1000);
    DB.timer.dur = Math.max(5, DB.timer.dur + d);
    save(); this.tick();
  },
  stop() { clearInterval(this.h); clearTimeout(this.hideT); if (DB.timer) { DB.timer = null; save(); } this.hide(); },
  tick() {
    const t = DB.timer;
    if (!t) { clearInterval(this.h); return; }
    const ms = t.endAt - Date.now();
    if (ms <= 0) { this.finish(); return; }
    this.show(Math.ceil(ms / 1000), ms / (t.dur * 1000), false);
  },
  finish() {
    clearInterval(this.h);
    DB.timer = null; save();
    this.show(0, 0, true);
    if (DB.settings.sound) this.beep();
    vibrate([250, 120, 250]);
    this.hideT = setTimeout(() => this.hide(), 6000);
  },
  show(sec, ratio, done) {
    const bar = $('#timerBar');
    bar.hidden = false;
    document.body.classList.add('timer-on');
    bar.classList.toggle('is-done', done);
    $('#timerLabel').innerHTML = done ? `${ICON.check}<span>休憩終了！次のセットへ</span>` : `${ICON.timer}<span>休憩中</span>`;
    $('#timerTime').textContent = done ? 'GO' : fmtSec(sec);
    $('#timerProg').style.transform = `scaleX(${clamp(ratio, 0, 1)})`;
  },
  hide() { $('#timerBar').hidden = true; document.body.classList.remove('timer-on'); },
  unlockAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.audio && AC) this.audio = new AC();
      if (this.audio && this.audio.state === 'suspended') this.audio.resume();
    } catch (e) { /* 音声非対応 */ }
  },
  beep() {
    const ctx = this.audio; if (!ctx) return;
    try {
      [0, 0.3, 0.6].forEach((t, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        const at = ctx.currentTime + t;
        o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
        o.connect(g); g.connect(ctx.destination); o.start(at); o.stop(at + 0.25);
      });
    } catch (e) { /* noop */ }
  },
  resume() {
    if (!DB.timer) return;
    if (DB.timer.endAt > Date.now()) this.run(); else { DB.timer = null; save(); }
  }
};

function recentDays(limit) {
  const map = new Map();
  const aid = DB.active ? DB.active.id : null;

/* ---------- トレーニング中 ---------- */
function ensureRecord(a, exId) {
  let r = DB.records.find((x) => x.sessionId === a.id && x.exerciseId === exId);
  if (!r) {
    const prev = prevRecords(exId, a.id, a.date)[0];
    const n = prev ? clamp(doneSets(prev).length, 1, 10) : 3;
    r = { id: uid('rec'), sessionId: a.id, date: a.date, exerciseId: exId, sets: Array.from({ length: n }, () => ({ w: null, r: null, done: false })), memo: '', updatedAt: Date.now() };
    DB.records.push(r);
    save();
  }
  return r;
}
function curRec() {
  const a = DB.active; if (!a) return null;
  const exId = a.exerciseIds[a.idx];
  return exId ? ensureRecord(a, exId) : null;
}
function startSession(ids, name, menuId) {
  ids = [...new Set(ids)].filter((id) => exMap().has(id));
  if (!ids.length) { toast('種目がありません'); return; }
  DB.active = { id: uid('ses'), name, menuId: menuId || null, date: ymd(), exerciseIds: ids, idx: 0, startedAt: Date.now() };
  DB.ui.welcomeDone = true;
  ensureRecord(DB.active, ids[0]);
  save();
  if (UI.tab !== 'record') setTab('record'); else { renderRecord(); window.scrollTo(0, 0); }
  updateTabbar();
  toast(`「${name}」を開始しました`);
}
function gotoExercise(i) {
  const a = DB.active; if (!a) return;
  a.idx = clamp(i, 0, Math.max(0, a.exerciseIds.length - 1));
  if (a.exerciseIds[a.idx]) ensureRecord(a, a.exerciseIds[a.idx]);
  save();
  renderRecord();
  const bar = $('.ex-tabs');
  if (bar) {
    const target = $('.session-head').offsetTop + $('.session-head').offsetHeight - 4;
    if (window.scrollY > target) window.scrollTo(0, target);
  }
}

function renderSession() {
  const a = DB.active;
  if (a.idx >= a.exerciseIds.length) a.idx = Math.max(0, a.exerciseIds.length - 1);
  const exId = a.exerciseIds[a.idx];
  let h = `<div style="height:14px"></div><div class="card session-head">
    <div class="sh-top"><div class="sh-titles"><div class="eyebrow live"><span class="dot"></span>トレーニング中 ・ ${new Date(a.startedAt).getHours()}:${pad2(new Date(a.startedAt).getMinutes())} 開始</div>
    <div class="sh-name">${esc(a.name)}</div></div>
    <button type="button" class="btn btn-outline" data-act="finish-session">終了する</button></div>
    <div class="sh-tools">
      <label class="date-field">${ICON.cal}<span class="df-text">${fmtDate(a.date)}<small>${a.date === ymd() ? '今日・タップで変更' : 'タップで変更'}</small></span><input type="date" data-act="date-picker" data-change="session-date" value="${a.date}" max="${ymd()}" aria-label="トレーニングの日付"></label>
      <button type="button" class="btn btn-soft btn-timer" data-act="timer-start" aria-label="休憩タイマーを開始">${ICON.timer}<span>休憩 ${fmtSec(DB.settings.restSec)}<br><small>${DB.settings.autoRest ? '自動ON' : '手動'}</small></span></button>
      <button type="button" class="btn btn-soft btn-icon" data-act="open-timer-settings" aria-label="休憩タイマーの設定">${ICON.gear}</button>
    </div></div>`;
  h += `<nav class="ex-tabs" aria-label="種目の切り替え">` + a.exerciseIds.map((id, i) => {
    const ex = getEx(id);
    const r = DB.records.find((x) => x.sessionId === a.id && x.exerciseId === id);
    const total = r ? r.sets.length : 0;
    const done = r ? r.sets.filter((s) => s.done).length : 0;
    const complete = done > 0 && done === total;
    return `<button type="button" class="ex-tab ${i === a.idx ? 'active' : ''} ${complete ? 'complete' : ''}" data-act="goto-ex" data-i="${i}" ${i === a.idx ? 'aria-current="true"' : ''}>
      <span class="n">${complete ? '✓' : i + 1}</span><span class="nm">${esc(ex.name)}</span>${total ? `<span class="cnt">${done}/${total}</span>` : ''}</button>`;
  }).join('') + `<button type="button" class="ex-tab add" data-act="session-add-ex">＋ 種目を追加</button></nav>`;

  if (!exId) {
    h += `<div class="card empty"><p>種目がありません。</p><button type="button" class="btn btn-primary" data-act="session-add-ex">＋ 種目を追加</button></div>`;
    return h;
  }
  h += renderExercisePanel(a, exId);
  const isLast = a.idx >= a.exerciseIds.length - 1;
  h += `<div class="ex-nav"><button type="button" class="btn" data-act="prev-ex" ${a.idx === 0 ? 'disabled' : ''}>← 前の種目</button>
    ${isLast ? `<button type="button" class="btn btn-navy" data-act="finish-session">${ICON.check}トレーニング終了</button>` : `<button type="button" class="btn btn-primary" data-act="next-ex">次の種目へ →</button>`}</div>`;
  return h;
}

function renderExercisePanel(a, exId) {
  const ex = getEx(exId);
  const rec = ensureRecord(a, exId);
  const prevs = prevRecords(exId, a.id, a.date);
  const prev = prevs[0];
  const prevDone = prev ? doneSets(prev) : [];
  const target = ex.defaultTargetReps;
  const bw = ex.equipment === '自重';
  let allMax = 0;
  for (const r of prevs) allMax = Math.max(allMax, setsStats(doneSets(r)).maxW);

  let h = `<section class="card ex-panel" aria-label="${esc(ex.name)}">
    <div class="ex-meta"><span class="tag">${esc(ex.part)}</span><span class="tag">${esc(ex.equipment)}</span><span class="tag">刻み ${fmtNum(ex.stepKg)}kg</span>${ex.custom ? '<span class="badge badge-custom">自分で追加</span>' : ''}</div>
    <div class="ex-title-row"><h2 class="ex-title">${esc(ex.name)}</h2><button type="button" class="icon-btn" data-act="ex-more" aria-label="この種目のその他の操作">${ICON.more}</button></div>
    <div class="target-row"><span class="lbl">目標回数</span>
      <div class="mini-stepper"><button type="button" data-act="target-adj" data-d="-1" aria-label="目標回数を減らす">−</button><b>${target}回</b><button type="button" data-act="target-adj" data-d="1" aria-label="目標回数を増やす">＋</button></div>
      <span class="hint" style="margin:0">1セットあたり</span></div>`;

  h += `<div class="sub-title">直近3回の実績</div>`;
  if (prevs.length) {
    h += `<ul class="recent-list">` + prevs.slice(0, 3).map((r, i) => `<li><div class="rl-date">${i === 0 ? '前回 ' : ''}${fmtDate(r.date)}</div>
      <div class="rl-sets">${esc(fmtSets(doneSets(r), ex))}</div>${r.memo ? `<div class="rl-memo">📝 ${esc(r.memo)}</div>` : ''}</li>`).join('') + `</ul>
      <button type="button" class="btn btn-outline btn-block" data-act="copy-prev">${ICON.copy}前回の記録をコピー</button>`;
  } else {
    h += `<p class="empty-mini">この種目はまだ記録がありません。今日が最初の記録です！</p>`;
  }

  if (prevDone.length && prevDone.every((s) => s.r >= target)) {
    const stepLabel = `+${fmtNum(ex.stepKg)}kg`;
    h += `<div class="suggest" role="note"><span class="suggest-badge">参考目安: ${bw ? `+1回 / 加重${stepLabel}` : `${stepLabel} / +1回`}</span>
      <span class="suggest-why">根拠: 前回（${fmtDate(prev.date)}）全${prevDone.length}セットで目標${target}回を達成</span>
      <div class="suggest-actions"><button type="button" data-act="apply-suggest" data-mode="w">${stepLabel}で入力</button><button type="button" data-act="apply-suggest" data-mode="r">+1回で入力</button></div>
      <span class="suggest-note">あくまで目安です。体調やフォームに合わせて自由に調整してください。</span></div>`;
  }

  h += `<div class="sub-title">今日のセット</div>
    <div class="set-head"><span>No.</span><span>${bw ? '追加重量(kg)' : '重量(kg)'}</span><span>回数</span><span>完了</span></div>`;
  h += rec.sets.map((s, i) => {
    let earlier = null;
    for (let k = i - 1; k >= 0; k--) { const e = rec.sets[k]; if (e.w != null && e.r > 0) { earlier = e; break; } }
    const ph = prevDone[i] || earlier || prevDone[prevDone.length - 1] || null;
    const phW = ph ? fmtNum(ph.w) : (bw ? '0' : '');
    const phR = ph ? String(ph.r) : String(target);
    let badges = '';
    if (s.done && s.r > 0 && s.w != null) {
      if (prevDone.length && beatsPrev(s, prevDone[Math.min(i, prevDone.length - 1)])) badges += '<span class="badge badge-beat">前回超え！</span>';
      if (prevs.length && s.w > allMax && s.w > 0) badges += '<span class="badge badge-pr">🏆 自己ベスト！</span>';
    }
    return `<div class="set-row ${s.done ? 'is-done' : ''}">
      <button type="button" class="set-no" data-act="set-del" data-i="${i}" aria-label="セット${i + 1}（タップで削除）">${i + 1}</button>
      <div class="stepper"><button type="button" data-act="set-step" data-f="w" data-d="-1" data-i="${i}" aria-label="重量を減らす">−</button>
        <input data-input="set-w" data-i="${i}" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${s.w == null ? '' : fmtNum(s.w)}" placeholder="${phW}" aria-label="セット${i + 1}の重量（kg）">
        <button type="button" data-act="set-step" data-f="w" data-d="1" data-i="${i}" aria-label="重量を増やす">＋</button></div>
      <div class="stepper"><button type="button" data-act="set-step" data-f="r" data-d="-1" data-i="${i}" aria-label="回数を減らす">−</button>
        <input data-input="set-r" data-i="${i}" inputmode="numeric" enterkeyhint="done" autocomplete="off" value="${s.r == null ? '' : s.r}" placeholder="${phR}" aria-label="セット${i + 1}の回数">
        <button type="button" data-act="set-step" data-f="r" data-d="1" data-i="${i}" aria-label="回数を増やす">＋</button></div>
      <button type="button" class="done-btn" data-act="set-done" data-i="${i}" aria-pressed="${s.done}" aria-label="セット${i + 1}を完了にする">${ICON.check}</button>
    </div>${badges ? `<div class="set-badges">${badges}</div>` : ''}`;
  }).join('');
  h += `<div class="set-actions"><button type="button" class="btn btn-outline" data-act="add-set">${ICON.plus}セットを追加</button></div>
    <p class="hint small">グレーの数字は前回の値です。そのまま✓を押すとその値で記録されます。セット番号をタップすると削除できます。</p>
    <label class="memo-label"><span>メモ（任意）</span><textarea class="input" data-input="rec-memo" rows="2" maxlength="500" placeholder="フォームの気づき・体調など">${esc(rec.memo)}</textarea></label>
  </section>`;

  const rel = relatedOf(ex);
  if (rel.length) {
    h += `<section class="card related" aria-label="関連・代替種目候補"><div class="sub-title quiet">関連・代替種目候補</div>` + rel.map((id) => {
      const rx = getEx(id); const sm = exSummary(id);
      const inSession = a.exerciseIds.includes(id);
      return `<div class="rel-item"><div class="rel-main"><div class="rel-name">${esc(rx.name)}</div>
        <div class="rel-sub">${sm ? `最終 ${fmtDate(sm.last)} ・ 最高 ${fmtNum(sm.maxW)}kg` : '未実施'}</div></div>
        ${inSession ? '<span class="badge">メニュー内</span>' : `<button type="button" class="btn" data-act="rel-swap" data-id="${esc(id)}">${ICON.swap}入替</button><button type="button" class="btn" data-act="rel-add" data-id="${esc(id)}">＋追加</button>`}</div>`;
    }).join('') + `</section>`;
  }
  return h;
}

async function finishSession() {
  const a = DB.active; if (!a) return;
  const recs = DB.records.filter((r) => r.sessionId === a.id);
  const pending = recs.reduce((n, r) => n + r.sets.filter((s) => !s.done && s.w != null && s.r > 0).length, 0);
  const doneCount = recs.reduce((n, r) => n + doneSets(r).length, 0);
  if (pending > 0) {
    const c = await choiceSheet({
      title: 'トレーニングを終了',
      message: `<p>数値は入力済みで、<b>完了✓がついていないセットが ${pending}セット</b> あります。</p>`,
      choices: [
        { key: 'all', label: '入力済みのセットも完了にして終了', cls: 'btn-primary' },
        { key: 'done', label: '完了✓のセットだけ保存して終了', desc: doneCount ? `${doneCount}セットを保存します` : '保存されるセットはありません' }
      ]
    });
    if (!c) return;
    if (c === 'all') recs.forEach((r) => r.sets.forEach((s) => { if (!s.done && s.w != null && s.r > 0) s.done = true; }));
  } else {
    const ok = await confirmSheet({
      title: 'トレーニングを終了しますか？',
      message: doneCount ? `<p>完了したセット: <b>${doneCount}セット</b></p>` : '<p>完了✓のセットがないため、今回の記録は保存されません。</p>',
      ok: '終了する'
    });
    if (!ok) return;
  }
  const summary = sessionSummary(a, recs);
  if (summary.sets > 0) DB.sessions.push({ id: a.id, name: a.name, menuId: a.menuId, date: a.date, startedAt: a.startedAt, endedAt: Date.now(), updatedAt: Date.now() });
  DB.active = null;
  cleanupDrafts();
  save();
  Timer.stop();
  renderRecord(); updateTabbar(); window.scrollTo(0, 0);
  if (summary.sets > 0) showSummary(summary);
  else toast('トレーニングを終了しました');
}
function sessionSummary(a, recs) {
  const items = []; let sets = 0, vol = 0, beats = 0, prs = 0;
  for (const r of recs) {
    const ds = doneSets(r); if (!ds.length) continue;
    const ex = getEx(r.exerciseId);
    const prevs = prevRecords(r.exerciseId, a.id, a.date);
    const pd = prevs[0] ? doneSets(prevs[0]) : [];
    let allMax = 0; for (const p of prevs) allMax = Math.max(allMax, setsStats(doneSets(p)).maxW);
    let b = 0; ds.forEach((s, i) => { if (pd.length && beatsPrev(s, pd[Math.min(i, pd.length - 1)])) b++; });
    const st = setsStats(ds);
    const pr = prevs.length > 0 && st.maxW > allMax && st.maxW > 0;
    sets += ds.length; vol += st.vol; beats += b; if (pr) prs++;
    items.push({ ex, ds, beats: b, pr });
  }
  return { name: a.name, date: a.date, minutes: Math.max(1, Math.round((Date.now() - a.startedAt) / 60000)), items, sets, vol, beats, prs };
}
function showSummary(sm) {
  openSheet({
    title: 'おつかれさまでした！',
    render: () => `<div class="summary-hero"><div class="big">${esc(sm.name)}</div><div class="muted">${fmtDate(sm.date, true)} ・ 約${sm.minutes}分</div></div>
      <div class="summary-grid"><div><b>${sm.items.length}</b><span>種目</span></div><div><b>${sm.sets}</b><span>完了セット</span></div>
      <div><b>${fmtBig(sm.vol)}</b><span>総負荷量（kg）</span></div><div><b>${sm.beats}</b><span>前回超えセット</span></div></div>
      ${sm.prs ? `<p class="hint" style="text-align:center;margin-bottom:10px"><span class="badge badge-pr">🏆 自己ベスト更新 ${sm.prs}種目</span></p>` : ''}
      ${sm.items.map((it) => `<div class="sum-ex"><div class="sum-ex-name">${esc(it.ex.name)}${it.beats ? `<span class="badge badge-beat">前回超え ×${it.beats}</span>` : ''}${it.pr ? '<span class="badge badge-pr">自己ベスト</span>' : ''}</div>
        <div class="sum-ex-sets">${esc(fmtSets(it.ds, it.ex))}</div></div>`).join('')}`,
    renderFoot: () => `<button type="button" class="btn" data-s="__close">閉じる</button><button type="button" class="btn btn-primary" data-s="graph">成長グラフを見る</button>`,
    actions: { graph: (t, s) => { s.close(); DB.ui.graphExId = sm.items[0] ? sm.items[0].ex.id : DB.ui.graphExId; UI.selDate = null; save(); setTab('graph'); } }
  });
}

/* 入力操作 */
function stepSet(el) {
  const rec = curRec(); if (!rec) return;
  const i = +el.dataset.i, f = el.dataset.f, d = +el.dataset.d;
  const s = rec.sets[i]; if (!s) return;
  const ex = getEx(rec.exerciseId);
  const input = el.parentElement.querySelector('input');
  let base = s[f];
  if (base == null) base = parseNum(input.placeholder);
  if (base == null) base = 0;
  let v = f === 'w' ? round2(base + d * ex.stepKg) : Math.round(base + d);
  v = Math.max(0, v);
  if (f === 'r') v = Math.min(v, 999);
  s[f] = v;
  input.value = fmtNum(v);
  rec.updatedAt = Date.now();
  save();
  if (s.done) renderRecord();
}
function toggleDone(i) {
  const rec = curRec(); if (!rec) return;
  const s = rec.sets[i]; if (!s) return;
  const row = $$('.set-row')[i];
  if (!s.done) {
    const inW = row && row.querySelector('[data-input="set-w"]');
    const inR = row && row.querySelector('[data-input="set-r"]');
    if (s.w == null && inW) { const p = parseNum(inW.placeholder); if (p != null) s.w = p; }
    if (s.r == null && inR) { const p = parseNum(inR.placeholder); if (p != null) s.r = Math.round(p); }
    if (s.w == null) { toast('重量を入力してください（自重なら0）'); if (inW) inW.focus(); return; }
    if (!(s.r > 0)) { toast('回数を入力してください'); if (inR) inR.focus(); return; }
    s.done = true;
    vibrate(30);
    if (DB.settings.autoRest) Timer.start(DB.settings.restSec);
  } else {
    s.done = false;
  }
  rec.updatedAt = Date.now();
  save();
  renderRecord();
}

  let h = `<header class="view-header"><div class="brand"><span class="brand-mark">${ICON.logo}</span><div><div class="eyebrow">LiftCanvas</div><h1>種目・メニュー管理</h1></div></div></header>

function renderMenusManage() {

      <button type="button" class="btn btn-icon" data-act="menu-move" data-i="${i}" data-d="1" ${i === DB.menus.length - 1 ? 'disabled' : ''} aria-label="下へ移動">${ICON.down}</button>

function renderExercisesManage() {
  const cats = ['すべて', '自分の種目', ...CATEGORIES];
  return `<button type="button" class="btn btn-primary btn-block btn-lg" data-act="ex-new">${ICON.plus}自分の種目を追加する</button>
    <p class="hint">「ブロッククリーン」「スナッチバランス」やジムの独自マシンなど、自由に登録できます。標準の種目もタップで目標回数・刻みを調整できます。</p>
    <div class="search">${ICON.search}<input type="search" class="input" data-input="ex-search" placeholder="種目名で検索" value="${esc(UI.exQuery)}" aria-label="種目名で検索"></div>
    <div class="chips-scroll" role="group" aria-label="カテゴリ">${cats.map((c) => `<button type="button" class="chip" data-act="ex-cat" data-c="${esc(c)}" aria-pressed="${UI.exCat === c}">${esc(c)}</button>`).join('')}</div>
    <div id="exList">${renderExList()}</div>`;
}
function filterExercises(q, cat) {
  q = (q || '').trim().toLowerCase();
  return allEx().filter((e) => {
    if (cat === '自分の種目' && !e.custom) return false;
    if (cat === '記録あり' && !exSummary(e.id)) return false;
    if (CATEGORIES.includes(cat) && e.part !== cat) return false;
    if (q && !e.name.toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderExList() {
  const list = filterExercises(UI.exQuery, UI.exCat);
  if (!list.length) return `<div class="card empty">該当する種目がありません。${UI.exCat === '自分の種目' ? '<br>上のボタンから追加できます。' : ''}</div>`;
  return CATEGORIES.map((cat) => {
    const items = list.filter((e) => e.part === cat);
    if (!items.length) return '';
    return `<h3 class="group-title">${esc(cat)} <span>${items.length}種目</span></h3><div class="list">${items.map((e) => {
      const sm = exSummary(e.id);
      return `<button type="button" class="list-item" data-act="ex-open" data-id="${esc(e.id)}"><div class="li-main">
        <div class="li-title">${esc(e.name)}${e.custom ? '<span class="badge badge-custom">自分で追加</span>' : ''}</div>
        <div class="li-sub">${esc(e.equipment)} ・ 刻み${fmtNum(e.stepKg)}kg ・ 目標${e.defaultTargetReps}回${sm ? ` ・ 最終 ${fmtDate(sm.last)}` : ''}</div></div>${ICON.chevR}</button>`;
    }).join('')}</div>`;
  }).join('');
}

/* 種目選択シート（単一/複数） */
function pickExercises({ title = '種目を選ぶ', multi = false, exclude = [], initialCat = 'すべて', onDone }) {
  const st = { q: '', cat: initialCat, sel: [] };
  const cats = ['すべて', '記録あり', '自分の種目', ...CATEGORIES];
  const listHtml = () => {
    const list = filterExercises(st.q, st.cat);
    if (!list.length) return `<p class="empty">該当する種目がありません。</p>`;
    const groups = st.cat === '記録あり'
      ? [{ name: '記録がある種目（新しい順）', items: list.sort((a, b) => (exSummary(a.id).last < exSummary(b.id).last ? 1 : -1)) }]
      : CATEGORIES.map((c) => ({ name: c, items: list.filter((e) => e.part === c) }));
    return groups.filter((g) => g.items.length).map((g) => `<h3 class="group-title">${esc(g.name)}</h3><div class="list">${g.items.map((e) => {
      const sm = exSummary(e.id);
      const ex = exclude.includes(e.id);
      const on = st.sel.includes(e.id);
      return `<button type="button" class="list-item ${on ? 'selected' : ''}" data-s="pick" data-id="${esc(e.id)}" ${ex ? 'disabled' : ''}>
        ${multi ? `<span class="check-circle">${ICON.check}</span>` : ''}<div class="li-main"><div class="li-title">${esc(e.name)}${e.custom ? '<span class="badge badge-custom">自分で追加</span>' : ''}${ex ? '<span class="badge">追加済み</span>' : ''}</div>
        <div class="li-sub">${esc(e.equipment)}${sm ? ` ・ 最終 ${fmtDate(sm.last)} ・ 最高 ${fmtNum(sm.maxW)}kg` : ' ・ 未実施'}</div></div>${multi ? '' : ICON.chevR}</button>`;
    }).join('')}</div>`).join('');
  };
  openSheet({
    title, state: st,
    render: () => `<div class="picker-top"><div class="search">${ICON.search}<input type="search" class="input" data-f="q" placeholder="種目名で検索" value="${esc(st.q)}" aria-label="種目名で検索"></div>
      <div class="chips-scroll">${cats.map((c) => `<button type="button" class="chip" data-s="cat" data-v="${esc(c)}" aria-pressed="${st.cat === c}">${esc(c)}</button>`).join('')}</div></div>
      <div class="picker-list">${listHtml()}</div>
      <div style="height:14px"></div><button type="button" class="btn btn-outline btn-block" data-s="create">${ICON.plus}リストにない種目を新しく作る</button>`,
    renderFoot: multi ? () => `<button type="button" class="btn" data-s="__close">キャンセル</button><button type="button" class="btn btn-primary" data-s="confirm" ${st.sel.length ? '' : 'disabled'}>${st.sel.length ? `${st.sel.length}種目を追加` : '種目を選んでください'}</button>` : null,
    onInput: (el, s) => { if (el.dataset.f === 'q') { st.q = el.value; $('.picker-list', s.body).innerHTML = listHtml(); } },
    actions: {
      cat: (t, s) => { st.cat = t.dataset.v; s.render(); },
      pick: (t, s) => {
        const id = t.dataset.id;
        if (!multi) { s.close(); onDone([id]); return; }
        const k = st.sel.indexOf(id);
        if (k >= 0) st.sel.splice(k, 1); else st.sel.push(id);
        t.classList.toggle('selected', k < 0);
        s.renderFoot();
      },
      confirm: (t, s) => { s.close(); onDone([...st.sel]); },
      create: (t, s) => openExerciseForm(null, (newId) => {
        if (multi) { st.sel.push(newId); st.cat = '自分の種目'; s.render(); } else { s.close(); onDone([newId]); }
      }, CATEGORIES.includes(st.cat) ? st.cat : undefined)
    }
  });
}

        const dup = allEx().find((e) => e.name === name && e.id !== id);
        if (dup) {

          if (!ok) return;
        }
        const now = Date.now();
        let newId = id;
        if (ex) {
          const partChanged = ex.part !== st.part;
          Object.assign(ex, { name, part: st.part, equipment: st.equipment, stepKg: st.stepKg, defaultTargetReps: st.reps, updatedAt: now });
          if (partChanged || !ex.relatedIds.length) ex.relatedIds = autoRelated(st.part, st.equipment, ex.id);
        } else {
          newId = uid('custom');
          DB.customExercises.push({ id: newId, name, part: st.part, equipment: st.equipment, stepKg: st.stepKg, defaultTargetReps: st.reps, relatedIds: autoRelated(st.part, st.equipment, newId), createdAt: now, updatedAt: now });

        invalidateEx(); save();
        s.close();
        toast(ex ? '種目を更新しました' : `「${name}」を追加しました`, 'ok');

        if (onSaved) onSaved(newId);

        if (!ok) return;
        deleteCustomExercise(id);
        s.close();
        toast('種目を削除しました');
        renderCurrent();
      }
    }
  });
}
function deleteCustomExercise(id) {
  DB.customExercises = DB.customExercises.filter((e) => e.id !== id);
  DB.records = DB.records.filter((r) => r.exerciseId !== id);
  DB.menus.forEach((m) => { m.exerciseIds = m.exerciseIds.filter((x) => x !== id); });
  if (DB.active) {
    const a = DB.active; const cur = a.exerciseIds[a.idx];
    a.exerciseIds = a.exerciseIds.filter((x) => x !== id);
    a.idx = Math.max(0, cur === id ? Math.min(a.idx, a.exerciseIds.length - 1) : a.exerciseIds.indexOf(cur));
  }
  if (DB.ui.graphExId === id) DB.ui.graphExId = null;
  invalidateEx(); save();
}

/* =====================================================================
   3. 成長グラフ
   ===================================================================== */
function periodStart(p) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (p === '1m') d.setMonth(d.getMonth() - 1);
  else if (p === '3m') d.setMonth(d.getMonth() - 3);
  else if (p === '6m') d.setMonth(d.getMonth() - 6);
  else return null;
  return ymd(d);
}
function dailySeries(exId) {
  const map = new Map();
  const recs = DB.records.filter((r) => r.exerciseId === exId && doneSets(r).length).sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
  for (const r of recs) {
    if (!map.has(r.date)) map.set(r.date, { date: r.date, sets: [], memos: [] });
    const g = map.get(r.date);
    g.sets.push(...doneSets(r));
    if (r.memo) g.memos.push(r.memo);
  }
  return [...map.values()].sort((a, b) => (a.date < b.date ? -1 : 1)).map((g) => ({ ...g, x: dayNum(g.date), stats: setsStats(g.sets) }));
}
function metricVal(stats, metric) {
  if (metric === 'e1rm') return round1(stats.e1rm);
  if (metric === 'volume') return stats.vol;
  if (metric === 'reps') return stats.maxR;
  return stats.maxW;
}
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return m * p;
}
/* 縦軸の自動調整：0始まりにせず、表示データの最小〜最大に約20%（最低±5kg）の余白をとる */
function computeYRange(vals, metric) {
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const range = hi - lo;
  const minPad = metric === 'reps' ? 2 : metric === 'volume' ? Math.max(5, hi * 0.05) : 5;
  const pad = Math.max(range * 0.2, minPad);
  let min = lo - pad, max = hi + pad;
  if (min < 0) min = 0;
  let step = niceStep((max - min) / 5);
  if (metric === 'reps') step = Math.max(1, Math.round(step));
  else step = Math.max(0.5, step);
  min = Math.floor(min / step) * step;
  max = Math.ceil(max / step) * step;
  if (max <= min) max = min + step;
  return { min: round2(min), max: round2(max), step };
}
function computeXRange(pts) {
  const a = pts[0].x, b = pts[pts.length - 1].x;
  if (b - a < 6) { const c = (a + b) / 2; return { min: c - 4, max: c + 4, span: 8 }; }
  const p = Math.max(1, (b - a) * 0.05);
  return { min: a - p, max: b + p, span: b - a };
}
function xLabel(v, xr) {
  const d = new Date(Math.round(v) * 864e5);
  return xr.span > 150 ? `${d.getUTCMonth() + 1}月` : `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}
function fmtTick(v, metric) {
  if (metric === 'volume' && v >= 1000) return Math.round(v).toLocaleString('ja-JP');
  return fmtNum(v);
}

function renderGraph() {
  const v = $('#view-graph');
  const g = DB.ui;
  const withRec = exercisesWithRecords();
  const hasDemo = DB.records.some((r) => r.demo);
  let h = `<header class="view-header"><div class="brand"><span class="brand-mark">${ICON.logo}</span><div><div class="eyebrow">LiftCanvas</div><h1>成長グラフ</h1></div></div></header>`;
  if (chartObj) { chartObj.destroy(); chartObj = null; }
  if (!withRec.length) {
    graphPts = [];
    v.innerHTML = h + `<div class="card empty"><p style="font-size:40px;margin:0">📈</p><p><b>まだ記録がありません</b><br>「記録する」でセットを完了✓にすると、ここに成長の推移が表示されます。</p>
      <button type="button" class="btn btn-primary btn-block" data-act="tab" data-tab="record">記録を始める</button>
      <button type="button" class="btn btn-outline btn-block" data-act="demo-add">サンプル記録でグラフを試してみる</button>
      <p class="hint small">サンプル記録はあとからワンタップで削除できます。</p></div>`;
    return;
  }
  if (!g.graphExId || !withRec.some((x) => x.id === g.graphExId)) { g.graphExId = withRec[0].id; UI.selDate = null; }
  const ex = getEx(g.graphExId);
  const series = dailySeries(ex.id);
  const start = periodStart(g.period);
  const pts = series.filter((p) => !start || p.date >= start).map((p) => ({ ...p, y: metricVal(p.stats, g.metric) }));
  graphPts = pts;
  const m = METRICS[g.metric];
  if (!UI.selDate || !pts.some((p) => p.date === UI.selDate)) UI.selDate = pts.length ? pts[pts.length - 1].date : null;

  if (hasDemo) h += `<div class="demo-banner"><span>サンプル記録を表示中です</span><button type="button" class="btn" data-act="demo-remove">サンプルを削除</button></div>`;
  h += `<button type="button" class="ex-select" data-act="graph-pick-ex"><div class="es-main"><span class="eyebrow">種目（タップで変更）</span><b>${esc(ex.name)}</b></div>${ICON.chevD}</button>
    <div class="chips-scroll" style="margin-top:10px" role="group" aria-label="最近の種目">${[{ id: ex.id }, ...withRec.filter((x) => x.id !== ex.id)].slice(0, 10).map((x) => `<button type="button" class="chip" data-act="graph-ex" data-id="${esc(x.id)}" aria-pressed="${x.id === ex.id}">${esc(getEx(x.id).name)}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="グラフの指標">${Object.entries(METRICS).map(([k, mm]) => `<button type="button" data-act="graph-metric" data-v="${k}" aria-pressed="${g.metric === k}">${mm.label}</button>`).join('')}</div>

  const recs = exRecords(ex.id);
  h += `<section class="section"><div class="section-head"><h2>過去の履歴</h2><span class="muted" style="font-size:13px">${recs.length}件</span></div>`;

function selIndex() { const i = graphPts.findIndex((p) => p.date === UI.selDate); return i >= 0 ? i : graphPts.length - 1; }
function renderPointDetail() {

    ${p.memos.length ? `<div class="pd-sub">📝 ${esc(p.memos.join(' / '))}</div>` : ''}</div>`;
}
function selectPoint(i) {
  if (!graphPts[i]) return;

}
function applyPointStyles(ds) {
  const sel = selIndex(); const many = graphPts.length > 60;
  ds.pointRadius = graphPts.map((_, i) => (i === sel ? 7.5 : many ? 3.5 : 5));
  ds.pointBackgroundColor = graphPts.map((_, i) => (i === sel ? '#10284a' : '#ffffff'));

}
function drawChart() {
  const canvas = $('#lcChart'); if (!canvas || !graphPts.length) return;
  const metric = DB.ui.metric; const m = METRICS[metric];

          }
        },

          x: { type: 'linear', min: xr.min, max: xr.max, grid: { display: false }, border: { color: '#c9d2df' },
            ticks: { precision: 0, maxTicksLimit: 5, color: '#87919f', font: { size: 11 }, maxRotation: 0, callback: (val) => xLabel(val, xr) } },
          y: { type: 'linear', beginAtZero: false, min: yr.min, max: yr.max, grid: { color: '#edf0f5' }, border: { display: false },
            ticks: { stepSize: yr.step, color: '#87919f', font: { size: 11 }, callback: (val) => fmtTick(val, metric) },
            title: { display: true, text: m.unit, color: '#87919f', font: { size: 11 } } }
