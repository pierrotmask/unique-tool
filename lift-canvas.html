<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#f3f5f9" id="metaTheme">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftCanvas">
<link rel="manifest" href="lift-canvas.webmanifest">
<link rel="apple-touch-icon" href="lift-canvas-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<title>LiftCanvas（リフトキャンバス）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e3a8a'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpolyline points='12,44 25,32 35,37 52,18' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='18' r='5' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
/* ===================== テーマ ===================== */
:root{
  --bg:#f3f5f9; --bg-grad:linear-gradient(180deg,#eef2f8 0,#f3f5f9 240px);
  --surface:#ffffff; --surface-solid:#ffffff; --surface-2:#f7f8fb; --surface-3:#eef1f6; --overlay:rgba(243,245,249,.86);
  --line:#e4e8ef; --line-2:#cfd6e1;
  --text:#121a2a; --text-2:#465062; --text-3:#666f80;
  --head:#0f2342; --accent:#2563eb; --accent-2:#1d4ed8; --accent-soft:#e9f0ff; --accent-soft-2:#d4e1ff; --on-accent:#fff;
  --btn:#2563eb; --btn-2:#1d4ed8; --ok-btn:#15803d;
  --ok:#16a34a; --ok-2:#15803d; --ok-soft:#e5f6ec; --ok-line:#b9e6c9;
  --warn:#d97706; --warn-soft:#fff4e0; --danger:#dc2626; --danger-soft:#fdecec; --danger-line:#f5c2c2;
  --gold:#b26a00; --gold-soft:#fff3d6; --gold-line:#f4d79b;
  --bd-skin:#e4e9f1; --bd-edge:#9aa6b8; --bd-idle:#cfd7e3; --bd-sep:#f8fafd; --stage:radial-gradient(ellipse at 50% 40%,#ffffff 0%,#e9eef6 55%,#dde4ee 100%);
  --heat-1:#f7b33f; --heat-2:#f97316; --heat-3:#e11d48;
  --rec-1:#0ea5e9; --rec-2:#3b82f6; --rec-3:#a5b4fc;
  --shadow:0 1px 2px rgba(15,35,66,.05),0 6px 20px rgba(15,35,66,.06);
  --shadow-lg:0 10px 40px rgba(15,35,66,.18);
  --hero:linear-gradient(135deg,#0f2342 0%,#1e3a8a 55%,#2563eb 100%);
  --c-wl:#0d9488; --c-chest:#e11d48; --c-back:#2563eb; --c-shoulder:#d97706; --c-leg:#16a34a; --c-arm:#db2777; --c-abs:#7c3aed;
  --r-xl:20px; --r-lg:16px; --r:12px; --r-sm:10px;
  --tabbar-h:66px; --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0d1218; --bg-grad:linear-gradient(180deg,#111925 0,#0d1218 260px);
  --surface:#18212e; --surface-solid:#18212e; --surface-2:#1f2a39; --surface-3:#283446; --overlay:rgba(13,18,24,.9);
  --line:#2e3b50; --line-2:#3f4e66;
  --text:#f1f4f9; --text-2:#c2cad8; --text-3:#97a3b8;
  --head:#f6f8fc; --accent:#7aa6ff; --accent-2:#9bbcff; --accent-soft:#1e3159; --accent-soft-2:#2f4a80; --on-accent:#fff;
  --btn:#2f6ae8; --btn-2:#2558cc; --ok-btn:#15803d;
  --ok:#4ade80; --ok-2:#86efac; --ok-soft:#133523; --ok-line:#256b42;
  --warn:#fbbf24; --warn-soft:#33270f; --danger:#ff7676; --danger-soft:#3a1a1d; --danger-line:#7a3036;
  --gold:#fcd34d; --gold-soft:#332a10; --gold-line:#6b5418;
  --bd-skin:#263142; --bd-edge:#71819c; --bd-idle:#3b475c; --bd-sep:#121923; --stage:radial-gradient(ellipse at 50% 38%,#24396a 0%,#152038 45%,#0f1726 100%);
  --heat-1:#ffb547; --heat-2:#ff7a3d; --heat-3:#ff3b5c;
  --rec-1:#38c6ff; --rec-2:#4b8bf0; --rec-3:#6f6fd6;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  --hero:linear-gradient(135deg,#16295a 0%,#21408c 60%,#2f5cc8 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg-grad);background-color:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding-top:var(--safe-top);padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 28px)}
body.has-mini{padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 96px)}
body.has-fab{padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 100px)}
body.has-fab.has-mini{padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 170px)}
body.lock{overflow:hidden}
body.covered #view,body.covered #fab{visibility:hidden;content-visibility:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.4}
a{color:var(--accent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
svg text{stroke:none}
svg.bodysvg{stroke:none}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===================== 見出し ===================== */
.topbar{display:flex;align-items:center;gap:10px;padding:16px 0 10px;min-height:68px}
.topbar h1{flex:1;margin:0;font-size:26px;line-height:1.2;font-weight:850;color:var(--head);letter-spacing:.01em}
.topbar .sub{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.08em;display:block;margin-bottom:2px}
.icon-btn{width:48px;height:48px;border-radius:14px;display:inline-grid;place-items:center;color:var(--text-2);flex:none;transition:background .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.solid{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px;min-height:32px}
.sec-h h2{flex:1;margin:0;font-size:17px;font-weight:800;color:var(--head)}
.sec-h .link{font-size:14px;font-weight:700;color:var(--accent);min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:2px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:13px} .tiny{font-size:11.5px}
.hint{font-size:13px;color:var(--text-2);margin:8px 2px 0;line-height:1.6}
.center{text-align:center}

/* ===================== カード ===================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;position:relative}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h h3{flex:1;margin:0;font-size:15.5px;font-weight:800;color:var(--head);display:flex;align-items:center;gap:6px}
.card-h .info{color:var(--text-3)}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995)}
.empty{text-align:center;color:var(--text-2);padding:28px 16px}
.empty .big{font-size:44px;line-height:1;margin-bottom:8px}
.empty-mini{font-size:13.5px;color:var(--text-2);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:12px;margin:0}

/* ===================== ボタン ===================== */
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--head);font-weight:750;font-size:15.5px;padding:8px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.25;text-align:center;transition:background .15s,transform .06s,border-color .15s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--btn);border-color:var(--btn);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--btn) 30%,transparent)}
.btn-primary:active:not(:disabled){background:var(--btn-2)}
.btn-ok{background:var(--ok-btn);border-color:var(--ok-btn);color:#fff}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn-line{background:var(--surface);border-color:var(--accent-soft-2);color:var(--accent)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-line{background:var(--surface);border-color:var(--danger-line);color:var(--danger)}
.btn-block{width:100%;display:flex}
.btn-lg{min-height:56px;font-size:16.5px;border-radius:16px}
.btn-sm{min-height:40px;font-size:14px;padding:6px 12px;border-radius:12px}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 16px);z-index:45;min-height:56px;padding:0 22px;border-radius:18px;background:var(--btn);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
body.has-mini .fab{bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 84px)}

/* ===================== チップ・セグメント ===================== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);font-weight:700;font-size:14px;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:var(--bg)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-3);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:10px;font-weight:750;color:var(--text-2);font-size:14px;padding:2px 4px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--head);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg.pill{border-radius:999px;background:transparent;border:1px solid var(--line-2);padding:3px}
.seg.pill button{border-radius:999px;min-height:40px}
.seg.pill button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.seg button small{display:block;font-size:10px;opacity:.8}

/* ===================== バッジ・タグ ===================== */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);white-space:nowrap;line-height:1.5}
.badge.beat{background:var(--accent-soft);color:var(--accent)}
.badge.pr{background:var(--gold-soft);color:var(--gold)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.custom{background:var(--accent-soft);color:var(--accent)}
.pdot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}

/* ===================== フォーム ===================== */
.field{display:block;margin:0 0 18px}
.field>.lbl{display:block;font-size:13.5px;font-weight:800;color:var(--head);margin-bottom:8px}
.field>.lbl em{font-style:normal;font-size:10.5px;color:#fff;background:var(--btn);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.input{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 14px;font-size:16px;background:var(--surface);color:var(--text)}
textarea.input{resize:vertical;min-height:76px;line-height:1.55}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search .input{padding-left:42px;border-radius:14px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:52px;height:50px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-size:22px;font-weight:700;color:var(--head)}
.stepper .val{min-width:80px;text-align:center;font-size:22px;font-weight:850;color:var(--head);font-variant-numeric:tabular-nums}
.stepper .u{font-size:14px;color:var(--text-2);font-weight:700;margin-left:2px}
.sw-row{display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 0;border-top:1px solid var(--line)}
.sw-row:first-child{border-top:0}
.sw-row .t{flex:1;min-width:0}
.sw-row .t b{display:block;color:var(--head);font-size:15px}
.sw-row .t span{display:block;font-size:12.5px;color:var(--text-2)}
.switch{position:relative;width:54px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .2s}
.switch span::after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;border-top:1px solid var(--line);text-align:left;background:var(--surface)}
.li:first-child{border-top:0}
.list .li{content-visibility:auto;contain-intrinsic-size:auto 64px}
.menu-card,.card.hist{content-visibility:auto;contain-intrinsic-size:auto 170px}
.li:active{background:var(--surface-2)}
.li .m{flex:1;min-width:0}
.li .t{font-weight:750;font-size:15.5px;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:1.35}
.li .s{font-size:12.5px;color:var(--text-2);margin-top:1px}
.li>svg{color:var(--text-3)}
.li.sel{background:var(--accent-soft)}
.li:disabled{opacity:.45}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
.li.sel .check{background:var(--btn);border-color:var(--btn);color:#fff}
.check svg{width:15px;height:15px;stroke-width:3.2}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--text-2);margin:18px 4px 8px}
.grp span{font-weight:700;color:var(--text-3);font-size:12px}

/* ===================== 種目アイコン ===================== */
.exi{width:46px;height:46px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.exi svg.bodysvg{width:100%;height:100%}
.exi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc,transparent)}
.bodysvg{display:block;width:100%;height:auto}
.bodysvg .bd-sil,.bodysvg .bd-head{fill:var(--bd-skin);stroke:var(--bd-edge);stroke-width:1.6;stroke-linejoin:round}
.bodysvg .bd-m{fill:var(--bd-idle);stroke:var(--bd-sep);stroke-width:1.3;stroke-linejoin:round;transition:fill .35s}
.bodysvg.mini .bd-sil,.bodysvg.mini .bd-head{stroke-width:2.4}
.bodysvg.mini .bd-m{stroke-width:2}
.bodysvg .bd-m.sel{stroke:var(--head);stroke-width:2.6}
.bodysvg .bd-label{font-size:11px;letter-spacing:.24em;fill:var(--text-3);text-anchor:middle;font-weight:800}
.stage{background:var(--stage);border-radius:18px;padding:14px 8px 6px;border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.18)}
.bodysvg.tapable .bd-m{cursor:pointer}

/* ===================== トレーニングタブ ===================== */
.hero{background:var(--hero);color:#fff;border:0;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.goal{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ring-t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .ring-t b{font-size:24px;font-weight:850;display:block}
.ring .ring-t span{font-size:10.5px;opacity:.85}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;position:relative;z-index:1}
.week-strip div{text-align:center;font-size:11px;opacity:.9}
.week-strip i{display:block;margin:4px auto 0;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.3);font-style:normal;line-height:22px;font-size:11px;font-weight:800}
.week-strip i.on{background:#fff;color:#1e3a8a;border-color:#fff}
.week-strip i.today{border-color:#fbbf24}
.goal-text{flex:1;min-width:0;position:relative;z-index:1}
.goal-text b{font-size:18px;display:block;line-height:1.3}
.goal-text span{font-size:13px;opacity:.88}
.resume{display:flex;align-items:center;gap:12px;border:1px solid var(--ok-line);background:var(--ok-soft)}
.resume .m{flex:1;min-width:0}
.resume b{color:var(--ok-2);display:block}
html[data-theme="light"] .resume b{color:var(--ok-2)}
.reco{border:0;color:#fff;background:radial-gradient(ellipse at 22% 35%,#2b4b8f 0%,#14213d 55%,#0c1322 100%);box-shadow:0 12px 34px rgba(12,19,34,.35);overflow:hidden;
  --bd-skin:#263142;--bd-edge:#7d8eab;--bd-idle:#3b475c;--bd-sep:#121923;--text-3:#9fb0cc}
.reco .reco-kicker{font-size:12px;font-weight:800;letter-spacing:.08em;color:#ffd166;display:flex;align-items:center;gap:4px}
.reco .reco-name{font-size:21px;font-weight:850;line-height:1.3;margin:4px 0;color:#fff}
.reco .reco-why{font-size:13px;color:#c8d4ea}
.reco .reco-note{font-size:11px;color:#8fa1c2;margin:8px 2px 0}
.reco .reco-stats{display:flex;gap:14px;margin-top:10px;font-size:12px;color:#c8d4ea}
.reco .reco-stats b{display:block;font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.reco-top{display:flex;gap:12px;align-items:center}
.reco-body{width:132px;flex:none;margin:-6px -4px -10px -8px}
.menu-card{display:flex;gap:12px;padding:14px}
.menu-card .mb{width:62px;flex:none;align-self:flex-start;background:var(--surface-2);border-radius:12px;padding:4px 2px;border:1px solid var(--line)}
.menu-card .mm{flex:1;min-width:0}
.menu-card .mt{display:flex;align-items:center;gap:8px}
.menu-card h3{flex:1;margin:0;font-size:16.5px;font-weight:850;color:var(--head);line-height:1.3}
.menu-card .ex{font-size:13px;color:var(--text-2);margin-top:6px;line-height:1.55}
.menu-card .meta{font-size:11.5px;color:var(--text-3);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.mfoot{display:flex;align-items:flex-end;gap:10px;margin-top:2px}
.mfoot .meta{flex:1;min-width:0}
.btn-start{min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:15px;flex:none;display:inline-flex;align-items:center;gap:6px}
.reorder{display:flex;flex-direction:column;gap:6px}
.banner{display:flex;align-items:center;gap:10px;border-radius:var(--r-lg);padding:10px 10px 10px 14px;font-size:13.5px;margin-bottom:12px;border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--text)}
.banner .m{flex:1;min-width:0}
.banner b{color:var(--gold)}
.banner.info{border-color:var(--accent-soft-2);background:var(--accent-soft)}
.banner.info b{color:var(--accent)}

/* ===================== ワークアウト画面 ===================== */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wo-head{position:sticky;top:0;z-index:5;background:var(--overlay);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-top)}
.wo-head-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:62px}
.wo-title{flex:1;min-width:0;padding:0 4px}
.wo-title b{display:block;font-size:16.5px;color:var(--head);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-title span{display:block;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.wo-finish{min-height:42px;padding:0 16px;border-radius:12px;background:var(--ok-btn);color:#fff;font-weight:800;font-size:15px;margin-left:4px}
.wo-nav{max-width:640px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.wo-nav::-webkit-scrollbar{display:none}
.wo-nav button{flex:none;min-height:34px;border-radius:999px;padding:0 12px;font-size:13px;font-weight:750;color:var(--text-2);background:var(--surface-3);display:inline-flex;align-items:center;gap:6px;max-width:190px}
.wo-nav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo-nav button.done{background:var(--ok-soft);color:var(--ok)}
.wo-nav button.cur{background:var(--head);color:var(--bg)}
.wo-body{max-width:640px;margin:0 auto;padding:12px 12px 140px}
.wo-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 2px 12px}
.wo-meta .chip{min-height:38px}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:130px}
.exc.ss{border-left:4px solid var(--accent)}
.exc-h{display:flex;align-items:center;gap:10px;padding:12px 6px 6px 12px}
.exc-h .nm{flex:1;min-width:0}
.exc-h .nm>button{font-size:16.5px;font-weight:850;color:var(--head);text-align:left;line-height:1.3;display:inline-flex;align-items:center;gap:4px}
.exc-h .nm>button svg{width:16px;height:16px;color:var(--text-3)}
.exc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.exc-tags button,.exc-tags span{font-size:11.5px;font-weight:750;color:var(--text-2);background:var(--surface-3);border-radius:7px;padding:2px 8px;min-height:24px;display:inline-flex;align-items:center;gap:3px}
.exc-tags button{color:var(--accent);background:var(--accent-soft)}
.ss-tag{font-size:11px;font-weight:850;color:var(--accent);margin:0 12px 2px;display:flex;align-items:center;gap:6px}
.recent{margin:4px 12px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.recent-row{display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:7px 10px;border-top:1px solid var(--line);font-size:13px}
.recent-row:first-child{border-top:0}
.recent-row .d{font-weight:800;color:var(--text-3);white-space:nowrap}
.recent-row:first-child .d{color:var(--accent)}
.recent-row .v{font-weight:750;color:var(--text);font-variant-numeric:tabular-nums;word-break:break-word}
.recent-row .memo{grid-column:2;font-size:12px;color:var(--text-2)}
.recent-act{display:flex;gap:8px;margin:0 12px 10px}
.recent-act .btn{flex:1;min-height:40px;font-size:13.5px;border-radius:11px}
.sugg{margin:0 12px 10px;padding:9px 10px;border-radius:12px;background:var(--accent-soft);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.sugg b{font-size:13px;color:var(--accent);font-weight:850}
.sugg span{font-size:12px;color:var(--text-2);flex:1 1 160px}
.sugg button{min-height:36px;border-radius:9px;background:var(--surface);color:var(--accent);font-weight:800;font-size:13px;padding:0 10px;border:1px solid var(--accent-soft-2)}
.sets{padding:0 6px 4px}
.set-h,.set-r{display:grid;grid-template-columns:40px minmax(0,1fr) 78px 60px 50px;gap:6px;align-items:center}
.set-h{font-size:11px;font-weight:800;color:var(--text-3);padding:2px 6px 4px;text-align:center}
.set-h span:nth-child(2){text-align:left;padding-left:4px}
.set-r{min-height:54px;padding:3px 6px;border-radius:12px;transition:background .2s}
.set-r.done{background:var(--ok-soft)}
.set-r.kp{background:var(--accent-soft)}
.set-no{height:44px;border-radius:10px;font-weight:850;font-size:15px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.set-no small{font-size:10px;font-weight:800;color:var(--text-3)}
.set-no.t-w{color:var(--warn)} .set-no.t-d{color:#8b5cf6} .set-no.t-f{color:var(--danger)}
.set-prev{font-size:13px;color:var(--text-3);font-weight:700;text-align:left;padding-left:4px;height:44px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:18px;font-weight:850;color:var(--head);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 4px;white-space:nowrap;overflow:hidden}
.cell .ph{color:var(--text-3);font-weight:750}
.cell small{font-size:11px;font-weight:700;color:var(--text-3)}
.cell.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);background:var(--surface)}
.set-r.done .cell{background:transparent;border-color:transparent}
.done-btn{height:44px;width:46px;border-radius:12px;border:2px solid var(--line-2);color:var(--text-3);display:grid;place-items:center;margin-left:auto;background:var(--surface)}
.done-btn svg{width:24px;height:24px;stroke-width:3}
.done-btn[aria-pressed="true"]{background:var(--ok-btn);border-color:var(--ok-btn);color:#fff}
.set-b{display:flex;gap:6px;justify-content:flex-end;padding:0 10px 6px;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.add-set{display:flex;gap:8px;padding:6px 12px 12px}
.add-set .btn{flex:1;min-height:42px;font-size:14px;border-radius:12px}
.exc-memo{margin:0 12px 12px}
.exc-memo textarea{min-height:44px;font-size:14px;padding:8px 12px}
.rel{margin:0 12px 12px;border-top:1px dashed var(--line-2);padding-top:6px}
.rel summary{font-size:12.5px;font-weight:750;color:var(--text-3);min-height:36px;display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}
.rel summary::-webkit-details-marker{display:none}
.rel-i{display:flex;align-items:center;gap:8px;padding:5px 0}
.rel-i .m{flex:1;min-width:0}
.rel-i b{display:block;font-size:13.5px;color:var(--text);font-weight:700}
.rel-i span{display:block;font-size:11.5px;color:var(--text-3)}
.rel-i .btn{min-height:36px;font-size:12.5px;padding:0 10px;border-radius:10px;color:var(--text-2)}
.wo-add{display:flex;gap:10px;margin:6px 0 18px}
.wo-add .btn{flex:1}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08);padding-bottom:var(--safe-bottom)}
.restbar .prog{height:4px;background:var(--accent);transform-origin:left;transition:transform .25s linear}
.restbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:64px}
.restbar .tm{flex:1;font-size:30px;font-weight:850;color:var(--head);font-variant-numeric:tabular-nums;line-height:1}
.restbar .tm small{display:block;font-size:11px;font-weight:750;color:var(--text-3);margin-bottom:3px}
.restbar .rb{min-width:48px;height:48px;border-radius:14px;background:var(--surface-3);color:var(--head);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 8px}
.restbar.done{background:var(--ok-btn);border-color:var(--ok-btn)}
.restbar.done .tm,.restbar.done .tm small{color:#fff}
.restbar.done .rb{background:rgba(255,255,255,.2);color:#fff}
.minibar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + var(--safe-bottom));z-index:49;padding:0 10px 8px}
.minibar button{max-width:620px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;min-height:58px;border-radius:16px;background:var(--head);color:var(--bg);padding:8px 14px;text-align:left;box-shadow:var(--shadow-lg)}
.minibar .m{flex:1;min-width:0}
.minibar b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar span{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.minibar .tmr{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}

/* ===================== テンキー ===================== */
.keypad{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.18);padding-bottom:var(--safe-bottom);animation:kpup .18s ease}
@keyframes kpup{from{transform:translateY(30px);opacity:.5}}
.kp-in{max-width:640px;margin:0 auto;padding:8px 10px 10px}
.kp-top{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.kp-lbl{flex:1;min-width:0}
.kp-lbl small{display:block;font-size:11.5px;font-weight:800;color:var(--text-3)}
.kp-lbl b{font-size:28px;font-weight:850;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.1}
.kp-lbl b .u{font-size:14px;color:var(--text-2);margin-left:3px}
.kp-lbl .caret{display:inline-block;width:2px;height:24px;background:var(--accent);margin-left:2px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kp-rest{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.kp-grid button{height:52px;border-radius:13px;background:var(--surface-3);font-size:22px;font-weight:750;color:var(--head)}
.kp-grid button:active{background:var(--line-2)}
.kp-grid button.fn{font-size:15px;background:var(--accent-soft);color:var(--accent);font-weight:800}
.kp-grid button.go{background:var(--btn);color:#fff;font-size:15px;font-weight:850}
.kp-grid button.ok{background:var(--ok-btn);color:#fff;font-size:15px;font-weight:850}
.kp-grid button.close{font-size:14px;font-weight:800;color:var(--text-2)}

/* ===================== カレンダー ===================== */
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-h h2{flex:1;margin:0;font-size:20px;font-weight:850;color:var(--head)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}
.cal .wd{font-size:11.5px;font-weight:800;color:var(--text-3);padding:4px 0}
.cal .wd.sun{color:#e11d48} .cal .wd.sat{color:#2563eb}
html[data-theme="dark"] .cal .wd.sun{color:#ff8fa3} html[data-theme="dark"] .cal .wd.sat{color:#93b6ff}
.cal .day{position:relative;aspect-ratio:1;max-height:54px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:750;color:var(--text)}
.cal .day svg.ringsvg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);transform:rotate(-90deg)}
.cal .day span{position:relative;z-index:1;width:68%;height:68%;display:grid;place-items:center;border-radius:50%}
.cal .day.out{color:var(--text-3);opacity:.35}
.cal .day.today span{outline:2px solid var(--head);outline-offset:1px}
.cal .day.sel span{background:var(--btn);color:#fff}
.cal .day.future{color:var(--text-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--text-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ses-stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.ses-stats span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.ses-stats svg{width:15px;height:15px}
.ses-ex{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ses-ex:first-of-type{border-top:0}
.ses-ex .bar{width:4px;border-radius:2px;flex:none}
.ses-ex .m{flex:1;min-width:0}
.ses-ex b{display:block;font-size:15px;color:var(--text)}
.ses-ex span{display:block;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;word-break:break-word}

/* ===================== 振り返り ===================== */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;font-weight:750;color:var(--text-2)}
.kpi b{display:block;font-size:23px;font-weight:850;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.25}
.kpi b small{font-size:12px;color:var(--text-2);margin-left:2px;font-weight:700}
.kpi em{font-style:normal;font-size:12px;font-weight:800}
.up{color:var(--ok)} .down{color:var(--danger)} .flat{color:var(--text-3)}
.mmap{max-width:340px;margin:0 auto}
.heat-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:11.5px;color:var(--text-2);margin-top:6px}
.heat-legend span{display:inline-flex;align-items:center;gap:5px}
.muscle-info{margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.muscle-info b{color:var(--head)}
.trend{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.trend:first-of-type{border-top:0}
.trend .m{flex:1;min-width:0}
.trend .m b{display:block;font-size:14.5px;color:var(--text);line-height:1.3}
.trend .m .v{font-size:22px;font-weight:850;color:var(--head);font-variant-numeric:tabular-nums}
.trend .m .v small{font-size:12px;color:var(--text-2);margin-left:2px}
.trend .m .d{font-size:12px;color:var(--text-2)}
.spark{width:46%;max-width:200px;height:56px;flex:none}
.spark svg{width:100%;height:100%}
.chart-box{position:relative;height:250px;margin-top:6px}
.chart-box.sm{height:190px}
.chart-box canvas{display:block;width:100%!important;height:100%!important}
.chart-box .svgc{width:100%;height:100%}
.chart-box .svgc svg{width:100%;height:100%;display:block}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--text-2);font-size:13.5px;padding:16px;background:var(--surface-2);border-radius:var(--r)}
.chart-note{font-size:11.5px;color:var(--text-3);margin-top:6px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.big2 b{display:block;font-size:30px;font-weight:850;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.15}
.big2 b small{font-size:14px;color:var(--text-2);margin-left:2px}
.big2 span{display:block;font-size:12px;color:var(--text-2);font-weight:700}
.delta{font-size:14px;font-weight:850;margin:8px 0 2px;color:var(--text-2)}
.delta b{font-size:17px}
.pt-detail{margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pt-detail .d{font-size:12px;font-weight:800;color:var(--accent)}
.pt-detail .v{font-size:15.5px;font-weight:800;color:var(--head);font-variant-numeric:tabular-nums;word-break:break-word}
.pt-detail .s{font-size:12px;color:var(--text-2)}
.streak{display:grid;grid-template-columns:30px repeat(7,1fr);gap:4px;font-size:10.5px}
.streak .wd{text-align:center;font-weight:800;color:var(--text-3)}
.streak .mo{font-size:10px;color:var(--text-3);font-weight:800;writing-mode:horizontal-tb;align-self:center}
.streak .c{aspect-ratio:1;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--text-3);overflow:hidden;position:relative}
.streak .c.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.streak .c.fut{opacity:.3}
.ratio{padding:10px 0;border-top:1px solid var(--line)}
.ratio:first-of-type{border-top:0}
.ratio-h{display:flex;align-items:baseline;gap:8px}
.ratio-h b{flex:1;font-size:14px;color:var(--text)}
.ratio-h em{font-style:normal;font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}
.ratio-bar{position:relative;height:10px;border-radius:5px;background:var(--surface-3);margin:8px 0 4px}
.ratio-bar .zone{position:absolute;top:0;bottom:0;background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:5px}
.ratio-bar .pin{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--head);transform:translateX(-2px)}
.ratio p{margin:0;font-size:12px;color:var(--text-2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;border-top:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11.5px;color:var(--text-3);font-weight:800;border-top:0}
.tbl td b{color:var(--head)}
.tbl tr.hl td{background:var(--accent-soft)}

/* ===================== プレート ===================== */
.plate-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 6px;overflow-x:auto}
.plate-wrap svg{width:100%;height:auto;min-width:300px}
.plates-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.plates-list span{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px;color:#fff}

/* ===================== ページ（全画面） ===================== */
.page{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:pgin .22s cubic-bezier(.2,.8,.2,1)}
.page.closing{animation:pgout .18s ease forwards}
@keyframes pgin{from{transform:translateX(36px);opacity:.3}}
@keyframes pgout{to{transform:translateX(36px);opacity:0}}
.page-h{position:sticky;top:0;z-index:5;background:var(--overlay);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-top)}
.page-h-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:60px}
.page-h-in h2{flex:1;min-width:0;margin:0;font-size:18px;font-weight:850;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-b{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + var(--safe-bottom))}

/* ===================== シート ===================== */
.sheet-bg{position:fixed;inset:0;background:rgba(6,12,24,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet-bg.closing{animation:fadeout .18s ease forwards}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);outline:none;box-shadow:var(--shadow-lg)}
.closing .sheet{animation:down .18s ease forwards}
@keyframes fade{from{opacity:0}} @keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(50px);opacity:.4}} @keyframes down{to{transform:translateY(50px)}}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:4px 6px 8px 18px;border-bottom:1px solid var(--line);min-height:56px}
.sheet-h h2{flex:1;margin:0;font-size:17.5px;font-weight:850;color:var(--head);line-height:1.3}
.sheet-b{overflow-y:auto;padding:16px 16px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.sheet-f{display:flex;gap:10px;padding:12px 16px calc(12px + var(--safe-bottom));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.sheet-f .btn-primary,.sheet-f .btn-ok{flex:1.6}
.sheet-msg{font-size:15px;margin:0 0 14px;color:var(--text)}
.sheet-msg p{margin:0 0 8px}
.choices{display:flex;flex-direction:column;gap:8px;padding-bottom:var(--safe-bottom)}
.choice{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 16px}
.choice .d{font-size:12.5px;font-weight:550;opacity:.85}
.choice.danger{color:var(--danger);border-color:var(--danger-line)}
.picker-top{position:sticky;top:-16px;z-index:2;background:var(--surface);margin:-16px -16px 0;padding:12px 16px 4px;border-bottom:1px solid var(--line)}
.info-tbl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.info-tbl span{color:var(--text-2)} .info-tbl b{color:var(--head);font-weight:750}

/* ===================== タブバー ===================== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--overlay);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tab{white-space:nowrap;height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:10.5px;font-weight:800;position:relative}
.tab .ic{width:54px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ic{background:var(--accent-soft)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--surface-solid)}

/* ===================== トースト ===================== */
.toast{position:fixed;left:50%;top:calc(var(--safe-top) + 12px);transform:translate(-50%,-20px);z-index:500;background:var(--head);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);width:max-content;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok-btn);color:#fff} .toast.error{background:var(--danger);color:#fff}
.pwa-card{border:1px solid var(--accent-soft-2);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 75%)}
.pwa-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pwa-top .m{flex:1;min-width:0}
.pwa-top b{display:block;font-size:16.5px;color:var(--head);line-height:1.35}
.pwa-top span{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.5}
.pwa-ic{width:52px;height:52px;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.pwa-later{margin-top:4px;justify-content:center}
.pwa-later .btn{flex:0 1 auto;color:var(--text-2)}
.guide{margin:0 0 14px;padding-left:22px;line-height:1.8;font-size:15px}
.guide li{margin:6px 0}
.upd-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-top) + 10px);z-index:480;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--accent-soft-2);box-shadow:var(--shadow-lg);border-radius:16px;padding:8px 8px 8px 14px;font-weight:750;color:var(--head);font-size:14px;max-width:calc(100% - 24px)}
.busy{position:fixed;inset:0;z-index:600;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center}
.busy-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 24px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;font-weight:750;color:var(--head)}
.spinner{width:24px;height:24px;border-radius:50%;border:3px solid var(--accent-soft-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:450;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}

@media (max-width:370px){
  .tab{font-size:9.5px;letter-spacing:-.03em;white-space:nowrap}
  .tab .ic{width:46px}
  .kpi b{font-size:19px}
  .big2 b{font-size:25px}
  .big2 span{font-size:11px}
  .wrap{padding:0 12px}
  .set-h,.set-r{grid-template-columns:34px minmax(0,1fr) 72px 54px 46px;gap:4px}
  .topbar h1{font-size:23px}
  .wo-body{padding:10px 8px 140px}
}
@media (min-width:700px){ .kpis{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* =====================================================================
   デザインレイヤー「プラットフォーム」
   ・競技用プレートの色（青20・緑10・黄15・赤25）に意味を持たせる
     青＝操作、緑＝完了、黄＝自己ベスト、赤＝高負荷／削除
   ・数字は Barlow Condensed（スコアボードの数字）、日本語は Zen Kaku Gothic New
   ・箱を増やさず余白でまとめる。カードは「主役」だけに使う
   ===================================================================== */
:root{
  --f-ui:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif;
  --plate-blue:#1d4ed8; --plate-red:#d62839; --plate-yellow:#f2b400; --plate-green:#11935a;
  --bg:#f4f5f7; --bg-grad:#f4f5f7;
  --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#eceef2; --overlay:rgba(244,245,247,.92);
  --line:#e3e6eb; --line-2:#cdd2da;
  --text:#15181e; --text-2:#4a515e; --text-3:#666e7c; --head:#15181e;
  --accent:#1d4ed8; --accent-2:#173fb0; --accent-soft:#e8eefc; --accent-soft-2:#c9d6f6;
  --btn:#1d4ed8; --btn-2:#173fb0; --ok-btn:#0e7c4b; --ok:#11935a; --ok-2:#0c7a4a; --ok-soft:#e3f4eb; --ok-line:#b5e0c9;
  --gold:#8a5a00; --gold-soft:#fff4d1; --gold-line:#f2d27a;
  --danger:#d62839; --danger-soft:#fdecee; --danger-line:#f3c1c7;
  --shadow:0 1px 0 rgba(21,24,30,.04),0 8px 24px -12px rgba(21,24,30,.12);
  --shadow-lg:0 18px 50px -12px rgba(21,24,30,.28);
  --r-xl:22px; --r-lg:18px; --r:14px;
  --stage:radial-gradient(ellipse at 50% 34%,#ffffff 0%,#eef1f5 52%,#e2e6ec 100%);
}
html[data-theme="dark"]{
  --bg:#111317; --bg-grad:#111317;
  --surface:#1a1d23; --surface-2:#20242b; --surface-3:#292e36; --overlay:rgba(17,19,23,.9);
  --line:#2a2f38; --line-2:#3a404b;
  --text:#eef0f3; --text-2:#b9c0cb; --text-3:#959dab; --head:#f5f6f8;
  --accent:#7ea2ff; --accent-2:#a2bcff; --accent-soft:#1c2846; --accent-soft-2:#2e4278;
  --btn:#2a5ee8; --btn-2:#2350c9; --ok-btn:#0f7d4d; --ok:#3ccf8a; --ok-2:#7ce3b0; --ok-soft:#14291f; --ok-line:#22573c;
  --gold:#ffcf4d; --gold-soft:#2c2510; --gold-line:#5d4b15;
  --danger:#ff6b78; --danger-soft:#33171b; --danger-line:#6d2a31;
  --shadow:none; --shadow-lg:0 18px 50px -10px rgba(0,0,0,.6);
  --bd-skin:#262a32; --bd-edge:#77808f; --bd-idle:#3a404b; --bd-sep:#14171c;
  --stage:radial-gradient(ellipse at 50% 34%,#2b3140 0%,#1b1f27 55%,#14171c 100%);
}
body{font-family:var(--f-ui);font-feature-settings:"palt";letter-spacing:0;background:var(--bg)}
.num,.kpi b,.big2 b,.cell,.set-no,.set-prev,.restbar .tm,.kp-lbl b,.trend .v,.reco-stats b,.ring .ring-t b,.tbl td,.stepper .val,.growth-val,.delta b,.pt-detail .v,.recent-row .v,.data-stats b,.minibar .tmr,.wo-title span,.ses-stats,.hist-sets,.ratio-h em,.exc-tags button,.exc-tags span,.sugg b,.summary-grid b,.cal .day span,.streak .c{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---- 見出し：アイブロウ（小さな英字ラベル）をやめ、太い見出し1本に ---- */
.topbar{padding:22px 0 12px;min-height:76px}
.topbar h1{font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.topbar .sub{display:none}
.sec{margin-top:28px}
.sec-h h2{font-size:18px;font-weight:900}
.card-h h3{font-size:16px;font-weight:900}

/* ---- カード：主役だけを箱に。影は控えめ、階層で角丸を変える ---- */
.card{border-radius:var(--r-lg);box-shadow:var(--shadow)}
.list{border-radius:var(--r-lg);box-shadow:none}
.li .t{font-weight:700}
.kpi{box-shadow:none;border-radius:var(--r)}
.kpi b{font-size:30px;font-weight:700;line-height:1.1;margin-top:2px}
.kpi b small{font-family:var(--f-ui);font-size:13px}
.big2 b{font-size:38px;font-weight:700;line-height:1.05}
.big2 b small{font-family:var(--f-ui);font-size:14px;font-weight:700}

/* ---- ボタン：押せるものは「プレートの青」、大きく・角を少し立てる ---- */
.btn{border-radius:var(--r);font-weight:700;letter-spacing:0}
.btn-primary{background:var(--btn);border-color:var(--btn);box-shadow:0 10px 22px -12px var(--btn)}
.btn-lg{min-height:58px;font-size:17px;border-radius:16px}
.chip{font-weight:700}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface-solid)}
.seg{border-radius:14px}
.seg.pill button[aria-pressed="true"]{background:var(--btn);color:#fff}

/* ---- トレーニング：今日のおすすめ（唯一の大胆な要素） ---- */
.reco{border-radius:24px;padding:18px 18px 16px;background:radial-gradient(ellipse at 18% 40%,#2b3346 0%,#171a20 62%,#121418 100%);box-shadow:0 22px 40px -22px rgba(0,0,0,.55);
  --bd-skin:#262a32;--bd-edge:#8a93a3;--bd-idle:#3a404b;--bd-sep:#14171c}
.reco::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--plate-red) 0 25%,var(--plate-blue) 25% 50%,var(--plate-yellow) 50% 75%,var(--plate-green) 75% 100%)}
.reco .reco-kicker{font-size:13px;letter-spacing:.04em;color:#ffd166;font-weight:700}
.reco .reco-name{font-size:26px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.reco .reco-why{font-size:13.5px;color:#c7cdd8}
.reco .reco-why b{font-size:17px;color:#fff;font-weight:700}
.reco .reco-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:16px 0 2px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.reco .reco-stats>div{font-size:12px;color:#a7afbd;padding-left:12px;border-left:1px solid rgba(255,255,255,.1);white-space:nowrap}
.reco .reco-stats>div:first-child{padding-left:0;border-left:0}
.reco .reco-stats b{font-size:32px;font-weight:700;line-height:1.05}
.reco .reco-stats b small{font-family:var(--f-ui);font-size:13px;margin-left:2px;color:#c7cdd8}
.reco-body{width:140px}
.menu-card{border-radius:var(--r-lg);padding:16px}
.menu-card h3{font-size:18px;font-weight:900}
.menu-card .mb{width:66px;background:var(--surface-2);border:0}
.menu-card .meta{gap:2px 12px;font-size:12px}
.btn-start{background:var(--btn);color:#fff;border-radius:14px;min-height:46px;padding:0 18px;box-shadow:0 8px 18px -10px var(--btn)}

/* ---- 記録画面：数字が主役。完了は「緑のプレート」 ---- */
.exc{border-radius:20px;box-shadow:var(--shadow)}
.exc-h .nm>button{font-size:18px;font-weight:900}
.exc-tags button,.exc-tags span{font-size:13px;font-weight:600;border-radius:8px;padding:2px 9px}
.set-h{font-size:11.5px;letter-spacing:.04em}
.set-r{min-height:58px;border-radius:14px}
.set-r.done{background:var(--ok-soft);box-shadow:inset 4px 0 0 var(--ok-btn)}
.set-no{font-size:20px;font-weight:700}
.set-prev{font-size:16px;font-weight:600}
.cell{height:50px;font-size:26px;font-weight:700;border-radius:12px;background:var(--surface-2)}
.cell .ph{font-weight:600;opacity:.7}
.done-btn{width:50px;height:50px;border-radius:50%}
.done-btn[aria-pressed="true"]{background:var(--ok-btn);border-color:var(--ok-btn);box-shadow:0 6px 14px -6px var(--ok-btn)}
.badge.pr{background:var(--plate-yellow);color:#2a1d00}
.restbar .tm{font-size:38px;font-weight:700}
.kp-lbl b{font-size:40px;font-weight:700}
.kp-grid button{font-family:var(--f-num);font-size:26px;font-weight:600;height:56px;border-radius:14px}
.kp-grid button.fn,.kp-grid button.go,.kp-grid button.ok,.kp-grid button.close{font-family:var(--f-ui);font-size:15px}
.wo-finish{background:var(--ok-btn);border-radius:14px;font-weight:700}

/* ---- 人体図：ステージの背景と輪郭 ---- */
.stage{background:var(--stage);border:0;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line)}
.bodysvg .bd-label{letter-spacing:.12em}

/* ---- タブバー ---- */
.tabbar{background:var(--overlay)}
.tab{font-weight:700;font-size:11px}
.tab .ic{width:56px;height:32px;border-radius:12px}
.tab[aria-current="page"] .ic{background:var(--btn);color:#fff}
.tab[aria-current="page"]{color:var(--text)}

/* ---- カレンダー ---- */
.cal .day span{font-size:16px;font-weight:600}
.cal .day.sel span{background:var(--btn)}
.fab{background:var(--btn);border-radius:18px;font-weight:700;box-shadow:0 14px 28px -12px var(--btn)}
@media (max-width:370px){ .topbar h1{font-size:26px} .reco .reco-name{font-size:22px} .reco-body{width:118px} .kpi b{font-size:26px} .big2 b{font-size:32px} .cell{font-size:22px} }

.meta-row{display:flex;flex-wrap:wrap;gap:0 12px}
.meta-row b{font-size:14px;font-weight:700;color:var(--text)}

.menu-card .meta-row b{font-size:16px}
.wo-meta{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;margin-bottom:10px}
.wo-meta::-webkit-scrollbar{display:none}
.wo-meta .chip{min-height:36px;font-size:13px;padding:0 12px;flex:none}
.wo-meta .chip svg{width:16px;height:16px}

h1,h2,h3,.exc-h .nm>button,.reco .reco-name,.menu-card h3,.li .t,.wo-title b,.sheet-h h2,.page-h-in h2,.btn{letter-spacing:-.02em}
/* =====================================================================
   デザインレイヤー「ホログラム・トレーニングベイ」（立体・近未来）
   ・人体図は「格子の床から浮かぶホログラム」＝唯一の大胆な要素
   ・面ごとに高さ（エレベーション）を持たせる：上辺の光、下の影、押すと沈むボタン
   ・色の意味（青＝操作／緑＝完了／黄＝自己ベスト／赤＝高負荷）は維持
   ===================================================================== */
:root{
  --glow:#3b82f6; --glow-2:#22d3ee;
  --bg:#eef2f8;
  --bg-fx:radial-gradient(1200px 600px at 80% -10%,rgba(59,130,246,.16),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(34,211,238,.12),transparent 60%),linear-gradient(180deg,#f3f6fb,#e9eef6);
  --grid-line:rgba(37,99,235,.07);
  --surface:linear-gradient(180deg,#ffffff 0%,#f7f9fd 100%); --surface-solid:#ffffff;
  --edge-hi:rgba(255,255,255,.95); --edge-lo:rgba(15,35,80,.08);
  --elev-1:0 1px 0 var(--edge-hi) inset,0 0 0 1px rgba(15,35,80,.06),0 2px 4px rgba(15,35,80,.04),0 14px 30px -16px rgba(15,35,80,.25);
  --elev-2:0 1px 0 var(--edge-hi) inset,0 0 0 1px rgba(15,35,80,.07),0 6px 12px rgba(15,35,80,.06),0 28px 50px -22px rgba(15,35,80,.38);
  --well:inset 0 2px 4px rgba(15,35,80,.10),inset 0 0 0 1px rgba(15,35,80,.08);
  --holo-bg:radial-gradient(120% 90% at 50% 18%,#ffffff 0%,#e8eef8 46%,#d6e0ef 100%);
  --holo-grid:rgba(37,99,235,.22); --holo-ring:rgba(37,99,235,.45); --holo-edge:#5f6f8a;
  --dock:rgba(255,255,255,.78);
}
html[data-theme="dark"]{
  --glow:#4f8cff; --glow-2:#22d3ee;
  --bg:#070b14;
  --bg-fx:radial-gradient(1000px 520px at 85% -10%,rgba(79,140,255,.22),transparent 60%),radial-gradient(800px 480px at -10% 35%,rgba(34,211,238,.12),transparent 60%),linear-gradient(180deg,#0a0f1c,#060910);
  --grid-line:rgba(120,170,255,.06);
  --surface:linear-gradient(180deg,#141b2b 0%,#0f1522 100%); --surface-solid:#121928;
  --surface-2:#182033; --surface-3:#202a40; --line:#243049; --line-2:#33415f;
  --text:#eef3ff; --text-2:#b8c3d9; --text-3:#90a0bc; --head:#f4f7ff;
  --edge-hi:rgba(160,195,255,.14); --edge-lo:rgba(0,0,0,.5);
  --elev-1:0 1px 0 var(--edge-hi) inset,0 0 0 1px rgba(120,160,255,.10),0 14px 30px -14px rgba(0,0,0,.8);
  --elev-2:0 1px 0 var(--edge-hi) inset,0 0 0 1px rgba(120,160,255,.14),0 24px 50px -18px rgba(0,0,0,.9),0 0 40px -20px rgba(79,140,255,.45);
  --well:inset 0 2px 6px rgba(0,0,0,.55),inset 0 0 0 1px rgba(120,160,255,.10);
  --holo-bg:radial-gradient(120% 90% at 50% 15%,#1b2a4d 0%,#0e1628 50%,#080c16 100%);
  --holo-grid:rgba(90,170,255,.32); --holo-ring:rgba(90,190,255,.7); --holo-edge:#8fb4ff;
  --bd-skin:#16213a; --bd-edge:#7fa6ff; --bd-idle:#24324f; --bd-sep:#0a101d;
  --overlay:rgba(8,12,22,.82); --dock:rgba(16,22,36,.78);
  --accent:#86aaff; --accent-soft:#18264a; --accent-soft-2:#2b3f74;
}

/* ---- 背景：奥行きのある光と、うっすらした格子 ---- */
body{background:var(--bg-fx);background-color:var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:32px 32px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}

/* ---- 面の高さ（カード・一覧・数値タイル） ---- */
.card,.list,.kpi,.stat-tile,.exc{background:var(--surface);border:0;box-shadow:var(--elev-1)}
.card.tap:active,.menu-card:active{transform:translateY(1px) scale(.995);box-shadow:var(--elev-1)}
.li{background:transparent}
.list{overflow:hidden}
.sheet{background:var(--surface-solid);box-shadow:0 -1px 0 var(--edge-hi) inset,0 -20px 60px -10px rgba(0,0,0,.45)}
.page,.overlay{background:var(--bg-fx);background-color:var(--bg)}

/* ---- ボタン：光る上辺と影で「押せる立体」に。押すと沈む ---- */
.btn{box-shadow:0 1px 0 var(--edge-hi) inset,0 0 0 1px var(--line-2),0 4px 10px -6px rgba(0,0,0,.25);border:0;background:var(--surface);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 1px var(--line-2),inset 0 2px 6px rgba(0,0,0,.18)}
.btn-primary,.btn-start,.fab{background:linear-gradient(180deg,#4d84ff 0%,#2457e6 55%,#1d47c9 100%);color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -2px 0 rgba(0,0,0,.18) inset,0 10px 24px -10px rgba(37,99,235,.9),0 0 0 1px rgba(29,71,201,.6)}
.btn-primary:active:not(:disabled),.btn-start:active,.fab:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 10px -6px rgba(37,99,235,.9),0 0 0 1px rgba(29,71,201,.6)}
.btn-ok,.wo-finish{background:linear-gradient(180deg,#22b06c 0%,#0e7c4b 100%);color:#fff;border:0;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 18px -10px rgba(14,124,75,.9)}
.btn-soft{background:linear-gradient(180deg,var(--accent-soft),var(--accent-soft));color:var(--accent)}
.btn-line{color:var(--accent)}
.btn-danger-line{color:var(--danger)}
.btn-ghost{background:transparent;box-shadow:none}
.icon-btn.solid{background:var(--surface);box-shadow:var(--elev-1);border:0}

/* ---- 入力欄・切替：くぼんだ「ウェル」 ---- */
.input,.search .input{background:var(--surface-2);border:0;box-shadow:var(--well)}
.input:focus{box-shadow:var(--well),0 0 0 3px rgba(59,130,246,.35)}
.seg{background:var(--surface-2);box-shadow:var(--well)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--elev-1)}
.seg.pill{border:0}
.seg.pill button[aria-pressed="true"]{background:linear-gradient(180deg,#4d84ff,#2457e6);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 14px -8px rgba(37,99,235,.9)}
.chip{background:var(--surface);border:0;box-shadow:0 1px 0 var(--edge-hi) inset,0 0 0 1px var(--line-2)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#4d84ff,#2457e6);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 14px -8px rgba(37,99,235,.9)}

/* ---- ホログラム・ステージ（人体図） ---- */
.stage{position:relative;overflow:hidden;background:var(--holo-bg);border-radius:22px;box-shadow:var(--elev-2);padding:14px 6px 30px;isolation:isolate}
.stage::before{content:"";position:absolute;left:-30%;right:-30%;bottom:-6%;height:46%;z-index:-1;
  background-image:linear-gradient(var(--holo-grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--holo-grid) 1.5px,transparent 1.5px);background-size:38px 38px;
  transform:perspective(320px) rotateX(64deg);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 70%,transparent 100%)}
.stage::after{content:"";position:absolute;left:8%;right:8%;bottom:5%;height:16%;z-index:-1;border-radius:50%;
  background:radial-gradient(closest-side,rgba(90,190,255,.35),transparent 70%);
  box-shadow:0 0 0 2px var(--holo-ring),0 0 22px 2px var(--holo-ring),inset 0 0 18px var(--holo-ring);opacity:.65}
.stage .bodysvg{position:relative;filter:drop-shadow(0 0 10px rgba(80,160,255,.35)) drop-shadow(0 18px 18px rgba(0,0,0,.35));animation:holo-float 6s ease-in-out infinite}
.stage .bodysvg::after{content:""}
@keyframes holo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bodysvg .bd-sil,.bodysvg .bd-head{stroke:var(--holo-edge)}
.reco .stage,.reco-body{background:transparent;box-shadow:none}
.mmap.stage .bodysvg{transform-origin:50% 60%}

/* ---- 今日のおすすめ：宙に浮くパネル ---- */
.reco{background:radial-gradient(120% 120% at 15% 25%,#22345e 0%,#101a30 48%,#090e1a 100%);
  box-shadow:0 1px 0 rgba(160,195,255,.25) inset,0 0 0 1px rgba(120,160,255,.18),0 30px 60px -24px rgba(8,14,30,.9),0 0 60px -26px rgba(79,140,255,.8)}
.reco-body{position:relative;isolation:isolate}
.reco-body::before{content:"";position:absolute;left:-25%;right:-25%;bottom:-4%;height:34%;z-index:-1;
  background-image:linear-gradient(rgba(90,170,255,.32) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(90,170,255,.32) 1.5px,transparent 1.5px);background-size:22px 22px;
  transform:perspective(200px) rotateX(64deg);transform-origin:50% 0;
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 0%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 30%,#000 0%,transparent 72%)}
.reco-body::after{content:"";position:absolute;left:10%;right:10%;bottom:2%;height:12%;z-index:-1;border-radius:50%;box-shadow:0 0 0 1.5px rgba(90,190,255,.7),0 0 16px 2px rgba(90,190,255,.55)}
.reco-top,.reco .reco-stats,.reco .btn,.reco .reco-note{position:relative;z-index:1}
.reco-body .bodysvg{filter:drop-shadow(0 0 12px rgba(255,140,60,.35)) drop-shadow(0 16px 14px rgba(0,0,0,.55));animation:holo-float 6s ease-in-out infinite}
.reco .reco-stats b{text-shadow:0 0 18px rgba(120,170,255,.55)}

/* ---- 記録画面：くぼんだ入力セル、光る完了オーブ ---- */
.cell{background:var(--surface-2);border:0;box-shadow:var(--well)}
.cell.on{box-shadow:var(--well),0 0 0 2px var(--glow),0 0 18px -2px var(--glow)}
.set-r.done{background:linear-gradient(90deg,rgba(17,147,90,.22),rgba(17,147,90,.06));box-shadow:inset 3px 0 0 #22c27a}
.done-btn{background:var(--surface);border:0;box-shadow:0 1px 0 var(--edge-hi) inset,0 0 0 1.5px var(--line-2),0 4px 10px -6px rgba(0,0,0,.4)}
.done-btn[aria-pressed="true"]{background:radial-gradient(circle at 35% 30%,#4ee39a 0%,#14a05f 45%,#0b6e41 100%);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 0 0 1px #0b6e41,0 0 20px -2px rgba(34,194,122,.85)}
.restbar{background:var(--dock);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:0;box-shadow:0 -1px 0 var(--edge-hi) inset,0 -18px 40px -20px rgba(0,0,0,.5)}
.restbar .prog{background:linear-gradient(90deg,var(--glow-2),var(--glow));box-shadow:0 0 12px var(--glow)}
.keypad{background:var(--surface-solid);box-shadow:0 -1px 0 var(--edge-hi) inset,0 -24px 60px -12px rgba(0,0,0,.5)}
.kp-grid button{background:var(--surface);box-shadow:0 1px 0 var(--edge-hi) inset,0 0 0 1px var(--line),0 4px 8px -6px rgba(0,0,0,.4)}
.kp-grid button:active{transform:translateY(2px);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.kp-grid button.go{background:linear-gradient(180deg,#4d84ff,#1d47c9)}
.kp-grid button.ok{background:linear-gradient(180deg,#22b06c,#0e7c4b)}
.wo-head,.page-h{background:var(--overlay);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-bottom:0;box-shadow:0 1px 0 var(--edge-hi),0 10px 30px -18px rgba(0,0,0,.5)}
.wo-nav button.cur{background:linear-gradient(180deg,#4d84ff,#2457e6);color:#fff;box-shadow:0 6px 14px -8px rgba(37,99,235,.9)}

/* ---- 浮かぶドック型タブバー ---- */
.tabbar{left:10px;right:10px;bottom:calc(8px + var(--safe-bottom));padding-bottom:0;border:0;border-radius:24px;background:var(--dock);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:0 1px 0 var(--edge-hi) inset,0 0 0 1px rgba(120,160,255,.14),0 20px 40px -16px rgba(0,0,0,.55)}
.tabbar-in{max-width:620px}
.tab{height:62px}
.tab[aria-current="page"] .ic{background:linear-gradient(180deg,#4d84ff,#2457e6);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 16px -6px rgba(37,99,235,.95)}
body{padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 40px)}
.minibar{bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 14px)}
.fab{bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 24px)}

/* ---- 数字：ダークでは発光 ---- */
html[data-theme="dark"] .kpi b,html[data-theme="dark"] .big2 b,html[data-theme="dark"] .trend .v{text-shadow:0 0 16px rgba(120,170,255,.35)}
.cal .day.sel span{background:radial-gradient(circle at 35% 30%,#6f9cff,#2457e6 60%,#1a3fb0);box-shadow:0 0 16px -2px rgba(37,99,235,.9)}
.cal .day svg.ringsvg{filter:drop-shadow(0 0 3px rgba(120,170,255,.35))}

@media (prefers-reduced-motion:reduce){.stage .bodysvg,.reco-body .bodysvg{animation:none}}

.set-r.done .cell{background:transparent;box-shadow:none}

.kp-grid button.go,.btn-primary,.btn-start,.fab,.chip[aria-pressed="true"],.seg.pill button[aria-pressed="true"],.wo-nav button.cur{background-color:#2457e6}
.kp-grid button.ok,.btn-ok,.wo-finish{background-color:#0e7c4b}

@media (max-width:370px){.kpi b{font-size:23px;white-space:nowrap}.kpi{padding:12px}}
/* =====================================================================
   HUDレイヤー：計器のような照準枠・走査光・発光インジケーター
   （動きは初回表示だけ。端末の「視差効果を減らす」設定では止める）
   ===================================================================== */
.hud{position:absolute;inset:10px;pointer-events:none;z-index:2;
  --c:rgba(130,200,255,.85); --l:18px; --w:2px;
  background:
    linear-gradient(var(--c),var(--c)) left top/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) left top/var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) right top/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) right top/var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) left bottom/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) left bottom/var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) right bottom/var(--l) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) right bottom/var(--w) var(--l) no-repeat;
  overflow:hidden}
.hud.scan::after{content:"";position:absolute;left:0;right:0;top:-30%;height:30%;
  background:linear-gradient(180deg,transparent,rgba(90,190,255,.10) 70%,rgba(140,215,255,.55) 98%,transparent);
  animation:hud-scan 1.5s cubic-bezier(.4,0,.2,1) .15s 1 both}
@keyframes hud-scan{from{transform:translateY(0)}to{transform:translateY(440%)}}
.reco-kicker .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ee39a;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 rgba(78,227,154,.7);animation:live-pulse 2.4s ease-out infinite}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(78,227,154,.65)}70%{box-shadow:0 0 0 8px rgba(78,227,154,0)}100%{box-shadow:0 0 0 0 rgba(78,227,154,0)}}
.reco .reco-stats{position:relative}
.reco .reco-stats::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:38%;background:linear-gradient(90deg,var(--glow-2),transparent);box-shadow:0 0 8px var(--glow-2)}

/* 見出しの横に小さな発光バー */
.sec-h h2{display:flex;align-items:center;gap:8px}
.sec-h h2::before{content:"";width:4px;height:16px;border-radius:2px;flex:none;background:linear-gradient(180deg,var(--glow-2),var(--glow));box-shadow:0 0 10px -1px var(--glow)}
.sec-h h2 svg{width:18px;height:18px;color:var(--gold)}

/* タブ：選択中は下に光の点 */
.tab[aria-current="page"]::after{content:"";position:absolute;bottom:5px;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--glow-2);box-shadow:0 0 10px 1px var(--glow-2)}
.tab[aria-current="page"]{color:var(--head)}

/* メニューの小さな人体：ホログラムの台座 */
.menu-card .mb{position:relative;background:var(--holo-bg);box-shadow:var(--well);overflow:hidden}
.menu-card .mb::after{content:"";position:absolute;left:14%;right:14%;bottom:6px;height:8px;border-radius:50%;box-shadow:0 0 0 1px var(--holo-ring),0 0 10px var(--holo-ring);opacity:.8}
.tag-preset{display:inline-flex;align-items:center;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0;vertical-align:3px;color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-soft-2);white-space:nowrap;font-family:var(--f-ui)}

/* ヒント（メニューは編集できる） */
.card.tip{display:flex;gap:12px;align-items:flex-start;padding:14px 10px 14px 14px;margin-bottom:12px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--accent-soft),var(--surface-solid) 70%)}
.card.tip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--glow-2),var(--glow));box-shadow:0 0 12px var(--glow)}
.tip-i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,#4d84ff,#2457e6);box-shadow:0 6px 14px -6px rgba(37,99,235,.9)}
.tip-i svg{width:20px;height:20px}
.card.tip .m{flex:1;min-width:0}
.card.tip .m>b{display:block;font-size:14.5px;color:var(--head)}
.card.tip p b{color:var(--head)}
.card.tip p{margin:4px 0 0;font-size:13px;line-height:1.65;color:var(--text-2)}
.card.tip .icon-btn{margin:-6px -2px 0 0}
.kbd{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;vertical-align:-6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.kbd svg{width:14px;height:14px}
.hidden-note{margin:4px 4px 0;font-size:13px;color:var(--text-3)}
.hidden-note .link{font-size:13px;font-weight:700;color:var(--accent);min-height:36px;padding:0 4px}

/* 前回をくり返す */
.card.repeat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:10px;font:inherit;color:inherit;border:0}
.card.repeat .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card.repeat .m b{font-size:15px;color:var(--head)}
.card.repeat .m .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,#22b06c,#0e7c4b);box-shadow:0 6px 14px -6px rgba(14,124,75,.9)}
.rp-i svg{width:20px;height:20px}

/* 最近の自己ベスト */
.pr-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pr-strip::-webkit-scrollbar{display:none}
.pr-chip{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:132px;max-width:170px;padding:12px 14px;border-radius:16px;border:0;text-align:left;font:inherit;color:var(--text);
  background:linear-gradient(160deg,rgba(234,179,8,.18),transparent 60%),var(--surface-solid);box-shadow:var(--elev-1),inset 0 0 0 1px rgba(234,179,8,.35)}
.pr-chip .pr-n{font-size:12.5px;font-weight:700;color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-chip b{font-size:28px;line-height:1.05;color:var(--head)}
.pr-chip b small{font-size:12px;margin-left:2px;font-family:var(--f-ui);color:var(--text-2)}
.pr-chip .pr-d{font-size:12px;font-weight:700;color:var(--gold)}
html[data-theme="dark"] .pr-chip .pr-d{color:#ffd166}
html[data-theme="dark"] .pr-chip b{text-shadow:0 0 14px rgba(255,209,102,.35)}

/* ジャンル別の折りたたみ */
.acc{margin:0 0 8px;border-radius:16px;background:var(--surface);box-shadow:var(--elev-1);overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 14px;border:0;background:transparent;font:inherit;color:var(--head);text-align:left}
.acc-h b{flex:1;font-size:15.5px;font-weight:800}
.acc-n{min-width:30px;padding:2px 8px;border-radius:999px;font-size:14px;text-align:center;color:var(--text-2);background:var(--surface-2);box-shadow:var(--well)}
.acc-h>svg:last-child{width:20px;height:20px;color:var(--text-3);transition:transform .2s}
.acc.open .acc-h>svg:last-child{transform:rotate(180deg);color:var(--accent)}
.acc.open .acc-h{box-shadow:inset 0 -1px 0 var(--line)}
.acc .pdot{width:10px;height:10px;box-shadow:0 0 8px currentColor}
.acc>.list{margin:0;border:0;border-radius:0;box-shadow:none;background:transparent;animation:acc-in .18s ease-out}
@keyframes acc-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pk-list .acc{margin-bottom:8px}

/* 取り消し付きの通知 */
.toast.has-undo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;text-align:left;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow-lg),0 0 0 1px rgba(120,160,255,.25)}
.toast-undo{min-height:40px;padding:0 14px;border-radius:10px;border:0;font:inherit;font-weight:800;color:#fff;background:linear-gradient(180deg,#4d84ff,#2457e6);box-shadow:0 1px 0 rgba(255,255,255,.35) inset;white-space:nowrap}

/* 初回の案内 */
.onb-lead{margin:0 0 14px;font-size:14px;line-height:1.7;color:var(--text-2)}
.onb-list{list-style:none;margin:16px 0 4px;padding:12px 14px;border-radius:14px;background:var(--surface-2);box-shadow:var(--well);display:flex;flex-direction:column;gap:10px}
.onb-list li{display:flex;gap:10px;font-size:13.5px;line-height:1.6;color:var(--text-2)}
.onb-list svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent)}

/* 設定へ移動した時の目印 */
.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}

@media (prefers-reduced-motion:reduce){.hud.scan::after,.reco-kicker .live,.acc>.list,.flash{animation:none}.hud.scan::after{display:none}}
/* おすすめカード：鍛える筋肉のタグ */
.reco-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reco-tags span{font-size:12px;font-weight:700;color:#ffd3b0;padding:3px 9px;border-radius:999px;background:rgba(255,122,61,.14);box-shadow:inset 0 0 0 1px rgba(255,140,80,.45),0 0 12px -4px rgba(255,122,61,.8)}
.kpi b small,.reco-stats b small{font-family:var(--f-ui)}
/* =====================================================================
   コンパクト表示：余白・カード高さを詰め、スクロール距離を減らす
   ===================================================================== */
.sec{margin-top:20px}
.sec-h{margin-bottom:8px}
.card{margin-bottom:10px}
.card-h{margin-bottom:8px}
/* ホーム：アプリ追加の帯 */
.pwa-card.slim{padding:10px 10px 4px 12px}
.pwa-card.slim .pwa-top{margin-bottom:0;gap:10px}
.pwa-card.slim .pwa-ic{width:38px;height:38px;border-radius:10px}
.pwa-card.slim .pwa-top b{font-size:15px}
.pwa-card.slim .pwa-top span{font-size:11.5px;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwa-card.slim .btn-sm{flex:none;min-height:36px;padding:0 14px}
.pwa-card.slim .icon-btn{flex:none;width:36px;height:36px;margin-right:-4px}
.pwa-card.slim .pwa-later{display:flex;justify-content:flex-end;margin:0}
.pwa-card.slim .pwa-later .link{min-height:28px;font-size:11.5px;color:var(--text-3);font-weight:700}
/* ホーム：おすすめ */
.reco .reco-note{margin-top:8px}
/* ホーム：メニュー（1枚 約110px） */
.menu-card{padding:12px;gap:10px;align-items:center;contain-intrinsic-size:auto 108px}
.menu-card .mb{width:50px;padding:2px 1px;border-radius:10px;align-self:center}
.menu-card .mb::after{display:none}
.menu-card h3{font-size:16px;display:flex;align-items:center;min-width:0}
.menu-card h3 .tag-preset{flex:none;margin-left:6px;padding:1px 7px;font-size:10.5px;vertical-align:0}
.menu-card .mt .icon-btn{width:40px;height:40px}
.menu-card .ex{margin-top:1px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-card .mfoot{align-items:center;margin-top:6px}
.menu-card .meta{margin-top:0;gap:2px 10px}
.menu-card .meta-row b{font-size:15px;margin-right:1px}
.menu-card .btn-start{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.card.tip{padding:12px 12px 12px 14px}
.card.tip p{margin:2px 0 0}
.other-start .row .btn{min-height:42px}
.other-start .card.repeat{margin-bottom:8px}
/* 共通：4つ並びの数字 */
.stat4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stat4>div{min-width:0;padding:0 6px;border-left:1px solid var(--line)}
.stat4>div:first-child{border-left:0;padding-left:2px}
.stat4 b{display:block;font-size:20px;font-weight:700;line-height:1.15;color:var(--head);white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f-num,inherit)}
.stat4 b small{font-family:var(--f-ui);font-size:10.5px;font-weight:700;color:var(--text-2);margin-left:1px}
.stat4 span{display:block;font-size:11px;font-weight:700;color:var(--text-2);margin-top:1px;white-space:nowrap}
.stat4 em{display:block;font-size:11px;white-space:nowrap}
.wk-card .stat4{margin-top:0;padding-top:0;border-top:0}
@media (max-width:370px){.stat4 b{font-size:17px}.stat4>div{padding:0 4px}}
/* 記録：積み重ね（1行） */
.streak-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;font:inherit;color:inherit}
.streak-row .sr-i{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.streak-row .sr-i svg{width:20px;height:20px}
.streak-row .m{flex:1;min-width:0}
.streak-row .m>b{display:block;font-size:15px;color:var(--head)}
.streak-row .m>span{font-size:12.5px;color:var(--text-2)}
.streak-row .m>span b{font-size:15px;color:var(--head);margin:0 2px}
.streak-row>svg{width:20px;height:20px;color:var(--text-3)}
/* 振り返り：小さい切り替え・推移・自己ベスト */
.seg.pill.mini{flex:none;padding:2px}
.seg.pill.mini button{min-height:34px;font-size:12.5px;padding:0 12px}
.trend{padding:8px 0}
.trend .m b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend .m .v{font-size:20px;line-height:1.2}
.trend .m .v .d{font-family:var(--f-ui);font-size:11.5px;font-weight:600;margin-left:8px}
.trend .spark{height:42px;width:40%}
.trends .btn-sm{margin-top:4px;min-height:40px}
.pr-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left;font:inherit;color:inherit;background:none}
.pr-row:first-of-type{border-top:0}
.pr-m{flex:1;min-width:0}
.pr-m b{display:block;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-m span{font-size:11.5px;color:var(--text-3)}
.pr-v{text-align:right;flex:none}
.pr-v b{display:block;font-size:18px;color:var(--gold);line-height:1.15}
.pr-v b small{font-size:11px;margin-left:1px;font-family:var(--f-ui)}
.pr-v em{font-size:11px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles>.tile:only-child{grid-column:1/-1}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;color:inherit;padding:12px 14px;margin:0;min-width:0;width:100%}
.tile .tl-h{display:flex;align-items:center;gap:6px;width:100%;font-size:14px;font-weight:800;color:var(--head)}
.tile .tl-h svg{width:17px;height:17px}
.tile .tl-h svg:last-child{margin-left:auto;color:var(--text-3)}
.tile>b{font-size:22px;color:var(--head);line-height:1.2;white-space:nowrap}
.tile>b small{font-size:11px;margin:0 2px;color:var(--text-2);font-family:var(--f-ui)}
.tile .tl-d{font-size:11.5px;color:var(--text-2)}
.tile .spark{width:100%;max-width:none;height:30px;margin-top:4px}
/* 設定：折りたたみ */
.set-sec{padding:0 16px}
.set-sec>summary{list-style:none;cursor:pointer;min-height:56px;margin:0;-webkit-tap-highlight-color:transparent}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary h3{flex:0 1 auto}
.set-sec>summary .ss-sub{flex:1;text-align:right;font-size:12px;color:var(--text-3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-sec>summary>svg{width:20px;height:20px;flex:none;margin-left:auto;color:var(--text-3);transition:transform .2s}
.set-sec[open]>summary>svg{transform:rotate(180deg);color:var(--accent)}
.set-sec[open]{padding-bottom:16px}
.set-sec[open]>summary{margin-bottom:8px;box-shadow:inset 0 -1px 0 var(--line)}
.sub-acc{margin-top:10px;border-radius:var(--r);background:var(--surface-2);padding:0 12px}
.sub-acc>summary{list-style:none;min-height:46px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:750;color:var(--text-2);cursor:pointer}
.sub-acc>summary::-webkit-details-marker{display:none}
.sub-acc>summary svg{width:18px;height:18px}
.sub-acc[open]{padding-bottom:10px}
