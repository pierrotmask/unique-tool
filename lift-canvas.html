}
/* Chart.js を読み込めない環境（初回オフライン等）向けの簡易描画 */
function drawFallbackChart(canvas, pts, xr, yr, unit, metric) {
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth, H = wrap.clientHeight, dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const L = 46, R = 12, T = 18, B = 26, pw = W - L - R, ph = H - T - B;
  const X = (x) => L + (x - xr.min) / (xr.max - xr.min) * pw;
  const Y = (y) => T + (1 - (y - yr.min) / (yr.max - yr.min)) * ph;
  c.font = '11px system-ui, sans-serif'; c.lineWidth = 1;
  for (let v = yr.min; v <= yr.max + 1e-9; v += yr.step) {
    const y = Math.round(Y(v)) + 0.5;
    c.strokeStyle = '#edf0f5'; c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke();
    c.fillStyle = '#87919f'; c.textAlign = 'right'; c.fillText(fmtTick(v, metric), L - 6, y + 4);
  }
  c.textAlign = 'left'; c.fillText(unit, 4, 11);
  c.strokeStyle = '#c9d2df'; c.beginPath(); c.moveTo(L, T + ph + 0.5); c.lineTo(W - R, T + ph + 0.5); c.stroke();
  c.textAlign = 'center'; c.fillStyle = '#87919f';
  for (let k = 0; k <= 4; k++) { const xv = xr.min + (xr.max - xr.min) * (k + 0.5) / 5; c.fillText(xLabel(xv, xr), X(xv), H - 8); }
  c.strokeStyle = '#1d5fd8'; c.lineWidth = 2.5; c.lineJoin = 'round'; c.beginPath();
  pts.forEach((p, i) => (i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))));
  c.stroke();
  const sel = selIndex(); const many = pts.length > 60;
  pts.forEach((p, i) => {
    c.beginPath(); c.arc(X(p.x), Y(p.y), i === sel ? 7.5 : many ? 3.5 : 5, 0, Math.PI * 2);
    c.fillStyle = i === sel ? '#10284a' : '#ffffff'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = i === sel ? '#10284a' : '#1d5fd8'; c.stroke();
  });
  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect(); const mx = e.clientX - rect.left;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const dd = Math.abs(X(p.x) - mx); if (dd < bd) { bd = dd; best = i; } });
    selectPoint(best);
  };
}
function loadChartJs() {
  if (window.Chart) { chartStatus = 'ready'; return; }
  if (chartStatus === 'loading') return;
  chartStatus = 'loading';
  let i = 0;
  const next = () => {
    if (window.Chart) { chartStatus = 'ready'; return; }
    if (i >= CHART_JS_SOURCES.length) { chartStatus = 'failed'; chartFailedAt = Date.now(); return; }
    const s = document.createElement('script');
    s.src = CHART_JS_SOURCES[i++]; s.async = true;
    s.onload = () => { if (window.Chart) { chartStatus = 'ready'; if (UI.tab === 'graph' && graphPts.length) drawChart(); } else next(); };
    s.onerror = () => { s.remove(); next(); };
    document.head.appendChild(s);
  };
  next();
}

    onInput: (el) => {

      else if (f === 'date') st.date = el.value;
    },

      'del-set': (t, s) => { st.sets.splice(+t.dataset.i, 1); st.dirty = true; s.render(); },
      'add-set': (t, s) => { const l = st.sets[st.sets.length - 1]; st.sets.push({ w: l ? l.w : null, r: l ? l.r : null }); st.dirty = true; s.render(); },
      delete: async (t, s) => {
        const ok = await confirmSheet({ title: 'この記録を削除しますか？', message: `<p>${fmtDate(rec.date, true)} の「${esc(ex.name)}」の記録を削除します。</p>`, ok: '削除する', danger: true });

    }
  });
}

/* サンプル記録 */
function addDemoData() {
  let seed = 20261119;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const memos = ['調子よし', 'フォームを意識', '少し疲れ気味', 'スピード良好', '睡眠不足'];
  const plans = [
    { id: 'wl_01', w: 45, step: 1, reps: 3, sets: 4, every: 7, offset: 0, prob: 0.4 },
    { id: 'wl_02', w: 60, step: 1, reps: 2, sets: 4, every: 7, offset: 0, prob: 0.4 },
    { id: 'wl_05', w: 70, step: 2.5, reps: 3, sets: 4, every: 7, offset: 3, prob: 0.33 },
    { id: 'leg_01', w: 80, step: 2.5, reps: 8, sets: 3, every: 7, offset: 3, prob: 0.3 },
    { id: 'chest_01', w: 55, step: 2.5, reps: 10, sets: 3, every: 7, offset: 2, prob: 0.25 },
    { id: 'back_01', w: 100, step: 2.5, reps: 5, sets: 3, every: 10, offset: 5, prob: 0.35 }
  ];
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const recs = [];
  for (const p of plans) {
    let w = p.w;
    for (let d = 330 - p.offset; d >= 1; d -= p.every + (rnd() < 0.25 ? 1 : 0)) {
      const date = new Date(today); date.setDate(today.getDate() - d);
      if (rnd() < p.prob) w += p.step;
      if (rnd() < 0.05) w = Math.max(p.w, w - p.step * 2);
      const sets = [];
      for (let i = 0; i < p.sets; i++) sets.push({ w: round2(w), r: Math.max(1, p.reps - (i === p.sets - 1 && rnd() < 0.3 ? 1 : 0)), done: true });
      recs.push({ id: uid('rec'), sessionId: 'demo_' + ymd(date), date: ymd(date), exerciseId: p.id, sets, memo: rnd() < 0.12 ? memos[Math.floor(rnd() * memos.length)] : '', updatedAt: date.getTime(), demo: true });
    }
  }
  DB.records.push(...recs);
  DB.ui.graphExId = 'wl_01'; DB.ui.period = 'all'; UI.selDate = null;
  save();
  toast(`サンプル記録を${recs.length}件追加しました`, 'ok');
  renderCurrent();
}
async function removeDemoData() {
  const n = DB.records.filter((r) => r.demo).length;
  if (!n) { toast('サンプル記録はありません'); return; }
  const ok = await confirmSheet({ title: 'サンプル記録を削除しますか？', message: `<p>サンプル記録 ${n}件を削除します。あなたが入力した記録は残ります。</p>`, ok: '削除する', danger: true });

}

/* エクスポート */
function buildExport() {
  const data = clone(DB);
  data.timer = null;
  return { app: 'LiftCanvas', format: STORAGE_KEY, version: APP_VERSION, exportedAt: new Date().toISOString(), data };
}
function exportFileName() { const d = new Date(); return `liftcanvas_backup_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}.json`; }
function markBackup(via) { DB.settings.lastBackupAt = Date.now(); DB.settings.lastBackupVia = via; save(); if (UI.tab === 'backup') renderBackup(); }
function downloadJson(json, name) {
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportShare() {
  const json = JSON.stringify(buildExport());
  const name = exportFileName();
  let file = null;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'LiftCanvas バックアップ', text: 'LiftCanvasのバックアップファイルです' });
      markBackup('ファイル共有'); toast('バックアップファイルを書き出しました', 'ok');
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      downloadJson(json, name); markBackup('ダウンロード'); toast('共有できなかったため、ダウンロード保存しました');
    }
  } else {
    downloadJson(json, name); markBackup('ダウンロード');
    toast('この端末は共有に非対応のため、ダウンロード保存しました');
  }
}
function exportDownload() { downloadJson(JSON.stringify(buildExport(), null, 1), exportFileName()); markBackup('ダウンロード'); toast('ダウンロードを開始しました', 'ok'); }

/* インポート */
function parseImport(input) {
  const j = typeof input === 'string' ? JSON.parse(input) : input;
  if (!j || typeof j !== 'object') throw new Error('ファイルの形式が正しくありません');
  const d = (j.data && typeof j.data === 'object' && (j.app === 'LiftCanvas' || j.format)) ? j.data : j;
  if (!Array.isArray(d.records) && !Array.isArray(d.menus) && !Array.isArray(d.customExercises)) throw new Error('LiftCanvasのバックアップファイルではないようです');
  return { data: normalize(d), exportedAt: j.exportedAt || null };
}
async function handleImportFile(file) {
  if (!file) return;
  if (file.size > 30 * 1024 * 1024) { toast('ファイルが大きすぎます', 'error'); return; }
  try {
    const text = await file.text();
    const parsed = parseImport(text);
    await askImportMode(parsed, file.name);
  } catch (e) {
    console.error(e);
    toast(e instanceof SyntaxError ? 'ファイルを読み取れませんでした（JSON形式ではありません）' : (e.message || '読み込みに失敗しました'), 'error');
  }
}
async function askImportMode(parsed, label) {
  const inc = parsed.data;
  const recs = inc.records.filter((r) => doneSets(r).length);
  const days = new Set(recs.map((r) => r.date)).size;
  const mode = await choiceSheet({
    title: 'データの復元',
    message: `<div class="import-info"><span>読み込み元</span><b>${esc(label)}</b>${parsed.exportedAt ? `<span>保存日時</span><b>${esc(fmtDateTime(Date.parse(parsed.exportedAt)))}</b>` : ''}
      <span>記録</span><b>${days}日分（${recs.length}件）</b><span>種目セット</span><b>${inc.menus.length}件</b><span>自分の種目</span><b>${inc.customExercises.length}件</b></div><p>復元の方法を選んでください。</p>`,
    choices: [
      { key: 'merge', label: '既存データと統合（マージ）', desc: 'この端末の記録は残したまま、バックアップの内容を追加します。同じ記録は新しい方を残します。', cls: 'btn-primary' },
      { key: 'overwrite', label: '上書き復元', desc: 'この端末のデータをすべて消して、バックアップの内容に置き換えます。', cls: 'btn-outline danger' }
    ]
  });
  if (!mode) return;
  if (mode === 'overwrite') {
    const ok = await confirmSheet({ title: '上書き復元しますか？', message: '<p>この端末の現在のデータは、すべてバックアップの内容に置き換わります。この操作は取り消せません。</p>', ok: '上書き復元する', danger: true });
    if (!ok) return;
  }
  applyImport(inc, mode);
}
function mergeById(cur, inc) {
  const map = new Map(cur.map((x) => [x.id, x]));
  for (const x of inc) { const e = map.get(x.id); if (!e || (x.updatedAt || 0) > (e.updatedAt || 0)) map.set(x.id, x); }
  return [...map.values()];
}
function applyImport(inc, mode) {
  Timer.stop();
  if (mode === 'overwrite') {
    const keepId = DB.settings.googleClientId;
    DB = normalize(clone(inc));
    if (!DB.settings.googleClientId) DB.settings.googleClientId = keepId;
    DB.active = null;
  } else {
    DB.records = mergeById(DB.records, inc.records);
    DB.customExercises = mergeById(DB.customExercises, inc.customExercises);
    DB.menus = mergeById(DB.menus, inc.menus);
    DB.sessions = mergeById(DB.sessions, inc.sessions);
    DB.overrides = { ...inc.overrides, ...DB.overrides };
  }
  DB.timer = null;
  invalidateEx(); cleanupDrafts();
  UI.selDate = null;
  save();
  renderCurrent();
  toast(mode === 'overwrite' ? 'バックアップから上書き復元しました' : 'バックアップのデータを統合しました', 'ok');
}
async function resetAll() {
  const ok = await confirmSheet({ title: 'すべてのデータを削除しますか？', message: '<p>記録・種目セット・自分の種目・設定がすべて削除されます。</p>', ok: '次へ', danger: true });
  if (!ok) return;

}

/* Googleドライブ連携（Google Identity Services + Drive API v3） */
const Drive = {
  token: null, exp: 0, gisPromise: null,
  clientId() { return (DB.settings.googleClientId || '').trim() || GOOGLE_CLIENT_ID; },
  loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    if (this.gisPromise) return this.gisPromise;
    this.gisPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
      s.onload = () => resolve();
      s.onerror = () => { this.gisPromise = null; s.remove(); reject(new Error('Googleのログイン機能を読み込めませんでした。ネット接続をご確認ください')); };
      document.head.appendChild(s);
    });
    return this.gisPromise;
  },
  async getToken() {
    if (this.token && Date.now() < this.exp - 60000) return this.token;
    const cid = this.clientId();
    if (!cid) throw new Error('クライアントIDが設定されていません');
    await this.loadGis();
    return new Promise((resolve, reject) => {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if (!resp || resp.error) { reject(new Error('Googleへのログインが許可されませんでした' + (resp && resp.error ? `（${resp.error}）` : ''))); return; }
          this.token = resp.access_token;
          this.exp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
          resolve(this.token);
        },
        error_callback: (err) => {
          const t = err && err.type;
          reject(new Error(t === 'popup_closed' ? 'ログインがキャンセルされました' : t === 'popup_failed_to_open' ? 'ログイン画面を開けませんでした（ポップアップを許可してください）' : 'Googleへのログインに失敗しました'));
        }
      });
      client.requestAccessToken({ prompt: '' });
    });
  },
  async api(url, opts = {}, retry = true) {
    const token = await this.getToken();
    const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
    if (res.status === 401 && retry) { this.token = null; return this.api(url, opts, false); }
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); detail = j.error && j.error.message ? j.error.message : ''; } catch (e) { /* noop */ }
      throw new Error(`Googleドライブでエラーが発生しました（${res.status}）${detail ? '：' + detail : ''}`);
    }
    return res;
  },
  async findFile() {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&pageSize=10&fields=files(id%2Cname%2CmodifiedTime%2Csize)`);
    const j = await res.json();
    return (j.files && j.files[0]) || null;
  },
  async upload() {
    const body = JSON.stringify(buildExport());
    const f = await this.findFile();
    if (f) {
      await this.api(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(f.id)}?uploadType=media&fields=id%2CmodifiedTime`, { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body });
      return 'updated';
    }
    const boundary = 'liftcanvas' + Date.now().toString(36);
    const meta = { name: DRIVE_FILE_NAME, mimeType: 'application/json', description: 'LiftCanvas（トレーニング記録）のバックアップ' };
    const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${boundary}--`;
    await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id%2CmodifiedTime', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body: multipart });
    return 'created';
  },
  async download() {
    const f = await this.findFile();
    if (!f) throw new Error('Googleドライブにバックアップが見つかりませんでした（このアプリで保存したファイルのみ検索できます）');
    const res = await this.api(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(f.id)}?alt=media`);
    return { text: await res.text(), file: f };
  }
};
function driveReady() {
  if (!Drive.clientId()) {
    toast('先に「クライアントIDの設定」を行ってください');
    const d = $('#driveDetails'); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return false;
  }
  if (location.protocol === 'file:') { toast('file:// で開いたページではGoogleログインを使えません。② のファイル保存をご利用ください', 'error'); return false; }
  if (!navigator.onLine) { toast('インターネットに接続してから実行してください', 'error'); return false; }
  return true;
}
async function driveBackup() {
  if (!driveReady()) return;
  setBusy(true, 'Googleドライブに保存しています…');
  try {
    const r = await Drive.upload();
    markBackup('Googleドライブ');
    toast(r === 'created' ? 'Googleドライブに新しく保存しました' : 'Googleドライブのバックアップを更新しました', 'ok');
  } catch (e) { console.error(e); toast(e.message || '保存に失敗しました', 'error'); }
  finally { setBusy(false); }
}
async function driveRestore() {
  if (!driveReady()) return;
  setBusy(true, 'Googleドライブから読み込んでいます…');
  let got = null;
  try { got = await Drive.download(); } catch (e) { console.error(e); toast(e.message || '読み込みに失敗しました', 'error'); }
  finally { setBusy(false); }
  if (!got) return;
  try { await askImportMode(parseImport(got.text), `Googleドライブ（${fmtDateTime(Date.parse(got.file.modifiedTime))} 更新）`); }
  catch (e) { toast(e.message || 'バックアップの内容を読み取れませんでした', 'error'); }
}

/* =====================================================================
   イベント処理
   ===================================================================== */
const ACTIONS = {
  'tab': (el) => setTab(el.dataset.tab),
  'welcome-close': () => { DB.ui.welcomeDone = true; save(); renderRecord(); },
  'goto-menus': () => { UI.manageView = 'menus'; setTab('manage'); },
  'start-menu': (el) => { const m = DB.menus.find((x) => x.id === el.dataset.id); if (m) startSession(m.exerciseIds, m.name, m.id); },
  'start-single': () => pickExercises({ title: '記録する種目を選ぶ（複数可）', multi: true, onDone: (ids) => { if (ids.length) startSession(ids, ids.length === 1 ? getEx(ids[0]).name : 'フリートレーニング', null); } }),
  'finish-session': () => finishSession(),
  'goto-ex': (el) => gotoExercise(+el.dataset.i),
  'prev-ex': () => gotoExercise(DB.active.idx - 1),
  'next-ex': () => gotoExercise(DB.active.idx + 1),
  'session-add-ex': () => pickExercises({ title: '今回のトレーニングに追加', multi: true, exclude: DB.active ? DB.active.exerciseIds : [], onDone: (ids) => {
    if (!ids.length || !DB.active) return;
    const start = DB.active.exerciseIds.length;
    DB.active.exerciseIds.push(...ids); save(); gotoExercise(start);
  } }),
  'ex-more': async () => {
    const a = DB.active; const exId = a.exerciseIds[a.idx]; const ex = getEx(exId);
    const choices = [];
    if (exSummary(exId)) choices.push({ key: 'graph', label: 'この種目の成長グラフを見る' });
    if (a.idx > 0) choices.push({ key: 'left', label: '順番を1つ前にする' });
    if (a.idx < a.exerciseIds.length - 1) choices.push({ key: 'right', label: '順番を1つ後にする' });
    choices.push({ key: 'detail', label: '目標回数・重量の刻みを設定' });
    choices.push({ key: 'remove', label: '今回のトレーニングから外す', cls: 'btn-outline danger' });
    const c = await choiceSheet({ title: ex.name, choices, cancel: '閉じる' });
    if (!c) return;
    if (c === 'graph') { DB.ui.graphExId = exId; UI.selDate = null; save(); setTab('graph'); }
    else if (c === 'left' || c === 'right') {
      const j = a.idx + (c === 'left' ? -1 : 1);
      [a.exerciseIds[a.idx], a.exerciseIds[j]] = [a.exerciseIds[j], a.exerciseIds[a.idx]];
      a.idx = j; save(); renderRecord();
    } else if (c === 'detail') openExerciseDetail(exId);
    else if (c === 'remove') {
      const rec = DB.records.find((r) => r.sessionId === a.id && r.exerciseId === exId);
      if (rec && doneSets(rec).length) {
        const ok = await confirmSheet({ title: 'この種目を外しますか？', message: '<p>今回完了したセットの記録も削除されます。</p>', ok: '外す', danger: true });
        if (!ok) return;
      }
      DB.records = DB.records.filter((r) => !(r.sessionId === a.id && r.exerciseId === exId));
      a.exerciseIds.splice(a.idx, 1);
      gotoExercise(Math.min(a.idx, a.exerciseIds.length - 1));
    }
  },
  'target-adj': (el) => { const rec = curRec(); if (!rec) return; setTarget(rec.exerciseId, getEx(rec.exerciseId).defaultTargetReps + Number(el.dataset.d)); renderRecord(); },
  'copy-prev': () => {
    const a = DB.active; const rec = curRec(); if (!rec) return;
    const prev = prevRecords(rec.exerciseId, a.id, a.date)[0];
    if (!prev) { toast('前回の記録がありません'); return; }
    const pd = doneSets(prev);
    pd.forEach((p, i) => {
      if (!rec.sets[i]) rec.sets.push({ w: p.w, r: p.r, done: false });
      else if (!rec.sets[i].done) { rec.sets[i].w = p.w; rec.sets[i].r = p.r; }
    });
    rec.updatedAt = Date.now(); save(); renderRecord();
    toast('前回の内容をコピーしました（自由に変更できます）');
  },
  'apply-suggest': (el) => {
    const a = DB.active; const rec = curRec(); if (!rec) return;
    const ex = getEx(rec.exerciseId);
    const prev = prevRecords(rec.exerciseId, a.id, a.date)[0]; if (!prev) return;
    const pd = doneSets(prev);
    const mode = el.dataset.mode;
    const n = Math.max(rec.sets.length, pd.length);
    for (let i = 0; i < n; i++) {
      const p = pd[Math.min(i, pd.length - 1)];
      if (!rec.sets[i]) rec.sets.push({ w: null, r: null, done: false });
      const s = rec.sets[i]; if (s.done) continue;
      if (mode === 'w') { s.w = round2(p.w + ex.stepKg); s.r = p.r; } else { s.w = p.w; s.r = p.r + 1; }
    }
    rec.updatedAt = Date.now(); save(); renderRecord();
    toast('参考目安を入力欄に反映しました（自由に調整できます）');
  },
  'add-set': () => {
    const rec = curRec(); if (!rec) return;
    if (rec.sets.length >= 30) { toast('セットは30まで追加できます'); return; }
    const l = rec.sets[rec.sets.length - 1];
    rec.sets.push({ w: l ? l.w : null, r: l ? l.r : null, done: false });
    rec.updatedAt = Date.now(); save(); renderRecord();
  },
  'set-del': async (el) => {
    const rec = curRec(); if (!rec) return;
    const i = +el.dataset.i; const s = rec.sets[i]; if (!s) return;
    if (s.done || s.w != null || s.r != null) {
      const ok = await confirmSheet({ title: `セット${i + 1}を削除しますか？`, ok: '削除する', danger: true });
      if (!ok) return;
    }
    rec.sets.splice(i, 1); rec.updatedAt = Date.now(); save(); renderRecord();
  },
  'set-step': (el) => stepSet(el),
  'set-done': (el) => toggleDone(+el.dataset.i),
  'rel-swap': (el) => {
    const a = DB.active; const old = a.exerciseIds[a.idx]; const id = el.dataset.id;
    const rec = DB.records.find((r) => r.sessionId === a.id && r.exerciseId === old);
    if (rec && doneSets(rec).length) {
      a.exerciseIds.splice(a.idx + 1, 0, id); save(); gotoExercise(a.idx + 1);
      toast('記録済みのため、入れ替えずに次へ追加しました');
      return;
    }
    DB.records = DB.records.filter((r) => !(r.sessionId === a.id && r.exerciseId === old));
    a.exerciseIds[a.idx] = id; save(); gotoExercise(a.idx);
    toast(`「${getEx(id).name}」に入れ替えました`);
  },
  'rel-add': (el) => { const a = DB.active; a.exerciseIds.splice(a.idx + 1, 0, el.dataset.id); save(); gotoExercise(a.idx + 1); toast(`「${getEx(el.dataset.id).name}」を追加しました`); },
  'open-timer-settings': () => openTimerSettings(),
  'date-picker': (el) => { try { if (el.showPicker) el.showPicker(); } catch (e) { /* 対応ブラウザのみ */ } },
  'timer-start': () => Timer.start(DB.settings.restSec),
  'timer-add': (el) => Timer.add(Number(el.dataset.d)),
  'timer-stop': () => Timer.stop(),
  'rest-preset': (el) => { applyRest('rest-preset', Number(el.dataset.v)); renderCurrent(); },
  'rest-adj': (el) => { applyRest('rest-adj', Number(el.dataset.d)); renderCurrent(); },
  // 管理
  'manage-view': (el) => { UI.manageView = el.dataset.v; renderManage(); },
  'menu-new': () => openMenuEditor(null),
  'menu-edit': (el) => openMenuEditor(el.dataset.id),
  'menu-dup': (el) => {
    const i = DB.menus.findIndex((x) => x.id === el.dataset.id); if (i < 0) return;
    const m = DB.menus[i];
    DB.menus.splice(i + 1, 0, { id: uid('menu'), name: (m.name + '（コピー）').slice(0, 40), exerciseIds: [...m.exerciseIds], updatedAt: Date.now() });
    save(); renderManage(); toast('種目セットを複製しました');
  },
  'menu-del': async (el) => {
    const m = DB.menus.find((x) => x.id === el.dataset.id); if (!m) return;
    const ok = await confirmSheet({ title: '種目セットを削除しますか？', message: `<p>「${esc(m.name)}」を削除します。これまでの記録は消えません。</p>`, ok: '削除する', danger: true });
    if (!ok) return;
    DB.menus = DB.menus.filter((x) => x.id !== m.id); save(); renderManage(); toast('種目セットを削除しました');
  },
  'menu-move': (el) => {
    const i = +el.dataset.i, j = i + Number(el.dataset.d);
    if (j < 0 || j >= DB.menus.length) return;
    [DB.menus[i], DB.menus[j]] = [DB.menus[j], DB.menus[i]];
    DB.menus[i].updatedAt = DB.menus[j].updatedAt = Date.now();
    save(); renderManage();
  },
  'ex-new': () => openExerciseForm(null, null, CATEGORIES.includes(UI.exCat) ? UI.exCat : undefined),
  'ex-open': (el) => openExerciseDetail(el.dataset.id),
  'ex-cat': (el) => { UI.exCat = el.dataset.c; $$('#view-manage .chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.c === UI.exCat))); $('#exList').innerHTML = renderExList(); },
  // グラフ
  'graph-pick-ex': () => pickExercises({ title: 'グラフを見る種目', initialCat: '記録あり', onDone: ([id]) => { DB.ui.graphExId = id; UI.selDate = null; UI.histLimit = 20; save(); renderGraph(); } }),
  'graph-ex': (el) => { DB.ui.graphExId = el.dataset.id; UI.selDate = null; UI.histLimit = 20; save(); if (UI.tab === 'graph') renderGraph(); else setTab('graph'); },
  'graph-metric': (el) => { DB.ui.metric = el.dataset.v; save(); renderView('graph'); },
  'graph-period': (el) => { DB.ui.period = el.dataset.v; save(); renderView('graph'); },
  'hist-edit': (el) => openRecordEditor(el.dataset.id),
  'hist-more': () => { UI.histLimit += 20; renderView('graph'); },
  'demo-add': () => addDemoData(),
  'demo-remove': () => removeDemoData(),
  // バックアップ
  'drive-save-id': () => {
    const v = ($('#clientIdInput').value || '').trim();
    if (v && !/\.apps\.googleusercontent\.com$/.test(v)) { toast('クライアントIDは「〜.apps.googleusercontent.com」の形式です', 'error'); return; }
    DB.settings.googleClientId = v; Drive.token = null; save(); renderBackup();
    toast(v ? 'クライアントIDを保存しました' : 'クライアントIDを削除しました', 'ok');
  },
  'drive-clear-id': () => { DB.settings.googleClientId = ''; Drive.token = null; save(); renderBackup(); toast('クライアントIDを削除しました'); },
  'drive-backup': () => driveBackup(),
  'drive-restore': () => driveRestore(),
  'export-share': () => exportShare(),
  'export-download': () => exportDownload(),
  'import-open': () => { const f = $('#fileInput'); f.value = ''; f.click(); },
  'reset-all': () => resetAll()
};
const INPUTS = {
  'set-w': (el) => { const rec = curRec(); const s = rec && rec.sets[+el.dataset.i]; if (!s) return; s.w = parseNum(el.value); rec.updatedAt = Date.now(); save(); },
  'set-r': (el) => { const rec = curRec(); const s = rec && rec.sets[+el.dataset.i]; if (!s) return; const n = parseNum(el.value); s.r = n == null ? null : Math.min(999, Math.round(n)); rec.updatedAt = Date.now(); save(); },
  'rec-memo': (el) => { const rec = curRec(); if (!rec) return; rec.memo = el.value.slice(0, 500); rec.updatedAt = Date.now(); save(); },
  'ex-search': (el) => { UI.exQuery = el.value; $('#exList').innerHTML = renderExList(); }
};
const CHANGES = {
  'session-date': async (el) => {
    const a = DB.active; if (!a) return;
    const v = el.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { el.value = a.date; return; }
    if (v > ymd()) { toast('未来の日付は選べません'); el.value = a.date; return; }
    a.date = v;
    DB.records.forEach((r) => { if (r.sessionId === a.id) { r.date = v; r.updatedAt = Date.now(); } });
    save(); renderRecord(); toast(`日付を ${fmtDate(v, true)} に変更しました`);
  },
  'autoRest': (el) => { DB.settings.autoRest = el.checked; save(); if (UI.tab === 'record') renderRecord(); },
  'sound': (el) => { DB.settings.sound = el.checked; save(); if (el.checked) Timer.unlockAudio(); },
  'file': (el) => { const f = el.files && el.files[0]; el.value = ''; handleImportFile(f); }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.input && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.change && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheets.length) { const s = sheets[sheets.length - 1]; s.tryClose(); return; }
  if (e.key !== 'Enter' || !e.target.dataset) return;
  if (e.target.dataset.input === 'set-w') { e.preventDefault(); const r = e.target.closest('.set-row').querySelector('[data-input="set-r"]'); if (r) r.focus(); }
  else if (e.target.dataset.input === 'set-r') { e.preventDefault(); e.target.blur(); }
});
document.addEventListener('focusin', (e) => {
  if (e.target.matches && e.target.matches('.stepper input')) setTimeout(() => { try { e.target.select(); } catch (err) { /* noop */ } }, 0);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && DB && DB.timer) Timer.tick(); });
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (UI.tab === 'graph' && !chartObj && graphPts.length) drawChart(); }, 200); });
window.addEventListener('online', () => { if (chartStatus === 'failed') { chartStatus = 'idle'; loadChartJs(); } });
window.addEventListener('storage', (e) => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try { DB = normalize(JSON.parse(e.newValue)); invalidateEx(); renderCurrent(); } catch (err) { /* noop */ }
});

/* ---------- 起動 ---------- */
function init() {
  DB = load();
  invalidateEx();
  cleanupDrafts();
  buildTabbar();
  $('#timerClose').innerHTML = ICON.close;
  setTab('record');
  Timer.resume();
  loadChartJs();
  save();
  if (!storageOK) toast('この環境ではデータを保存できません（プライベートモード等）', 'error');
}
init();
</script>
</body>
</html>
