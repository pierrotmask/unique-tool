/* ---------- プレート計算 ---------- */
function plateLoad(total, bar, collar, plates) {
  let side = (total - bar - (collar ? 5 : 0)) / 2;
  if (side < -1e-9) return { ok: false, list: [], rest: side * 2 };
  const list = [];
  for (const p of plates) { while (side + 1e-9 >= p) { list.push(p); side = round2(side - p); } }
  return { ok: side < 1e-6, list, rest: round2(side * 2) };
}
function plateSvg(list, collar) {
  const H = 120, cy = 60; let x = 70; let h = `<rect x="0" y="${cy - 5}" width="70" height="10" rx="3" fill="#9aa4b2"/><rect x="62" y="${cy - 14}" width="8" height="28" rx="2" fill="#7b8594"/>`;
  for (const p of list) {
    const ph = p >= 10 ? 104 : p >= 5 ? 76 : p >= 2 ? 58 : 46; const pw = p >= 15 ? 16 : p >= 5 ? 12 : 9;
    h += `<rect x="${x}" y="${cy - ph / 2}" width="${pw}" height="${ph}" rx="3" fill="${PLATE_COLORS[p] || '#94a3b8'}" stroke="rgba(0,0,0,.25)"/><text x="${x + pw / 2}" y="${cy + ph / 2 + 13}" font-size="9" text-anchor="middle" fill="var(--text-2)" font-weight="700">${p}</text>`;
    x += pw + 2;
  }
  if (collar) { h += `<rect x="${x}" y="${cy - 14}" width="10" height="28" rx="2" fill="#475569"/>`; x += 12; }
  h += `<rect x="${x}" y="${cy - 5}" width="${Math.max(40, 300 - x)}" height="10" rx="3" fill="#9aa4b2"/>`;
  return `<svg viewBox="0 0 ${Math.max(340, x + 50)} ${H + 14}">${h}</svg>`;
}
function openPlateCalc(initial) {

  openSheet({

/* ---------- ウォームアップ自動作成 ---------- */
function buildWarmups(target, ex) {
  const bar = ex.equipment === 'バーベル' ? DB.settings.barKg : 0;
  const step = ex.stepKg;
  const plan = [[0.4, 5], [0.55, 3], [0.7, 2], [0.8, 1], [0.9, 1]];
  const out = [];
  if (bar && target > bar + 10) out.push({ w: bar, r: ex.part === '全身・WL' ? 5 : 8 });
  for (const [p, r] of plan) {
    const w = Math.round((target * p) / step) * step;
    if (w <= (out.length ? out[out.length - 1].w : 0) || w >= target || w < bar) continue;
    if (p >= 0.9 && target < 80) continue;
    out.push({ w: round2(w), r: ex.part === '全身・WL' ? Math.min(r, 3) : r });
  }
  return out;
}
async function warmupFor(i) {
  const rec = recAt(i); const ex = getEx(rec.exerciseId);
  let first = rec.sets.find((s) => s.t !== 'w');
  let target = first && first.w != null ? first.w : null;
  if (target == null) { const j = rec.sets.indexOf(first); if (j >= 0) target = phOf(i, j).w; }
  if (!(target > 0)) {
    const v = await promptSheet({ title: 'ウォームアップ作成', label: 'メインセットの重量（kg）', placeholder: '例：80', ok: '作成' });
    target = parseNum(v); if (!(target > 0)) return;
  }
  const ws = buildWarmups(target, ex);
  if (!ws.length) { toast('重量が軽いため、ウォームアップは不要です'); return; }
  rec.sets = rec.sets.filter((s) => !(s.t === 'w' && !s.done));
  const idx = rec.sets.findIndex((s) => s.t !== 'w');
  rec.sets.splice(idx < 0 ? rec.sets.length : idx, 0, ...ws.map((w) => ({ w: w.w, r: w.r, done: false, t: 'w' })));
  rec.updatedAt = Date.now(); touch(); renderWorkout();
  toast(`ウォームアップ ${ws.length}セットを追加しました（${fmtNum(target)}kgの${ws.map((w) => Math.round(w.w / target * 100) + '%').join('・')}）`);
}

function bestOneRm(exId) {

  for (const r of exRecords(exId)) for (const s of work(r)) if (s.r === 1) single = Math.max(single, s.w);
  return { e1: round1(sm.bestE1), single, maxW: sm.maxW };
}

/* 数字のカウントアップ（初回表示のみ） */
function countUp(els) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (const el of els) {
    const n = el.firstChild; if (!n || n.nodeType !== 3) continue;
    const to = Number(n.nodeValue); if (!isFinite(to) || to <= 0) continue;
    const t0 = performance.now(), dur = 900;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); n.nodeValue = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1 && n.isConnected) requestAnimationFrame(step); };
    n.nodeValue = '0'; requestAnimationFrame(step);
  }
}

/* =====================================================================
   1. トレーニング
   ===================================================================== */
function weekStreaks() {
  const weeks = new Set(IDX().sessions.map((s) => weekStart(s.date)));
  const sorted = [...weeks].sort();
  let longest = 0, run = 0, prev = null;
  for (const w of sorted) { run = prev && daysBetween(prev, w) === 7 ? run + 1 : 1; longest = Math.max(longest, run); prev = w; }
  let cur = 0; let w = weekStart(ymd());
  if (!weeks.has(w)) w = addDays(w, -7);
  while (weeks.has(w)) { cur++; w = addDays(w, -7); }
  return { longest, cur, total: IDX().sessions.length };
}
function menuMuscles(m) {
  const fills = {}; const set = new Set();
  for (const id of m.exerciseIds) { const e = getEx(id); if (e.missing) continue; for (const k of e.sub) if (!fills[k]) fills[k] = partColor(e.part) + '66'; }
  for (const id of m.exerciseIds) { const e = getEx(id); if (e.missing) continue; for (const k of e.muscles) { fills[k] = partColor(e.part); set.add(k); } }
  return { fills, primary: [...set] };
}
function recommendMenu() {
  if (!DB.menus.length) return null;
  const agg = muscleAgg(28);
  const lastOf = (id) => DB.sessions.filter((s) => s.menuId === id && s.date).map((s) => s.date).sort().pop();
  let best = null;
  for (const m of DB.menus.filter(menuVisible)) {
    const ids = m.exerciseIds.filter((id) => exMap().has(id)); if (!ids.length) continue;
    const mm = menuMuscles(m);
    const ready = mm.primary.length ? mm.primary.reduce((a, k) => a + (1 - Math.min(1, agg.fatigue[k] / 6)), 0) / mm.primary.length : 1;
    const last = lastOf(m.id); const days = last ? daysBetween(last, ymd()) : 10;
    const score = ready * 0.7 + Math.min(days, 10) / 10 * 0.3;
    if (!best || score > best.score) best = { m, score, ready, last, days, mm, agg };
  }
  return best;
}
/* 最近の自己ベスト（14日以内） */
function prStrip() {
  const from = addDays(ymd(), -14);
  const list = prEvents().filter((x) => x.date >= from);
  const seen = new Set(); const top = [];
  for (const x of list) { if (seen.has(x.ex.id)) continue; seen.add(x.ex.id); top.push(x); if (top.length >= 6) break; }
  if (!top.length) return '';
  return `<section class="sec"><div class="sec-h"><h2>${ICON.trophy || ICON.bolt} 最近の自己ベスト</h2><button type="button" class="link" data-a="tab" data-tab="review">すべて見る</button></div>
    <div class="pr-strip">${top.map((x) => `<button type="button" class="pr-chip" data-a="exDetail" data-id="${esc(x.ex.id)}"><span class="pr-n">${esc(x.ex.name)}</span><b class="num">${fmtNum(x.v)}<small>${x.key === 'e1rm' ? 'kg' : unitOf(x.ex)}</small></b><span class="pr-d">+${fmtNum(round1(x.v - x.prev))} ・ ${fmtRelDay(x.date)}</span></button>`).join('')}</div></section>`;
}

    <div class="row">

/* メニュー編集（全画面） */
function openMenuEditor(menuId, initialIds) {

  const st = { name: m ? m.name : '', ids: m ? m.exerciseIds.filter((id) => exMap().has(id)) : (initialIds || []), sets: m ? { ...m.sets } : {}, dirty: false };

        <div class="stepper" style="margin-top:6px;gap:4px"><button type="button" data-a="sets" data-i="${i}" data-d="-1" style="width:40px;height:38px;font-size:18px">−</button><span class="val" style="min-width:60px;font-size:16px">${n}<span class="u">セット</span></span><button type="button" data-a="sets" data-i="${i}" data-d="1" style="width:40px;height:38px;font-size:18px">＋</button></div></div>
        <div style="display:flex;flex-direction:column"><button type="button" class="icon-btn" data-a="mv" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="上へ">${ICON.up}</button><button type="button" class="icon-btn" data-a="mv" data-i="${i}" data-d="1" ${i === st.ids.length - 1 ? 'disabled' : ''} aria-label="下へ">${ICON.down}</button></div>
        <button type="button" class="icon-btn" data-a="rm" data-i="${i}" aria-label="外す">${ICON.close}</button></div>`; }).join('')}</div>` : '<p class="empty-mini">まだ種目がありません。下のボタンから追加してください。</p>'}
      <div style="height:10px"></div><button type="button" class="btn btn-line btn-block" data-a="add">${ICON.plus}種目を追加</button></div>
      <button type="button" class="btn btn-primary btn-block btn-lg" data-a="save">${ICON.check}保存する</button>
      ${m ? `<button type="button" class="btn btn-danger-line btn-block" style="margin-top:10px" data-a="del">${ICON.trash}このメニューを削除</button>` : ''}`,
    inputs: { name: (el) => { st.name = el.value; st.dirty = true; } },
    actions: {
      __back: async () => { if (st.dirty) { const ok = await confirmSheet({ title: '編集内容を破棄しますか？', ok: '破棄する', danger: true }); if (!ok) return; } p.close(); },
      sets: (el) => { const id = st.ids[Number(el.dataset.i)]; st.sets[id] = clamp((st.sets[id] || 3) + Number(el.dataset.d), 1, 20); st.dirty = true; p.render(); },
      mv: (el) => { const i = Number(el.dataset.i), j = i + Number(el.dataset.d); [st.ids[i], st.ids[j]] = [st.ids[j], st.ids[i]]; st.dirty = true; p.render(); },
      rm: (el) => { st.ids.splice(Number(el.dataset.i), 1); st.dirty = true; p.render(); },
      add: () => pickExercises({ title: 'メニューに追加', multi: true, exclude: st.ids, onDone: (ids) => { st.ids.push(...ids); st.dirty = true; p.render(); } }),
      save: () => {

        else DB.menus.push({ id: uid('menu'), name, exerciseIds: [...st.ids], sets, updatedAt: Date.now() });

      },
      del: () => { p.close(); deleteMenu(m); }
    }
  });
}

function deleteMenu(m) {

  DB.menus.splice(i, 1); touch(); refreshAll();
  undoToast(`「${m.name}」を削除しました（記録は残ります）`, () => { if (DB.menus.some((x) => x.id === m.id)) return; DB.menus.splice(Math.min(i, DB.menus.length), 0, m); touch(); refreshAll(); });
}

function renderCal() {
  if (!UI.calMonth) UI.calMonth = ymd().slice(0, 7);
  if (!UI.calSel) UI.calSel = ymd();
  const [y, mo] = UI.calMonth.split('-').map(Number);
  const first = new Date(y, mo - 1, 1); const lastDay = new Date(y, mo, 0).getDate();
  const byDate = IDX().byDate;
  let h = topbar('記録', `<button type="button" class="icon-btn" data-a="calToday" aria-label="今日へ">${ICON.cal}</button>`);
  h += `<div class="card" id="calCard"><div class="cal-h"><button type="button" class="icon-btn" data-a="calMove" data-d="-1" aria-label="前の月">${ICON.chevL}</button><h2>${y}年${mo}月</h2><button type="button" class="icon-btn" data-a="calMove" data-d="1" aria-label="次の月">${ICON.chevR}</button></div>
    <div class="cal">${WEEK.map((w, k) => `<div class="wd ${k === 0 ? 'sun' : k === 6 ? 'sat' : ''}">${w}</div>`).join('')}`;
  for (let k = 0; k < first.getDay(); k++) h += '<div></div>';
  let mDays = 0, mSets = 0, mVol = 0, mDur = 0;
  for (let d = 1; d <= lastDay; d++) {
    const ds = `${y}-${pad2(mo)}-${pad2(d)}`;
    const ses = byDate.get(ds) || [];
    const parts = [...new Set(ses.flatMap((s) => s.parts))].filter((p) => CATEGORIES.includes(p));
    if (ses.length) { mDays++; for (const s of ses) { mSets += s.sets; mVol += s.vol; if (s.endedAt && s.startedAt) mDur += s.endedAt - s.startedAt; } }
    h += `<button type="button" class="day ${ds === ymd() ? 'today' : ''} ${ds === UI.calSel ? 'sel' : ''} ${ds > ymd() ? 'future' : ''}" data-a="calSel" data-d="${ds}" aria-label="${mo}月${d}日${ses.length ? '（記録あり）' : ''}">${dayRingSvg(parts)}<span>${d}</span></button>`;
  }
  h += `</div><div class="legend">${dataCats().map((c) => `<span><i class="pdot" style="background:${partColor(c)}"></i>${PART_SHORT[c]}</span>`).join('')}</div></div>`;
  h += `<div class="kpis"><div class="kpi"><span>${mo}月のトレーニング</span><b>${mDays}<small>日</small></b></div><div class="kpi"><span>完了セット</span><b>${mSets}</b></div>
    <div class="kpi"><span>総負荷量</span><b>${fmtBig(mVol)}<small>kg</small></b></div><div class="kpi"><span>合計時間</span><b>${mDur ? durHtml(mDur) : '-'}</b></div></div>`;
  const sk = weekStreaks();
  h += `<section class="card tap" data-a="openStreak" style="margin-top:12px"><div class="card-h"><h3>${ICON.layers} 積み重ね</h3><span class="small faint">週ごとの一覧</span>${ICON.chevR}</div>
    <div class="big2" style="grid-template-columns:repeat(3,1fr);margin:0"><div><b>${sk.total}<small>回</small></b><span>合計回数</span></div><div><b>${sk.cur}<small>週</small></b><span>現在の連続</span></div><div><b>${sk.longest}<small>週</small></b><span>最長の連続</span></div></div></section>`;
  const sel = UI.calSel; const ses = byDate.get(sel) || [];
  h += `<section class="sec"><div class="sec-h"><h2>${fmtDateLong(sel)}</h2>${sel <= ymd() ? `<button type="button" class="link" data-a="calAdd">${ICON.plus}記録を追加</button>` : ''}</div>`;
  if (!ses.length) h += `<div class="card empty"><p>${sel > ymd() ? '未来の日付です' : 'この日の記録はありません'}</p></div>`;
  h += ses.map((s) => sessionCard(s)).join('');
  h += `</section>`;
  return h;
}
function sessionCard(s) {

    <button type="button" class="icon-btn" data-a="sesMore" data-id="${esc(s.id)}" aria-label="操作">${ICON.more}</button></div>
    <div class="ses-stats">${dur ? `<span>${ICON.clock}${fmtDur(dur)}</span>` : ''}${s.startedAt ? `<span>${fmtClock(s.startedAt)}〜</span>` : ''}<span>${ICON.layers}${s.sets}セット</span><span>${ICON.weight}${fmtBig(s.vol)}kg</span></div>
    ${s.recs.map((r) => { const ex = getEx(r.exerciseId); const st = setsStats(work(r), ex); return `<button type="button" class="ses-ex" data-a="exDetail" data-id="${esc(r.exerciseId)}"><span class="bar" style="background:${partColor(ex.part)}"></span><div class="m"><b>${esc(ex.name)}</b><span>${st.vol ? `ボリューム ${fmtBig(st.vol)}kg ・ ` : ''}${esc(fmtSets(doneSets(r), ex))}</span>${r.memo ? `<span>📝 ${esc(r.memo)}</span>` : ''}</div></button>`; }).join('')}
    ${s.note ? `<div class="hint" style="margin-top:8px">📝 ${esc(s.note)}</div>` : ''}
    <div class="row" style="margin-top:10px"><button type="button" class="btn btn-sm" data-a="sesEdit" data-id="${esc(s.id)}">${ICON.edit}編集</button><button type="button" class="btn btn-sm" data-a="sesAgain" data-id="${esc(s.id)}">${ICON.play}もう一度</button></div></article>`;
}

/* ---------- ウェイトリフティング分析 ---------- */
function wlBest(id) {
  const recs = exRecords(id); if (!recs.length) return null;
  const ex = getEx(id); let maxW = 0, e1 = 0, date = '';
  for (const r of recs) { const st = setsStats(work(r), ex); if (st.maxW > maxW) { maxW = st.maxW; date = r.date; } e1 = Math.max(e1, st.e1rm); }
  const v = ex.part === '全身・WL' && !['wl_05', 'wl_42'].includes(id) ? maxW : Math.max(maxW, round1(e1));
  return { v, maxW, e1: round1(e1), date };
}
function sinclairCoef(bw, sex) {
  const c = SINCLAIR[sex] || SINCLAIR.m;
  if (!(bw > 0)) return null;
  if (bw >= c.b) return 1;
  return Math.pow(10, c.A * Math.pow(Math.log10(bw / c.b), 2));
}
function wlCard() {
  const sn = wlBest('wl_01'), cj = wlBest('wl_02');
  const any = WL_RATIOS.some((r) => wlBest(r.a) && wlBest(r.b));
  return `<section class="card tap" data-a="openWl"><div class="card-h"><h3>${ICON.bolt} ウェイトリフティング分析</h3>${ICON.chevR}</div>
    ${sn || cj ? `<div class="big2"><div><b>${sn ? fmtNum(sn.v) : '-'}<small>kg</small></b><span>スナッチ最高</span></div><div><b>${cj ? fmtNum(cj.v) : '-'}<small>kg</small></b><span>クリーン＆ジャーク最高</span></div></div>` : ''}
    <p class="small muted" style="margin:0">${any ? 'リフト間の比率・Sinclair・試技重量の目安を確認できます' : 'スナッチ・C&J・スクワットを記録すると、リフト比率から弱点の目安がわかります'}</p></section>`;
}
function openWl() {
  openPage({
    title: 'ウェイトリフティング分析',
    render: () => {
      const ids = ['wl_01', 'wl_02', 'wl_13', 'wl_14', 'wl_09', 'wl_03', 'wl_05', 'leg_01', 'wl_07', 'wl_10', 'wl_08'];
      let h = `<div class="card"><div class="card-h"><h3>主要リフトの最高記録</h3></div><table class="tbl"><tr><th>種目</th><th>最高</th><th>日付</th></tr>${ids.map((id) => { const b = wlBest(id); return `<tr><td><button type="button" data-a="exDetail" data-id="${id}" style="font-weight:750;color:var(--text);text-align:left">${esc(getEx(id).name)}</button></td><td><b>${b ? fmtNum(b.v) + 'kg' : '-'}</b></td><td class="faint">${b ? fmtDate(b.date) : ''}</td></tr>`; }).join('')}</table>
        <p class="hint">WL種目は実際に挙げた最高重量、スクワット系は推定1RMも考慮した値です。</p></div>`;
      h += `<div class="card"><div class="card-h"><h3>リフト比率（弱点の目安）</h3></div>${WL_RATIOS.map((r) => {
        const a = wlBest(r.a), b = wlBest(r.b);
        if (!a || !b || !b.v) return `<div class="ratio"><div class="ratio-h"><b>${r.label}</b><em class="faint">-</em></div><p>両方の記録がそろうと表示します</p></div>`;
        const pct = a.v / b.v * 100; const lo = 40, hi = 110; const pos = (v) => clamp((v - lo) / (hi - lo) * 100, 0, 100);
        const msg = pct < r.lo ? r.low : pct > r.hi ? r.high : 'バランスの良い範囲です';
        return `<div class="ratio"><div class="ratio-h"><b>${r.label}</b><em class="${pct < r.lo || pct > r.hi ? '' : 'up'}">${pct.toFixed(1)}%</em></div>
          <div class="ratio-bar"><div class="zone" style="left:${pos(r.lo)}%;width:${pos(r.hi) - pos(r.lo)}%"></div><div class="pin" style="left:${pos(pct)}%"></div></div>
          <p>目安 ${r.lo}〜${r.hi}%（${fmtNum(a.v)}kg ÷ ${fmtNum(b.v)}kg）：${msg}</p></div>`;
      }).join('')}<p class="hint">一般的なコーチングの目安です。体格・経験・練習内容で変わるため、参考情報としてお使いください。</p></div>`;
      const sn = wlBest('wl_01'), cj = wlBest('wl_02');
      const bw = DB.bodylog.length ? DB.bodylog[DB.bodylog.length - 1].kg : null;
      const total = (sn ? sn.v : 0) + (cj ? cj.v : 0);
      const coef = sinclairCoef(bw, DB.settings.sex);
      h += `<div class="card"><div class="card-h"><h3>トータルと Sinclair</h3></div><div class="big2"><div><b>${total ? fmtNum(total) : '-'}<small>kg</small></b><span>トータル（スナッチ＋C&J）</span></div>
        <div><b>${total && coef ? fmtNum(round1(total * coef)) : '-'}</b><span>Sinclairトータル</span></div></div>

        ${bw ? '' : `<button type="button" class="btn btn-line btn-block" data-a="openBody">${ICON.plus}体重を記録</button>`}</div>`;
      const plan = (b) => [[0.91, '第1試技'], [0.96, '第2試技'], [1.0, '第3試技'], [1.02, '挑戦']].map(([p, l]) => `<tr><td>${l}</td><td>${Math.round(p * 100)}%</td><td><b>${Math.round(b.v * p)}kg</b></td></tr>`).join('');
      if (sn || cj) h += `<div class="card"><div class="card-h"><h3>試技重量の目安（試合・記録会）</h3></div>
        ${sn ? `<div class="small" style="font-weight:800;margin:4px 0">スナッチ（最高 ${fmtNum(sn.v)}kg）</div><table class="tbl">${plan(sn)}</table>` : ''}
        ${cj ? `<div class="small" style="font-weight:800;margin:12px 0 4px">クリーン＆ジャーク（最高 ${fmtNum(cj.v)}kg）</div><table class="tbl">${plan(cj)}</table>` : ''}
        <p class="hint">一般的な組み立て方の例です。当日の調子に合わせて、最終判断はご自身・コーチと相談してください。</p></div>`;
      return h;
    }
  });
}

  return allEx().filter((e) => {

/* ---------- 種目の詳細ページ ---------- */
function dailySeries(exId) {
  const map = new Map(); const ex = getEx(exId);
  for (const r of [...exRecords(exId)].reverse()) {
    if (!map.has(r.date)) map.set(r.date, { date: r.date, sets: [], memos: [], recs: [] });
    const g = map.get(r.date); g.sets.push(...doneSets(r)); g.recs.push(r); if (r.memo) g.memos.push(r.memo);
  }
  return [...map.values()].sort((a, b) => (a.date < b.date ? -1 : 1)).map((g) => ({ ...g, x: dayNum(g.date), stats: setsStats(g.sets.filter((s) => s.t !== 'w'), ex) }));
}
function periodStart(p) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (p === '1m') d.setMonth(d.getMonth() - 1); else if (p === '3m') d.setMonth(d.getMonth() - 3); else if (p === '6m') d.setMonth(d.getMonth() - 6); else return null;
  return ymd(d);
}
function repMaxTable(exId) {
  const reps = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15];
  const best = {};
  for (const r of exRecords(exId)) for (const s of work(r)) for (const n of reps) if (s.r >= n && (!best[n] || s.w > best[n].w)) best[n] = { w: s.w, date: r.date };
  return reps.filter((n) => best[n]).map((n) => ({ n, ...best[n] }));
}
function openExerciseDetail(exId) {

    render: () => exDetailHtml(exId, st),

      ${chartHtml({ type: 'bar', labels: ws.map((_, i) => { const d = parseYmd(addDays(thisW, -7 * (11 - i))); return `${d.getMonth() + 1}/${d.getDate()}`; }), datasets: [{ label: '総負荷量', data: ws.map(Math.round), color: partColor(ex.part) }], kind: 'volume', aria: '週ごとのボリューム' }, 'sm')}</div>`;

    if (rm.length) h += `<div class="card"><div class="card-h"><h3>${ICON.trophy} 回数別の自己ベスト</h3></div><table class="tbl"><tr><th>回数</th><th>重量</th><th>推定1RM</th><th>日付</th></tr>${rm.map((r) => `<tr><td>${r.n}回</td><td><b>${fmtNum(r.w)}kg</b></td><td>${fmtNum(round1(e1rm(r.w, r.n)))}kg</td><td class="faint">${fmtDate(r.date)}</td></tr>`).join('')}</table>
      <p class="hint">「その回数以上」で挙げた最高重量です。</p></div>`;

function parseImport(input) {
  const j = typeof input === 'string' ? JSON.parse(input) : input;

  const d = (j.data && typeof j.data === 'object' && (j.app === 'LiftCanvas' || j.format)) ? j.data : j;
  if (!Array.isArray(d.records) && !Array.isArray(d.menus)) throw new Error('LiftCanvasのバックアップファイルではないようです');
  return { data: normalize(d), exportedAt: j.exportedAt || null };
}
async function askImportMode(parsed, label) {

      { key: 'merge', label: '既存データと統合（マージ）', desc: 'この端末の記録は残したまま、バックアップの内容を追加します。同じ記録は新しい方を残します。' }

function mergeById(cur, inc) { const map = new Map(cur.map((x) => [x.id, x])); for (const x of inc) { const e = map.get(x.id); if (!e || (x.updatedAt || 0) > (e.updatedAt || 0)) map.set(x.id, x); } return [...map.values()]; }
function applyImport(inc, mode) {
  Timer.stop(); closeKeypad();

    const keep = { id: DB.settings.googleClientId, theme: DB.settings.theme };

    DB.active = null;

    DB.records = mergeById(DB.records, inc.records);
    DB.customExercises = mergeById(DB.customExercises, inc.customExercises);
    DB.menus = mergeById(DB.menus, inc.menus);
    DB.sessions = mergeById(DB.sessions, inc.sessions);
    const bl = new Map(DB.bodylog.map((b) => [b.date, b])); for (const b of inc.bodylog) { const e = bl.get(b.date); if (!e || (b.updatedAt || 0) > (e.updatedAt || 0)) bl.set(b.date, b); }
    DB.bodylog = [...bl.values()].sort((a, b) => (a.date < b.date ? -1 : 1));

async function handleImportFile(file) {

/* ---------- Googleドライブ連携（Google Identity Services + Drive API v3） ---------- */
const Drive = {
  token: null, exp: 0, gisP: null,
  clientId() { return (DB.settings.googleClientId || '').trim() || GOOGLE_CLIENT_ID; },
  loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    if (this.gisP) return this.gisP;
    this.gisP = new Promise((resolve, reject) => {
      const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { this.gisP = null; s.remove(); reject(new Error('Googleのログイン機能を読み込めませんでした。通信状態をご確認ください')); };
      document.head.appendChild(s);
    });
    return this.gisP;
  },
  async getToken() {
    if (this.token && Date.now() < this.exp - 60000) return this.token;
    const cid = this.clientId(); if (!cid) throw new Error('Googleドライブ連携が設定されていません');
    await this.loadGis();
    return new Promise((resolve, reject) => {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: cid, scope: DRIVE_SCOPE,
        callback: (r) => { if (!r || r.error) { reject(new Error('Googleへのログインが許可されませんでした')); return; } this.token = r.access_token; this.exp = Date.now() + (Number(r.expires_in) || 3600) * 1000; resolve(this.token); },
        error_callback: (err) => { const t = err && err.type; reject(new Error(t === 'popup_closed' ? 'ログインがキャンセルされました' : t === 'popup_failed_to_open' ? 'ログイン画面を開けませんでした（ポップアップを許可してください）' : 'Googleへのログインに失敗しました')); }
      });
      client.requestAccessToken({ prompt: '' });
    });
  },
  async api(url, opts = {}, retry = true) {
    const token = await this.getToken();
    const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
    if (res.status === 401 && retry) { this.token = null; return this.api(url, opts, false); }
    if (!res.ok) { let d = ''; try { const j = await res.json(); d = j.error && j.error.message ? j.error.message : ''; } catch (e) { /* noop */ } throw new Error(`Googleドライブでエラーが発生しました（${res.status}）${d ? '：' + d : ''}`); }
    return res;
  },
  async findFile() {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&pageSize=10&fields=files(id%2Cname%2CmodifiedTime%2Csize)`);
    const j = await res.json(); return (j.files && j.files[0]) || null;
  },
  async upload() {
    const body = JSON.stringify(buildExport()); const f = await this.findFile();
    if (f) { await this.api(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(f.id)}?uploadType=media&fields=id%2CmodifiedTime`, { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body }); return 'updated'; }
    const b = 'liftcanvas' + Date.now().toString(36);
    const meta = { name: DRIVE_FILE_NAME, mimeType: 'application/json', description: 'LiftCanvas（トレーニング記録）のバックアップ' };
    await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id%2CmodifiedTime', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body: `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${b}--` });
    return 'created';
  },
  async download() {
    const f = await this.findFile();
    if (!f) throw new Error('Googleドライブにバックアップが見つかりませんでした（このアプリで保存したファイルのみ探せます）');
    const res = await this.api(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(f.id)}?alt=media`);
    return { text: await res.text(), file: f };
  }
};
function driveReady() {
  if (!Drive.clientId()) { toast('Googleドライブ連携はまだ設定されていません。ファイル保存をご利用ください'); return false; }
  if (location.protocol === 'file:') { toast('ファイルを直接開いた状態ではGoogleログインを使えません', 'error'); return false; }
  if (!navigator.onLine) { toast('インターネットに接続してから実行してください', 'error'); return false; }
  return true;
}
async function driveBackup() {
  if (!driveReady()) return;
  setBusy(true, 'Googleドライブに保存しています…');
  try { const r = await Drive.upload(); markBackup('Googleドライブ'); toast(r === 'created' ? 'Googleドライブに保存しました' : 'Googleドライブのバックアップを更新しました', 'ok'); }
  catch (e) { console.error(e); DB.settings.drivePending = true; save(); toast(e.message || '保存に失敗しました', 'error'); }
  finally { setBusy(false); }
}
/* トレーニング終了時の自動保存（失敗しても記録は端末に残り、あとで再保存できる） */
async function autoDriveBackup() {
  if (!DB.settings.autoDrive || !Drive.clientId() || location.protocol === 'file:') return;
  if (!navigator.onLine) { DB.settings.drivePending = true; save(); return; }
  try { await Drive.upload(); markBackup('Googleドライブ（自動）'); toast('Googleドライブに自動保存しました', 'ok'); }
  catch (e) { console.warn(e); DB.settings.drivePending = true; save(); updateTabbar(); toast('ドライブへの自動保存ができませんでした。あとで「設定」から保存できます'); }
}
async function driveRestore() {
  if (!driveReady()) return;
  setBusy(true, 'Googleドライブから読み込んでいます…');
  let got = null;
  try { got = await Drive.download(); } catch (e) { console.error(e); toast(e.message || '読み込みに失敗しました', 'error'); } finally { setBusy(false); }
  if (!got) return;
  try { await askImportMode(parseImport(got.text), `Googleドライブ（${fmtDateTime(Date.parse(got.file.modifiedTime))} 更新）`); }
  catch (e) { toast(e.message || 'バックアップの内容を読み取れませんでした', 'error'); }
}

/* ---------- サンプル記録・初期化 ---------- */
function addDemoData() {
  let seed = 20261119;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const plans = [
    { day: 1, name: 'WL・スクワットの日', menu: 'menu_01', ex: [['wl_01', 45, 1, 3, 5, 0.45], ['wl_02', 60, 1, 2, 5, 0.45], ['wl_08', 80, 2.5, 3, 4, 0.4], ['wl_05', 70, 2.5, 3, 4, 0.4]] },
    { day: 3, name: '胸・肩の日', menu: 'menu_02', ex: [['chest_01', 55, 2.5, 10, 3, 0.3], ['chest_04', 16, 2, 10, 3, 0.25], ['shoulder_01', 35, 2.5, 8, 3, 0.25], ['shoulder_03', 6, 1, 15, 3, 0.15]] },
    { day: 5, name: '背中・腕の日', menu: 'menu_03', ex: [['back_01', 100, 2.5, 5, 3, 0.35], ['back_02', 0, 2.5, 8, 3, 0.25], ['back_04', 50, 2.5, 10, 3, 0.3], ['arm_01', 25, 2.5, 10, 3, 0.2]] },
    { day: 6, name: '全身ベーシック', menu: 'menu_04', ex: [['leg_01', 80, 2.5, 8, 3, 0.35], ['abs_09', 0, 2.5, 45, 2, 0.3]] }
  ];
  const state = {}; const today = ymd(); const recs = []; const sessions = [];
  const start = addDays(weekStart(today), -7 * 47);
  for (let w = 0; w < 48; w++) {
    for (const p of plans) {
      const date = addDays(start, w * 7 + p.day); if (date > today || rnd() < 0.12) continue;
      const sid = 'demo_' + date + '_' + p.day; const st0 = parseYmd(date).getTime() + (17 + Math.floor(rnd() * 3)) * 3600e3;
      const ids = [];
      p.ex.forEach(([id, w0, step, reps, n, prob], k) => {
        if (state[id] == null) state[id] = w0;
        if (rnd() < prob) state[id] += step; if (rnd() < 0.04) state[id] = Math.max(w0, state[id] - step * 2);
        const timed = id === 'abs_09';
        const sets = [];
        if (getEx(id).part === '全身・WL') sets.push({ w: 20, r: 3, done: true, t: 'w' });
        for (let i = 0; i < n; i++) sets.push({ w: id === 'back_02' ? (state[id] > 5 ? round2(state[id] - 5) : 0) : round2(state[id]), r: timed ? reps + Math.round(state[id] / 2.5) * 5 + (i ? -5 : 0) : Math.max(1, reps - (i === n - 1 && rnd() < 0.3 ? 1 : 0)), done: true, t: 'n' });
        recs.push({ id: uid('rec'), sessionId: sid, date, exerciseId: id, sets, memo: rnd() < 0.08 ? ['調子よし', 'フォーム意識', '少し疲れ気味', 'スピード良好'][Math.floor(rnd() * 4)] : '', order: k, updatedAt: st0, demo: true });
        ids.push(id);
      });
      sessions.push({ id: sid, name: p.name, menuId: p.menu, date, startedAt: st0, endedAt: st0 + (45 + Math.floor(rnd() * 40)) * 60000, note: '', rating: 0, exerciseIds: ids, updatedAt: st0 });
    }
  }
  DB.records.push(...recs); DB.sessions.push(...sessions);
  if (!DB.bodylog.length) { let bw = 72; for (let w = 0; w < 48; w += 2) { bw += (rnd() - 0.45) * 0.6; const d = addDays(start, w * 7); if (d <= today) DB.bodylog.push({ date: d, kg: round1(bw), fat: null, updatedAt: 1, demo: true }); } }
  DB.ui.welcomeDone = true;
  touch(); refreshAll();
  toast(`サンプル記録（約1年分・${sessions.length}回）を追加しました`, 'ok');
}

      (/Android/.test(navigator.userAgent) ? '<p class="hint">Androidでは、記録はそのままアプリ版に引き継がれます。</p>' : '') + (kind !== 'firefox' ? oldShortcut : ''),
    foot: () => `<button type="button" class="btn" data-a="pwaDiag">診断する</button><button type="button" class="btn btn-primary" data-a="__close">OK</button>`
  });
}

/* ---------- インストール診断（うまくいかない時の原因確認） ---------- */
async function openPwaDiag() {
  const rows = [];
  const add = (label, ok, detail) => rows.push({ label, ok, detail });
  add('ブラウザ', null, BROWSER_LABEL[browserKind()] || browserKind());
  add('https で開いている', location.protocol === 'https:' || location.hostname === 'localhost', location.protocol);
  let man = null;
  try { const r = await fetch('lift-canvas.webmanifest', { cache: 'no-store' }); man = r.ok ? await r.json() : null; } catch (e) { man = null; }
  add('アプリ情報（manifest）を読み込める', !!man, man ? man.short_name : '取得できません');
  let iconOk = false; try { iconOk = (await fetch('lift-canvas-icon-512.png', { cache: 'no-store' })).ok; } catch (e) { /* noop */ }
  add('アイコンを読み込める', iconOk, '');
  let reg = null; try { reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(SW_SCOPE); } catch (e) { /* noop */ }
  add('オフライン機能（サービスワーカー）', !!(reg && reg.active), reg ? (reg.active ? '有効' : '準備中') : ('serviceWorker' in navigator ? '未登録' : '非対応のブラウザ'));
  add('このページを制御中', !!(navigator.serviceWorker && navigator.serviceWorker.controller), navigator.serviceWorker && navigator.serviceWorker.controller ? '' : '一度ページを再読み込みしてください');
  add('インストールボタンの準備', PWA.prompt || isStandalone() ? true : null, PWA.prompt ? 'あり（ボタンから追加できます）' : isStandalone() ? '追加済み' : 'まだ（メニューから追加してください）');
  add('アプリとして起動中', null, isStandalone() ? 'はい' : 'いいえ（ブラウザで表示中）');
  let persisted = null; try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (e) { /* noop */ }
  add('保存データの保護', null, persisted === true ? '保護されています' : '通常（ブラウザの判断で消える可能性あり）');
  add('バージョン', null, APP_VERSION);
  const text = rows.map((r) => `${r.ok == null ? '・' : r.ok ? '○' : '×'} ${r.label}：${r.detail}`).join('\n') + `\n${navigator.userAgent}`;
  openSheet({
    title: 'インストール診断',
    render: () => `<div class="list">${rows.map((r) => `<div class="li" style="min-height:52px"><span style="font-size:18px;width:22px;text-align:center;color:${r.ok == null ? 'var(--text-3)' : r.ok ? 'var(--ok)' : 'var(--danger)'}">${r.ok == null ? '・' : r.ok ? '○' : '×'}</span><div class="m"><div class="t" style="font-size:14.5px">${esc(r.label)}</div>${r.detail ? `<div class="s">${esc(r.detail)}</div>` : ''}</div></div>`).join('')}</div>
      <p class="hint">×がある場合は、ページを再読み込みしてからもう一度お試しください。それでも解決しない場合は、下のボタンで結果をコピーして提供者に送ってください。</p>`,
    foot: () => `<button type="button" class="btn" data-a="reload">再読み込み</button><button type="button" class="btn btn-primary" data-a="copy">${ICON.copy}結果をコピー</button>`,
    actions: {
      copy: async () => { try { await navigator.clipboard.writeText(text); toast('診断結果をコピーしました', 'ok'); } catch (e) { toast('コピーできませんでした'); } },
      reload: () => { saveNow(); location.reload(); }
    }
  });
}

/* ---------- iPhoneの引き継ぎコード ---------- */
function makeTransferCode() {
  const bytes = new TextEncoder().encode(JSON.stringify(buildExport()));
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return TRANSFER_PREFIX + btoa(bin);
}
function readTransferCode(text) {
  const t = String(text || '').replace(/\s+/g, '');
  const i = t.indexOf(TRANSFER_PREFIX);
  if (i < 0) throw new Error('引き継ぎコードが見つかりません（「LC1:」から始まる文字列を貼り付けてください）');
  const bin = atob(t.slice(i + TRANSFER_PREFIX.length));
  const bytes = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  return parseImport(new TextDecoder().decode(bytes));
}
async function copyTransferCode() {
  const code = makeTransferCode();
  let ok = false;
  try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { ok = false; }
  if (!ok) {
    openSheet({ title: '引き継ぎコード', render: () => `<p class="small">下のコードを長押しして「すべてを選択」→「コピー」してください。</p><textarea class="input" rows="6" readonly style="font-size:12px">${esc(code)}</textarea>`, foot: () => `<button type="button" class="btn btn-primary" data-a="__close">閉じる</button>` });
  } else toast('引き継ぎコードをコピーしました。ホーム画面のアプリで貼り付けてください', 'ok');
  DB.ui.pwaMoved = true; save();
  if (UI.tab === 'train') renderTab();
}
function openTransferPaste(first) {
  const st = { code: '' };
  openSheet({
    title: first ? 'Safariの記録を引き継ぎますか？' : '記録を引き継ぐ', state: st, dismissible: !first,
    render: () => `<p class="small" style="margin:0 0 10px">${first ? 'ホーム画面のアプリは、Safariとは別の場所に記録を保存します。' : ''}Safari版の「設定 → 引き継ぎコードをコピー」でコピーしたコードを貼り付けてください。</p>
      <textarea class="input" data-in="code" rows="5" placeholder="LC1:… から始まるコード" style="font-size:12px">${esc(st.code)}</textarea>
      <div style="height:10px"></div><button type="button" class="btn btn-line btn-block" data-a="paste">${ICON.copy}クリップボードから貼り付け</button>
      <div style="height:8px"></div><button type="button" class="btn btn-block" data-a="file">${ICON.upload}バックアップファイルから復元</button>`,
    foot: () => `<button type="button" class="btn" data-a="skip">${first ? '新しく始める' : 'キャンセル'}</button><button type="button" class="btn btn-primary" data-a="ok">引き継ぐ</button>`,
    inputs: { code: (el) => { st.code = el.value; } },
    actions: {
      paste: async (el, e, s) => { try { st.code = await navigator.clipboard.readText(); s.render(); } catch (err) { toast('貼り付けできませんでした。入力欄を長押しして「ペースト」してください'); } },
      file: (el, e, s) => { DB.ui.transferAsked = true; save(); s.close(); ACT.importOpen(); },
      skip: (el, e, s) => { DB.ui.transferAsked = true; save(); s.close(); if (!DB.ui.onboarded && !DB.active) setTimeout(() => { if (!sheets.length) openOnboarding(); }, 250); },
      ok: (el, e, s) => {
        let parsed; try { parsed = readTransferCode(st.code); } catch (err) { toast(err.message || 'コードを読み取れませんでした', 'error'); return; }
        DB.ui.transferAsked = true;
        s.close();
        if (hasRealData()) askImportMode(parsed, '引き継ぎコード'); else { applyImport(parsed.data, 'overwrite'); DB.ui.transferAsked = true; save(); }
      }
    }
  });
}

/* ---------- サービスワーカー・自動更新 ---------- */
function registerSW() {
  if (!('serviceWorker' in navigator) || !isHttp()) return;
  navigator.serviceWorker.register(SW_FILE, { scope: SW_SCOPE }).catch(() => { /* 非対応・プライベート等 */ });
}
function isBusy() {
  const a = document.activeElement;
  return sheets.length > 0 || !!UI.kp || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || (UI.wo && !$('#workout').hidden);
}
async function checkUpdate(force) {
  if (!isHttp() || !navigator.onLine) return;
  if (!force && Date.now() - PWA.lastCheck < 10 * 60e3) return;
  PWA.lastCheck = Date.now();
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/^const APP_VERSION = '(\d{4}\.\d{2}\.\d{2}\.\d+)'/m);
    if (!m || m[1] === APP_VERSION) return;
    PWA.updateReady = true;
    if (isBusy()) showUpdateBar(); else applyUpdate();
  } catch (e) { /* オフライン等 */ }
}
function showUpdateBar() {
  if ($('#updBar')) return;
  document.body.insertAdjacentHTML('beforeend', `<div id="updBar" class="upd-bar" role="status"><span>✨ 新しい版があります</span><button type="button" class="btn btn-sm btn-primary" data-a="pwaUpdate">更新する</button></div>`);
}
async function applyUpdate() {
  saveNow();
  try { sessionStorage.setItem('lc_updated', APP_VERSION); } catch (e) { /* noop */ }
  try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(SW_SCOPE); if (r) await r.update(); } catch (e) { /* noop */ }
  location.reload();
}
function pwaInit() {
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); PWA.prompt = e; if (UI.tab === 'train' || UI.tab === 'settings') renderTab(); });
  window.addEventListener('appinstalled', () => { PWA.prompt = null; DB.ui.pwaHide = true; save(); toast('ホーム画面に追加しました', 'ok'); renderTab(); });
  registerSW();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* noop */ }
  try { if (sessionStorage.getItem('lc_updated')) { sessionStorage.removeItem('lc_updated'); setTimeout(() => toast('✨ 最新版に更新しました', 'ok'), 400); } } catch (e) { /* noop */ }
  setTimeout(() => checkUpdate(true), 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); else if (PWA.updateReady && !isBusy()) { /* 次回表示時に更新 */ } });
  // iPhoneのホーム画面版を初めて開いたとき：引き継ぎを先に案内
  if (isIOS() && isStandalone() && !DB.ui.transferAsked && !hasRealData()) setTimeout(() => openTransferPaste(true), 300);
}
Object.assign(ACT, {
  pwaInstall: async () => {
    const p = PWA.prompt; if (!p) { openInstallGuide(); return; }
    try { p.prompt(); const r = await p.userChoice; PWA.prompt = null; if (r && r.outcome === 'accepted') { DB.ui.pwaHide = true; save(); } renderTab(); } catch (e) { openInstallGuide(); }
  },
  pwaGuide: () => openInstallGuide(),
  pwaDiag: () => openPwaDiag(),
  pwaLater: () => { PWA.sessionHide = true; renderTab(); toast('設定画面からいつでも追加できます'); },
  pwaNever: () => { DB.ui.pwaHide = true; save(); renderTab(); toast('案内を非表示にしました（設定画面からいつでも追加できます）'); },
  pwaSafariOnce: () => { PWA.safariOnce = true; renderTab(); },
  pwaCopyCode: () => copyTransferCode(),
  pwaCodeFile: () => { downloadBlob(new Blob([makeTransferCode()], { type: 'text/plain' }), 'liftcanvas_引き継ぎコード.txt'); DB.ui.pwaMoved = true; save(); toast('引き継ぎコードを保存しました'); },
  pwaPaste: () => openTransferPaste(false),
  pwaUpdate: () => applyUpdate()
});

/* =====================================================================
   イベント処理・起動
   ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const sc = scopeOf(el);
  const name = el.dataset.a;
  const fn = (sc && sc.actions && sc.actions[name]) || ACT[name];
  if (fn) fn(el, e, sc);
});
document.addEventListener('input', (e) => {
  const el = e.target; const name = el.dataset && el.dataset.in; if (!name) return;
  const sc = scopeOf(el);
  const fn = (sc && sc.inputs && sc.inputs[name]) || INP[name];
  if (fn) fn(el, e, sc);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'fileInput') { CHG.file(el, e); return; }
  const name = el.dataset && el.dataset.ch; if (!name) return;
  const sc = scopeOf(el);
  const fn = (sc && sc.changes && sc.changes[name]) || CHG[name];
  if (fn) fn(el, e, sc);
});
document.addEventListener('keydown', (e) => {
  if (UI.kp && !sheets.length && !(e.target.matches && e.target.matches('input,textarea'))) {
    const k = e.key;
    if (/^[0-9]$/.test(k)) { KP_ACT.k({ dataset: { v: k } }); e.preventDefault(); return; }
    if (k === '.' || k === ',') { KP_ACT.k({ dataset: { v: '.' } }); e.preventDefault(); return; }
    if (k === 'Backspace') { KP_ACT.kBs(); e.preventDefault(); return; }
    if (k === 'Enter' || k === 'Tab') { KP_ACT.kNext(); e.preventDefault(); return; }
    if (k === 'Escape') { closeKeypad(); return; }
    if (k === 'ArrowUp') { KP_ACT.kStep({ dataset: { d: '1' } }); e.preventDefault(); return; }
    if (k === 'ArrowDown') { KP_ACT.kStep({ dataset: { d: '-1' } }); e.preventDefault(); return; }
  }
  if (e.key === 'Escape') {
    if (sheets.length) sheets[sheets.length - 1].tryClose();
    else if (pages.length) { const p = pages[pages.length - 1]; p.actions.__back(); }
  }
});
/* テンキー以外をタップしたら閉じる */
document.addEventListener('pointerdown', (e) => {
  if (!UI.kp) return;
  if (e.target.closest('#keypad') || e.target.closest('.cell') || e.target.closest('.done-btn') || e.target.closest('.sheet-bg')) return;
  closeKeypad();
}, true);
window.addEventListener('pagehide', () => flushSave());
window.addEventListener('beforeunload', () => flushSave());
window.addEventListener('freeze', () => flushSave());
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); if (!document.hidden && DB) { if (DB.timer) Timer.tick(); tickClock(); } });
window.addEventListener('online', () => { if (chartStatus === 'failed') { chartStatus = 'idle'; loadChartJs(); } });
window.addEventListener('storage', (e) => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try { clearTimeout(saveT); saveT = null; DB = normalize(JSON.parse(e.newValue)); invalidateEx(); refreshAll(); } catch (err) { /* noop */ }
});
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (DB.settings.theme === 'auto') { applyTheme(); refreshAll(); } }); } catch (e) { /* 古いブラウザ */ } }
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { $$('.svgc').forEach((s) => { const cv = s.parentElement.querySelector('canvas'); if (cv && cv._spec) svgChartInto(cv, cv._spec); }); }, 250); });

function init() {
  DB = load();
  document.body.insertAdjacentHTML('afterbegin', bodyDefs());
  applyTheme();
  invalidateEx();
  sanitizeRefs();
  cleanupDrafts();
  buildTabbar();
  const qTab = new URLSearchParams(location.search).get('tab');
  setTab(TABS.some((t) => t.key === qTab) ? qTab : 'train');
  Timer.resume();
  if (DB.active && !DB.active.minimized) openWorkout();
  renderMinibar();
  loadChartJs();
  pwaInit();
  setTimeout(() => { if (!DB.ui.onboarded && !DB.active && !sheets.length) openOnboarding(); }, 450);
  if (Drive.clientId() && navigator.onLine && location.protocol !== 'file:') setTimeout(() => Drive.loadGis().catch(() => { /* 使う時に再試行 */ }), 1500);
  saveNow();
  if (!storageOK) toast('この環境ではデータを保存できません（プライベートモード等）', 'error');
}
init();
</script>
