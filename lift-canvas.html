@media (max-width:360px){.pwa-card.slim .pwa-top b{font-size:14px;white-space:nowrap}}
/* ===== 記録の取り込み ===== */
.imp-fmts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.imp-fmts span{font-size:12px;font-weight:700;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.imp-ta{min-height:150px;font-size:15px;line-height:1.55;resize:vertical}
.imp-ex{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin:0;font-size:13px;line-height:1.6}
.imp code{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;white-space:nowrap}
.imp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 4px}
.imp-sum>div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center}
.imp-sum b{display:block;font-size:24px;line-height:1.1;color:var(--head)}
.imp-sum span{font-size:12px;color:var(--text-2);font-weight:700}
.imp-names{display:flex;flex-direction:column;gap:6px}
.imp-n{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.15fr);align-items:center;gap:8px;width:100%;text-align:left;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.imp-n .src{display:flex;flex-direction:column;min-width:0}
.imp-n .src b{font-size:14px;overflow-wrap:anywhere}
.imp-n .src small{font-size:11.5px;color:var(--text-3)}
.imp-n .arr{color:var(--text-3)}
.imp-n .dst{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:14px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.imp-tag{font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;white-space:nowrap}
.imp-tag.ok{background:var(--ok-soft);color:var(--ok)}
.imp-tag.warn{background:var(--warn-soft);color:var(--warn)}
.imp-tag.new{background:var(--accent-soft);color:var(--accent)}
.imp-tag.skip{background:var(--surface-3);color:var(--text-3)}
.imp-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:2px 0 4px}
.imp-cols label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--text-2);min-width:0}
.imp-cols select{min-height:42px;padding:0 8px;font-size:14px}
.imp-skip>div,.imp-prev>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.imp-skip span,.imp-prev .d{color:var(--text-3);white-space:nowrap}
.imp-skip code{white-space:normal;overflow-wrap:anywhere}
.imp-skip em{grid-column:2;font-style:normal;color:var(--warn);font-weight:700}
.imp-prev b{font-size:13px}
.imp-prev .v{grid-column:2;color:var(--text-2);overflow-wrap:anywhere}
.imp-done{width:56px;height:56px;margin:8px auto 0;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.imp-done svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.4}
.imp-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.imp-li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.imp-li .m{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12.5px;color:var(--text-2)}
.imp-li .m b{font-size:14px;color:var(--text);overflow-wrap:anywhere}
.imp-cta{margin-top:8px;color:var(--accent)}
/* ===== 経験レベル ===== */
.card.beg>summary{list-style:none;cursor:pointer}
.card.beg>summary::-webkit-details-marker{display:none}
.card.beg>summary>svg{margin-left:auto;width:20px;height:20px;transition:transform .2s}
.card.beg[open]>summary>svg{transform:rotate(180deg)}
.beg-list{margin:4px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.55}
.beg-list b{display:block;color:var(--head)}
.beg-list span{color:var(--text-2)}
.beg-act{margin-top:8px}.beg-act .btn{flex:1;white-space:nowrap}
.card.beg .btn-block{flex-wrap:wrap;row-gap:0}
.beg-hint{line-height:1.6}
.gloss{margin:0}
.gloss dt{font-weight:800;color:var(--head);margin-top:12px}
.gloss dt:first-child{margin-top:0}
.gloss dd{margin:3px 0 0;font-size:14px;line-height:1.65;color:var(--text-2)}
.rpe-q{display:flex;align-items:center;gap:4px;padding:2px 10px 8px;overflow-x:auto;scrollbar-width:none}
.rpe-q span{font-size:11.5px;font-weight:800;color:var(--text-3);margin-right:2px}
.rpe-q button{flex:1 1 0;min-width:0;min-height:34px;padding:0 6px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);font:inherit;font-size:13px;font-weight:750;cursor:pointer}
@media (max-width:360px){.imp-n{grid-template-columns:1fr;gap:4px}.imp-n .arr{display:none}.imp-cols{grid-template-columns:1fr}}
.imp-lines{display:flex;flex-direction:column}
.imp-l{display:grid;grid-template-columns:22px 52px minmax(0,1fr);gap:6px;align-items:start;text-align:left;width:100%;padding:7px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer}
.imp-l .no{font-size:11px;color:var(--text-3);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.imp-l .lk{font-size:11px;font-weight:700;border-radius:6px;padding:2px 0;text-align:center;background:var(--bg-2,rgba(127,127,127,.12));color:var(--text-2)}
.imp-l .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.imp-l code{font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.imp-l .iv{font-size:12px;color:var(--text-2);overflow-wrap:anywhere}
.imp-l .iv i{font-style:normal;color:var(--text-3)}
.imp-l.k-d .lk{background:rgba(59,130,246,.16);color:#2563eb}
.imp-l.k-e .lk,.imp-l.k-s .lk{background:rgba(16,185,129,.16);color:#059669}
.imp-l.k-b .lk{background:rgba(168,85,247,.16);color:#9333ea}
.imp-l.k-t .lk{background:rgba(127,127,127,.14)}
.imp-l.k-m code{color:var(--text-3)}
.imp-l.k-x .lk{background:rgba(217,119,6,.18);color:#b45309}
.imp-l.k-x .iv{color:var(--warn,#d97706);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .imp-l.k-d .lk{color:#93c5fd}:root:not([data-theme="light"]) .imp-l.k-e .lk,:root:not([data-theme="light"]) .imp-l.k-s .lk{color:#6ee7b7}:root:not([data-theme="light"]) .imp-l.k-b .lk{color:#d8b4fe}:root:not([data-theme="light"]) .imp-l.k-x .lk{color:#fcd34d}}
:root[data-theme="dark"] .imp-l.k-d .lk{color:#93c5fd}:root[data-theme="dark"] .imp-l.k-e .lk,:root[data-theme="dark"] .imp-l.k-s .lk{color:#6ee7b7}:root[data-theme="dark"] .imp-l.k-b .lk{color:#d8b4fe}:root[data-theme="dark"] .imp-l.k-x .lk{color:#fcd34d}

/* 画面キーボードが出ている間：シートは見えている範囲（キーボードの上）に収める */
.sheet-bg{bottom:auto;top:var(--vvt,0px);height:var(--vvh,100%)}
html.kb .sheet{max-height:100%;border-radius:14px 14px 0 0}
html.kb .sheet-grip{display:none}
html.kb .sheet-h{min-height:44px;padding-top:2px;padding-bottom:2px}
html.kb .sheet-h h2{font-size:15.5px}
html.kb .sheet-f{padding:8px 12px}
html.kb .sheet-f .btn{min-height:42px}
html.kb .sheet-pick{height:100%}
html.kb .sheet-pick .chips{display:none}
html.kb .sheet-pick .picker-top{padding-top:8px;padding-bottom:8px}
html.kb .page{top:var(--vvt,0px);bottom:auto;height:var(--vvh,100%)}

/* 分析 */
.ins-list{display:flex;flex-direction:column;gap:6px}
.ins{border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface-2,transparent)}
.ins>summary{list-style:none;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;cursor:pointer}
.ins>summary::-webkit-details-marker{display:none}
.ins .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:#94a3b8}
.ins-good .dot{background:#10b981}.ins-warn .dot{background:#f59e0b}.ins-info .dot{background:#3b82f6}
.ins .m{display:flex;flex-direction:column;gap:2px;min-width:0}
.ins .m b{font-size:14px;color:var(--head);line-height:1.4}
.ins .m span{font-size:12.5px;color:var(--text-2);line-height:1.55}
.ev{font-style:normal;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap;margin-left:4px}
.ev-h{background:rgba(16,185,129,.16);color:#047857}.ev-m{background:rgba(59,130,246,.15);color:#1d4ed8}.ev-r{background:rgba(127,127,127,.16);color:var(--text-2)}
.ins-refs{list-style:none;padding:0;margin:6px 0 10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.6}
.ins-refs li{border-left:3px solid var(--line-2);padding-left:8px}
.ins-refs.big li{padding:2px 0 2px 10px}
.vbars{display:flex;flex-direction:column;gap:7px}
.vb{display:grid;grid-template-columns:62px minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:12.5px}
.vb .n{color:var(--text-2);white-space:nowrap}
.vb .tr{position:relative;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.vb .band{position:absolute;top:0;bottom:0;background:rgba(16,185,129,.22)}
.vb .bar{position:absolute;left:0;top:2px;bottom:2px;border-radius:5px;background:#10b981;min-width:2px}
.vb .bar.lo{background:#f59e0b}.vb .bar.mid{background:#fbbf24}.vb .bar.hi{background:#3b82f6}
.vb .v{text-align:right;font-weight:800;color:var(--head);white-space:nowrap}
.vb .v small{font-weight:600;color:var(--text-3);font-size:10.5px}
.rbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:4px 0 8px}
.rbar i{display:block;min-width:2px}
/* 設定：共有 */
.share-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px}
.share-card .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(59,130,246,.14);color:var(--accent);flex:none}
.share-card .ic svg{width:20px;height:20px}
.share-card .m{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.share-card .m b{font-size:14.5px;color:var(--head)}
.share-card .m span{font-size:12px;color:var(--text-3)}
.qr-wrap{text-align:center;margin-top:12px}
.qr-wrap .qr{width:min(240px,70vw);height:min(240px,70vw);border-radius:10px;border:1px solid var(--line)}
.set-sec>summary .ss-sub.warn{color:var(--warn,#d97706);font-weight:800}
svg.qr{stroke:none;fill:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev-h{color:#6ee7b7}:root:not([data-theme="light"]) .ev-m{color:#93c5fd}}
:root[data-theme="dark"] .ev-h{color:#6ee7b7}:root[data-theme="dark"] .ev-m{color:#93c5fd}

/* =====================================================================
   見出し・案内・レベル比較などの部品（配色はこれまでの青系のまま）
   ・見出しには英字の小見出しを添える
   ・使い方ガイドの強調色は操作の色（青）に合わせる
   ===================================================================== */
:root{--volt:#2563eb}
html[data-theme="dark"]{--volt:#5b8cff}


/* ---- 見出し：英字の小見出し＋太い和文 ---- */
.topbar{padding-top:calc(var(--safe-top) + 18px)}
.topbar h1{font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1.08}
.topbar .kick{display:flex;align-items:center;gap:7px;font-family:var(--f-num);font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--text-3);margin-bottom:3px;text-transform:uppercase}
.topbar .kick::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--volt)}
.sec-h h2{font-weight:900;letter-spacing:.01em}
.sec-h h2::before{background:var(--volt);box-shadow:none;width:4px;height:15px}


/* ---- その他の開始方法（メニューの上） ---- */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quick .btn{min-height:46px;font-size:14px}
.quick .card.repeat{grid-column:1/-1;margin:0}
.quick .imp-cta{grid-column:1/-1}

/* ---- レベル比較 ---- */
.lv-cmp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.lv-cmp th,.lv-cmp td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:center}
.lv-cmp th:first-child,.lv-cmp td:first-child{text-align:left;font-weight:700;color:var(--text-2)}
.lv-cmp thead th{font-size:11.5px;color:var(--text-3);font-weight:800;position:sticky;top:0;background:var(--surface-solid)}
.lv-cmp thead th.on{color:var(--head)}
.lv-cmp td.on{background:var(--accent-soft)}
.lv-cmp .y{color:var(--accent);font-weight:900}
.lv-cmp .n{color:var(--text-3);opacity:.6}
.lv-cmp tr.all td{color:var(--text-3)}
.lv-note{font-size:12px;color:var(--text-3);margin:8px 0 0;line-height:1.6}
details.lv-more>summary{list-style:none;cursor:pointer;font-size:13px;font-weight:800;color:var(--accent);padding:8px 0;display:flex;align-items:center;gap:4px}
details.lv-more>summary::-webkit-details-marker{display:none}
details.lv-more>summary svg{width:16px;height:16px;transition:transform .2s}
details.lv-more[open]>summary svg{transform:rotate(180deg)}

/* =====================================================================
   使い方ガイド（スポットライト式のオーバーレイ）
   ===================================================================== */
.tour-bk{position:fixed;inset:0;z-index:700}
.tour-hole{position:fixed;z-index:701;border-radius:16px;box-shadow:0 0 0 9999px rgba(8,14,28,.68);pointer-events:none;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
.tour-hole::after{content:"";position:absolute;inset:-4px;border-radius:19px;border:2.5px solid var(--volt);animation:tour-pulse 1.4s ease-in-out infinite}
@keyframes tour-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.015)}}
.tour-dim{position:fixed;inset:0;z-index:701;background:rgba(8,14,28,.68);pointer-events:none}
.tour-bub{position:fixed;z-index:702;background:var(--surface-solid);color:var(--text);border-radius:20px;padding:16px 16px 12px;box-shadow:0 0 0 1px var(--line),0 24px 60px -10px rgba(0,0,0,.55);animation:tour-in .22s ease}
@keyframes tour-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tour-bub.mid{animation:none}
.tour-step{font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--text-3);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.tour-step i{flex:1;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;position:relative}
.tour-step i b{position:absolute;left:0;top:0;bottom:0;background:var(--volt)}
.tour-bub h4{margin:0 0 6px;font-size:17px;font-weight:900;line-height:1.4;color:var(--head)}
.tour-bub p{margin:0;font-size:14px;line-height:1.75;color:var(--text-2)}
.tour-bub p b{color:var(--text)}
.tour-bub ul{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px;line-height:1.6;color:var(--text-2)}
.tour-bub ul li{display:flex;gap:8px;padding:3px 0}
.tour-bub ul li::before{content:"";flex:none;width:6px;height:6px;border-radius:2px;background:var(--volt);margin-top:8px}
.tour-btns{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px}
.tour-btns .btn{min-height:42px;padding:0 16px;font-size:14px}
.tour-btns .sp{flex:1}
.tour-btns.col{flex-direction:column;align-items:stretch}
.tour-arr{position:absolute;width:16px;height:16px;background:var(--surface-solid);transform:translateX(-50%) rotate(45deg)}
.tour-arr.up{top:-7px}
.tour-arr.down{bottom:-7px}
.tour-skip{background:none;border:0;color:var(--text-3);font-weight:800;font-size:13px;padding:8px 4px;min-height:40px}
.tour-hero{font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.tour-hole::after{animation:none}.tour-bub{animation:none}.tour-hole{transition:none}}
.lv-cmp th:not(:first-child),.lv-cmp td:not(:first-child){width:46px;white-space:nowrap;padding-left:2px;padding-right:2px}
/* 記録画面ではヘッダーのボタン（終了など）を隠さない位置に通知を出す */
body.covered .toast{top:calc(var(--safe-top) + 112px)}
/* はじめて開いたときの特徴スライド */
.tour-feats{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tour-feats .tf{display:flex;gap:12px;align-items:flex-start}
.tour-feats .tf-i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tour-feats .tf-i svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tour-feats b{display:block;font-size:14.5px;line-height:1.45;color:var(--head)}
.tour-feats span{display:block;font-size:12.5px;line-height:1.6;color:var(--text-2);margin-top:1px}
.tour-feats span b{display:inline;font-size:inherit}
.tour-bub.center{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain}
.tour-bub{text-align:left}.tour-feats .tf>div{flex:1;min-width:0}

</style>

/* 図形は一度だけ <defs> に定義し、<use> で使い回す（大量表示でも軽い） */
function bodyDefs() {
  const g = (id, list) => `<g id="${id}">${list.map((d) => `<path d="${d}"/>`).join('')}</g>`;
  let h = `<g id="bd-sil"><path d="${BODY_OUTLINE}"/></g>`;
  for (const k of Object.keys(BODY_FRONT.m)) h += g('bdF-' + k, BODY_FRONT.m[k]);
  for (const k of Object.keys(BODY_BACK.m)) h += g('bdB-' + k, BODY_BACK.m[k]);
  h += `<clipPath id="bd-clip"><path d="${BODY_OUTLINE}"/><path d="${BODY_OUTLINE}" transform="matrix(-1,0,0,1,200,0)"/><ellipse cx="100" cy="34" rx="20" ry="26"/><rect x="83" y="54" width="34" height="20"/></clipPath>

    <filter id="bd-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

/* fills: { 筋肉キー: 色 }。opts.mini=true で種目アイコン用、opts.sel で選択中の筋肉を強調、opts.glow で発光 */
function bodySvg(fills = {}, opts = {}) {
  const fig = (def, pre, dx, label) => {
    const half = (mirror) => {
      let h = '<use href="#bd-sil" class="bd-sil"/>';
      for (const k of Object.keys(def.m)) {
        const f = fills[k];
        h += `<use href="#${pre}-${k}" data-m="${k}" class="bd-m${f ? ' on' : ''}${opts.sel === k ? ' sel' : ''}"${f ? ` style="fill:${f}"` : ''}${f && opts.glow ? ' filter="url(#bd-glow)"' : ''}/>`;
      }
      return mirror ? `<g transform="matrix(-1,0,0,1,200,0)">${h}</g>` : h;
    };
    const head = '<ellipse cx="100" cy="34" rx="20" ry="26" class="bd-head"/><path d="M89,55 C89,63 87,69 83,73 L117,73 C113,69 111,63 111,55 Z" class="bd-head"/>';
    return `<g transform="translate(${dx},0)">${head}${half(false)}${half(true)}${opts.mini ? '' : '<rect x="0" y="0" width="200" height="440" fill="url(#bd-shade)" clip-path="url(#bd-clip)" pointer-events="none"/>'}${label ? `<text x="100" y="458" class="bd-label">${label}</text>` : ''}</g>`;
  };
  if (opts.mini) {
    const back = opts.side === 'back';
    const vb = opts.crop === 'upper' ? '30 68 140 140' : opts.crop === 'lower' ? '50 206 100 200' : '36 64 128 210';
    return `<svg viewBox="${vb}" class="bodysvg mini" aria-hidden="true">${fig(back ? BODY_BACK : BODY_FRONT, back ? 'bdB' : 'bdF', 0, '')}</svg>`;
  }
  const labels = opts.labels !== false;
  return `<svg viewBox="0 0 420 ${labels ? 470 : 446}" class="bodysvg${opts.tap ? ' tapable' : ''}${opts.stage ? ' stage' : ''}" role="img" aria-label="${esc(opts.aria || '筋肉マップ')}">
    ${fig(BODY_FRONT, 'bdF', 0, labels ? '前面' : '')}${fig(BODY_BACK, 'bdB', 220, labels ? '背面' : '')}</svg>`;
}

/* ===== サンプル記録の判定（バックアップ・復元・削除のすべてでこれだけを使う） =====

const isDemoSes = (x) => String((x && x.id) || '').startsWith('demo_');
const isDemoRec = (r) => !!(r && (r.demo || String(r.sessionId || '').startsWith('demo_')));

  d.sessions = (data.sessions || []).filter((x) => !isDemoSes(x));
  d.bodylog = (data.bodylog || []).filter((b) => !isDemoBody(b));

    const ms = arr(e.muscles).filter((m) => MUSCLE_KEYS.includes(m));
    const part = CATEGORIES.includes(e.part) ? e.part : CATEGORIES[0];
    return {
      id: String(e.id), name: String(e.name).slice(0, 40), en: String(e.en || '').slice(0, 60),
      part: CATEGORIES.includes(e.part) ? e.part : CATEGORIES[0],
      equipment: EQUIPMENTS.includes(e.equipment) ? e.equipment : 'その他',
      stepKg: num(e.stepKg) > 0 ? num(e.stepKg) : 2.5,

  add(d) { if (!DB.timer) return; DB.timer.endAt = Math.max(Date.now() + 1000, DB.timer.endAt + d * 1000); DB.timer.dur = Math.max(5, DB.timer.dur + d); save(); this.tick(); },
  stop() { clearInterval(this.h); this.doneUntil = 0; if (DB.timer) { DB.timer = null; save(); } updateRestbar(); renderMinibar(); },
  tick() {

/* ---------- プレート計算 ---------- */
function plateLoad(total, bar, collar, plates) {
  let side = (total - bar - (collar ? 5 : 0)) / 2;
  if (side < -1e-9) return { ok: false, list: [], rest: side * 2 };
  const list = [];
  for (const p of plates) { while (side + 1e-9 >= p) { list.push(p); side = round2(side - p); } }
  return { ok: side < 1e-6, list, rest: round2(side * 2) };
}
function plateSvg(list, collar) {
  const H = 120, cy = 60; let x = 70; let h = `<rect x="0" y="${cy - 5}" width="70" height="10" rx="3" fill="#9aa4b2"/><rect x="62" y="${cy - 14}" width="8" height="28" rx="2" fill="#7b8594"/>`;
  for (const p of list) {
    const ph = p >= 10 ? 104 : p >= 5 ? 76 : p >= 2 ? 58 : 46; const pw = p >= 15 ? 16 : p >= 5 ? 12 : 9;
    h += `<rect x="${x}" y="${cy - ph / 2}" width="${pw}" height="${ph}" rx="3" fill="${PLATE_COLORS[p] || '#94a3b8'}" stroke="rgba(0,0,0,.25)"/><text x="${x + pw / 2}" y="${cy + ph / 2 + 13}" font-size="9" text-anchor="middle" fill="var(--text-2)" font-weight="700">${p}</text>`;
    x += pw + 2;
  }
  if (collar) { h += `<rect x="${x}" y="${cy - 14}" width="10" height="28" rx="2" fill="#475569"/>`; x += 12; }
  h += `<rect x="${x}" y="${cy - 5}" width="${Math.max(40, 300 - x)}" height="10" rx="3" fill="#9aa4b2"/>`;
  return `<svg viewBox="0 0 ${Math.max(340, x + 50)} ${H + 14}">${h}</svg>`;
}
function openPlateCalc(initial) {
  const st = { w: initial || 60, bar: DB.settings.barKg, collar: DB.settings.collar };
  openSheet({
    title: 'プレート計算', state: st,
    render: () => {

      return `<div class="center" style="margin-bottom:10px"><div class="stepper" style="justify-content:center"><button type="button" data-a="adj" data-d="-2.5">−</button><div><input class="input center" data-in="w" inputmode="decimal" value="${fmtNum(st.w)}" style="width:120px;font-size:24px;font-weight:850"></div><button type="button" data-a="adj" data-d="2.5">＋</button></div><div class="faint small" style="margin-top:4px">合計重量（kg）</div></div>
        <div class="plate-wrap">${plateSvg(r.list, st.collar)}</div>
        <div class="plates-list">${r.list.length ? r.list.map((p) => `<span style="background:${PLATE_COLORS[p]};${p === 5 || p === 0.5 ? 'color:#111;border:1px solid #ccc' : ''}">${p}kg</span>`).join('') : '<span style="background:var(--surface-3);color:var(--text-2)">プレートなし</span>'}</div>
        <p class="hint">${r.ok ? `片側：<b>${r.list.reduce((a, b) => a + b, 0)}kg</b>（${r.list.join(' + ') || 'なし'}）` : r.rest < 0 ? 'バーより軽い重量です' : `ぴったりにできません（あと <b>${fmtNum(r.rest)}kg</b>）`}</p>
        <div class="field" style="margin-top:14px"><span class="lbl">バーの重さ</span><div class="chip-wrap">${[20, 15, 10, 7, 0].map((b) => `<button type="button" class="chip" data-a="bar" data-v="${b}" aria-pressed="${st.bar === b}">${b ? b + 'kg' : 'なし'}</button>`).join('')}</div></div>

        <p class="hint">使えるプレートは「設定 → プレート」で変更できます。</p>`;

/* ---------- ウォームアップ自動作成 ---------- */
function buildWarmups(target, ex) {
  const bar = ex.equipment === 'バーベル' ? DB.settings.barKg : 0;
  const step = ex.stepKg;
  const plan = [[0.4, 5], [0.55, 3], [0.7, 2], [0.8, 1], [0.9, 1]];
  const out = [];
  if (bar && target > bar + 10) out.push({ w: bar, r: ex.part === '全身・WL' ? 5 : 8 });
  for (const [p, r] of plan) {
    const w = Math.round((target * p) / step) * step;
    if (w <= (out.length ? out[out.length - 1].w : 0) || w >= target || w < bar) continue;
    if (p >= 0.9 && target < 80) continue;
    out.push({ w: round2(w), r: ex.part === '全身・WL' ? Math.min(r, 3) : r });
  }
  return out;
}
async function warmupFor(i) {
  const rec = recAt(i); const ex = getEx(rec.exerciseId);
  let first = rec.sets.find((s) => s.t !== 'w');
  let target = first && first.w != null ? first.w : null;
  if (target == null) { const j = rec.sets.indexOf(first); if (j >= 0) target = phOf(i, j).w; }
  if (!(target > 0)) {
    const v = await promptSheet({ title: 'ウォームアップ作成', label: 'メインセットの重量（kg）', placeholder: '例：80', ok: '作成' });
    target = parseNum(v); if (!(target > 0)) return;
  }
  const ws = buildWarmups(target, ex);
  if (!ws.length) { toast('重量が軽いため、ウォームアップは不要です'); return; }
  rec.sets = rec.sets.filter((s) => !(s.t === 'w' && !s.done));
  const idx = rec.sets.findIndex((s) => s.t !== 'w');
  rec.sets.splice(idx < 0 ? rec.sets.length : idx, 0, ...ws.map((w) => ({ w: w.w, r: w.r, done: false, t: 'w' })));
  rec.updatedAt = Date.now(); touch(); renderWorkout();
  toast(`ウォームアップ ${ws.length}セットを追加しました（${fmtNum(target)}kgの${ws.map((w) => Math.round(w.w / target * 100) + '%').join('・')}）`);
}

/* ---------- 1RMの%で入力 ---------- */
function bestOneRm(exId) {
  const sm = exSummary(exId); if (!sm) return null;
  let single = 0;
  for (const r of exRecords(exId)) for (const s of work(r)) if (s.r === 1) single = Math.max(single, s.w);
  return { e1: round1(sm.bestE1), single, maxW: sm.maxW };
}

  const refs = [{ k: 'e1', l: '推定1RM', v: b.e1 }, { k: 'maxW', l: '最高重量', v: b.maxW }]; if (b.single) refs.push({ k: 'single', l: '1回の最高', v: b.single });

      return `<div class="field"><span class="lbl">基準にする重量</span><div class="seg">${refs.map((r) => `<button type="button" data-a="ref" data-v="${r.k}" aria-pressed="${st.ref === r.k}">${r.l}<small>${fmtNum(r.v)}kg</small></button>`).join('')}</div></div>

        <p class="hint">「入力する」を押すと、未完了のセット（ウォームアップ以外）の重量に入ります。回数はそのままです。</p>`;
    },

        rec.updatedAt = Date.now(); touch(); s.close(); renderWorkout(); toast(`${st.pct}%（${fmtNum(w)}kg）を入力しました`);
      }
    }
  });
}

function countUp(els) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (const el of els) {
    const n = el.firstChild; if (!n || n.nodeType !== 3) continue;
    const to = Number(n.nodeValue); if (!isFinite(to) || to <= 0) continue;
    const t0 = performance.now(), dur = 900;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); n.nodeValue = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1 && n.isConnected) requestAnimationFrame(step); };
    n.nodeValue = '0'; requestAnimationFrame(step);

}

function weekStreaks() {
  const weeks = new Set(IDX().sessions.map((s) => weekStart(s.date)));
  const sorted = [...weeks].sort();
  let longest = 0, run = 0, prev = null;
  for (const w of sorted) { run = prev && daysBetween(prev, w) === 7 ? run + 1 : 1; longest = Math.max(longest, run); prev = w; }
  let cur = 0; let w = weekStart(ymd());
  if (!weeks.has(w)) w = addDays(w, -7);
  while (weeks.has(w)) { cur++; w = addDays(w, -7); }
  return { longest, cur, total: IDX().sessions.length };
}
function menuMuscles(m) {
  const fills = {}; const set = new Set();
  for (const id of m.exerciseIds) { const e = getEx(id); if (e.missing) continue; for (const k of e.sub) if (!fills[k]) fills[k] = partColor(e.part) + '66'; }
  for (const id of m.exerciseIds) { const e = getEx(id); if (e.missing) continue; for (const k of e.muscles) { fills[k] = partColor(e.part); set.add(k); } }
  return { fills, primary: [...set] };
}
function recommendMenu() {
  if (!DB.menus.length) return null;
  const agg = muscleAgg(28);
  const lastOf = (id) => DB.sessions.filter((s) => s.menuId === id && s.date).map((s) => s.date).sort().pop();
  let best = null;
  for (const m of DB.menus.filter(menuVisible)) {
    const ids = m.exerciseIds.filter((id) => exMap().has(id)); if (!ids.length) continue;
    const mm = menuMuscles(m);
    const ready = mm.primary.length ? mm.primary.reduce((a, k) => a + (1 - Math.min(1, agg.fatigue[k] / 6)), 0) / mm.primary.length : 1;
    const last = lastOf(m.id); const days = last ? daysBetween(last, ymd()) : 10;
    const score = ready * 0.7 + Math.min(days, 10) / 10 * 0.3;
    if (!best || score > best.score) best = { m, score, ready, last, days, mm, agg };
  }
  return best;
}

function prStrip() {
  const from = addDays(ymd(), -14);
  const list = prEvents().filter((x) => x.date >= from);
  const seen = new Set(); const top = [];
  for (const x of list) { if (seen.has(x.ex.id)) continue; seen.add(x.ex.id); top.push(x); if (top.length >= 6) break; }
  if (!top.length) return '';
  return `<section class="sec"><div class="sec-h"><h2>${ICON.trophy || ICON.bolt} 最近の自己ベスト</h2><button type="button" class="link" data-a="tab" data-tab="review">すべて見る</button></div>

}

    h += `<div class="card resume tap" data-a="openWo"><div class="m"><b>${ICON.play} 進行中：${esc(DB.active.name)}</b><span class="small muted">${fmtClock(DB.active.startedAt)}開始 ・ タップで再開</span></div>${ICON.chevR}</div>`;
  }
  const rec = !DB.active && recommendMenu();
  if (rec && !UI.reorder) {
    const parts = [...new Set(rec.m.exerciseIds.map((id) => getEx(id).part))].filter((p) => CATEGORIES.includes(p));
    const reason = !IDX().sessions.length ? 'まずはこのメニューから始めてみましょう' : `${parts.map((p) => PART_SHORT[p]).join('と')}の回復度 <b class="num">${Math.round(rec.ready * 100)}</b>%<br>${rec.last ? `前回は${fmtRelDay(rec.last)}` : 'まだ実施していません'}`;
    const glowFills = {}; for (const k of Object.keys(rec.mm.fills)) glowFills[k] = rec.mm.fills[k].length > 7 ? '#ffb54799' : '#ffb547';
    for (const k of rec.mm.primary) glowFills[k] = '#ff7a3d';
    const first = !UI.scanned && DB.ui.onboarded; if (first) UI.scanned = true;
    h += `<div class="card reco${first ? ' intro' : ''}"><i class="hud${first ? ' scan' : ''}" aria-hidden="true"></i><div class="reco-top"><div class="reco-body">${bodySvg(glowFills, { labels: false, glow: true })}</div><div style="flex:1;min-width:0"><div class="reco-kicker"><i class="live" aria-hidden="true"></i>今日のおすすめ</div>
      <div class="reco-name">${esc(rec.m.name)}</div><div class="reco-why">${reason}</div>
      ${rec.mm.primary.length ? `<div class="reco-tags">${[...new Set(rec.mm.primary.map((k) => MUSCLES[k].replace(/（.*?）/g, '')))].slice(0, 4).map((m) => `<span>${esc(m)}</span>`).join('')}</div>` : ''}</div></div>
      <button type="button" class="btn btn-primary btn-block btn-lg" style="margin-top:12px" data-a="startMenu" data-id="${esc(rec.m.id)}">${ICON.play}このメニューで開始</button>
      <p class="reco-note">回復の目安と前回からの日数で選んでいます</p></div>`;
  }
  h += prStrip();
  if (!UI.reorder) h += quickStart();
  const menus = UI.reorder ? DB.menus : DB.menus.filter(menuVisible);
  const hidden = DB.menus.length - menus.length;
  h += `<section class="sec"><div class="sec-h"><h2>メニュー（${menus.length}）</h2>${UI.reorder ? '<button type="button" class="link" data-a="reorder">完了</button>' : `<button type="button" class="link" data-a="menuNew">${ICON.plus}メニューを作成</button>`}</div>`;
  if (!DB.menus.length) h += `<div class="card empty"><div class="big">📋</div><p>メニューがありません</p><button type="button" class="btn btn-primary" data-a="menuNew">${ICON.plus}メニューを作成</button></div>`;
  h += menus.map((m) => {
    const i = DB.menus.indexOf(m);
    const ids = m.exerciseIds.filter((id) => exMap().has(id));
    const last = DB.sessions.filter((s) => s.menuId === m.id && s.date).map((s) => s.date).sort().pop();
    const totalSets = ids.reduce((a, id) => a + (m.sets[id] || 3), 0);
    return `<article class="card menu-card"><div class="mb">${bodySvg(menuMuscles(m).fills, { labels: false })}</div><div class="mm">
      <div class="mt"><h3>${esc(m.name)}${presetUnchanged(m) ? '<span class="tag-preset" title="例のメニュー（編集できます）">例</span>' : ''}</h3>${UI.reorder
        ? `<button type="button" class="icon-btn" data-a="menuMove" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="上へ">${ICON.up}</button><button type="button" class="icon-btn" data-a="menuMove" data-i="${i}" data-d="1" ${i === DB.menus.length - 1 ? 'disabled' : ''} aria-label="下へ">${ICON.down}</button>`
        : `<button type="button" class="icon-btn" data-a="menuMore" data-id="${esc(m.id)}" aria-label="${esc(m.name)}の操作" style="margin:-8px -10px -8px 0">${ICON.more}</button>`}</div>
      <div class="ex">${ids.map((id) => esc(getEx(id).name)).join('、') || '<span class="faint">種目がありません</span>'}</div>
      <div class="mfoot"><div class="meta meta-row"><span><b class="num">${ids.length}</b>種目</span><span><b class="num">${totalSets}</b>セット</span><span>${last ? fmtRelDay(last) : '未実施'}</span></div>
      ${UI.reorder ? '' : `<button type="button" class="btn-start" data-a="startMenu" data-id="${esc(m.id)}" ${ids.length ? '' : 'disabled'}>${ICON.play}開始</button>`}</div></div></article>`;
  }).join('');
  if (hidden > 0 && !UI.reorder) h += `<p class="hidden-note">ウェイトリフティングのメニュー ${hidden}件を非表示にしています。<button type="button" class="link" data-a="goWlSetting">表示する</button></p>`;
  h += `</section>`;
  return h;
}

/* メニュー編集（全画面） */
function openMenuEditor(menuId, initialIds) {
  const m = menuId ? DB.menus.find((x) => x.id === menuId) : null;
  const st = { name: m ? m.name : '', ids: m ? m.exerciseIds.filter((id) => exMap().has(id)) : (initialIds || []), sets: m ? { ...m.sets } : {}, dirty: false };
  const p = openPage({
    title: m ? 'メニューを編集' : '新しいメニュー', state: st,
    render: () => `<label class="field"><span class="lbl">メニュー名<em>必須</em></span><input class="input" data-in="name" maxlength="30" value="${esc(st.name)}" placeholder="例：WL・スクワットの日" autocomplete="off"></label>
      <div class="field"><span class="lbl">種目とセット数（上から順に行います）</span>
      ${st.ids.length ? `<div class="list">${st.ids.map((id, i) => { const e = getEx(id); const n = st.sets[id] || 3; return `<div class="li" style="gap:8px">${exIcon(e)}<div class="m"><div class="t">${esc(e.name)}</div><div class="s">${esc(e.part)}・${esc(e.equipment)}</div>
        <div class="stepper" style="margin-top:6px;gap:4px"><button type="button" data-a="sets" data-i="${i}" data-d="-1" style="width:40px;height:38px;font-size:18px">−</button><span class="val" style="min-width:60px;font-size:16px">${n}<span class="u">セット</span></span><button type="button" data-a="sets" data-i="${i}" data-d="1" style="width:40px;height:38px;font-size:18px">＋</button></div></div>
        <div style="display:flex;flex-direction:column"><button type="button" class="icon-btn" data-a="mv" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="上へ">${ICON.up}</button><button type="button" class="icon-btn" data-a="mv" data-i="${i}" data-d="1" ${i === st.ids.length - 1 ? 'disabled' : ''} aria-label="下へ">${ICON.down}</button></div>
        <button type="button" class="icon-btn" data-a="rm" data-i="${i}" aria-label="外す">${ICON.close}</button></div>`; }).join('')}</div>` : '<p class="empty-mini">まだ種目がありません。下のボタンから追加してください。</p>'}
      <div style="height:10px"></div><button type="button" class="btn btn-line btn-block" data-a="add">${ICON.plus}種目を追加</button></div>
      <button type="button" class="btn btn-primary btn-block btn-lg" data-a="save">${ICON.check}保存する</button>
      ${m ? `<button type="button" class="btn btn-danger-line btn-block" style="margin-top:10px" data-a="del">${ICON.trash}このメニューを削除</button>` : ''}`,
    inputs: { name: (el) => { st.name = el.value; st.dirty = true; } },
    actions: {
      __back: async () => { if (st.dirty) { const ok = await confirmSheet({ title: '編集内容を破棄しますか？', ok: '破棄する', danger: true }); if (!ok) return; } p.close(); },
      sets: (el) => { const id = st.ids[Number(el.dataset.i)]; st.sets[id] = clamp((st.sets[id] || 3) + Number(el.dataset.d), 1, 20); st.dirty = true; p.render(); },
      mv: (el) => { const i = Number(el.dataset.i), j = i + Number(el.dataset.d); [st.ids[i], st.ids[j]] = [st.ids[j], st.ids[i]]; st.dirty = true; p.render(); },
      rm: (el) => { st.ids.splice(Number(el.dataset.i), 1); st.dirty = true; p.render(); },
      add: () => pickExercises({ title: 'メニューに追加', multi: true, exclude: st.ids, onDone: (ids) => { st.ids.push(...ids); st.dirty = true; p.render(); } }),
      save: () => {
        const name = st.name.trim();
        if (!name) { toast('メニュー名を入力してください'); $('[data-in="name"]', p.el).focus(); return; }
        if (!st.ids.length) { toast('種目を1つ以上追加してください'); return; }
        const sets = {}; st.ids.forEach((id) => { if (st.sets[id] && st.sets[id] !== 3) sets[id] = st.sets[id]; });
        if (m) Object.assign(m, { name, exerciseIds: [...st.ids], sets, updatedAt: Date.now() });
        else DB.menus.push({ id: uid('menu'), name, exerciseIds: [...st.ids], sets, updatedAt: Date.now() });
        touch(); p.close(); toast('メニューを保存しました', 'ok'); refreshAll();
      },
      del: () => { p.close(); deleteMenu(m); }
    }
  });
}

function deleteMenu(m) {
  const i = DB.menus.indexOf(m); if (i < 0) return;
  DB.menus.splice(i, 1); touch(); refreshAll();
  undoToast(`「${m.name}」を削除しました（記録は残ります）`, () => { if (DB.menus.some((x) => x.id === m.id)) return; DB.menus.splice(Math.min(i, DB.menus.length), 0, m); touch(); refreshAll(); });
}
Object.assign(ACT, {
  begStart: () => startWorkout(BEGINNER_MENU, 'はじめての全身', null),
  begHide: () => { DB.ui.begHide = true; save(); renderTab(); toast('設定の「経験レベル」からいつでも戻せます'); },
  glossary: () => openGlossary(),
  undo: () => { const f = UI.undo; UI.undo = null; $('#toast').className = 'toast'; if (f) f(); },
  menuTipOk: () => { DB.ui.menuTipDone = true; save(); renderTab(); },
  goSetSec: (el) => openSetSec(el.dataset.sk),
  goWlSetting: () => { openSetSec('training'); setTimeout(() => { const el = $('#wlRow'); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); } }, 60); },
  repeatLast: () => { const s = IDX().sessions.find((x) => !x.live && x.recs.length); if (s) startWorkout(s.recs.map((r) => r.exerciseId), s.name, s.menuId && DB.menus.some((m) => m.id === s.menuId) ? s.menuId : null); },
  tab: (el) => setTab(el.dataset.tab),
  welcomeOk: () => { DB.ui.welcomeDone = true; save(); renderTab(); },
  reorder: () => { UI.reorder = !UI.reorder; renderTab(); },
  startMenu: (el) => { const m = DB.menus.find((x) => x.id === el.dataset.id); if (m) startWorkout(m.exerciseIds, m.name, m.id); },
  startPick: () => pickExercises({ title: '記録する種目（複数可）', multi: true, onDone: (ids) => { if (ids.length) startWorkout(ids, ids.length === 1 ? getEx(ids[0]).name : 'フリートレーニング', null); } }),
  startEmpty: () => startWorkout([], 'フリートレーニング', null),
  menuNew: () => openMenuEditor(null),
  menuMove: (el) => { const i = Number(el.dataset.i), j = i + Number(el.dataset.d); if (j < 0 || j >= DB.menus.length) return; [DB.menus[i], DB.menus[j]] = [DB.menus[j], DB.menus[i]]; DB.menus[i].updatedAt = DB.menus[j].updatedAt = Date.now(); touch(); renderTab(); },
  menuMore: async (el) => {
    const m = DB.menus.find((x) => x.id === el.dataset.id); if (!m) return;
    const c = await choiceSheet({ title: m.name, choices: [{ key: 'edit', label: '編集する' }, { key: 'dup', label: '複製する' }, { key: 'del', label: '削除する', cls: 'danger' }], cancel: '閉じる' });
    if (c === 'edit') openMenuEditor(m.id);
    else if (c === 'dup') { const i = DB.menus.indexOf(m); DB.menus.splice(i + 1, 0, { id: uid('menu'), name: (m.name + '（コピー）').slice(0, 40), exerciseIds: [...m.exerciseIds], sets: { ...m.sets }, updatedAt: Date.now() }); touch(); renderTab(); toast('メニューを複製しました'); }
    else if (c === 'del') deleteMenu(m);
  }
});

/* =====================================================================
   2. 記録（カレンダー）
   ===================================================================== */
function renderCal() {
  if (!UI.calMonth) UI.calMonth = ymd().slice(0, 7);
  if (!UI.calSel) UI.calSel = ymd();
  const [y, mo] = UI.calMonth.split('-').map(Number);
  const first = new Date(y, mo - 1, 1); const lastDay = new Date(y, mo, 0).getDate();
  const byDate = IDX().byDate;
  let h = topbar('記録', `<button type="button" class="icon-btn" data-a="calToday" aria-label="今日へ">${ICON.cal}</button>`);
  h += `<div class="card" id="calCard"><div class="cal-h"><button type="button" class="icon-btn" data-a="calMove" data-d="-1" aria-label="前の月">${ICON.chevL}</button><h2>${y}年${mo}月</h2><button type="button" class="icon-btn" data-a="calMove" data-d="1" aria-label="次の月">${ICON.chevR}</button></div>
    <div class="cal">${WEEK.map((w, k) => `<div class="wd ${k === 0 ? 'sun' : k === 6 ? 'sat' : ''}">${w}</div>`).join('')}`;
  for (let k = 0; k < first.getDay(); k++) h += '<div></div>';
  let mDays = 0, mSets = 0, mVol = 0, mDur = 0;
  for (let d = 1; d <= lastDay; d++) {
    const ds = `${y}-${pad2(mo)}-${pad2(d)}`;
    const ses = byDate.get(ds) || [];
    const parts = [...new Set(ses.flatMap((s) => s.parts))].filter((p) => CATEGORIES.includes(p));
    if (ses.length) { mDays++; for (const s of ses) { mSets += s.sets; mVol += s.vol; if (s.endedAt && s.startedAt) mDur += s.endedAt - s.startedAt; } }
    h += `<button type="button" class="day ${ds === ymd() ? 'today' : ''} ${ds === UI.calSel ? 'sel' : ''} ${ds > ymd() ? 'future' : ''}" data-a="calSel" data-d="${ds}" aria-label="${mo}月${d}日${ses.length ? '（記録あり）' : ''}">${dayRingSvg(parts)}<span>${d}</span></button>`;
  }
  h += `</div><div class="legend">${dataCats().map((c) => `<span><i class="pdot" style="background:${partColor(c)}"></i>${PART_SHORT[c]}</span>`).join('')}</div>
    <div class="stat4"><div><b>${mDays}<small>日</small></b><span>${mo}月の日数</span></div><div><b>${mSets}</b><span>セット</span></div><div><b>${fmtBig(mVol)}<small>kg</small></b><span>総負荷量</span></div><div><b>${mDur ? durHtml(mDur) : '-'}</b><span>合計時間</span></div></div></div>`;
  const sk = weekStreaks();
  h += `<button type="button" class="card tap streak-row" data-a="openStreak"><span class="sr-i">${ICON.layers}</span><span class="m"><b>積み重ね</b><span><b class="num">${sk.total}</b>回 ・ 連続<b class="num">${sk.cur}</b>週（最長${sk.longest}週）</span></span>${ICON.chevR}</button>`;
  const sel = UI.calSel; const ses = byDate.get(sel) || [];
  h += `<section class="sec"><div class="sec-h"><h2>${fmtDateLong(sel)}</h2>${sel <= ymd() ? `<button type="button" class="link" data-a="calAdd">${ICON.plus}記録を追加</button>` : ''}</div>`;
  if (!ses.length) h += `<div class="card empty"><p>${sel > ymd() ? '未来の日付です' : 'この日の記録はありません'}</p></div>`;
  h += ses.map((s) => sessionCard(s)).join('');
  h += `</section>`;
  return h;
}
function sessionCard(s) {
  const dur = s.endedAt && s.startedAt ? s.endedAt - s.startedAt : 0;
  return `<article class="card"><div class="card-h"><h3>${esc(s.name)}${s.live ? '<span class="badge ok">記録中</span>' : ''}${s.demo ? '<span class="badge">サンプル</span>' : ''}${s.rating ? ` <span>${['😫', '😕', '🙂', '😀', '🔥'][s.rating - 1]}</span>` : ''}</h3>
    <button type="button" class="icon-btn" data-a="sesMore" data-id="${esc(s.id)}" aria-label="操作">${ICON.more}</button></div>
    <div class="ses-stats">${dur ? `<span>${ICON.clock}${fmtDur(dur)}</span>` : ''}${s.startedAt ? `<span>${fmtClock(s.startedAt)}〜</span>` : ''}<span>${ICON.layers}${s.sets}セット</span><span>${ICON.weight}${fmtBig(s.vol)}kg</span></div>
    ${s.recs.map((r) => { const ex = getEx(r.exerciseId); const st = setsStats(work(r), ex); return `<button type="button" class="ses-ex" data-a="exDetail" data-id="${esc(r.exerciseId)}"><span class="bar" style="background:${partColor(ex.part)}"></span><div class="m"><b>${esc(ex.name)}</b><span>${st.vol ? `ボリューム ${fmtBig(st.vol)}kg ・ ` : ''}${esc(fmtSets(doneSets(r), ex))}</span>${r.memo ? `<span>📝 ${esc(r.memo)}</span>` : ''}</div></button>`; }).join('')}
    ${s.note ? `<div class="hint" style="margin-top:8px">📝 ${esc(s.note)}</div>` : ''}
    <div class="row" style="margin-top:10px"><button type="button" class="btn btn-sm" data-a="sesEdit" data-id="${esc(s.id)}">${ICON.edit}編集</button><button type="button" class="btn btn-sm" data-a="sesAgain" data-id="${esc(s.id)}">${ICON.play}もう一度</button></div></article>`;
}
function sessionToSummary(s) {
  const items = s.recs.map((r) => ({ ex: getEx(r.exerciseId), ds: doneSets(r), beats: 0, pr: null }));
  return { id: s.id, name: s.name, date: s.date, ms: s.endedAt && s.startedAt ? s.endedAt - s.startedAt : 0, items, sets: s.sets, vol: s.vol, beats: 0, prs: [] };
}
Object.assign(ACT, {
  calMove: (el) => { const [y, m] = UI.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.d), 1); UI.calMonth = ymd(d).slice(0, 7); renderTab(); },
  calToday: () => { UI.calMonth = ymd().slice(0, 7); UI.calSel = ymd(); renderTab(); },
  calSel: (el) => { UI.calSel = el.dataset.d; renderTab(); },
  calAdd: async () => {
    const date = UI.calSel;
    const live = date === ymd() && !DB.active;   // 今日（進行中なし）は通常の記録として開始
    // メニューから選ぶ or 種目を選ぶ
    const menus = DB.menus.filter(menuVisible).map((m) => ({ m, ids: m.exerciseIds.filter((id) => exMap().has(id)) })).filter((x) => x.ids.length);
    const c = menus.length ? await choiceSheet({ title: `${fmtDateLong(date)}の記録を追加`, message: '<p class="small muted" style="margin:0">メニューを選ぶと、その種目とセット数で記録画面が開きます。</p>', cancel: '閉じる',
      choices: [...menus.map(({ m, ids }) => ({ key: 'm:' + m.id, label: m.name, desc: `${ids.length}種目：${ids.slice(0, 3).map((id) => getEx(id).name).join('、')}${ids.length > 3 ? ' ほか' : ''}` })),
        { key: 'pick', label: '種目を選んで追加', desc: 'メニューを使わずに、やった種目だけ選ぶ' }] }) : 'pick';
    if (!c) return;
    const open = (ids, name, menuId) => {
      if (live) { startWorkout(ids, name, menuId); return; }
      const sid = uid('ses');
      UI.wo = { id: sid, live: false, edit: { id: sid, name, menuId, date, exerciseIds: [...new Set(ids)], startedAt: 0, endedAt: 0, supersets: {}, note: '' } };
      showWorkout();
    };
    if (c.startsWith('m:')) { const x = menus.find((y) => 'm:' + y.m.id === c); if (x) open(x.ids, x.m.name, x.m.id); return; }
    pickExercises({ title: `${fmtDateLong(date)}の記録を追加`, multi: true, onDone: (ids) => { if (ids.length) open(ids, ids.length === 1 ? getEx(ids[0]).name : live ? 'フリートレーニング' : 'トレーニング', null); } });
  },
  sesEdit: (el) => openSessionEdit(el.dataset.id),
  sesAgain: (el) => { const s = IDX().sessions.find((x) => x.id === el.dataset.id); if (s) startWorkout(s.recs.map((r) => r.exerciseId), s.name, s.menuId); },
  sesMore: async (el) => {
    const s = IDX().sessions.find((x) => x.id === el.dataset.id); if (!s) return;
    const c = await choiceSheet({ title: s.name, choices: [{ key: 'edit', label: '編集する' }, { key: 'share', label: '画像で共有' }, { key: 'again', label: 'もう一度このトレーニングを行う' }, { key: 'menu', label: 'メニューとして保存' }, { key: 'del', label: 'この記録を削除', cls: 'danger' }], cancel: '閉じる' });
    if (c === 'edit') openSessionEdit(s.id);
    else if (c === 'share') shareSessionImage(sessionToSummary(s));
    else if (c === 'again') startWorkout(s.recs.map((r) => r.exerciseId), s.name, s.menuId);
    else if (c === 'menu') { const n = await promptSheet({ title: 'メニューとして保存', label: 'メニュー名', value: s.name }); if (n) { DB.menus.push({ id: uid('menu'), name: n, exerciseIds: s.recs.map((r) => r.exerciseId), sets: Object.fromEntries(s.recs.map((r) => [r.exerciseId, Math.max(1, work(r).length)])), updatedAt: Date.now() }); touch(); toast('メニューに保存しました', 'ok'); } }
    else if (c === 'del') {
      const ok = await confirmSheet({ title: 'この記録を削除しますか？', message: `<p>${fmtDate(s.date, true)}「${esc(s.name)}」（${s.sets}セット）を削除します。この操作は取り消せません。</p>`, ok: '削除する', danger: true });
      if (!ok) return;
      const ids = new Set(s.recs.map((r) => r.id));
      DB.records = DB.records.filter((r) => !ids.has(r.id));
      DB.sessions = DB.sessions.filter((x) => x.id !== s.id);
      touch(); refreshAll(); toast('記録を削除しました');
    }
  }
});
/* カレンダーのスワイプで月移動 */
let swipeX = null;
document.addEventListener('touchstart', (e) => { const c = e.target.closest && e.target.closest('#calCard'); swipeX = c ? e.touches[0].clientX : null; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (swipeX == null) return; const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;

function prEvents() {

function wlBest(id) {
  const recs = exRecords(id); if (!recs.length) return null;
  const ex = getEx(id); let maxW = 0, e1 = 0, date = '';
  for (const r of recs) { const st = setsStats(work(r), ex); if (st.maxW > maxW) { maxW = st.maxW; date = r.date; } e1 = Math.max(e1, st.e1rm); }
  const v = ex.part === '全身・WL' && !['wl_05', 'wl_42'].includes(id) ? maxW : Math.max(maxW, round1(e1));
  return { v, maxW, e1: round1(e1), date };
}

}

function filterEx(q, cat, equip) {
  q = (q || '').trim().toLowerCase();
  const fav = new Set(DB.favorites);
  return allEx().filter((e) => {
    if (!exVisible(e)) return false;
    if (cat === '★お気に入り' && !fav.has(e.id)) return false;
    if (cat === '記録あり' && !exSummary(e.id)) return false;
    if (cat === '自分の種目' && !e.custom) return false;
    if (CATEGORIES.includes(cat) && e.part !== cat) return false;

function dailySeries(exId) {

    const g = map.get(r.date); g.sets.push(...doneSets(r)); g.recs.push(r); if (r.memo) g.memos.push(r.memo);
  }
  return [...map.values()].sort((a, b) => (a.date < b.date ? -1 : 1)).map((g) => ({ ...g, x: dayNum(g.date), stats: setsStats(g.sets.filter((s) => s.t !== 'w'), ex) }));
}
function periodStart(p) {

}
function repMaxTable(exId) {

}

const APP_URL = 'https://pierrotmask.github.io/unique-tool/lift-canvas.html';
const QR_SOURCES = ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];
function appShareUrl() { return location.protocol === 'https:' && !/^(localhost|127\.)/.test(location.hostname) ? location.origin + location.pathname : APP_URL; }
const SHARE_TEXT = '筋トレの記録アプリ「LiftCanvas」。無料・登録なしで、記録はスマホの中だけに保存されます。';
function loadQr() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  return new Promise((resolve, reject) => { let i = 0; const next = () => { if (i >= QR_SOURCES.length) { reject(new Error('QRコードを作れませんでした（電波を確認してください）')); return; } const sc = document.createElement('script'); sc.src = QR_SOURCES[i++]; sc.onload = () => (window.qrcode ? resolve(window.qrcode) : next()); sc.onerror = () => { sc.remove(); next(); }; document.head.appendChild(sc); }; next(); });
}
function qrSvg(qr) {
  const n = qr.getModuleCount(); const m = 3; let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x + m} ${y + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + m * 2} ${n + m * 2}" class="qr" role="img" aria-label="アプリのQRコード" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function openShareApp() {
  const url = appShareUrl(); const st = { qr: '', qrErr: '' };
  openSheet({
    title: 'このアプリを人に教える', state: st,
    render: () => `<div class="share-app"><p class="small muted" style="margin:0 0 12px">${esc(SHARE_TEXT)}<br>送った相手が開くと、すぐに使い始められます（相手にあなたの記録は送られません）。</p>
      <div class="stack">${navigator.share ? `<button type="button" class="btn btn-primary btn-block btn-lg" data-a="native">${ICON.share}LINE・メールなどで送る</button>` : ''}
      <button type="button" class="btn btn-block" data-a="copy">${ICON.copy}リンクをコピー</button>
      <button type="button" class="btn btn-block" data-a="showQr" ${st.qr ? 'hidden' : ''}>QRコードを表示（目の前の人に）</button></div>
      ${st.qr ? `<div class="qr-wrap">${st.qr}<p class="tiny faint">相手のスマホのカメラで読み取ってもらってください</p></div>` : ''}${st.qrErr ? `<p class="small" style="color:var(--warn)">${esc(st.qrErr)}</p>` : ''}
      <p class="tiny faint" style="margin:12px 0 0;overflow-wrap:anywhere">${esc(url)}</p></div>`,
    actions: {
      native: async () => { try { await navigator.share({ title: 'LiftCanvas', text: SHARE_TEXT, url }); } catch (e) { if (e && e.name !== 'AbortError') toast('共有できませんでした。リンクをコピーしてください'); } },
      copy: async () => { try { await navigator.clipboard.writeText(`${SHARE_TEXT}\n${url}`); toast('リンクをコピーしました', 'ok'); } catch (e) { promptSheet({ title: 'リンク', label: '長押しでコピーしてください', value: url, ok: '閉じる', maxlength: 300 }); } },
      showQr: async (el, e, s) => {
        try { el.disabled = true; const q = await loadQr(); const qr = q(0, 'M'); qr.addData(url); qr.make(); st.qr = qrSvg(qr); st.qrErr = ''; }
        catch (err) { st.qrErr = err.message || 'QRコードを作れませんでした'; }
        s.render();
      }
    }
  });
}

function buildExport() { const data = stripDemo(clone(DB)); data.timer = null; return { app: 'LiftCanvas', format: STORAGE_KEY, version: APP_VERSION, exportedAt: new Date().toISOString(), data }; }
function exportName(ext = 'json') { const d = new Date(); return `liftcanvas_backup_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}.${ext}`; }
function markBackup(via) { DB.settings.lastBackupAt = Date.now(); DB.settings.lastBackupVia = via; if (via.startsWith('Google')) { DB.settings.lastDriveAt = Date.now(); DB.settings.drivePending = false; } save(); updateTabbar(); if (UI.tab === 'settings' || UI.tab === 'train') renderTab(); }
function downloadBlob(blob, name) { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
async function exportShare() {
  const json = JSON.stringify(buildExport()); const name = exportName();
  let file = null; try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'LiftCanvas バックアップ' }); markBackup('ファイル共有'); toast('バックアップファイルを書き出しました', 'ok'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  downloadBlob(new Blob([json], { type: 'application/json' }), name); markBackup('ダウンロード'); toast('ダウンロード保存しました', 'ok');

function parseImport(input) {

  return { data: stripDemo(normalize(d)), exportedAt: j.exportedAt || null };
}
async function askImportMode(parsed, label) {

      { key: 'merge', label: '既存データと統合（マージ）', desc: 'この端末の記録は残したまま、バックアップの内容を追加します。同じ記録は新しい方を残します。' }
    ]

    if (!ok) return;

function mergeById(cur, inc) { const map = new Map(cur.map((x) => [x.id, x])); for (const x of inc) { const e = map.get(x.id); if (!e || (x.updatedAt || 0) > (e.updatedAt || 0)) map.set(x.id, x); } return [...map.values()]; }
function applyImport(inc, mode) {
  Timer.stop(); closeKeypad();
  if (UI.wo) closeWorkoutView();
  if (mode === 'overwrite') {
    const keep = { id: DB.settings.googleClientId, theme: DB.settings.theme };
    DB = normalize(clone(inc));
    if (!DB.settings.googleClientId) DB.settings.googleClientId = keep.id;
    DB.active = null;
  } else {
    DB.records = mergeById(DB.records, inc.records);
    DB.customExercises = mergeById(DB.customExercises, inc.customExercises);
    DB.menus = mergeById(DB.menus, inc.menus);
    DB.sessions = mergeById(DB.sessions, inc.sessions);
    DB.imports = mergeById(DB.imports || [], inc.imports || []);
    const bl = new Map(DB.bodylog.map((b) => [b.date, b])); for (const b of inc.bodylog) { const e = bl.get(b.date); if (!e || (b.updatedAt || 0) > (e.updatedAt || 0)) bl.set(b.date, b); }
    DB.bodylog = [...bl.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
    DB.overrides = { ...inc.overrides, ...DB.overrides };
    DB.favorites = [...new Set([...DB.favorites, ...inc.favorites])];
    DB.exNotes = { ...inc.exNotes, ...DB.exNotes };
  }

}
async function handleImportFile(file) {
  if (!file) return;
  if (file.size > 40 * 1024 * 1024) { toast('ファイルが大きすぎます', 'error'); return; }

/* ---------- Googleドライブ連携（Google Identity Services + Drive API v3） ---------- */
const Drive = {
  token: null, exp: 0, gisP: null,
  clientId() { return (DB.settings.googleClientId || '').trim() || GOOGLE_CLIENT_ID; },
  loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    if (this.gisP) return this.gisP;
    this.gisP = new Promise((resolve, reject) => {
      const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { this.gisP = null; s.remove(); reject(new Error('Googleのログイン機能を読み込めませんでした。通信状態をご確認ください')); };
      document.head.appendChild(s);
    });
    return this.gisP;
  },
  async getToken() {
    if (this.token && Date.now() < this.exp - 60000) return this.token;
    const cid = this.clientId(); if (!cid) throw new Error('Googleドライブ連携が設定されていません');
    await this.loadGis();
    return new Promise((resolve, reject) => {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: cid, scope: DRIVE_SCOPE,
        callback: (r) => { if (!r || r.error) { reject(new Error('Googleへのログインが許可されませんでした')); return; } this.token = r.access_token; this.exp = Date.now() + (Number(r.expires_in) || 3600) * 1000; resolve(this.token); },
        error_callback: (err) => { const t = err && err.type; reject(new Error(t === 'popup_closed' ? 'ログインがキャンセルされました' : t === 'popup_failed_to_open' ? 'ログイン画面を開けませんでした（ポップアップを許可してください）' : 'Googleへのログインに失敗しました')); }
      });
      client.requestAccessToken({ prompt: '' });
    });
  },
  async api(url, opts = {}, retry = true) {
    const token = await this.getToken();
    const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
    if (res.status === 401 && retry) { this.token = null; return this.api(url, opts, false); }
    if (!res.ok) { let d = ''; try { const j = await res.json(); d = j.error && j.error.message ? j.error.message : ''; } catch (e) { /* noop */ } throw new Error(`Googleドライブでエラーが発生しました（${res.status}）${d ? '：' + d : ''}`); }
    return res;
  },
  folderId: null,
  async folder() {
    if (this.folderId) return this.folderId;
    let parent = 'root';
    for (const name of DRIVE_FOLDERS) {
      const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${name.replace(/'/g, "\\'")}' and '${parent}' in parents and trashed=false`);
      const j = await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&pageSize=1&fields=files(id)`)).json();
      if (j.files && j.files[0]) { parent = j.files[0].id; continue; }
      const c = await (await this.api('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parent] }) })).json();
      parent = c.id;
    }
    this.folderId = parent; return parent;
  },
  async findFile() {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&pageSize=10&fields=files(id%2Cname%2CmodifiedTime%2Csize)`);
    const j = await res.json(); return (j.files && j.files[0]) || null;
  },
  async upload() {
    try { return await this.upload1(); }
    catch (e) { if (!this.folderId) throw e; this.folderId = null; return this.upload1(); }   // フォルダが消された等：作り直して再試行
  },
  async upload1() {
    const body = JSON.stringify(buildExport()); const f = await this.findFile();
    if (f) { await this.api(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(f.id)}?uploadType=media&fields=id%2CmodifiedTime`, { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body }); return 'updated'; }
    const b = 'liftcanvas' + Date.now().toString(36);
    const meta = { name: DRIVE_FILE_NAME, mimeType: 'application/json', description: 'LiftCanvas（トレーニング記録）のバックアップ', parents: [await this.folder()] };
    await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id%2CmodifiedTime', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body: `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${b}--` });
    return 'created';
  },
  async download() {
    const f = await this.findFile();
    if (!f) throw new Error('Googleドライブにバックアップが見つかりませんでした（このアプリで保存したファイルのみ探せます）');
    const res = await this.api(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(f.id)}?alt=media`);
    return { text: await res.text(), file: f };
  }
};
function driveReady() {
  if (!Drive.clientId()) { toast('Googleドライブ連携はまだ設定されていません。ファイル保存をご利用ください'); return false; }
  if (location.protocol === 'file:') { toast('ファイルを直接開いた状態ではGoogleログインを使えません', 'error'); return false; }
  if (!navigator.onLine) { toast('インターネットに接続してから実行してください', 'error'); return false; }
  return true;
}
async function driveBackup() {
  if (!driveReady()) return;
  setBusy(true, 'Googleドライブを確認しています…');
  // 新しい端末・データが空の端末から、ドライブにある本物のバックアップを上書きしてしまう事故を防ぐ
  let f = null;
  try { f = await Drive.findFile(); } catch (e) { setBusy(false); console.error(e); toast(e.message || 'Googleドライブに接続できませんでした', 'error'); return; }
  const real = DB.records.filter((r) => !isDemoRec(r) && r.sets.some((x) => x.done)).length;
  if (f && (!DB.settings.lastDriveAt || !real)) {
    setBusy(false);
    const ok = await confirmSheet({ title: 'ドライブのバックアップを上書きしますか？', message: `<p>Googleドライブには、すでにバックアップがあります（${esc(fmtDateTime(Date.parse(f.modifiedTime)))} 更新）。</p><p>${real ? `この端末の記録（${real}件）で` : '<b>この端末には記録がないため、保存すると空のデータで</b>'}置き換わります。<b>機種変更の直後なら、先に「Googleドライブから復元」</b>を行ってください。</p>`, ok: '上書きして保存', danger: true });
    if (!ok) return;
  }
  setBusy(true, 'Googleドライブに保存しています…');
  try { const r = await Drive.upload(); markBackup('Googleドライブ'); toast(r === 'created' ? 'Googleドライブに保存しました' : 'Googleドライブのバックアップを更新しました', 'ok'); }
  catch (e) { console.error(e); DB.settings.drivePending = true; save(); toast(e.message || '保存に失敗しました', 'error'); }
  finally { setBusy(false); }
}
/* トレーニング終了時の自動保存（失敗しても記録は端末に残り、あとで再保存できる） */
async function autoDriveBackup() {
  if (!DB.settings.autoDrive || !DB.settings.lastDriveAt || !Drive.clientId() || location.protocol === 'file:') return;

async function driveRestore() {
  if (!driveReady()) return;
  setBusy(true, 'Googleドライブから読み込んでいます…');
  let got = null;
  try { got = await Drive.download(); } catch (e) { console.error(e); toast(e.message || '読み込みに失敗しました', 'error'); } finally { setBusy(false); }
  if (!got) return;
  try { await askImportMode(parseImport(got.text), `Googleドライブ（${fmtDateTime(Date.parse(got.file.modifiedTime))} 更新）`); }
  catch (e) { toast(e.message || 'バックアップの内容を読み取れませんでした', 'error'); }
}

/* ---------- サンプル記録・初期化 ---------- */
function addDemoData() {
  if (hasDemo()) { toast('サンプル記録はすでに追加されています'); return; }
  let seed = 20261119;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const plans = [
    { day: 1, name: 'WL・スクワットの日', menu: 'menu_01', ex: [['wl_01', 45, 1, 3, 5, 0.45], ['wl_02', 60, 1, 2, 5, 0.45], ['wl_08', 80, 2.5, 3, 4, 0.4], ['wl_05', 70, 2.5, 3, 4, 0.4]] },
    { day: 3, name: '胸・肩の日', menu: 'menu_02', ex: [['chest_01', 55, 2.5, 10, 3, 0.3], ['chest_04', 16, 2, 10, 3, 0.25], ['shoulder_01', 35, 2.5, 8, 3, 0.25], ['shoulder_03', 6, 1, 15, 3, 0.15]] },
    { day: 5, name: '背中・腕の日', menu: 'menu_03', ex: [['back_01', 100, 2.5, 5, 3, 0.35], ['back_02', 0, 2.5, 8, 3, 0.25], ['back_04', 50, 2.5, 10, 3, 0.3], ['arm_01', 25, 2.5, 10, 3, 0.2]] },
    { day: 6, name: '全身ベーシック', menu: 'menu_04', ex: [['leg_01', 80, 2.5, 8, 3, 0.35], ['abs_09', 0, 2.5, 45, 2, 0.3]] }
  ];
  const state = {}; const today = ymd(); const recs = []; const sessions = [];
  const start = addDays(weekStart(today), -7 * 47);
  for (let w = 0; w < 48; w++) {
    for (const p of plans) {
      const date = addDays(start, w * 7 + p.day); if (date > today || rnd() < 0.12) continue;
      const sid = 'demo_' + date + '_' + p.day; const st0 = parseYmd(date).getTime() + (17 + Math.floor(rnd() * 3)) * 3600e3;
      const ids = [];
      p.ex.forEach(([id, w0, step, reps, n, prob], k) => {
        if (state[id] == null) state[id] = w0;
        if (rnd() < prob) state[id] += step; if (rnd() < 0.04) state[id] = Math.max(w0, state[id] - step * 2);
        const timed = id === 'abs_09';
        const sets = [];
        if (getEx(id).part === '全身・WL') sets.push({ w: 20, r: 3, done: true, t: 'w' });
        for (let i = 0; i < n; i++) sets.push({ w: id === 'back_02' ? (state[id] > 5 ? round2(state[id] - 5) : 0) : round2(state[id]), r: timed ? reps + Math.round(state[id] / 2.5) * 5 + (i ? -5 : 0) : Math.max(1, reps - (i === n - 1 && rnd() < 0.3 ? 1 : 0)), done: true, t: 'n' });
        recs.push({ id: uid('rec'), sessionId: sid, date, exerciseId: id, sets, memo: rnd() < 0.08 ? ['調子よし', 'フォーム意識', '少し疲れ気味', 'スピード良好'][Math.floor(rnd() * 4)] : '', order: k, updatedAt: st0, demo: true });
        ids.push(id);
      });
      sessions.push({ id: sid, name: p.name, menuId: p.menu, date, startedAt: st0, endedAt: st0 + (45 + Math.floor(rnd() * 40)) * 60000, note: '', rating: 0, exerciseIds: ids, updatedAt: st0 });
    }
  }
  DB.records.push(...recs); DB.sessions.push(...sessions);
  if (!DB.bodylog.length) { let bw = 72; for (let w = 0; w < 48; w += 2) { bw += (rnd() - 0.45) * 0.6; const d = addDays(start, w * 7); if (d <= today) DB.bodylog.push({ date: d, kg: round1(bw), fat: null, updatedAt: 1, demo: true }); } }
  DB.ui.welcomeDone = true;
  touch(); refreshAll();
  toast(`サンプル記録（約1年分・${sessions.length}回）を追加しました`, 'ok');
}

IMP.resolveYears = (ds, today = ymd()) => {

/* ---------- セットの書き方（60kg×10×3 / 60kg 10回 3セット / 80x8,8,6 / 10回×3 / 30秒 / @8 …） ---------- */

/* ---------- 名前とセットの境目 ---------- */
IMP.SET_HEAD = /^(?:\+?\d+(?:\.\d+)?\s*(?:kg|㎏|キロ|lbs?|ポンド|[xX×✕＊*]|回|reps?|レップ|秒|分|sec|min|セット|sets?|@)|自重|bw\b|\d+(?:\.\d+)?\s+\d+\s*(?:回|reps?|レップ)|\d+(?:\.\d+)?(?:[\s,、/]+\d+(?:\.\d+)?)*\s*(?:$|[(（]))/i;

/* ---------- 文章（メモ帳など）の読み取り ---------- */
/* 「60/10」「100-5」（重量/回数）、「10.10.8」「10-8-6」（回数の並び）をふつうの書き方にそろえる */
IMP.normPairs = (s) => s
  .replace(/(\d{1,2})\s*[-~〜]\s*\d{1,2}(?=\s*(?:回|reps?|レップ))/gi, '$1')
  .replace(/(?<![\d.])\d{1,3}(?:\.\d{1,3}){2,}(?![\d.])/g, (m) => (m.split('.').every((x) => Number(x) <= 50) ? m.replace(/\./g, ',') : m))

    .replace(/^(?:\d{1,2}[.)）](?=\s*[^\d\s.])|[(（]\d{1,2}[)）])\s*/, '')

IMP.CARDIO = /ランニング|ジョギング|ジョグ|ウォーキング|散歩|エアロバイク|バイク|サイクリング|トレッドミル|ルームランナー|有酸素|水泳|スイミング|スイム|クロストレーナー|ステッパー|running|jogging|\bjog\b|walking|cycling|treadmill|elliptical|\bswim|cardio|\d+(?:\.\d+)?\s*km(?![a-z])/i;

    if (it.note && !rec.memo.includes(it.note)) rec.memo = (rec.memo ? rec.memo + ' / ' : '') + String(it.note).slice(0, 200);
  }
  const haveBody = new Set(DB.bodylog.filter((x) => x.imp !== batch && !(opt.ignore || []).includes(x.imp)).map((x) => x.date)); const bodyMap = new Map();
  for (const x of an.body || []) { const d = x.day.dt.ymd; if (!isYmd(d) || d > ymd() || haveBody.has(d) || skipDays.has(d)) continue; const o = bodyMap.get(d) || { date: d, kg: null, fat: null, updatedAt: now, imp: batch }; if (x.kg) o.kg = Math.round(x.kg * 100) / 100; if (x.fat) o.fat = Math.round(x.fat * 10) / 10; bodyMap.set(d, o); }
  const body = [...bodyMap.values()].filter((x) => x.kg > 0);
  const usedEx = new Set([...records.values()].map((r) => r.exerciseId));
  const recs = [...records.values()]; const sess = [...sessions.values()].filter((s) => s.exerciseIds.length);
  const days = [...new Set(recs.map((r) => r.date))].sort();
  return { batch, pre, sessions: sess, records: recs, body, customs: customs.filter((e) => usedEx.has(e.id)), sets, days, skipDays: [...skipDays], overlapDays: [...overlapDays], wl: recs.some((r) => ((customs.find((c) => c.id === r.exerciseId) || (exMap().get(r.exerciseId)) || {}).part) === '全身・WL') };
};
/* DBへ反映（同じ取り込みを再度行ったら置き換え） */
IMP.commit = (b, label) => {
  IMP.removeBatch(b.batch, true);
  for (const e of b.customs) { const { custom, ...x } = e; DB.customExercises.push(x); }
  DB.sessions.push(...b.sessions); DB.records.push(...b.records);
  if (b.body && b.body.length) { DB.bodylog.push(...b.body); DB.bodylog.sort((x, y) => (x.date < y.date ? -1 : 1)); }
  DB.imports = (DB.imports || []).filter((x) => x.id !== b.batch);
  DB.imports.push({ id: b.batch, label: String(label || '').slice(0, 60), at: Date.now(), days: b.days.length, sets: b.sets, body: (b.body || []).length, from: b.days[0] || '', to: b.days[b.days.length - 1] || '', updatedAt: Date.now() });
  invalidateEx(); touch();
};
IMP.removeBatch = (batch, quiet) => {
  const pre = `imp_${batch}_`;
  DB.records = DB.records.filter((r) => !r.id.startsWith(pre) && !r.sessionId.startsWith(pre));
  DB.sessions = DB.sessions.filter((s) => !s.id.startsWith(pre));
  DB.bodylog = DB.bodylog.filter((x) => x.imp !== batch);
  DB.customExercises = DB.customExercises.filter((e) => !e.id.startsWith(pre) || DB.records.some((r) => r.exerciseId === e.id));
  DB.menus.forEach((m) => { m.exerciseIds = m.exerciseIds.filter((id) => !id.startsWith(pre) || exMap().has(id)); });
  if (!quiet) DB.imports = (DB.imports || []).filter((x) => x.id !== batch);
  invalidateEx(); sanitizeRefs(); touch();
};

          const doc = /\.(xlsx|xlsm|xls|csv|tsv|json)$/i.test(f.name) ? null : await IMP.readDocument(buf, f.name);
          if (doc) {
            setBusy(false);
            if (doc.input.text != null) st.text = doc.input.text;
            if (await start(doc.input, `${f.name}（${doc.fmt}）`, true)) { s.render(); s.renderFoot(); s.body.scrollTop = 0; }
            return;
          }
          if (/\.(xlsx|xlsm|xls)$/i.test(f.name) || (new Uint8Array(buf)[0] === 0x50 && new Uint8Array(buf)[1] === 0x4b)) {
            const sheets2 = await IMP.xlsxRows(buf);
            const rows = []; for (const sh of sheets2) { if (rows.length && sh.rows.length && IMP.detectTable(sh.rows) && IMP.detectTable(rows)) rows.push(...sh.rows.slice(IMP.detectTable(sh.rows).headRow + 1)); else rows.push(...sh.rows, ['']); }
            setBusy(false); if (await start({ rows: rows.filter((r) => r.some((v) => String(v).trim())) }, f.name, true)) { s.render(); s.renderFoot(); s.body.scrollTop = 0; }
            return;
          }
          const text = IMP.decode(buf); setBusy(false);
          const tt = text.trim();
          if (tt.startsWith(TRANSFER_PREFIX) || tt.startsWith('{')) { s.close(); await handleImportFile(new File([text], f.name, { type: 'application/json' })); return; }
          st.text = text; if (await start({ text }, f.name, true)) { s.render(); s.renderFoot(); s.body.scrollTop = 0; }
        } catch (err) { console.error(err); setBusy(false); toast(err.message || '読み込みに失敗しました', 'error'); }
      },
      col: (el, e, s) => { const f = el.dataset.f; const v = Number(el.value); st.an.table.map[f] = v >= 0 ? v : undefined; if (v < 0) delete st.an.table.map[f]; st.mapEdited = true; st.showCols = true; reAnalyze(); s.render(); s.renderFoot(); },
      ovl: (el, e, s) => { st.skipOverlap = el.checked; s.render(); s.renderFoot(); }
    },
    actions: {
      pick: (el, e, s) => { const f = $('#impFile', s.body); if (f) f.click(); },
      example: (el, e, s) => { st.text = IMP_EXAMPLE; s.render(); },
      tpl: () => { downloadBlob(new Blob([IMP.templateCsv()], { type: 'text/csv' }), 'liftcanvas_import_template.csv'); toast('テンプレートを保存しました。Excelやスプレッドシートで開いて記入できます'); },
      paste: async (el, e, s) => {
        const t = st.text.trim(); if (!t) return;
        if (t.startsWith(TRANSFER_PREFIX) || (t.startsWith('{') && t.includes('"records"'))) { s.close(); await handleImportFile(new File([t], '貼り付け', { type: 'application/json' })); return; }
        if (await start({ text: st.text }, '貼り付けた文章')) { s.render(); s.renderFoot(); s.body.scrollTop = 0; }
      },
      lf: (el, e, s) => { st.lf = el.dataset.v; s.render(); },
      editLine: async (el, e, s) => {
        const n = Number(el.dataset.n); const arr = st.text.split(/\r?\n/); if (!(n >= 1 && n <= arr.length)) return;
        const v = await promptSheet({ title: `${n}行目を直す`, label: '空にすると、この行を取り込みません', value: arr[n - 1].trim(), ok: '読み直す', maxlength: 300 });
        if (v == null) return;
        arr[n - 1] = v; st.text = arr.join('\n'); st.input = { text: st.text };
        try { reAnalyze(); } catch (err) { console.error(err); toast('読み取りに失敗しました', 'error'); return; }
        s.render(); s.renderFoot();
      },
      back: (el, e, s) => { st.step = 'src'; s.render(); s.renderFoot(); s.body.scrollTop = 0; },
      unit: (el, e, s) => { st.unit = el.dataset.v; reAnalyze(); s.render(); s.renderFoot(); },
      nm: async (el, e, s) => {
        const n = st.an.names[Number(el.dataset.i)];
        const choices = n.cands.filter((id) => exMap().has(id)).map((id) => ({ key: 'id:' + id, label: getEx(id).name + (n.act === 'map' && n.id === id ? ' ✓' : ''), desc: `${getEx(id).part} ・ ${getEx(id).equipment}` }));
        choices.push({ key: 'pick', label: 'ほかの種目から選ぶ…' }, { key: 'new', label: `新しい種目として追加${n.act === 'new' ? ' ✓' : ''}`, desc: `「${n.src.slice(0, 40)}」を自分の種目に追加します` }, { key: 'skip', label: `取り込まない${n.act === 'skip' ? ' ✓' : ''}` });
        const k = await choiceSheet({ title: `「${n.src.slice(0, 30)}」をどの種目として取り込みますか？`, choices });
        if (!k) return;
        if (k.startsWith('id:')) { n.act = 'map'; n.id = k.slice(3); n.confirmed = true; }
        else if (k === 'skip') n.act = 'skip';
        else if (k === 'new') {
          const p = await choiceSheet({ title: '部位を選んでください', choices: CATEGORIES.map((c) => ({ key: c, label: c + (c === n.part ? ' ✓' : '') })) });
          if (!p) return; n.act = 'new'; n.part = p;
        } else if (k === 'pick') {
          pickExercises({ title: `「${n.src.slice(0, 20)}」に対応する種目`, onDone: (ids) => { if (ids && ids[0]) { n.act = 'map'; n.id = ids[0]; n.confirmed = true; if (!n.cands.includes(ids[0])) n.cands.unshift(ids[0]); } s.render(); s.renderFoot(); } });
          return;
        }
        s.render(); s.renderFoot();
      },
      commit: async (el, e, s) => {
        const b = preview(); if (!b.sets && !b.body.length) return;
        const again = (DB.imports || []).find((x) => x.id === b.batch);
        const older = sameFile().filter((x) => x.id !== b.batch);
        if (again) { const ok = await confirmSheet({ title: '同じ内容を以前に取り込んでいます', message: `<p>${esc(fmtDateTime(again.at))}の取り込みを、今回の内容で置き換えます（取り込み後に編集した内容は元に戻ります）。</p>`, ok: '置き換える' }); if (!ok) return; }
        else if (older.length) { const ok = await confirmSheet({ title: '同じファイルを以前に取り込んでいます', message: `<p>${esc(fmtDateTime(older[older.length - 1].at))}に取り込んだ「${esc(st.label)}」を、今回の内容で置き換えます（前回の取り込みは取り消されます）。</p>`, ok: '置き換える' }); if (!ok) return; }
        for (const x of older) IMP.removeBatch(x.id);
        IMP.commit(b, st.label);
        st.result = b; st.step = 'done'; refreshAll(); s.render(); s.renderFoot(); s.body.scrollTop = 0;
      },
      wlOn: (el, e, s) => { DB.settings.wl = true; touch(); refreshAll(); s.render(); toast('ウェイトリフティング機能をONにしました'); },
      doneClose: (el, e, s) => s.close(),
      goReview: (el, e, s) => { s.close(); setTab('review'); }
    }
  });
  function rank(n) { return n.act === 'map' && n.score < 0.85 && !n.confirmed ? 0 : n.act === 'new' ? 1 : n.act === 'skip' ? 3 : 2; }
}

/* ---------- インストール診断（うまくいかない時の原因確認） ---------- */
async function openPwaDiag() {
  const rows = [];
