  let man = null;
  try { const r = await fetch('lift-canvas.webmanifest', { cache: 'no-store' }); man = r.ok ? await r.json() : null; } catch (e) { man = null; }
  add('アプリ情報（manifest）を読み込める', !!man, man ? man.short_name : '取得できません');
  let iconOk = false; try { iconOk = (await fetch('lift-canvas-icon-512.png', { cache: 'no-store' })).ok; } catch (e) { /* noop */ }
  add('アイコンを読み込める', iconOk, '');
  let reg = null; try { reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(SW_SCOPE); } catch (e) { /* noop */ }
  add('オフライン機能（サービスワーカー）', !!(reg && reg.active), reg ? (reg.active ? '有効' : '準備中') : ('serviceWorker' in navigator ? '未登録' : '非対応のブラウザ'));
  add('このページを制御中', !!(navigator.serviceWorker && navigator.serviceWorker.controller), navigator.serviceWorker && navigator.serviceWorker.controller ? '' : '一度ページを再読み込みしてください');
  add('インストールボタンの準備', PWA.prompt || isStandalone() ? true : null, PWA.prompt ? 'あり（ボタンから追加できます）' : isStandalone() ? '追加済み' : 'まだ（メニューから追加してください）');
  add('アプリとして起動中', null, isStandalone() ? 'はい' : 'いいえ（ブラウザで表示中）');
  let persisted = null; try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (e) { /* noop */ }
  add('保存データの保護', null, persisted === true ? '保護されています' : '通常（ブラウザの判断で消える可能性あり）');
  add('バージョン', null, APP_VERSION);
  const text = rows.map((r) => `${r.ok == null ? '・' : r.ok ? '○' : '×'} ${r.label}：${r.detail}`).join('\n') + `\n${navigator.userAgent}`;
  openSheet({
    title: 'インストール診断',
    render: () => `<div class="list">${rows.map((r) => `<div class="li" style="min-height:52px"><span style="font-size:18px;width:22px;text-align:center;color:${r.ok == null ? 'var(--text-3)' : r.ok ? 'var(--ok)' : 'var(--danger)'}">${r.ok == null ? '・' : r.ok ? '○' : '×'}</span><div class="m"><div class="t" style="font-size:14.5px">${esc(r.label)}</div>${r.detail ? `<div class="s">${esc(r.detail)}</div>` : ''}</div></div>`).join('')}</div>
      <p class="hint">×がある場合は、ページを再読み込みしてからもう一度お試しください。それでも解決しない場合は、下のボタンで結果をコピーして提供者に送ってください。</p>`,
    foot: () => `<button type="button" class="btn" data-a="reload">再読み込み</button><button type="button" class="btn btn-primary" data-a="copy">${ICON.copy}結果をコピー</button>`,
    actions: {
      copy: async () => { try { await navigator.clipboard.writeText(text); toast('診断結果をコピーしました', 'ok'); } catch (e) { toast('コピーできませんでした'); } },
      reload: () => { saveNow(); location.reload(); }
    }
  });
}

/* ---------- iPhoneの引き継ぎコード ---------- */
function makeTransferCode() {
  const bytes = new TextEncoder().encode(JSON.stringify(buildExport()));
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return TRANSFER_PREFIX + btoa(bin);
}
function readTransferCode(text) {
  const t = String(text || '').replace(/\s+/g, '');
  const i = t.indexOf(TRANSFER_PREFIX);
  if (i < 0) throw new Error('引き継ぎコードが見つかりません（「LC1:」から始まる文字列を貼り付けてください）');
  const bin = atob(t.slice(i + TRANSFER_PREFIX.length));
  const bytes = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  return parseImport(new TextDecoder().decode(bytes));
}
async function copyTransferCode() {
  const code = makeTransferCode();
  let ok = false;
  try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { ok = false; }
  if (!ok) {
    openSheet({ title: '引き継ぎコード', render: () => `<p class="small">下のコードを長押しして「すべてを選択」→「コピー」してください。</p><textarea class="input" rows="6" readonly style="font-size:12px">${esc(code)}</textarea>`, foot: () => `<button type="button" class="btn btn-primary" data-a="__close">閉じる</button>` });
  } else toast('引き継ぎコードをコピーしました。ホーム画面のアプリで貼り付けてください', 'ok');
  DB.ui.pwaMoved = true; save();
  if (UI.tab === 'train') renderTab();
}
function openTransferPaste(first) {
  const st = { code: '' };
  openSheet({
    title: first ? 'Safariの記録を引き継ぎますか？' : '記録を引き継ぐ', state: st, dismissible: !first,
    render: () => `<p class="small" style="margin:0 0 10px">${first ? 'ホーム画面のアプリは、Safariとは別の場所に記録を保存します。' : ''}Safari版の「設定 → 引き継ぎコードをコピー」でコピーしたコードを貼り付けてください。</p>
      <textarea class="input" data-in="code" rows="5" placeholder="LC1:… から始まるコード" style="font-size:12px">${esc(st.code)}</textarea>
      <div style="height:10px"></div><button type="button" class="btn btn-line btn-block" data-a="paste">${ICON.copy}クリップボードから貼り付け</button>
      <div style="height:8px"></div><button type="button" class="btn btn-block" data-a="file">${ICON.upload}バックアップファイルから復元</button>`,
    foot: () => `<button type="button" class="btn" data-a="skip">${first ? '新しく始める' : 'キャンセル'}</button><button type="button" class="btn btn-primary" data-a="ok">引き継ぐ</button>`,
    inputs: { code: (el) => { st.code = el.value; } },
    actions: {
      paste: async (el, e, s) => { try { st.code = await navigator.clipboard.readText(); s.render(); } catch (err) { toast('貼り付けできませんでした。入力欄を長押しして「ペースト」してください'); } },
      file: (el, e, s) => { DB.ui.transferAsked = true; save(); s.close(); ACT.importOpen(); },
      skip: (el, e, s) => { DB.ui.transferAsked = true; save(); s.close(); if (!DB.ui.onboarded && !DB.active) setTimeout(() => { if (!sheets.length) openOnboarding(); }, 250); },
      ok: (el, e, s) => {
        let parsed; try { parsed = readTransferCode(st.code); } catch (err) { toast(err.message || 'コードを読み取れませんでした', 'error'); return; }
        DB.ui.transferAsked = true;
        s.close();
        if (hasRealData()) askImportMode(parsed, '引き継ぎコード'); else { applyImport(parsed.data, 'overwrite'); DB.ui.transferAsked = true; save(); }
      }
    }
  });
}

/* ---------- サービスワーカー・自動更新 ---------- */
function registerSW() {
  if (!('serviceWorker' in navigator) || !isHttp()) return;
  navigator.serviceWorker.register(SW_FILE, { scope: SW_SCOPE }).catch(() => { /* 非対応・プライベート等 */ });
}
function isBusy() {
  const a = document.activeElement;
  return sheets.length > 0 || !!UI.kp || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || (UI.wo && !$('#workout').hidden);
}
async function checkUpdate(force) {
  if (!isHttp() || !navigator.onLine) return;
  if (!force && Date.now() - PWA.lastCheck < 10 * 60e3) return;
  PWA.lastCheck = Date.now();
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/^const APP_VERSION = '(\d{4}\.\d{2}\.\d{2}\.\d+)'/m);
    if (!m || m[1] === APP_VERSION) return;
    PWA.updateReady = true;
    if (isBusy()) showUpdateBar(); else applyUpdate();
  } catch (e) { /* オフライン等 */ }
}
function showUpdateBar() {
  if ($('#updBar')) return;
  document.body.insertAdjacentHTML('beforeend', `<div id="updBar" class="upd-bar" role="status"><span>✨ 新しい版があります</span><button type="button" class="btn btn-sm btn-primary" data-a="pwaUpdate">更新する</button></div>`);
}
async function applyUpdate() {
  saveNow();
  try { sessionStorage.setItem('lc_updated', APP_VERSION); } catch (e) { /* noop */ }
  try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(SW_SCOPE); if (r) await r.update(); } catch (e) { /* noop */ }
  location.reload();
}
function pwaInit() {
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); PWA.prompt = e; if (UI.tab === 'train' || UI.tab === 'settings') renderTab(); });
  window.addEventListener('appinstalled', () => { PWA.prompt = null; DB.ui.pwaHide = true; save(); toast('ホーム画面に追加しました', 'ok'); renderTab(); });
  registerSW();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* noop */ }
  try { if (sessionStorage.getItem('lc_updated')) { sessionStorage.removeItem('lc_updated'); setTimeout(() => toast('✨ 最新版に更新しました', 'ok'), 400); } } catch (e) { /* noop */ }
  setTimeout(() => checkUpdate(true), 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); else if (PWA.updateReady && !isBusy()) { /* 次回表示時に更新 */ } });
  // iPhoneのホーム画面版を初めて開いたとき：引き継ぎを先に案内
  if (isIOS() && isStandalone() && !DB.ui.transferAsked && !hasRealData()) setTimeout(() => openTransferPaste(true), 300);
}
Object.assign(ACT, {
  pwaInstall: async () => {
    const p = PWA.prompt; if (!p) { openInstallGuide(); return; }
    try { p.prompt(); const r = await p.userChoice; PWA.prompt = null; if (r && r.outcome === 'accepted') { DB.ui.pwaHide = true; save(); } renderTab(); } catch (e) { openInstallGuide(); }
  },
  pwaGuide: () => openInstallGuide(),
  pwaDiag: () => openPwaDiag(),
  pwaLater: () => { PWA.sessionHide = true; renderTab(); toast('設定画面からいつでも追加できます'); },
  pwaNever: () => { DB.ui.pwaHide = true; save(); renderTab(); toast('案内を非表示にしました（設定画面からいつでも追加できます）'); },
  pwaSafariOnce: () => { PWA.safariOnce = true; renderTab(); },
  pwaCopyCode: () => copyTransferCode(),
  pwaCodeFile: () => { downloadBlob(new Blob([makeTransferCode()], { type: 'text/plain' }), 'liftcanvas_引き継ぎコード.txt'); DB.ui.pwaMoved = true; save(); toast('引き継ぎコードを保存しました'); },
  pwaPaste: () => openTransferPaste(false),
  pwaUpdate: () => applyUpdate()
});

/* =====================================================================
   イベント処理・起動
   ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const sc = scopeOf(el);
  const name = el.dataset.a;
  const fn = (sc && sc.actions && sc.actions[name]) || ACT[name];
  if (fn) fn(el, e, sc);
});
document.addEventListener('input', (e) => {
  const el = e.target; const name = el.dataset && el.dataset.in; if (!name) return;
  const sc = scopeOf(el);
  const fn = (sc && sc.inputs && sc.inputs[name]) || INP[name];
  if (fn) fn(el, e, sc);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'fileInput') { CHG.file(el, e); return; }
  const name = el.dataset && el.dataset.ch; if (!name) return;
  const sc = scopeOf(el);
  const fn = (sc && sc.changes && sc.changes[name]) || CHG[name];
  if (fn) fn(el, e, sc);
});
document.addEventListener('keydown', (e) => {
  if (UI.kp && !sheets.length && !(e.target.matches && e.target.matches('input,textarea'))) {
    const k = e.key;
    if (/^[0-9]$/.test(k)) { KP_ACT.k({ dataset: { v: k } }); e.preventDefault(); return; }
    if (k === '.' || k === ',') { KP_ACT.k({ dataset: { v: '.' } }); e.preventDefault(); return; }
    if (k === 'Backspace') { KP_ACT.kBs(); e.preventDefault(); return; }
    if (k === 'Enter' || k === 'Tab') { KP_ACT.kNext(); e.preventDefault(); return; }
    if (k === 'Escape') { closeKeypad(); return; }
    if (k === 'ArrowUp') { KP_ACT.kStep({ dataset: { d: '1' } }); e.preventDefault(); return; }
    if (k === 'ArrowDown') { KP_ACT.kStep({ dataset: { d: '-1' } }); e.preventDefault(); return; }
  }
  if (e.key === 'Escape') {
    if (sheets.length) sheets[sheets.length - 1].tryClose();
    else if (pages.length) { const p = pages[pages.length - 1]; p.actions.__back(); }
  }
});
/* テンキー以外をタップしたら閉じる */
document.addEventListener('pointerdown', (e) => {
  if (!UI.kp) return;
  if (e.target.closest('#keypad') || e.target.closest('#tour') || e.target.closest('.cell') || e.target.closest('.done-btn') || e.target.closest('.sheet-bg')) return;
  closeKeypad();
}, true);
window.addEventListener('pagehide', () => flushSave());
window.addEventListener('beforeunload', () => flushSave());
window.addEventListener('freeze', () => flushSave());
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); if (!document.hidden && DB) { if (DB.timer) Timer.tick(); tickClock(); } if (DB) Wake.sync(); });
window.addEventListener('online', () => { if (chartStatus === 'failed') { chartStatus = 'idle'; loadChartJs(); } });
window.addEventListener('storage', (e) => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try { clearTimeout(saveT); saveT = null; DB = normalize(JSON.parse(e.newValue)); invalidateEx(); refreshAll(); } catch (err) { /* noop */ }
});
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (DB.settings.theme === 'auto') { applyTheme(); refreshAll(); } }); } catch (e) { /* 古いブラウザ */ } }
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { $$('.svgc').forEach((s) => { const cv = s.parentElement.querySelector('canvas'); if (cv && cv._spec) svgChartInto(cv, cv._spec); }); }, 250); });

function init() {
  DB = load();
  document.body.insertAdjacentHTML('afterbegin', bodyDefs());
  applyTheme();
  invalidateEx();
  sanitizeRefs();
  cleanupDrafts();
  buildTabbar();
  const qTab = new URLSearchParams(location.search).get('tab');
  setTab(TABS.some((t) => t.key === qTab) ? qTab : 'train');
  Timer.resume();
  if (DB.active && !DB.active.minimized) openWorkout();
  renderMinibar();
  loadChartJs();
  pwaInit();
  setTimeout(() => { if (!DB.ui.onboarded && !DB.active && !sheets.length) { if (DB.ui.introDone) openOnboarding(); else startIntro(); } }, 450);
  if (Drive.clientId() && navigator.onLine && location.protocol !== 'file:') setTimeout(() => Drive.loadGis().catch(() => { /* 使う時に再試行 */ }), 1500);
  saveNow();
  if (!storageOK) toast('この環境ではデータを保存できません（プライベートモード等）', 'error');
}
init();
