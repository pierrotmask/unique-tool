<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F7F4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121614">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かけ算ごはん">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="stock-arrange-meal.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="stock-arrange-meal-icon-192.png">
<link rel="apple-touch-icon" href="stock-arrange-meal-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>かけ算ごはん｜下処理ストック×味付け 日替わり献立</title>
<style>
:root{
  --bg:#F8F7F4; --card:#FFFFFF; --green:#2E5A44; --green-l:#E6EFE9; --green-ll:#F1F6F2;
  --orange:#D96B27; --orange-d:#B9551A; --orange-l:#FBEDE3;
  --ink:#1F2A24; --sub:#56625B; --muted:#89928C; --line:#E9E5DD; --line2:#F1EEE8;
  --wa:#3B5BA9; --wa-l:#E7ECF8; --yo:#A8750A; --yo-l:#FBF0D6; --chu:#C0392B; --chu-l:#FBE4E1; --kan:#8E44AD; --kan-l:#F3E5F8; --eth:#0E7C7B; --eth-l:#DDF1F0;
  --ok:#2E7D4F; --ok-l:#E3F2E8; --soon:#B7791F; --soon-l:#FCF1DC; --over:#C0392B; --over-l:#FBE4E1;
  --radius:18px; --shadow:0 1px 2px rgba(31,42,36,.05),0 4px 14px rgba(31,42,36,.06);
  --nav-h:66px; --safe-b:env(safe-area-inset-bottom,0px);
  --hdr-bg:rgba(248,247,244,.94); --nav-bg:rgba(255,255,255,.97); --seg-bg:#EEEBE4; --sw-off:#CFCAC0; --handle:#D5CFC4; --box-line:#CBC4B7;
  --fz:#2C5F8A; --fz-l:#E3EEF8; --fr:#2B6E62; --fr-l:#E3F2EF; --pt:#7A5B2E; --pt-l:#F3EDE2; --info-ink:#7a3d12; --warn-ink:#7a4f0d;
  --hero1:#2E5A44; --hero2:#3C7258;
  color-scheme:light dark;
}
/* ダークモード（端末の設定に連動。PWAの上下のシステム領域も theme-color で黒系に揃える） */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --card:#1C2320; --ink:#E6ECE8; --sub:#B3BDB7; --muted:#88938C; --line:#2F3934; --line2:#252D29;
    --green:#5BA77E; --green-l:#203A2D; --green-ll:#19271F;
    --orange:#E07A3A; --orange-d:#F4A06A; --orange-l:#3A2617;
    --wa:#93ABEB; --wa-l:#1E2742; --yo:#E4B851; --yo-l:#372B12; --chu:#F2837A; --chu-l:#3D1E1B; --kan:#CB98E3; --kan-l:#2F1F39; --eth:#55C7C1; --eth-l:#123331;
    --ok:#73CF97; --ok-l:#173020; --soon:#E9B657; --soon-l:#33290F; --over:#F2877A; --over-l:#3B1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    --hdr-bg:rgba(18,22,20,.94); --nav-bg:rgba(24,30,27,.97); --seg-bg:#252D29; --sw-off:#3A4540; --handle:#3A4540; --box-line:#4A5650;
    --fz:#8EB9E2; --fz-l:#1B2B3B; --fr:#7CCBB9; --fr-l:#16302A; --pt:#DAB97F; --pt-l:#33291A; --info-ink:#F3CDAE; --warn-ink:#EDCB8C;
    --hero1:#24493A; --hero2:#2F6049;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
.wrap{max-width:560px;margin:0 auto}
/* header */
#hdr{position:sticky;top:0;z-index:30;background:var(--hdr-bg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line2)}
.hdr-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16px;letter-spacing:.02em;color:var(--green)}
.ttl small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppl{display:flex;align-items:center;gap:6px;flex:none}
.help{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--green);font-weight:800;font-size:17px;flex:none;display:grid;place-items:center}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:34px;height:32px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);padding:0 6px}
.seg button.on{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 人数ステッパー（1〜6人） */
.pstep{display:inline-flex;align-items:center;background:var(--seg-bg);border-radius:12px;padding:3px;gap:2px}
.pstep button{width:32px;height:32px;border-radius:9px;font-size:18px;font-weight:800;color:var(--green);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);display:grid;place-items:center;line-height:1}
.pstep button:disabled{opacity:.35;box-shadow:none;background:transparent}
.pstep b{min-width:44px;text-align:center;font-size:15px;font-weight:800;color:var(--green)}
.pstep b small{font-size:11px;font-weight:700;margin-left:1px}
.pstep.big button{width:44px;height:40px;font-size:22px}
.pstep.big b{min-width:62px;font-size:19px}
.pstep.dim b{color:var(--muted)}
/* main */
#main{max-width:560px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.sec-t h2{font-size:16px;margin:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec-t h2 .num{background:var(--green);color:#fff;font-size:11px;border-radius:99px;padding:1px 8px}
.sec-t small{color:var(--muted);font-size:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(46,90,68,.25);position:relative;overflow:hidden}
.hero:after{content:"×";position:absolute;right:-6px;top:-34px;font-size:150px;font-weight:900;opacity:.08;line-height:1}
.hero h1{font-size:18px;margin:0 0 4px}
.hero p{margin:0;font-size:12.5px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.13);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11px;opacity:.85}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:15px;font-weight:700;font-size:15px;padding:10px 14px;transition:transform .08s ease,filter .15s;text-align:center;line-height:1.35}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 4px 14px rgba(217,107,39,.32)}
.btn.primary:active{background:var(--orange-d)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(46,90,68,.25)}
.btn.outline{background:var(--card);color:var(--green);border:1.5px solid var(--green)}
.btn.soft{background:var(--green-l);color:var(--green)}
.btn.ghost{background:transparent;color:var(--sub);min-height:40px;font-weight:600;font-size:13px}
.btn.sm{min-height:40px;font-size:13.5px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn-col{display:grid;gap:10px;margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip .c{font-size:11px;opacity:.75}
/* stock rows */
.grp-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:none}
.srow.zero{opacity:.55}
.emo{width:44px;height:44px;border-radius:14px;background:var(--green-ll);display:grid;place-items:center;font-size:23px;flex:none}
.sinfo{flex:1;min-width:0}
.sinfo .nm{font-weight:700;font-size:15px;line-height:1.3}
.sinfo .un{font-size:11.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.st-freeze{background:var(--fz-l);color:var(--fz)}
.st-fridge{background:var(--fr-l);color:var(--fr)}
.st-pantry{background:var(--pt-l);color:var(--pt)}
.fr-ok{background:var(--ok-l);color:var(--ok)}
.fr-soon{background:var(--soon-l);color:var(--soon)}
.fr-today,.fr-over{background:var(--over-l);color:var(--over)}
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:14px;flex:none}
.stepper button{width:40px;height:44px;font-size:22px;font-weight:600;color:var(--green);display:grid;place-items:center}
.stepper button:active{background:var(--green-l);border-radius:14px}
.stepper .v{min-width:30px;text-align:center;font-weight:800;font-size:17px}
.stepper .v small{display:block;font-size:9px;color:var(--muted);font-weight:600;margin-top:-3px}
.del{width:40px;height:44px;color:var(--over);font-size:13px;font-weight:700;flex:none}
.empty{text-align:center;padding:30px 18px;color:var(--sub)}
.empty .big{font-size:44px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{margin:0 0 14px;font-size:13px}
.link{color:var(--sub);font-size:12.5px;text-decoration:underline;padding:10px;display:block;margin:10px auto 0}
/* genre */
.g{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.g-wa{background:var(--wa-l);color:var(--wa)} .g-yo{background:var(--yo-l);color:var(--yo)} .g-chu{background:var(--chu-l);color:var(--chu)} .g-kan{background:var(--kan-l);color:var(--kan)} .g-eth{background:var(--eth-l);color:var(--eth)}
.gb-wa{background:var(--wa)} .gb-yo{background:var(--yo)} .gb-chu{background:var(--chu)} .gb-kan{background:var(--kan)} .gb-eth{background:var(--eth)}
.typ{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--line2);padding:2px 8px;border-radius:7px}
.mth{font-size:11.5px;color:var(--muted);font-weight:600}
/* mode seg */
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--seg-bg);border-radius:15px;padding:4px;gap:4px;margin-bottom:14px}
.mode button{height:44px;border-radius:12px;font-weight:700;font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.mode button.on{background:var(--card);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* dish card */
.dish{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;position:relative;border-left:5px solid transparent}
.dish+.dish{margin-top:12px}
.dish.b-wa{border-left-color:var(--wa)} .dish.b-yo{border-left-color:var(--yo)} .dish.b-chu{border-left-color:var(--chu)} .dish.b-kan{border-left-color:var(--kan)} .dish.b-eth{border-left-color:var(--eth)}
.dish.done{opacity:.6}
.d-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.d-top .sp{flex:1}
.star{font-size:20px;line-height:1;color:var(--box-line);width:34px;height:30px;display:grid;place-items:center}
.star.on{color:#E8A317}
.d-name{display:block;text-align:left;width:100%;font-size:17px;font-weight:800;line-height:1.4;margin:8px 0 8px;color:var(--ink)}
.d-name:after{content:" ›";color:var(--muted);font-weight:600}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px}
.fp{display:inline-flex;align-items:center;gap:3px;background:var(--green-ll);color:var(--green);border-radius:8px;padding:3px 8px;font-weight:700}
.fp.base{background:var(--orange-l);color:var(--orange-d)}
.fp.miss{background:var(--card);border:1px dashed var(--box-line);color:var(--sub)}
.fp .s{font-size:10px;font-weight:700;opacity:.8}
.fx{color:var(--muted);font-weight:800;font-size:12px}
.d-act{margin-top:12px;display:flex;gap:8px}
.d-act .btn{min-height:44px;font-size:13.5px}
.warn{font-size:11.5px;color:var(--soon);margin-top:8px;font-weight:600}
.sub-dish{display:flex;align-items:center;gap:10px;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:10px}
.sub-dish .sdn{flex:1;min-width:0;text-align:left}
.sub-dish .sdn b{display:block;font-size:14.5px;line-height:1.4}
.sub-dish .sdn .d-top{margin-bottom:3px}
.swap{flex:none;height:36px;padding:0 10px;border-radius:10px;background:var(--bg);color:var(--green);font-size:12px;font-weight:700;white-space:nowrap}
.swap:active{background:var(--green-l)}
/* week */
.week-sum{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.wk-range{font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 10px}
.vcell{border-radius:10px;color:#fff;text-align:center;padding:5px 0 6px;font-weight:800}
.vcell small{display:block;font-size:10px;opacity:.85;font-weight:700}
.vcell span{font-size:15px}
.gcount{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.wk-meta{font-size:12px;color:var(--sub);margin-top:8px}
.day{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:0;overflow:hidden}
.day+.day{margin-top:12px}
.day-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--green-ll);font-weight:800;color:var(--green);font-size:14px}
.day-h .dot{width:10px;height:10px;border-radius:50%}
.day-b{padding:12px 14px 12px}
.day-main .d-name{font-size:16.5px;margin-top:6px}
.confirm-bar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);margin-top:16px;z-index:5}
.status{display:flex;align-items:center;gap:8px;background:var(--ok-l);color:var(--ok);font-weight:700;font-size:13px;border-radius:12px;padding:9px 12px;margin-bottom:12px}
.status.chg{background:var(--soon-l);color:var(--soon)}
/* fav / dict */
.switch-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--green-ll);border-radius:14px;margin-top:12px}
.switch-row .tx{flex:1;font-size:13px;font-weight:700;color:var(--green)}
.switch-row .tx small{display:block;font-weight:500;color:var(--sub);font-size:11.5px}
.sw{width:52px;height:30px;border-radius:99px;background:var(--sw-off);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--green)} .sw.on:after{left:25px}
.fav-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.fav-row:last-child{border-bottom:none}
.fav-row .fx2{flex:1;min-width:0;text-align:left}
.fav-row .fx2 b{display:block;font-size:14.5px;line-height:1.4;margin-top:3px}
.x{width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:18px;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pbtn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 6px 8px;text-align:center;position:relative;min-height:74px}
.pbtn .e{font-size:22px;display:block;line-height:1.2}
.pbtn .n{font-size:11.5px;font-weight:700;line-height:1.25;display:block;margin-top:3px}
.pbtn.on{border-color:var(--green);background:var(--green-ll)}
.pbtn .cnt{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.pbtn .cnt:empty{display:none}
.pbtn:active{transform:scale(.96)}
.gtab{display:flex;gap:6px;flex-wrap:wrap}
.bbtn{height:34px;padding:0 11px;border-radius:10px;font-size:12.5px;font-weight:700;border:1.5px solid transparent}
.bbtn.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.dict-row{padding:12px 14px;border-bottom:1px solid var(--line2)}
.dict-row:last-child{border-bottom:none}
.dict-row .dn{display:block;text-align:left;font-weight:800;font-size:14.5px;line-height:1.4;margin:5px 0 7px}
.mini{display:flex;flex-wrap:wrap;gap:5px}
.mini button{height:30px;padding:0 9px;border-radius:9px;background:var(--bg);font-size:12px;font-weight:600;color:var(--sub);border:1px solid var(--line)}
.mini button:active{background:var(--green-l)}
.mini .lbl{font-size:11px;color:var(--muted);align-self:center;margin-right:2px}
.info-box{background:var(--orange-l);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--info-ink)}
.info-box b{color:var(--orange-d)}
/* shop */
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step-n{background:var(--orange);color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:3px 9px;flex:none}
.step-h h3{margin:0;font-size:16px;flex:1}
.prog{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.sec-name{font-size:12px;font-weight:800;color:var(--green);margin:16px 0 4px;display:flex;align-items:center;gap:6px}
.chk{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.chk:last-child{border-bottom:none}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--box-line);flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;margin-top:1px;transition:all .15s}
.chk.on .box{background:var(--green);border-color:var(--green)}
.chk .ct{flex:1;min-width:0}
.chk .ct b{display:block;font-size:15px;line-height:1.4}
.chk .ct small{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.chk .ct p{margin:4px 0 0;font-size:13px;color:var(--sub);line-height:1.6}
.chk.on .ct b{text-decoration:line-through;color:var(--muted)}
.chk .amt{font-weight:800;color:var(--orange-d);white-space:nowrap;font-size:14px;flex:none;margin-top:1px}

function partGroups(cat){
  const pre=cat==='protein'?'p_':'v_', used=new Set();
  const gs=PART_GROUPS[cat].map(([label,ids])=>{ const list=ids.split(' ').map(x=>pre+x).filter(id=>PART[id]); list.forEach(id=>used.add(id)); return {label,ids:list}; });
  const rest=PARTS.filter(p=>p.category===cat&&!used.has(p.id)).map(p=>p.id); if(rest.length) gs.push({label:'その他',ids:rest});
  return gs.filter(g=>g.ids.length);
}

const wordsOf = v=>String(v||'').split(/\s+/).filter(Boolean);
function linkParts(b){
  [['pOnly','protein','p_'],['vOnly','veg','v_']].forEach(([k,cat,pre])=>{ const L=b[k]; if(!L.length) return;
    PARTS.forEach(p=>{ if(p.category!==cat || L.includes(p.id) || (!p.like&&!p.addTo) || wordsOf(p.notIn).includes(b.id)) return;
      if(wordsOf(p.addTo).includes(b.id) || wordsOf(p.like).some(x=>L.includes(pre+x))) L.push(p.id); }); });
}

function weightedPick(arr, scoreFn){
  const w = arr.map(x=>Math.exp(Math.max(-6,Math.min(6,scoreFn(x)))*0.7));
  let r = Math.random()*w.reduce((a,b)=>a+b,0);

  return arr[arr.length-1];
}

function frac(x){
  const w=Math.floor(x+1e-9); const f=Math.round((x-w)*4)/4;
  if(f>=1) return String(w+1);
  const fs={0.25:'1/4',0.5:'1/2',0.75:'3/4'}[f];
  if(!fs) return String(w);
  return w ? `${w}と${fs}` : fs;
}
function fmtSpoon(t){
  if(t<0.2) return '少々';
  if(t<3){ const r = t<1 ? Math.round(t*4)/4 : Math.round(t*2)/2; return '小さじ'+frac(r); }
  const r=Math.round(t*2)/2, tb=Math.floor(r/3), rem=r-tb*3;
  if(rem===0) return '大さじ'+tb;

}
function fmtSeason(s,n){

// 塩分は食材の重さに比例させる（黄金比の考え方）。味付けの分量は「元の32食材での平均的な重さ」を基準に設計しているので、
// 実際に使う食材が軽い・重いときは、塩分のもとになる調味料をその比率で増減する（汁物は水分基準なのでそのまま）
const ORIG_PARTS = ['p_mushidori','p_butakoma','p_momo','p_hikiniku','p_sake','p_shiromi','p_tofu','p_egg','p_tuna','p_saba','p_butabara','p_sasami','p_atsuage','p_ebi','v_ninjin','v_cabbage','v_tamanegi','v_broccoli','v_kinoko','v_horenso','v_komatsuna','v_nasu','v_jagaimo','v_piman','v_moyashi','v_negi','v_kabocha','v_hakusai','v_tomato','v_daikon','v_paprika','v_gobo'];
const REF_FOOD = {};
function refFood(b){
  if(REF_FOOD[b.id]) return REF_FOOD[b.id];

  const ps=orig.filter(q=>compat(b,q,'protein')), vs=orig.filter(q=>compat(b,q,'veg'));
  return (REF_FOOD[b.id]=(b.requiredCategories.protein[0]>=1?avg(ps):avg(ps)*0.3)+avg(vs)*(b.requiredCategories.veg[1]>=2?1.45:1)||0);
}
const dishFood = d=>dishParts(d).reduce((a,id)=>a+(PART[id].edible||PART[id].grams),0);   // 骨付きは食べられる部分の重さで
const scalesWithFood = s=>s.k!=='oil'&&(s.tsp!=null||s.g!=null)&&(s.k!=='x'||/^(塩昆布|塩|醤油|味噌)/.test(s.n));   // 水・だし・とろみ等は増減しない（塩昆布など塩気のあるトッピングは増減する）
function seasonFactor(d){
  const b=d&&BASE[d.baseId]; if(!b||b.custom||b.dishType==='汁物') return 1;
  const ref=refFood(b); if(!ref) return 1;
  const food=dishFood(d);
  return Math.min(1.5,Math.max(0.3,Math.round(food/ref*20)/20));
}
function goldenRatio(b){

  if(it.length<2) return '';

/* ---------- stock helpers ---------- */
function lifeDays(p,st){
  if(st===p.storageType) return p.shelfLifeDays;
  if(st==='fridge') return p.fridgeDays||3;
  if(st==='freeze') return p.freezeDays||21;
  return p.storageType==='pantry' ? p.shelfLifeDays : (p.fridgeDays||3);
}
function freshness(b){
  const p=PART[b.partId], life=lifeDays(p,b.storage), el=daysSince(b.addedAt), rem=life-el;
  let cls='ok', txt=`あと${rem}日`;
  if(rem<0){cls='over';txt='消費目安超過';}
  else if(rem===0){cls='today';txt='今日中に';}
  else if(rem<=2){cls='soon';txt=`あと${rem}日・早めに`;}
  return {cls,txt,rem,el,life};
}
const stockCount = id=>S.stock.filter(b=>b.partId===id).reduce((a,b)=>a+b.count,0);
function stockMap(){ const m={}; S.stock.forEach(b=>{m[b.partId]=(m[b.partId]||0)+b.count;}); return m; }
function minRemain(id){ const r=S.stock.filter(b=>b.partId===id&&b.count>0).map(b=>freshness(b).rem); return r.length?Math.min(...r):99; }
function addStock(partId,n,storage,date){
  const st=storage||PART[partId].storageType, d=date||todayStr();
  const ex=S.stock.find(b=>b.partId===partId&&b.addedAt===d&&b.storage===st);
  if(ex) ex.count+=n; else S.stock.push({uid:uid(),partId,count:n,storage:st,addedAt:d});
}
function consumeStock(partId,n){
  let need=n;
  const bs=S.stock.filter(b=>b.partId===partId&&b.count>0).sort((a,b)=>a.addedAt<b.addedAt?-1:1);
  for(const b of bs){ const t=Math.min(b.count,need); b.count-=t; need-=t; if(need<=0) break; }
  S.stock=S.stock.filter(b=>b.count>0);

}
function stockPool(){
  const m=stockMap(), ids=Object.keys(m).filter(id=>m[id]>0&&PART[id]);

}

/* =====================================================================
   6. パーツ × 味付けの掛け算エンジン
   ===================================================================== */
function compat(b,p,role){
  if(!p.compatibleTags.includes(b.genre)) return false;
  if(role==='protein'){
    if(p.category!=='protein') return false;
    if(b.requiredCategories.proteinReady && !p.ready) return false;
    return !b.pOnly.length || b.pOnly.includes(p.id);
  }
  if(p.category!=='veg') return false;
  return !b.vOnly.length || b.vOnly.includes(p.id);
}
function makeDish(b,p,vs){
  return { key:`${b.id}|${p||'-'}|${[...vs].sort().join('+')}`, baseId:b.id, p:p||null, v:[...vs], type:b.dishType, genre:b.genre };
}
const dishParts = d=>(d.p?[d.p]:[]).concat(d.extraP||[],d.v||[]);
function dishName(d){
  if(d.rid) return RECIPE[d.rid]?RECIPE[d.rid].name:'（定番レシピ）';
  const b=BASE[d.baseId]; const vn=d.v.map(id=>PART[id].short);
  const head = d.p ? `${PART[d.p].short}と${vn.join('・')}` : vn.join('と');
  return `${head}の${b.suffix}`;
}
function pickVegs(b,pool,k,sf,avoid){
  const cand=pool.filter(id=>compat(b,PART[id],'veg'));
  const chosen=[];
  for(let i=0;i<k;i++){
    const c=cand.filter(id=>!chosen.includes(id)&&!chosen.some(x=>PART[x].group===PART[id].group));
    if(!c.length) break;
    chosen.push(weightedPick(c,id=>sf(id)-(avoid&&avoid.includes(id)?2:0)));
  }
  return chosen;
}
function randomCombo(b,o){
  const rc=b.requiredCategories;
  const pc=o.pool.protein.filter(id=>compat(b,PART[id],'protein'));
  let p=null;
  if(rc.protein[0]>=1){ if(!pc.length) return null; p=weightedPick(pc,o.partScore); }
  else if(rc.protein[1]>=1 && pc.length && Math.random()<(o.sideProteinRate??ARRANGE_RULES.sideProteinRate)) p=weightedPick(pc,o.partScore);
  const k = rc.veg[1]>=2 && Math.random()<(b.twoVeg??0.35) ? 2 : rc.veg[0];
  let vs=pickVegs(b,o.pool.veg,k,o.partScore,o.avoidVeg);
  if(vs.length<rc.veg[0]) return null;
  return makeDish(b,p,vs);
}
function favKeySet(){ return new Set(S.favorites.map(f=>f.key)); }
function scoreDish(d,o,favs){
  let s=Math.random()*1.4;
  dishParts(d).forEach(id=>{ s+=o.partScore(id)*0.5; });
  if(o.genreCount) s-=(o.genreCount[d.genre]||0)*1.3;
  if(o.genreCount && (o.genreCount[d.genre]||0)>=ARRANGE_RULES.maxSameGenrePerWeek) s-=2;
  if(o.baseCount) s-=(o.baseCount[d.baseId]||0)*2;
  if(o.nearBases && o.nearBases.has(d.baseId)) s-=4;   // 前日・前々日に食べた味付けは、条件をゆるめたときも選ばれにくく
  if(o.softKeys && o.softKeys.has(d.key)) s-=3;
  if(o.avoidVeg) s-=d.v.filter(x=>o.avoidVeg.includes(x)).length*1.2;
  if(S.favPriority && favs.has(d.key)) s+=ARRANGE_RULES.favoriteBonus;
  if(BASE[d.baseId].gochiso){ s+= o.preferGochiso ? 3 : 0; if(S.weekendMode!=='both') s-=(o.gochisoCount||0)*2.5; }
  return s;
}
function dishAllowed(d,h){
  if(h.genres && h.genres.has(d.genre)) return false;
  if(h.bases && h.bases.has(d.baseId)) return false;
  if(h.keys && h.keys.has(d.key)) return false;
  if(h.bp && h.bp.has(d.baseId+'|'+d.p)) return false;
  if(h.must && h.must.has(d.key)) return false;
  return true;
}
function searchDish(o,h){
  const favs=favKeySet();
  let best=null, bestS=-1e9;
  for(const b of shuffle(BASES.filter(x=>x.dishType===o.type&&!(o.noGochiso&&x.gochiso)&&!(o.onlyGochiso&&!x.gochiso)))){
    if(h.genres && h.genres.has(b.genre)) continue;
    if(h.bases && h.bases.has(b.id)) continue;
    for(let t=0;t<3;t++){
      const d=randomCombo(b,o); if(!d) break;
      if(!dishAllowed(d,h)) continue;
      const s=scoreDish(d,o,favs);
      if(s>bestS){best=d;bestS=s;}
    }
  }
  // お気に入り優先採用：条件を満たすお気に入りを候補に追加
  if(S.favPriority){
    const inPool=new Set([...o.pool.protein,...o.pool.veg]);
    S.favorites.forEach(f=>{
      const b=BASE[f.baseId]; if(!b||b.dishType!==o.type||!BASES.includes(b)||(o.noGochiso&&b.gochiso)||(o.onlyGochiso&&!b.gochiso)) return;   // OFFのジャンル・器具、対象外のごちそうは採用しない
      const d=makeDish(b,f.p,f.v);
      if(!dishParts(d).every(id=>inPool.has(id))) return;
      if(!dishAllowed(d,h)) return;
      const s=scoreDish(d,o,favs)+0.5;
      if(s>bestS){best=d;bestS=s;}
    });

}
// 週末をごちそうにするか（設定：quick=時短のみ / sun=日曜だけ / both=土日）
function gochisoDay(dateStr){ const w=parseYmd(dateStr).getDay(); const m=S.weekendMode||'quick'; return m==='both'?(w===0||w===6):m==='sun'?w===0:false; }
function generateDish(o){
  const h=o.hard||{};
  const tiers=[h, {keys:h.keys,must:h.must,genres:h.genres}, {must:h.must,keys:h.keys}, {must:h.must}];
  for(const t of tiers){ const d=searchDish(o,t); if(d) return d; }
  return null;

/* ---------- モードA：今あるストックから今日のアレンジ提案 ---------- */
function modeAScore(used){
  return id=>{
    const c=stockCount(id); let s=c>=S.people?1.5:0.3;
    const r=minRemain(id); if(r<=1) s+=2; else if(r<=3) s+=1;   // 期限が近いものを優先
    s-=(used[id]||0)*(PART[id].category==='protein'?1.6:0.6);
    return s;
  };
}
function swapSuggestion(i){
  const cur=S.suggestions[i]; if(!cur) return false;
  const others=S.suggestions.filter((_,k)=>k!==i), used={};
  others.forEach(d=>dishParts(d).forEach(id=>used[id]=(used[id]||0)+1));
  const d=generateDish({ type:cur.type, pool:stockPool(), partScore:modeAScore(used), avoidVeg:others.flatMap(x=>x.v), sideProteinRate:0.3,
    hard:{ genres: cur.type==='主菜'?new Set(others.filter(x=>x.type==='主菜').map(x=>x.genre)):null,
      bases:new Set([cur.baseId,...others.map(x=>x.baseId)]), keys:new Set(S.seenKeys), must:new Set(S.suggestions.map(x=>x.key)) } });
  if(!d) return false;
  S.suggestions[i]=d; S.seenKeys=[d.key,...S.seenKeys].slice(0,150); return true;
}
function makeSuggestions(){
  const pool=stockPool();
  if(!pool.veg.length && !pool.protein.length){ S.suggestions=[]; return; }
  const seen=new Set(S.seenKeys), cookedKeys=new Set(S.cooked.slice(0,10).map(c=>c.key));
  const res=[], used={}, genreCount={}, baseCount={};
  const partScore=modeAScore(used);
  const slots=[];
  if(pool.protein.length) slots.push('主菜','主菜','主菜');
  if(pool.veg.length){ slots.push('副菜'); slots.push(Math.random()<0.5?'汁物':'副菜'); if(!pool.protein.length) slots.push('副菜','汁物'); }
  for(const type of slots){
    const must=new Set(res.map(d=>d.key));
    const mainGenres=new Set(res.filter(d=>d.type==='主菜').map(d=>d.genre));
    const d=generateDish({ type, pool, partScore, genreCount, baseCount, softKeys:cookedKeys, noGochiso:!gochisoDay(todayStr()), preferGochiso:gochisoDay(todayStr()),
      avoidVeg: res.flatMap(x=>x.v), sideProteinRate:0.3,
      hard:{ genres: type==='主菜'?mainGenres:null, bases:new Set(res.map(x=>x.baseId)), keys:seen, must } });
    if(!d) continue;
    res.push(d); genreCount[d.genre]=(genreCount[d.genre]||0)+1; baseCount[d.baseId]=(baseCount[d.baseId]||0)+1;
    dishParts(d).forEach(id=>used[id]=(used[id]||0)+1);
  }
  S.suggestions=res;
  S.seenKeys=[...res.map(d=>d.key),...S.seenKeys].slice(0,150);

/* ---------- モードB：1週間の日替わり献立 ---------- */
function selectCore(stockIds, avoidParts){
  const pick=(cat,target,maxStock)=>{
    const stocked=stockIds.filter(id=>PART[id].category===cat).sort((a,b)=>stockCount(b)-stockCount(a)).slice(0,maxStock);
    const out=[...stocked];
    let others=shuffle(PARTS.filter(p=>p.category===cat&&!out.includes(p.id)).map(p=>p.id));
    if(avoidParts) others.sort((a,b)=>(avoidParts[a]||0)-(avoidParts[b]||0));
    while(out.length<target && others.length){
      // 野菜は系統（group）がばらけるように補充
      let idx=0;
      if(cat==='veg'){ const gs=new Set(out.map(x=>PART[x].group)); const j=others.findIndex(x=>!gs.has(PART[x].group)); if(j>=0) idx=j; }
      out.push(others.splice(idx,1)[0]);
    }
    return out;
  };
  const pT=ARRANGE_RULES.coreProteins+(Math.random()<0.5?1:0), vT=ARRANGE_RULES.coreVegs+(Math.random()<0.5?1:0);
  return { protein:pick('protein',pT,6), veg:pick('veg',vT,8) };
}
// 献立の開始日（土日休みを基本に「月曜から」。シフト制などは「今日から」「明日から」も選べ、選んだものを次回も使う）
function planStartDate(){ const t=todayStr(); return S.planStart==='today'?t : S.planStart==='tmr'?addDays(t,1) : upcomingMonday(); }
const daysBetween = (a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
// 最近実際に食べたもの（作った記録＋献立表の過去の日）。組み直し・新規作成で「近日と同じ」を避けるのに使う
function recentEaten(start){
  const lo=addDays(start,-3), byDate={}, keys=new Set();
  const add=(date,o)=>{ if(date<lo||date>=start) return; const e=byDate[date]||(byDate[date]={date,bases:[],parts:[],mainGenre:null});
    if(o.baseId){ e.bases.push(o.baseId); if(o.type==='主菜'&&!e.mainGenre) e.mainGenre=o.genre; }
    if(o.mainPart) e.parts.push(o.mainPart); if(o.key) keys.add(o.key); };
  (S.cooked||[]).forEach(c=>{ if(!c||!c.at) return; const date=ymd(new Date(c.at)), k=String(c.key||''), [bid,pp]=k.split('|');
    if(BASE[bid]) add(date,{baseId:bid,type:BASE[bid].dishType,genre:BASE[bid].genre,mainPart:BASE[bid].dishType==='主菜'&&pp&&pp!=='-'?pp:null,key:k});
    else if(Array.isArray(c.parts)) c.parts.filter(id=>PART[id]&&PART[id].category==='protein').forEach(id=>add(date,{mainPart:id})); });
  const seen=new Set();
  [S.draft,activePlan()].forEach(pl=>{ if(!pl||seen.has(pl.id)) return; seen.add(pl.id);
    pl.days.forEach(d=>{ if(d.shifted) return; d.dishes.forEach(x=>add(d.date,{baseId:x.baseId,type:x.type,genre:x.genre,mainPart:x.type==='主菜'?x.p:null,key:x.key})); }); });
  return { eaten:Object.values(byDate), keys };
}
// 指定日から count 日分の献立を組む（新規作成・組み直しで共通）
function generateDays(o){
  const people=o.people, virtual=stockMap(), usage={}, weekKeys=new Set(), genreCount={}, baseCount={};
  const prevDays=o.prevDays||[], days=[], rc=o.recent||{eaten:[],keys:new Set()};
  const apply=(d,isMain,consume)=>{
    weekKeys.add(d.key); baseCount[d.baseId]=(baseCount[d.baseId]||0)+1;
    if(isMain) genreCount[d.genre]=(genreCount[d.genre]||0)+1;
    dishParts(d).forEach(id=>{ usage[id]=(usage[id]||0)+1; if(consume) virtual[id]=(virtual[id]||0)-people; });
  };
  prevDays.forEach(d=>d.dishes.forEach((x,j)=>apply(x,j===0,false)));
  for(let i=0;i<o.count;i++){
    const date=addDays(o.start,i);
    const prev=i>0?days[i-1]:prevDays[prevDays.length-1], prevMain=prev&&prev.dishes.find(x=>x.type==='主菜');
    const prevBases=new Set(prev?prev.dishes.map(x=>x.baseId):[]);
    // 前日・前々日に実際に食べた味付け、前日の主菜のタンパク質・ジャンルは避ける（近日と違う食事に）
    const nearBases=new Set(prevBases), nearParts=new Set(prevMain&&prevMain.p?[prevMain.p]:[]), nearGenres=new Set(prevMain?[prevMain.genre]:[]);
    rc.eaten.forEach(e=>{ const ago=daysBetween(e.date,date); if(ago>=1&&ago<=2) e.bases.forEach(b=>nearBases.add(b)); if(ago===1){ e.parts.forEach(x=>nearParts.add(x)); if(e.mainGenre) nearGenres.add(e.mainGenre); } });
    const partScore=id=>{
      let s=0; const vv=virtual[id]||0;
      if(vv>=people) s+=ARRANGE_RULES.stockBonus; else if(vv>0) s+=1; else if(o.replan) s-=1.2;   // 組み直しは手持ちのストックを優先
      const u=usage[id]||0;
      if(PART[id].category==='veg') s+=Math.min(u,2)*0.4-(u>=4?1:0);
      else s+= u>=2 ? -(u-1)*1.2 : 0.3*u;
      if(nearParts.has(id)) s-=2.5;
      if(o.different && o.lastParts[id]) s-=0.4;
      return s;
    };
    const keys=new Set([...(o.different?o.histKeys:[]), ...rc.keys]);
    const hard={ genres: nearGenres.size?nearGenres:null, bases:nearBases, must:weekKeys, keys: keys.size?keys:null, bp: o.different?o.histBP:null };
    const main=generateDish({ type:'主菜', pool:o.core, partScore, genreCount, baseCount, nearBases, softKeys:o.histKeys, hard, noGochiso:!gochisoDay(date), preferGochiso:gochisoDay(date), gochisoCount:days.filter(d=>isGochisoDish(d.dishes[0])).length });
    const dishes=[];
    if(main){ dishes.push(main); apply(main,true,true); }
    const types = sideTypes();
    for(const type of types){
      const today=new Set(dishes.map(x=>x.baseId));
      const d=generateDish({ type, pool:o.core, partScore, baseCount, nearBases, softKeys:o.histKeys, avoidVeg:dishes.flatMap(x=>x.v),
        hard:{ bases:new Set([...nearBases,...today]), must:new Set([...weekKeys]), keys: keys.size?keys:null, bp: o.different?o.histBP:null } });
      if(d){ dishes.push(d); apply(d,false,true); }
    }
    days.push({ date, dishes });
  }
  return days;
}
// 1日の品数（設定）：主菜のほかに作る料理。どの設定でも副菜は必ず1品入れる（汁物だけの日を作らない）
const DISH_SETS = { auto:{label:'おまかせ', desc:'主菜＋副菜（日によって汁物も）'}, side:{label:'主菜＋副菜', desc:'主菜＋副菜'}, soup:{label:'一汁二菜', desc:'主菜＋副菜＋汁物'}, full:{label:'一汁三菜', desc:'主菜＋副菜2品＋汁物'} };
function sideTypes(){

  if(m==='side') return ['副菜'];
  if(m==='soup') return ['副菜','汁物'];
  if(m==='full') return ['副菜','副菜','汁物'];

}
const TYPE_ORDER = { '主菜':0, '副菜':1, '汁物':2 };
// 献立の1日に1品追加（同じ日・前後の日と味付けが重ならないように）
function addDishToDay(plan,di,type){
  const day=plan.days[di]; if(!day) return null;
  const prev=plan.days[di-1], next=plan.days[di+1];
  const bases=new Set(); [prev,next,day].forEach(d=>d&&d.dishes.forEach(x=>bases.add(x.baseId)));
  const must=new Set(); plan.days.forEach(d=>d.dishes.forEach(x=>must.add(x.key)));
  const sp0=stockPool(), core=plan.core||{protein:[],veg:[]};
  let pool={ protein:[...new Set([...core.protein,...sp0.protein])], veg:[...new Set([...core.veg,...sp0.veg])] };
  if(pool.veg.length<3){ const c2=selectCore([...sp0.protein,...sp0.veg],null); pool={ protein:[...new Set([...pool.protein,...c2.protein])], veg:[...new Set([...pool.veg,...c2.veg])] }; }
  const usage={}; plan.days.forEach(d=>d.dishes.forEach(x=>dishParts(x).forEach(id=>usage[id]=(usage[id]||0)+1)));
  const sm=stockMap();
  const partScore=id=>{ let sc=(sm[id]||0)>=plan.people?1.5:0; sc+=PART[id].category==='veg'?Math.min(usage[id]||0,2)*0.3:0; return sc; };
  const d=generateDish({ type, pool, partScore, avoidVeg:day.dishes.flatMap(x=>x.v), sideProteinRate:0.25, hard:{ bases, must } });
  if(!d) return null;
  day.dishes.push(d);
  day.dishes.sort((a,b)=>(TYPE_ORDER[a.type]??1)-(TYPE_ORDER[b.type]??1));
  return d;
}
// 設定した品数に足りない日へ、副菜・汁物を足す（今日以降・まだ作っていない日。多い分は消さない）
function fillDishSet(plan){
  const t=todayStr(); let added=0;
  const need=S.dishSet==='full'?{'副菜':2,'汁物':1}:S.dishSet==='soup'?{'副菜':1,'汁物':1}:{'副菜':1,'汁物':0};
  plan.days.forEach((d,di)=>{ if(d.date<t||d.shifted||!d.dishes.length||d.dishes.every(x=>x.done)) return;
    ['副菜','汁物'].forEach(type=>{ let have=d.dishes.filter(x=>x.type===type).length; while(have<need[type]){ if(!addDishToDay(plan,di,type)) break; have++; added++; } }); });
  return added;
}
function generateWeek(different){
  const people=S.people, last=S.history[0];
  const histKeys=new Set(), histBP=new Set(), lastParts={};
  if(last) last.days.forEach(day=>day.dishes.forEach(d=>{ histKeys.add(d.key); histBP.add(d.baseId+'|'+d.p); dishParts(d).forEach(id=>lastParts[id]=(lastParts[id]||0)+1); }));
  const pool0=stockPool();
  const core=selectCore([...pool0.protein,...pool0.veg], different?lastParts:null);
  let start=planStartDate();
  if(different && last && last.weekStart>=start) start=addDays(last.weekStart,7);
  const days=generateDays({ start, count:7, people, core, different:!!different, histKeys, histBP, lastParts, recent:recentEaten(start) });
  return { id:uid(), weekStart:start, people, core, days, createdAt:Date.now(), different:!!different, confirmed:false };
}
// ---------- 週の途中の変更（作った・ずらす・組み直し） ----------
const planCopies = id=>[S.draft,...S.history].filter(p=>p&&p.id===id);
// 今日を含む献立（作成中の献立を優先、なければ確定済みの献立）
function curPlan(){
  const t=todayStr(), covers=p=>p&&p.days&&p.days.length&&p.days[0].date<=t&&p.days[p.days.length-1].date>=t;
  if(covers(S.draft)) return S.draft; const a=activePlan(); return covers(a)?a:null;
}
// 同じ献立の別コピー（作成中と確定済み）にも変更を反映する
function syncPlan(src){ planCopies(src.id).forEach(p=>{ if(p!==src){ p.days=JSON.parse(JSON.stringify(src.days)); p.core=src.core; p.replannedAt=src.replannedAt; p.replanLack=src.replanLack; } }); }
const lackSig = p=>planShortage(p).map(x=>x.id+':'+x.lack).sort().join(',');
// 組み直した後に、ストックがさらに変わっていなければ「組み直し済み」（不足分は買い足しで対応）
const lackAccepted = p=>!!p.replanLack && p.replanLack===lackSig(p);
function forPlanDish(ref,fn){ const [,id,di,j]=ref.split(':'); planCopies(id).forEach(pl=>{ const x=pl.days[+di]&&pl.days[+di].dishes[+j]; if(x) fn(x); }); }
// これからの日（今日以降で、まだ作っていない日）に必要な量と、今のストックとの差
function planShortage(p){
  const t=todayStr(), need={};
  p.days.forEach(d=>{ if(d.date<t) return; d.dishes.forEach(x=>{ if(!x.done) dishParts(x).forEach(id=>need[id]=(need[id]||0)+p.people); }); });
  const sm=stockMap();
  return Object.keys(need).filter(id=>need[id]>(sm[id]||0)).map(id=>({ id, need:need[id], have:sm[id]||0, lack:need[id]-(sm[id]||0) }));
}
// 不足の警告を出すか（買い物前の献立では出さない：まだ買っていないだけなので）
function shortageMatters(p){ const a=planCopies(p.id).find(x=>x.prepDone); return !!a || p.days[0].date<todayStr(); }   // 仕込み登録後か、献立の2日目以降
// 今日以降を、今のストックで組み直す（作った日・過去の日はそのまま。最近食べた料理と違うものに）
function replanPlan(p){
  const t=todayStr();
  let k=p.days.findIndex(d=>d.date>=t);
  if(k<0) return 0;
  if(p.days[k].dishes.some(x=>x.done)) k++;
  if(k>=p.days.length) return 0;
  const prevDays=p.days.slice(0,k);
  const sp=stockPool(), core0=p.core||{protein:[],veg:[]};
  const core={ protein:[...new Set([...sp.protein,...core0.protein])], veg:[...new Set([...sp.veg,...core0.veg])] };
  if(!core.protein.length||core.veg.length<2){ const c2=selectCore([...sp.protein,...sp.veg],null); core.protein=[...new Set([...core.protein,...c2.protein])]; core.veg=[...new Set([...core.veg,...c2.veg])]; }
  const start=p.days[k].date;
  const histKeys=new Set(); (S.history[0]&&S.history[0].id!==p.id?S.history[0].days:[]).forEach(d=>d.dishes.forEach(x=>histKeys.add(x.key)));
  const nd=generateDays({ start, count:p.days.length-k, people:p.people, core, prevDays, histKeys, histBP:new Set(), lastParts:{}, recent:recentEaten(start), replan:true });
  p.days=prevDays.concat(nd); p.core=core; p.replannedAt=Date.now();
  p.replanLack=lackSig(p);   // 組み直してもストックだけでは足りない分（買い足しが必要）
  syncPlan(p);
  return nd.length;
}
// 今日の分を作らなかった：今日以降の料理を1日ずつ後ろへ（最終日の分は献立から外れ、ストックは残る）
function shiftPlan(p,di){
  const last=p.days.length-1; if(di<0||di>last) return null;
  const dropped=p.days[last].dishes;
  for(let i=last;i>di;i--) p.days[i].dishes=p.days[i-1].dishes;
  p.days[di].dishes=[]; p.days[di].shifted=true;
  syncPlan(p);
  return dropped;
}
function swapDish(di,j,force){ return swapDishIn(S.draft,di,j,force); }

/* =====================================================================
   7. 調理手順の自動合成
   ===================================================================== */
const jn = arr=>arr.map(x=>x.short).join('・');
function prepText(b,all,people){
  if(b.method==='和えるだけ'){
    const raw=b.rawOk||[];
    const heat=all.filter(x=>!x.ready&&!raw.includes(x.id));
    const thaw=all.filter(x=>x.ready&&x.storageType==='freeze');
    const out=[];
    if(heat.length){ const m=Math.min(2+(people-1)+(heat.some(x=>x.storageType==='freeze')?1:0),6); out.push(hasEq('microwave') ? `${jn(heat)}は耐熱容器に入れてふんわりラップし、レンジ600Wで${m}分加熱して粗熱を取る`
      : hasEq('pot') ? `小鍋に湯を沸かして${jn(heat)}を1〜2分茹で、ザルに上げて粗熱を取る`
      : `フライパンに${jn(heat)}と水大さじ2を入れ、ふたをして中火で2〜3分蒸し焼きにして粗熱を取る`); }
    if(thaw.length) out.push(hasEq('microwave') ? `冷凍の${jn(thaw)}はレンジ600Wで1分ずつ様子を見ながら解凍し、水気をしっかり絞る`
      : `冷凍の${jn(thaw)}は前の晩に冷蔵庫へ移して自然解凍（急ぐときは保存袋ごと流水で解凍）し、水気をしっかり絞る`);
    return out.length ? out.join('。')+'。' : '';
  }
  const fr=all.filter(x=>x.storageType==='freeze');
  return fr.length ? `冷凍ストック（${jn(fr)}）は解凍不要。凍ったまま使えます。` : '';
}
function buildSteps(d,people){
  const b=BASE[d.baseId], p=d.p?PART[d.p]:null, vs=d.v.map(id=>PART[id]), all=(p?[p]:[]).concat(vs);
  const V=jn(vs), ALL=jn(all), P=p?p.short:'';
  const mw=(b.mwBase||2)+(p&&!p.ready?(b.mwRaw||0):0)+Math.min(people-1,4);
  const raw=p&&!p.ready, big=people>2;
  const tok={ OVEN:12+(raw?3:0)+(big?3:0), STEAM:8+(raw?2:0)+(big?2:0), AF:12+(big?3:0), GRILL:7+(raw?1:0)+(big?1:0),
    BAKE: hasEq('toaster') ? 'トースター（1000W）で5〜6分' : 'オーブン（230℃に予熱）で8〜10分' };
  const fry = !p ? `${V}を入れて2〜3分炒める`
    : p.ready ? `${V}を入れて2〜3分炒め、火が通ったら${p.fry}`
    : `${p.fry}。続けて${V}を加え、2〜3分炒め合わせる`;
  const sim = !p ? `${V}を入れ、ふたをして3〜4分、やわらかくなるまで煮る`
    : p.ready ? `${V}を入れてふたをし3〜4分煮て、やわらかくなったら${p.simmer}`
    : `${p.simmer}。${V}も加え、ふたをして3〜4分、野菜がやわらかくなるまで煮る`;
  const prep=prepText(b,all,people);
  const steps=b.finishSteps.map(t=>{
    if(t.includes('{PREP}')) return prep ? t.replace('{PREP}',prep) : null;
    return t.replace(/\{FRY\}/g,fry).replace(/\{SIMMER\}/g,sim).replace(/\{MW\}/g,mw).replace(/\{(OVEN|STEAM|AF|GRILL|BAKE)\}/g,(m,k)=>tok[k]).replace(/\{PCOOK\}/g,p?p.fry:'').replace(/\{ALL\}/g,ALL).replace(/\{V\}/g,V).replace(/\{P\}/g,P);
  }).filter(Boolean);
  // 塩分を設計値に合わせるための「塩（味の調整）」を、料理の種類に応じた位置で使う
  if(b.seasonings.some(x=>x.n==='塩（味の調整）')){
    const liquid=b.dishType==='汁物'||b.seasonings.some(x=>x.ml!=null&&/水|豆乳|ココナッツ|だし/.test(x.n));
    if(liquid) steps.splice(Math.max(steps.length-1,0),0,'味をみて、塩（味の調整）の量を目安に加えて味をととのえる。');
    else steps.splice(prep&&b.finishSteps[0]==='{PREP}'?1:0,0,`${ALL}に塩（味の調整）を全体に振ってなじませる（下味がつき、仕上がりの味が締まる）。`);
  }
  // 5人分以上：一度に入りきらない調理法は、分けて作る目安を添える
  if(people>=5){
    const tip={ 'フライパン':'5人分以上はフライパンに入りきらないため、具材を2回に分けて焼き（炒め）、最後にまとめて味をからめる（26cm以上の大きめのフライパンなら1回でも可）。',
      'レンジ':'5人分以上は大きめの耐熱容器を使い、加熱の途中で一度全体を混ぜる（加熱ムラを防ぐ）。',
      'レンジ＋トースター':'5人分以上は耐熱皿を2枚に分けて加熱・焼き色づけをする。',
      '魚焼きグリル':'5人分以上はグリルに並びきらないため、2回に分けて焼く。',
      'ノンフライヤー':'5人分以上はバスケットに重ならないよう、2回に分けて焼く。',
      'せいろ':'5人分以上はせいろを2段重ねにし、途中で上下を入れ替える。' }[b.method];
    if(tip) steps.splice(prep&&b.finishSteps[0]==='{PREP}'?1:0,0,tip);
  }
  return steps;
}

function activePlan(){ return S.history.find(h=>h.id===S.activePlanId)||null; }
function computeShopping(plan){
  if(plan.prepDone && plan.buySnapshot) return plan.buySnapshot;
  const need={};
  plan.days.forEach(d=>d.dishes.forEach(x=>dishParts(x).forEach(id=>need[id]=(need[id]||0)+plan.people)));
  const sm=stockMap(); const items=[], covered=[];
  Object.keys(need).forEach(id=>{
    const p=PART[id], pu=p.purchaseUnit, have=Math.min(sm[id]||0,need[id]), buyS=need[id]-have;
    if(buyS<=0){ covered.push({id,need:need[id]}); return; }
    const units=Math.ceil(buyS*p.grams/pu.grams/pu.step-1e-9)*pu.step;
    const produced=Math.floor(units*pu.grams/p.grams+1e-9);
    items.push({ id, need:need[id], have, buyS, units, produced, section:pu.section,
      label:`${pu.item} ${frac(units)}${pu.unit}`, grams:Math.round(units*pu.grams) });
  });
  items.sort((a,b)=>SECTIONS.indexOf(a.section)-SECTIONS.indexOf(b.section));
  return { items, covered };
}
function planSeasonings(plan){
  const set=new Map();
  plan.days.forEach(d=>d.dishes.forEach(x=>BASE[x.baseId]&&BASE[x.baseId].seasonings.forEach(s=>{
    const n=s.n.replace(/（.*?）/g,''); if(n==='水') return; set.set(n,(set.get(n)||0)+1);
  })));
  return [...set.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}

function estMinutes(b,d,people){
  if(b.gochiso||b.method==='自動調理鍋') return null;
  const p=d&&d.p?PART[d.p]:null, raw=p&&!p.ready, n=people||S.people, all=d?dishParts(d).map(id=>PART[id]):[];
  const heat=all.some(x=>!x.ready&&!(b.rawOk||[]).includes(x.id)), thick=/あん|煮|チヂミ/.test(b.name);
  switch(b.method){
    case 'フライパン': return 6+(raw?3:0)+(thick?2:0)+(n>2?1:0)+(n>=5?4:0)+(p&&p.extraMin||0);
    case '和えるだけ': return 3+(heat?3:0)+(n>2?1:0);
    case 'レンジ': return (b.mwBase||2)+(raw?(b.mwRaw||0):0)+Math.min(n-1,4)+4;
    case '鍋': return 7+(raw?3:0)+(n>2?1:0)+(p&&p.extraMin||0);

    case 'ノンフライヤー': return 18+(n>2?3:0)+(n>=5?12:0);

}

function renderStock(){
  const sm=stockMap();
  const pS=S.stock.filter(b=>PART[b.partId].category==='protein').reduce((a,b)=>a+b.count,0);
  const vS=S.stock.filter(b=>PART[b.partId].category==='veg').reduce((a,b)=>a+b.count,0);
  const soon=S.stock.filter(b=>b.count>0&&freshness(b).rem<=2).length;
  const kinds=Object.keys(sm).length;
  let rows=S.stock.slice();
  const F=S.stockFilter||'all';
  if(F==='protein'||F==='veg') rows=rows.filter(b=>PART[b.partId].category===F);
  if(F==='freeze'||F==='fridge'||F==='pantry') rows=rows.filter(b=>b.storage===F);
  if(F==='soon') rows=rows.filter(b=>freshness(b).rem<=2);

}
function renderPlan(){
  return noMainWarn()+`<div class="mode">

      `${short.length?`<div class="warn">⚠ ${short.map(id=>PART[id].short).join('・')}の在庫が${S.people}人分に足りません（あるだけ消費します）</div>`:''}

  </div>`;

// 今日の献立カード（献立表に今日の料理があるとき、アレンジ提案より先に表示）
function todayCardHTML(){
  const p=curPlan(); if(!p) return '';
  const t=todayStr(), di=p.days.findIndex(d=>d.date===t); if(di<0) return '';
  const day=p.days[di], ref=j=>`P:${p.id}:${di}:${j}`;
  if(!day.dishes.length) return `<div class="today-card"><div class="tc-h"><b>📅 今日の献立</b><small>${fmtDate(t)}</small></div><p class="hint mt0">今日はお休みにしました（献立を明日以降に1日ずらしました）。下の提案から自由に作れます。</p></div>`;
  const allDone=day.dishes.every(x=>x.done), sm=stockMap();
  const lackToday=[...new Set(day.dishes.filter(x=>!x.done).flatMap(dishParts))].filter(id=>(sm[id]||0)<p.people);
  const start=new Date(); start.setHours(0,0,0,0);
  const otherCooked=!allDone && (S.cooked||[]).some(c=>c.at>=start.getTime() && !day.dishes.some(x=>x.key===c.key));
  const lackLater=shortageMatters(p)?planShortage(p).filter(x=>!lackToday.includes(x.id)):[];
  return `<div class="today-card"><div class="tc-h"><b>📅 今日の献立</b><small>${fmtDate(t)}・${p.people}人分</small></div>
    ${day.dishes.map((x,j)=>`<button class="tc-row ${x.done?'done':''}" data-act="open" data-ref="${ref(j)}"><span class="typ">${x.type}</span><b>${esc(dishName(x))}</b>${x.done?'<span class="pill fr-ok">✓ 作った</span>':''}</button>`).join('')}
    ${allDone?`<div class="status" style="margin:10px 0 0">✓ 今日の献立は作りました。おつかれさまでした！</div>`:`
      ${lackToday.length?`<div class="warn">⚠ ${lackToday.map(id=>PART[id].short).join('・')}のストックが${p.people}人分に足りません</div>`:''}
      ${otherCooked?`<p class="hint">今日は別の料理を作りましたか？ 献立の料理は「明日にずらす」で後ろに回せます。</p>`:''}
      <div class="tc-act"><button class="btn primary" data-act="cookDay" data-id="${p.id}" data-di="${di}">✓ 作った</button><button class="btn outline" data-act="shiftDay" data-id="${p.id}" data-di="${di}">⏭ 明日にずらす</button></div>`}
    ${(lackToday.length||lackLater.length)&&shortageMatters(p)&&!lackAccepted(p)?`<button class="btn soft sm" style="margin-top:8px" data-act="replan" data-id="${p.id}">🔄 ストックが変わったので、今日以降を組み直す</button>`:''}
  </div>`;
}

      ${isT&&todo?`<div class="d-act" style="padding:10px 14px 0"><button class="swap" data-act="cookDay" data-id="${p.id}" data-di="${di}">✓ 作った</button><button class="swap" data-act="shiftDay" data-id="${p.id}" data-di="${di}">⏭ 明日にずらす</button></div>`:''}
      <div class="day-b">${d.dishes.map((x,j)=>{
        const ref=`W:${di}:${j}`, fav=dishFav(x), wantTag=x.want?'<span class="tagx" style="background:var(--orange-l)">🍽 食べたい</span>':'';
        if(j===0) return `<div class="day-main"><div class="d-top">${gBadge(x.genre)}<span class="typ">${x.type}</span>${dishLabel(x)}${wantTag}${dishOK(x)?'':dishOffTag(x)}${x.done?'<span class="ok-mark">✓ 作った</span>':''}<span class="sp"></span><button class="star ${fav?'on':''}" data-act="fav" data-ref="${ref}">${fav?'★':'☆'}</button></div>
          <button class="d-name" data-act="open" data-ref="${ref}">${esc(dishName(x))}</button>${formulaHTML(x,true)}
          ${x.done||past?'':`<div class="d-act"><button class="swap" data-act="swap" data-d="${di}" data-j="${j}">↻ 別アレンジに変更</button>${BASES.some(z=>z.gochiso)?(isGochisoDish(x)?`<button class="swap" data-act="swapMode" data-d="${di}" data-m="quick">⚡ 時短に</button>`:`<button class="swap" data-act="swapMode" data-d="${di}" data-m="gochiso">🍷 ごちそうに</button>`):''}</div>`}</div>`;
        return `<div class="sub-dish"><button class="sdn" data-act="open" data-ref="${ref}"><div class="d-top">${gBadge(x.genre)}<span class="typ">${x.type}</span>${dishLabel(x)}${wantTag}${dishOK(x)?'':dishOffTag(x)}${fav?'<span style="color:#E8A317">★</span>':''}</div><b>${esc(dishName(x))}</b>${x.done?'<span class="ok-mark">✓ 作った</span>':''}</button>
          ${x.done||past?'':`<button class="swap" data-act="swap" data-d="${di}" data-j="${j}">↻ 変更</button><button class="rmx" data-act="rmDish" data-d="${di}" data-j="${j}" aria-label="この品を外す">×</button>`}</div>`;
      }).join('')}${past||!todo?'':ADD_OPEN===di?`<div class="day-add"><span>追加する料理：</span><button class="swap" data-act="addDish" data-d="${di}" data-t="副菜">🥗 副菜</button>${d.dishes.some(x=>x.type==='汁物')?'':`<button class="swap" data-act="addDish" data-d="${di}" data-t="汁物">🍲 汁物</button>`}<button class="addbtn" style="color:var(--muted)" data-act="addOpen" data-d="-1">やめる</button></div>`
        :d.dishes.length<5?`<div class="day-add"><button class="addbtn" data-act="addOpen" data-d="${di}">＋ 1品追加</button></div>`:''}</div></div>`;
  }).join('');
  html+=`<div class="btn-col"><button class="btn soft sm" data-act="shareSheet">👪 家族と献立を共有（LINEなどで送る）</button></div>`;
  html+=`<div class="confirm-bar">${p.confirmed?`<button class="btn green" data-act="tab" data-tab="shop">🛒 買い物＆仕込みリストを見る</button>`:`<button class="btn primary" data-act="confirm">✅ この献立を確定（買い物＆仕込みリストへ反映）</button>`}</div>`;
  return html;
}

function combosCount(b){
  const P=PARTS.filter(p=>compat(b,p,'protein')).length, V=PARTS.filter(p=>compat(b,p,'veg')).length;
  const vc = b.requiredCategories.veg[1]>=2 ? V+V*(V-1)/2 : V;
  const pc = b.requiredCategories.protein[0]>=1 ? P : P+1;
  return Math.round(pc*vc);
}

  <div class="list">${fr.map(r=>recipeRow(r,{unfav:true})).join('')}${favs.length||fr.length?favs.map(f=>{ const d=makeDish(BASE[f.baseId],f.p,f.v); const b=BASE[f.baseId];
    return `<div class="fav-row" data-k="${esc(kana(dishName(d)+' '+d.genre+' '+d.type+' '+dishParts(d).map(id=>YOMI[id]||'').join(' ')))}"><button class="fx2" data-act="open" data-ref="F:${esc(f.key)}"><div class="d-top">${gBadge(d.genre)}<span class="typ">${d.type}</span>${mLabel(b)}${baseUsable(b)?'':offTag(b)}</div><b>${esc(dishName(d))}</b></button><button class="x" data-act="unfav" data-key="${esc(f.key)}" aria-label="削除">×</button></div>`; }).join('')
    :`<div class="empty"><div class="big">⭐</div><b>お気に入りはまだありません</b><p>料理カードや定番レシピの☆、キッチンモードの<br>「★ お気に入りに保存」で保存できます。</p></div>`}</div>
  <div class="switch-row"><div class="tx">献立作成時にお気に入りを優先採用<small>ONにすると提案・1週間献立でお気に入りの組み合わせが選ばれやすくなります</small></div><button class="sw ${S.favPriority?'on':''}" data-act="favPri" aria-label="切り替え"></button></div>`;

  const total=BASES.reduce((a,b)=>a+combosCount(b),0);

  }
  return html;
}
function dictByPart(id){
  const p=PART[id], isP=p.category==='protein';
  const list=BASES.filter(b=>compat(b,p,isP?'protein':'veg'));
  let n=0;
  const rows=GENRES.map(g=>{ const bs=list.filter(b=>b.genre===g); if(!bs.length) return '';

      if(isP){
        const vs=PARTS.filter(v=>compat(b,v,'veg')); n+=vs.length;
        const ex=makeDish(b,id,[vs[0].id]);
        return `<div class="dict-row"><div class="d-top"><span class="typ">${b.dishType}</span>${mLabel(b)}</div><button class="dn" data-act="open" data-ref="X:${b.id}:${id}:${vs[0].id}">${esc(dishName(ex))}</button>
          <div class="mini"><span class="lbl">合わせる野菜→</span>${vs.map(v=>`<button data-act="open" data-ref="X:${b.id}:${id}:${v.id}">${v.emoji}${esc(v.short)}</button>`).join('')}</div></div>`;
      } else {
        const ps=PARTS.filter(q=>compat(b,q,'protein')); const opt=b.requiredCategories.protein[0]===0;
        n+=ps.length+(opt?1:0);
        const ex=makeDish(b,opt?null:(ps[0]&&ps[0].id),[id]);
        return `<div class="dict-row"><div class="d-top"><span class="typ">${b.dishType}</span>${mLabel(b)}</div><button class="dn" data-act="open" data-ref="X:${b.id}:${ex.p||'-'}:${id}">${esc(dishName(ex))}</button>
          <div class="mini"><span class="lbl">合わせる食材→</span>${opt?`<button data-act="open" data-ref="X:${b.id}:-:${id}">🥗野菜のみ</button>`:''}${ps.map(q=>`<button data-act="open" data-ref="X:${b.id}:${q.id}:${id}">${q.emoji}${esc(q.short)}</button>`).join('')}</div></div>`;
      }
    }).join('')}</div>`; }).join('');
  return `${kyouLinksHTML([id],`${esc(p.short)}のプロのレシピを探す`)}<div class="sec-t"><h2>${p.emoji} ${esc(p.name)}を使ったアレンジ一覧</h2></div>
    <div class="info-box">${list.length}種の味付けベース × 相性の良い食材で <b>${n}通り</b>（1品目のみ表示・野菜2種の組み合わせはさらに増えます）</div>${rows}`;
}
function dictByBase(bid){

function renderShop(){
  const plan=activePlan();
  if(!plan) return `<div class="card empty"><div class="big">🛒</div><b>確定した献立がありません</b><p>「アレンジ献立」タブで1週間献立を作成して確定すると、<br>買い物リストとまとめ下処理のガイドが自動で作られます。</p>

  plan.shopChecks=plan.shopChecks||{}; plan.prepChecks=plan.prepChecks||{}; plan.seasonChecks=plan.seasonChecks||{};
  const sh=computeShopping(plan);

  let html=`<div class="hero"><h1>買い物＆まとめ下処理</h1><p>${fmtDate(plan.weekStart)}〜${fmtDate(addDays(plan.weekStart,6))}の献立（${plan.people}人分）から逆算</p>

  // STEP1
  html+=`<div class="card" style="margin-top:14px"><div class="step-h"><span class="step-n">STEP 1</span><h3>スーパーで買うもの</h3><small style="color:var(--muted);font-weight:700">${done}/${sh.items.length}</small></div>
    <div class="prog"><i style="width:${sh.items.length?done/sh.items.length*100:100}%"></i></div>
    ${plan.prepDone?`<p class="hint">※仕込み登録済みのため、確定時点のリストを表示しています。</p>`:`<p class="hint">タブ1のストック分は自動で差し引き済み。売り場ごとにまとめています。</p>`}
    ${sh.items.length?SECTIONS.map(sec=>{ const its=sh.items.filter(i=>i.section===sec); if(!its.length) return '';
      return `<div class="sec-name">${SECTION_ICON[sec]} ${sec}</div>${its.map(i=>{ const p=PART[i.id];
        return `<button class="chk ${plan.shopChecks[i.id]?'on':''}" data-act="chkShop" data-id="${i.id}"><span class="box">${plan.shopChecks[i.id]?'✓':''}</span>
          <span class="ct"><b>${esc(p.purchaseUnit.item)}</b><small>${p.emoji}${esc(p.name)}に ／ 1週間で${i.need}食分使用${i.have?`・ストック${i.have}食分を差し引き`:''}</small></span>
          <span class="amt">${frac(i.units)}${esc(p.purchaseUnit.unit)}<small style="display:block;font-size:11px;color:var(--muted);text-align:right;font-weight:600">約${i.grams}g</small></span></button>`; }).join('')}`; }).join('')
      :`<div class="empty"><b>🎉 買い足しは不要です</b><p>今のストックだけで1週間まわせます。</p></div>`}
    ${sh.covered.length?`<div class="covered">📦 ストックで足りているもの：${sh.covered.map(c=>`${PART[c.id].emoji}${esc(PART[c.id].short)}（${c.need}食分）`).join('、')}</div>`:''}
  </div>`;
  // 献立に入れた定番レシピ（ストック以外の材料も確認できるように）
  { const rds=[]; plan.days.forEach(d=>d.dishes.forEach(x=>{ if(x.rid&&RECIPE[x.rid]&&!rds.some(y=>y.rid===x.rid)) rds.push({rid:x.rid,date:d.date}); }));
    if(rds.length) html+=`<div class="card"><div class="step-h"><span class="step-n" style="background:var(--green)">📗</span><h3>定番レシピの材料も確認</h3></div><p class="hint mt0">献立に入れた定番レシピの、ストック以外の材料（肉・野菜・調味料など）はレシピで確認してください。</p>
      ${rds.map(x=>`<button class="krow" style="font-size:14px;width:100%;text-align:left" data-act="open" data-ref="R:${x.rid}"><span>${esc(RECIPE[x.rid].name)}<small>${fmtDate(x.date)}</small></span><span class="q" style="font-size:13px">材料を見る ›</span></button>`).join('')}</div>`; }
  // 仕込み後の組み直し・予定外の変更で足りなくなったもの
  if(plan.prepDone){ const lack=planShortage(plan);
    if(lack.length) html+=`<div class="card"><div class="step-h"><span class="step-n" style="background:var(--orange)">追加</span><h3>追加で買うもの</h3></div><p class="hint mt0">献立の組み直しや予定外の変更で、これからの献立に足りなくなった分です。</p>

let MODAL=null, wakeLock=null;
function resolveRef(ref){
  const [t,...r]=ref.split(':');
  if(t==='A') return S.suggestions&&S.suggestions[+r[0]];
  if(t==='W') return S.draft&&S.draft.days[+r[0]]&&S.draft.days[+r[0]].dishes[+r[1]];
  if(t==='F'){ const key=r.join(':'); const f=S.favorites.find(x=>x.key===key); return f&&makeDish(BASE[f.baseId],f.p,f.v); }
  if(t==='X'){ const b=BASE[r[0]]; return b&&makeDish(b,r[1]==='-'?null:r[1],r[2].split('+')); }
  if(t==='P'){ const pl=planCopies(r[0])[0]; return pl&&pl.days[+r[1]]&&pl.days[+r[1]].dishes[+r[2]]; }
  return null;
}

let TOUR=null, tipsReady=false;
function startTour(steps,kind,key){
  TOUR={ steps, i:0, kind, key, dontShow:true };

  pushOv(); showTourStep();

function startWelcome(){ startTour(WELCOME_TOUR,'welcome'); }
function showTourStep(){
  const st=TOUR.steps[TOUR.i];
  if(st.before) st.before();
  const el=document.querySelector(st.sel);
  if(el&&!el.closest('#nav,#hdr')){
    const r=el.getBoundingClientRect(), top=r.top, vh=innerHeight;
    if(top<90||r.bottom>vh-240) window.scrollTo(0, window.scrollY+top-Math.max(90,vh*0.28));
  }
  drawTour();
}
function drawTour(){
  const box=$('#tour');
  if(!TOUR){ box.innerHTML=''; return; }
  const st=TOUR.steps[TOUR.i], n=TOUR.steps.length, last=TOUR.i===n-1;
  const el=document.querySelector(st.sel); const r=el?el.getBoundingClientRect():null;
  const pad=6, W=innerWidth, H=innerHeight, bw=Math.min(340,W-24);
  let hole='', bubStyle='', arrow='';
  if(r&&r.width){
    const L=Math.max(4,r.left-pad), T=Math.max(4,r.top-pad), R=Math.min(W-4,r.right+pad), B=Math.min(H-4,r.bottom+pad);
    hole=`<div class="tour-hole" style="left:${L}px;top:${T}px;width:${R-L}px;height:${B-T}px"></div>`;
    const below=H-B, above=T, cx=(L+R)/2;
    const left=Math.min(Math.max(12,cx-bw/2),W-bw-12), ax=Math.min(Math.max(22,cx-left),bw-22);
    if(below>=above){ bubStyle=`top:${B+14}px;left:${left}px;width:${bw}px`; arrow=`<i class="tour-arr up" style="left:${ax}px"></i>`; }
    else { bubStyle=`bottom:${H-T+14}px;left:${left}px;width:${bw}px`; arrow=`<i class="tour-arr down" style="left:${ax}px"></i>`; }
  } else {
    hole='<div class="tour-dim"></div>';
    bubStyle=`top:50%;left:${(W-bw)/2}px;width:${bw}px;transform:translateY(-50%)`;
  }
  const empty=!S.stock.length;
  let btns;
  if(last&&TOUR.kind==='welcome'){
    btns=`${empty?'<button class="btn primary sm" data-act="tourStart" data-demo="1">✨ お試しセットで始める</button>':''}<button class="btn ${empty?'soft':'green'} sm" data-act="tourStart">${empty?'自分で登録する':'はじめる'}</button>`;
  } else {
    btns=`<button class="btn ghost sm" data-act="tourEnd">${TOUR.kind==='welcome'?'スキップ':'閉じる'}</button><button class="btn green sm" data-act="tourNext">${last?'OK':'次へ'}</button>`;
  }
  box.innerHTML=`<div class="tour-bk" data-act="tourTap"></div>${hole}
    <div class="tour-bub" style="${bubStyle}" role="dialog" aria-modal="true" aria-label="使い方ガイド">${arrow}
      ${n>1?`<div class="tour-step">${TOUR.i+1} / ${n}</div>`:''}
      <b>${st.title}</b><div class="tour-txt">${st.text}</div>
      <div class="tour-btns ${last&&TOUR.kind==='welcome'?'col':''}">${btns}</div>
      ${last&&TOUR.kind==='welcome'?`<button class="ck-row ${TOUR.dontShow?'on':''}" data-act="tourCk"><span class="box">${TOUR.dontShow?'✓':''}</span>次回からこの案内を表示しない</button>`:''}
    </div>`;
}
function endTour(fromBack){
  if(!TOUR) return;
  if(TOUR.kind==='welcome'){ S.tutorialSeen=!!TOUR.dontShow; tipsReady=true; }
  else { S.tipsSeen=S.tipsSeen||{}; S.tipsSeen[TOUR.key]=true; }
  TOUR=null; drawTour(); document.body.style.overflow=''; save();
  if(!fromBack) popOv();
}

function maybeTip(){

function seasonToRow(s){
  if(s.tsp!=null){ return s.tsp>=3&&Math.abs(s.tsp/3-Math.round(s.tsp/3*2)/2)<1e-9 ? {n:s.n,a:s.tsp/3,u:'tbsp'} : {n:s.n,a:s.tsp,u:'tsp'}; }
  if(s.ml!=null) return {n:s.n,a:s.ml,u:'ml'};
  if(s.g!=null) return {n:s.n,a:s.g,u:'g'};
  if(s.cm!=null) return {n:s.n,a:s.cm,u:'cm'};
  return {n:s.n,a:'',u:s.text==='適量'?'適量':'少々'};
}

function saveCustomForm(id){
  const name=$('#cf_name').value.trim().replace(/\s+/g,' ');
  if(!name){ toast('味付けの名前を入力してください'); $('#cf_name').focus(); return false; }
  const seasonings=[];
  document.querySelectorAll('#cf_rows .cf-row').forEach(r=>{
    const n=r.querySelector('.sn').value.trim(); if(!n) return;
    const a=parseFloat(r.querySelector('.sa').value), u=r.querySelector('.su').value;
    if(u==='少々'||u==='適量'){ seasonings.push({n,text:u,k:'x'}); return; }
    if(!(a>0)){ seasonings.push({n,text:'少々',k:'x'}); return; }
    if(u==='tsp') seasonings.push({n,tsp:a}); else if(u==='tbsp') seasonings.push({n,tsp:a*3});
    else if(u==='ml') seasonings.push({n,ml:a,k:'x'}); else if(u==='g') seasonings.push({n,g:a,k:'x'}); else seasonings.push({n,cm:a,k:'x'});
  });
  if(!seasonings.length){ toast('調味料を1つ以上入力してください'); return false; }
  const steps=$('#cf_steps').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const obj={ id:id||'u_'+uid(), name, genre:$('#cf_genre').value, dishType:$('#cf_type').value, method:$('#cf_method').value, seasonings, steps:steps.length?steps:null, createdAt:Date.now() };
  S.customBases=S.customBases||[];
  const i=S.customBases.findIndex(x=>x.id===obj.id);
  if(i>=0) S.customBases[i]=obj; else S.customBases.push(obj);
  rebuildBases(); S.suggestions=null; return true;
}

const b64e = str=>btoa(unescape(encodeURIComponent(str)));
const b64d = str=>decodeURIComponent(escape(atob(str)));
function buildMigration(){
  save();
  const data={};
  PROF.list.forEach(p=>{ try{ const v=localStorage.getItem(dataKey(p.id)); if(v) data[p.id]=JSON.parse(v); }catch(e){} });
  return { app:'kakezan-gohan', kind:'migration', v:1, at:Date.now(), profiles:PROF, data };
}
const migrationCode = ()=>'KKZ1:'+b64e(JSON.stringify(buildMigration()));
function parseMigration(text){
  text=(text||'').trim();
  if(text.startsWith('KKZ1:')) text=b64d(text.slice(5).replace(/\s+/g,''));
  const o=JSON.parse(text);
  if(!o||o.app!=='kakezan-gohan'||o.kind!=='migration'||!o.profiles||!Array.isArray(o.profiles.list)||!o.data) throw new Error('format');
  return o;
}
function applyMigration(o){
  // 既存ユーザーのデータを消してから書き込む
  try{ PROF.list.forEach(p=>localStorage.removeItem(dataKey(p.id))); }catch(e){}
  Object.entries(o.data).forEach(([id,st])=>{ if(o.profiles.list.some(p=>p.id===id)){ st.tutorialSeen=true; localStorage.setItem(dataKey(id),JSON.stringify(st)); } });
  if(!o.profiles.list.some(p=>p.id===o.profiles.current)) o.profiles.current=o.profiles.list[0].id;
  localStorage.setItem(PROF_KEY,JSON.stringify(o.profiles));
  setInst({importAsked:true});
  try{ sessionStorage.setItem('kakezan-msg','🔁 引き継ぎが完了しました'); }catch(e){}
  location.reload();
}

// ---------- ファイル保存（スマホは共有シートで「ファイルに保存」できるように） ----------
async function shareOrDownload(name,text){
  const blob=new Blob([text],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(isMobile()&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return 'shared'; }
  }catch(e){ if(e&&e.name==='AbortError') return 'cancel'; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
  return 'downloaded';
}

// ---------- 自動アップデート ----------
// オンラインで開けば常に最新版（ネット優先）。開いたまま更新が公開されたときは、
// アプリに戻ってきたタイミングなど操作の邪魔にならない時に自動で切り替える。
let updPending=null, lastUpdCheck=0;
async function checkUpdate(force){
  if(!isHttp()) return false;
  if(!force && Date.now()-lastUpdCheck<10*60*1000) return false;
  lastUpdCheck=Date.now();
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}); if(!r.ok) return false;
    const m=(await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if(m&&m[1]!==APP_VERSION){ updPending=m[1]; return true; }
  }catch(e){}
  return false;
}
const isIdle=()=>!MODAL&&!TOUR&&!$('#sheet').innerHTML&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
function applyUpdate(){
  save();
  try{ sessionStorage.setItem('kakezan-msg',`✨ 最新版（${updPending}）に更新しました`); }catch(e){}
  try{ navigator.serviceWorker&&navigator.serviceWorker.getRegistration(SW_SCOPE).then(r=>r&&r.update()); }catch(e){}
  location.reload();
}
function updateBar(){
  if(!updPending) return '';
  return `<div class="status" style="align-items:center">✨<span style="flex:1">新しいバージョンがあります</span><button class="btn primary sm" style="width:auto" data-act="applyUpdate">今すぐ更新</button></div>`;
}
async function updateFlow(onReturn){
  const found=updPending||await checkUpdate(onReturn);
  if(!found) return;
  if(isIdle()) applyUpdate(); else render();
}

const B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
const e62 = (n,w)=>{ let r=''; for(let i=0;i<w;i++){ r=B62[n%62]+r; n=Math.floor(n/62); } return r; };
const d62 = str=>[...str].reduce((a,c)=>{ const v=B62.indexOf(c); if(v<0) throw new Error('char'); return a*62+v; },0);
const SHARE_EPOCH = '2024-01-01';
// 共有コード：A形式（食材1文字）／B形式（食材2文字・食材が増えたとき）。定番レシピは味付け番号3000＋レシピ番号で表す
const RID_BASE = 3000;
const ridNum = rid=>parseInt(String(rid).slice(1),10);
function planToShort(p){
  let skipped=0;
  const items=p.days.map(day=>day.dishes.filter(x=>{
    if(x.rid) return !!RECIPE[x.rid];
    const ok=SHARE_BASES.includes(x.baseId)&&(!x.p||SHARE_PARTS.includes(x.p))&&x.v.every(v=>SHARE_PARTS.includes(v)); if(!ok) skipped++; return ok; }));
  const pidx=id=>id?SHARE_PARTS.indexOf(id)+1:0;
  const wide=items.some(ds=>ds.some(x=>!x.rid&&[x.p,...x.v].some(id=>pidx(id)>=62)));
  const pw=wide?2:1;
  let out=(wide?'B':'A')+String(p.people)+e62(Math.round((parseYmd(p.weekStart)-parseYmd(SHARE_EPOCH))/864e5),3);
  items.forEach(ds=>{
    out+=B62[ds.length];
    ds.forEach(x=>{ if(x.rid){ out+=e62(RID_BASE+ridNum(x.rid),2)+'0'.repeat(pw*3); return; }
      out+=e62(SHARE_BASES.indexOf(x.baseId),2)+e62(pidx(x.p),pw)+e62(pidx(x.v[0]),pw)+e62(pidx(x.v[1]),pw); });
  });
  return { code:out, skipped };
}

function shortToPlan(code){
  if(code[0]!=='A'&&code[0]!=='B') throw new Error('ver');
  const pw=code[0]==='B'?2:1;
  const people=+code[1]; let i=5;
  const weekStart=addDays(SHARE_EPOCH,d62(code.slice(2,5)));
  const days=[]; let missing=0;
  for(let k=0;k<7;k++){
    const n=d62(code[i++]); const dishes=[];
    for(let m=0;m<n;m++){
      const bi=d62(code.slice(i,i+2)); i+=2;
      const pi=d62(code.slice(i,i+pw)), v1=d62(code.slice(i+pw,i+2*pw)), v2=d62(code.slice(i+2*pw,i+3*pw)); i+=3*pw;
      if(bi>=RID_BASE){ const rid='k'+String(bi-RID_BASE).padStart(2,'0'); if(RECIPE[rid]) dishes.push(makeRecipeDish(rid)); else missing++; continue; }
      const b=BASE[SHARE_BASES[bi]], P=pi?SHARE_PARTS[pi-1]:null, V=[SHARE_PARTS[v1-1]].concat(v2?[SHARE_PARTS[v2-1]]:[]);
      if(!b||(pi&&!PART[P])||!V.every(v=>PART[v])){ missing++; continue; }
      dishes.push(makeDish(b,P,V));
    }
    days.push({date:addDays(weekStart,k),dishes});
  }
  if(i!==code.length) throw new Error('len');

function parsePlanCode(text){
  text=(text||'').trim();
  const m=text.match(/[#?&]m=([0-9A-Za-z]+)/)||text.match(/^([AB][1-6][0-9A-Za-z]{4,})$/);
  if(m) return shortToPlan(m[1]);
  const i=text.indexOf('KKZP1:'); if(i<0) throw new Error('nocode');
  const o=JSON.parse(b64d(text.slice(i+6).split(/\s/)[0]));
  if(!o||o.kind!=='plan'||!Array.isArray(o.days)) throw new Error('format');
  let missing=0;
  const days=o.days.map(d=>({ date:d.date, dishes:d.dishes.filter(x=>{ const b=BASE[x.baseId]; const ok=b&&(!x.p||PART[x.p])&&x.v.every(v=>PART[v]); if(!ok) missing++; return ok; }).map(x=>makeDish(BASE[x.baseId],x.p,x.v)) }));
  return { plan:{ id:uid(), weekStart:o.weekStart, people:[1,2,3,4,5,6].includes(o.people)?o.people:S.people, core:o.core||{protein:[],veg:[]}, days, createdAt:Date.now(), shared:true, confirmed:false }, missing };
}

  if(WANT_CACHE[q]) return WANT_CACHE[q];
  const qk=kana(q), qy=kana(recipeYomi(q)), out=[], seen=new Set(), push=(ref,d)=>{ if(!d||seen.has(d.key)) return; seen.add(d.key); out.push({ref,d}); };
  const can=r=>recipeCookable(r)&&recipeEqOK(r), hit=k=>k.includes(qk)||k.includes(qy);
  // 名前で探したときは、OFFのジャンルの定番レシピも出す（はっきり食べたいものなので）
  const rs=RECIPES.filter(r=>['主菜','主食','副菜','汁物'].includes(r.type)&&(qk?hit(recipeKey(r)):genreOn(r.genre)))
    .sort((a,b)=>(can(b)-can(a))||((['主菜','主食'].includes(b.type))-(['主菜','主食'].includes(a.type))));
  const arr=[];
  if(qk){
    const mb=BASES.filter(b=>hit(kana(b.name+' '+b.suffix+' '+b.genre+' '+b.dishType+' '+recipeYomi(b.name)))).slice(0,6);
    mb.forEach(b=>{ for(let t=0;t<(mb.length<3?3:1);t++){ const d=comboFor(b,null); if(d) arr.push(d); } });
    PARTS.filter(p=>hit(partKey(p.id))||hit(kana(p.short))).slice(0,2).forEach(p=>{
      shuffle(BASES.filter(b=>compat(b,p,p.category)&&(p.category==='veg'||b.dishType==='主菜'))).slice(0,4).forEach(b=>{ const d=comboFor(b,p.id); if(d) arr.push(d); }); });
  } else {
    const pool=stockPool(); const used=new Set();
    for(let i=0;i<6&&pool.protein.length;i++){ const d=generateDish({ type:'主菜', pool, partScore:id=>(stockCount(id)>=S.people?1.5:0.3), hard:{ bases:used } }); if(!d) break; used.add(d.baseId); arr.push(d); }
  }
  rs.slice(0,qk?10:5).forEach(r=>push('R:'+r.id,makeRecipeDish(r.id)));
  arr.slice(0,8).forEach(d=>push(`X:${d.baseId}:${d.p||'-'}:${d.v.join('+')}`,d));
  // 並び：ストックだけで作れるもの→主菜→その他
  const cookable=d=>dishParts(d).length>0&&dishParts(d).every(id=>stockCount(id)>0);
  out.sort((a,b)=>(cookable(b.d)-cookable(a.d))||((b.d.type==='主菜')-(a.d.type==='主菜')));
  return (WANT_CACHE[q]=out);
}

function wantApply(ref,dayOffset){
  const want=ref.startsWith('R:')?(RECIPE[ref.slice(2)]&&makeRecipeDish(ref.slice(2))):resolveRef(ref);
  if(!want) return;
  const w=JSON.parse(JSON.stringify(want)); delete w.done;
  const date=addDays(todayStr(),dayOffset);
  const pl=planCovering(date), day=pl&&pl.days.find(d=>d.date===date);
  if(day&&day.dishes.some(x=>x.done)){ toast(`${dayOffset?'明日':'今日'}はもう作った料理があります。${dayOffset?'':'「明日」を選んでください'}`); return; }
  if(!pl&&S.draft&&!S.history.some(h=>h.id===S.draft.id)&&S.draft.days[S.draft.days.length-1].date>=todayStr()
    &&!confirm(`作成中（未確定）の献立（${fmtMD(S.draft.weekStart)}〜）を置き換えて、${fmtMD(date)}から新しい1週間の献立を作ります。よろしいですか？`)) return;
  const before=JSON.stringify({draft:S.draft,history:S.history,active:S.activePlanId});
  const r=planAroundWant(w,date);
  $('#sheet').innerHTML=''; if(MODAL) closeModal(); popOv();
  S.tab='plan'; S.mode=dayOffset===0&&curPlan()?'A':'B'; ADD_OPEN=-1; render(); window.scrollTo(0,0);
  toast(r.created?`🍽「${dishName(w)}」を${dayOffset?'明日':'今日'}にして、1週間の献立を作りました`:`🍽「${dishName(w)}」に合わせて${dayOffset?'明日':'今日'}の献立を組み直しました`,
    ()=>{ const o=JSON.parse(before); S.draft=o.draft; S.history=o.history; S.activePlanId=o.active; render(); });
}
