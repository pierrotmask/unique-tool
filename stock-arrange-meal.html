    else { ACTIONS.shareSheet(); toast('届いたリンクを下の欄に貼り付けてください'); setTimeout(()=>{ const ta=$('#plan_code'); ta&&ta.focus(); },300); } },
  safariAnyway:()=>{ try{ sessionStorage.setItem('kakezan-safari-ok','1'); }catch(e){} render(); },
  incomingAccept:()=>{ const r=INCOMING; INCOMING=null; $('#sheet').innerHTML=''; popOv(); importPlan(r); if(!S.tutorialSeen) setTimeout(startWelcome,400); },
  incomingDecline:()=>{ INCOMING=null; ACTIONS.closeSheet(); },
  partDict:ds=>{ S.tab='fav'; S.dictMode='part'; S.dictSel=ds.id; render(); setTimeout(()=>{ const el=document.querySelector('#main .dict-row'); const h=document.querySelector('#main .sec-t:last-of-type'); (h||el)&&(h||el).scrollIntoView({block:'start'}); window.scrollBy(0,-70); },60); },
  installGuide:()=>{ const had=!!$('#sheet').innerHTML; renderInstallGuide(); if(!had) pushOv(); },
  installSnooze:()=>{ setInst({snoozeUntil:addDays(todayStr(),14)}); render(); toast('2週間後にまたお知らせします（メニューからいつでも追加できます）'); },
  installNever:()=>{ const st=instState(); setInst({never:!st.never}); renderInstallGuide(); render(); toast(st.never?'案内を再び表示します':'この案内は表示しません（メニューからいつでも追加できます）'); },
  installNow:async()=>{ const d=PWA.deferred; if(!d) return; d.prompt(); try{ const c=await d.userChoice; if(c&&c.outcome==='accepted'){ closeSheetUI(); } }catch(e){} PWA.deferred=null; render(); },
  migrateSheet:()=>{ const had=!!$('#sheet').innerHTML; renderMigrateSheet(false); if(!had) pushOv(); },
  migCopy:async()=>{ const code=migrationCode();
    try{ await navigator.clipboard.writeText(code); toast('📋 引き継ぎコードをコピーしました'); }
    catch(e){ const ta=$('#mig_code'); if(ta){ ta.value=code; ta.select(); } else { prompt('このコードをすべて選択してコピーしてください',code); } toast('コードを選択してコピーしてください'); } },
  migFile:async()=>{ const r=await shareOrDownload(`kakezan-gohan-transfer-${todayStr()}.json`,JSON.stringify(buildMigration())); if(r!=='cancel') toast(r==='shared'?'共有メニューから「ファイルに保存」を選んでください':'💾 引き継ぎファイルを保存しました'); },
  migPaste:async()=>{ try{ $('#mig_code').value=await navigator.clipboard.readText(); toast('貼り付けました'); }catch(e){ toast('入力欄を長押しして「ペースト」してください'); $('#mig_code').focus(); } },
  migApply:()=>{ let m; try{ m=parseMigration($('#mig_code').value); }catch(e){ toast('引き継ぎコードを読み取れませんでした。全体をコピーできているか確認してください'); return; }
    if(confirm(`ユーザー${m.profiles.list.length}人分のデータを引き継ぎます。この画面のデータは置き換わります。よろしいですか？`)) applyMigration(m); },
  migSkip:()=>{ MIG_FIRST=false; setInst({importAsked:true}); $('#sheet').innerHTML=''; if(!S.tutorialSeen) startWelcome(); else popOv(); },
  migDone:ds=>{ setInst({migrated:ds.v==='1'}); renderInstallGuide(); render(); toast(ds.v==='1'?'✅ 移行済みにしました。以後はホーム画面版を使ってください':'移行済みの表示を取り消しました'); },
  applyUpdate:()=>applyUpdate(),
  checkUpdateNow:async()=>{ const f=await checkUpdate(true); if(f){ applyUpdate(); } else toast(`最新版です（${APP_VERSION}）`); },
  importData:()=>$('#importFile').click(),
  resetAll:()=>{ if(confirm(`「${curProfile().name}」のデータ（ストック・お気に入り・献立履歴・設定）を消去します。元に戻せません。よろしいですか？`)){ try{localStorage.removeItem(dataKey(PROF.current));}catch(e){} S=DEFAULT_STATE(); rebuildBases(); $('#sheet').innerHTML=''; render(); tipsReady=false; TOUR={ steps:WELCOME_TOUR, i:0, kind:'welcome', dontShow:true }; document.body.style.overflow='hidden'; showTourStep(); } },
  // stock
  openAdd:()=>{ renderAddSheet(); pushOv(); },
  presetSheet:()=>{ renderPresetSheet(); pushOv(); },
  addPreset:ds=>{ $('#sheet').innerHTML=''; popOv(); addPreset(ds.id); },
  demo:()=>addPreset('basic'),
  closeSheet:()=>{ if(MIG_FIRST){ MIG_FIRST=false; ACTIONS.migSkip(); return; } INCOMING=null; closeSheetUI(); if(!S.tutorialSeen&&!TOUR&&!tipsReady) setTimeout(startWelcome,300); },
  addQty:ds=>{ S.addQty=+ds.n; const sc=$('#sheet .sheet').scrollTop; renderAddSheet(); $('#sheet .sheet').scrollTop=sc; save(); },
  addPart:ds=>{
    const snap=snapshot();
    addStock(ds.id,S.addQty); S.addLog[ds.id]=(S.addLog[ds.id]||0)+1; S.suggestions=null;
    refreshSheetCounts(); render();
    toast(`${PART[ds.id].name} を${S.addQty}食分追加`, ()=>restore(snap));
  },
  inc:ds=>{ const b=S.stock.find(x=>x.uid===ds.uid); if(b){ b.count++; S.suggestions=null; render(); } },
  dec:ds=>{ const b=S.stock.find(x=>x.uid===ds.uid); if(!b) return; const snap=snapshot(); b.count--;
    if(b.count<=0){ S.stock=S.stock.filter(x=>x!==b); toast(`${PART[b.partId].name} を使い切りました`, ()=>restore(snap)); }
    S.suggestions=null; render(); },
  cycleSt:ds=>{ const b=S.stock.find(x=>x.uid===ds.uid); if(b){ b.storage=STORAGE_ORDER[(STORAGE_ORDER.indexOf(b.storage)+1)%3]; render(); } },
  sfilter:ds=>{ S.stockFilter=(S.stockFilter===ds.f&&ds.f!=='all')?'all':ds.f; render(); if(ds.f==='soon') setTimeout(()=>{ const c=$('#main .chips'); c&&c.scrollIntoView({block:'start'}); window.scrollBy(0,-70); },30); },
  clearStock:()=>{ const snap=snapshot(); S.stock=[]; S.suggestions=null; render(); toast('ストックをすべてクリアしました', ()=>restore(snap)); },
  // plan
  mode:ds=>{ S.mode=ds.m; render(); },
  shuffle:()=>{ makeSuggestions(); render(); toast('🔀 新しい組み合わせを合成しました'); },
  swapA:ds=>{ if(swapSuggestion(+ds.i)){ render(); toast('↻ この1品を入れ替えました'); } else toast('手持ちのストックでは他の組み合わせがありません'); },
  cook:ds=>{
    const d=resolveRef(ds.ref); if(!d||d.done) return;
    const snap=snapshot();
    const msg=dishParts(d).map(id=>{ const got=consumeStock(id,S.people); return `${PART[id].short}−${got}`; }).join('、');
    d.done=true; S.cooked.unshift({key:d.key,at:Date.now()}); S.cooked=S.cooked.slice(0,30);
    const pref=/^[WP]:/.test(ds.ref)?toPRef(ds.ref):null;
    if(pref){ forPlanDish(pref,x=>x.done=true); S.suggestions=null; }
    if(MODAL&&MODAL.ref===ds.ref) MODAL.dish=d;
    render(); if(MODAL) renderModal(); toast(`🍽 いただきます！ ${msg}`, ()=>{ if(pref) forPlanDish(pref,x=>delete x.done); restore(snap); });
  },
  genWeek:()=>{ ADD_OPEN=-1; S.draft=generateWeek(false); render(); toast('📅 1週間の献立を作成しました'); },
  planStart:ds=>{ S.planStart=ds.v; render(); toast({mon:'次の月曜から1週間で作ります',today:'今日から1週間で作ります',tmr:'明日から1週間で作ります'}[ds.v]); },
  weekendModeSel:ds=>ACTIONS.weekendMode(ds),
  wkOpt:()=>{ WK_OPT=!WK_OPT; render(); },
  cookDay:ds=>{ const pl=planCopies(ds.id)[0]; if(!pl) return; const di=+ds.di, day=pl.days[di]; if(!day) return;
    const todo=day.dishes.map((x,j)=>[x,j]).filter(([x])=>!x.done); if(!todo.length) return;
    const snap=snapshot(), got={};
    todo.forEach(([x,j])=>{ dishParts(x).forEach(id=>{ got[id]=(got[id]||0)+consumeStock(id,pl.people); }); forPlanDish(`P:${pl.id}:${di}:${j}`,y=>y.done=true); S.cooked.unshift({key:x.key,at:Date.now()}); });
    S.cooked=S.cooked.slice(0,30); S.suggestions=null; render();
    toast(`🍽 いただきます！ ${Object.entries(got).map(([id,c])=>PART[id].short+'−'+c).join('、')||'ストックの消費なし'}`, ()=>{ todo.forEach(([x,j])=>forPlanDish(`P:${pl.id}:${di}:${j}`,y=>delete y.done)); restore(snap); }); },
  shiftDay:ds=>{ const pl=planCopies(ds.id)[0]; if(!pl) return; const before=JSON.stringify(pl.days); const dropped=shiftPlan(pl,+ds.di); if(!dropped) return; render();
    toast(dropped.length?`⏭ 1日ずつ後ろにずらしました（最終日の「${dishName(dropped[0])}」はお休み）`:'⏭ 1日ずつ後ろにずらしました', ()=>{ pl.days=JSON.parse(before); syncPlan(pl); render(); }); },
  replan:ds=>{ const pl=(ds.id&&planCopies(ds.id)[0])||curPlan()||S.draft; if(!pl) return; const before=JSON.stringify({days:pl.days,core:pl.core});
    const k=replanPlan(pl); if(!k){ toast('組み直せる日がありません（献立の期間が終わっています）'); return; } render();
    const lackN=planShortage(pl).length;
    toast(`🔄 ${k}日分を組み直しました（最近食べた料理とかぶらないように）${lackN&&shortageMatters(pl)?'。ストックで足りない分は買い物タブに出ています':''}`, ()=>{ const o=JSON.parse(before); pl.days=o.days; pl.core=o.core; syncPlan(pl); render(); }); },
  genNext:()=>{ ADD_OPEN=-1; if(!S.history.length) toast('確定済みの履歴がないため、新規で作成しました'); else toast('🔄 先週と違う組み合わせで作成しました'); S.draft=generateWeek(true); render(); },
  fixEquip:()=>{ const p=S.draft; let ok=0, ng=0;
    p.days.forEach((d,di)=>d.dishes.forEach((x,j)=>{ if(!dishOK(x)){ if(swapDish(di,j)) ok++; else ng++; } }));
    render(); toast(ng?`${ok}品を差し替えました（${ng}品は代わりが見つかりませんでした）`:`↻ ${ok}品を今の設定に合う料理に差し替えました`); },
  weekendMode:ds=>{ S.weekendMode=ds.m; render(); toast({quick:'休日も時短料理で組みます',sun:'日曜の主菜をごちそうにします',both:'土日の主菜をごちそうにします'}[ds.m]+'（次の献立作成から。今の献立は各曜日のボタンで変更できます）'); },
  swapMode:ds=>{ if(swapDish(+ds.d,0,ds.m)){ render(); toast(ds.m==='gochiso'?'🍷 ごちそうに変更しました':'⚡ 時短の料理に変更しました'); } else toast(ds.m==='gochiso'?'手持ちの食材・設定で作れるごちそうがありません':'他に条件を満たす料理がありません'); },
  swap:ds=>{ if(swapDish(+ds.d,+ds.j)){ render(); toast('↻ 別のアレンジに差し替えました'); } else toast('他に条件を満たす組み合わせがありません'); },
  addOpen:ds=>{ ADD_OPEN=+ds.d; render(); },
  shareApp:async()=>{ const r=await shareApp(); if(r==='copied') toast('📋 アプリのリンクをコピーしました。LINEなどに貼り付けて送ってください'); },
  wantSheet:()=>{ const had=!!$('#sheet').innerHTML; WANT_Q=''; WANT_CACHE={}; renderWantSheet(); if(!had) pushOv(); setTimeout(()=>{ const i=$('#want_q'); if(i&&!('ontouchstart' in window)) i.focus(); },50); },
  wantDay:ds=>{ WANT_DAY=+ds.v; renderWantSheet(); },
  wantMore:()=>{ WANT_CACHE={}; const el=$('#want_res'); if(el) el.innerHTML=wantResultsHTML(WANT_Q); },
  wantPick:ds=>wantApply(ds.ref,WANT_DAY),
  wantThis:ds=>wantApply(ds.ref,0),
  addDish:ds=>{ const p=S.draft; if(!p) return; const before=JSON.stringify(p.days); const d=addDishToDay(p,+ds.d,ds.t); ADD_OPEN=-1;
    if(!d){ render(); toast(`追加できる${ds.t}が見つかりませんでした（使うジャンル・ストックを確認してください）`); return; }
    p.confirmed=false; render(); toast(`＋ ${ds.t}「${dishName(d)}」を追加しました`, ()=>{ p.days=JSON.parse(before); render(); }); },
  rmDish:ds=>{ const p=S.draft; if(!p) return; const day=p.days[+ds.d]; if(!day||+ds.j<1) return; const before=JSON.stringify(p.days);
    const x=day.dishes.splice(+ds.j,1)[0]; p.confirmed=false; render(); toast(`「${dishName(x)}」を外しました`, ()=>{ p.days=JSON.parse(before); render(); }); },
  dishSet:ds=>{ S.dishSet=ds.v; const p=S.draft; let added=0, before=null;
    if(p&&p.days[p.days.length-1].date>=todayStr()){ before=JSON.stringify(p.days); added=fillDishSet(p); if(added) p.confirmed=false; }
    render(); toast(added?`品数を「${DISH_SETS[ds.v].label}」にしました。今の献立にも${added}品追加しました`:`品数を「${DISH_SETS[ds.v].label}」にしました（次の献立作成から）`, added?()=>{ p.days=JSON.parse(before); render(); }:null); },
  confirm:()=>{
    const p=S.draft; if(!p) return;
    p.people=S.people; p.confirmed=true; p.confirmedAt=Date.now();
    const old=S.history.find(h=>h.id===p.id);
    const copy=JSON.parse(JSON.stringify(p));
    copy.names=copy.days.map(d=>d.dishes.map(dishName));
    if(old){ copy.shopChecks=old.shopChecks; copy.seasonChecks=old.seasonChecks; ['prepDone','prepDoneAt','buySnapshot','prepChecks'].forEach(k=>{ if(old[k]!=null) copy[k]=old[k]; }); }   // 仕込み済みの状態は再確定しても保つ
    S.history=[copy,...S.history.filter(h=>h.id!==p.id)].slice(0,12);
    S.activePlanId=p.id; render(); toast('✅ 確定しました。買い物リストに反映！');
  },
  goWeek:()=>{ S.tab='plan'; S.mode='B'; render(); window.scrollTo(0,0); },
  // fav
  fav:ds=>{ const d=resolveRef(ds.ref); if(!d) return; if(d.rid){ ACTIONS.rFav({id:d.rid}); return; } toggleFav(d); render(); if(MODAL) renderModal(); },
  unfav:ds=>{ const keep=S.favorites.slice(); S.favorites=S.favorites.filter(f=>f.key!==ds.key); render(); toast('お気に入りから外しました', ()=>{ S.favorites=keep; render(); }); },
  favPri:()=>{ S.favPriority=!S.favPriority; render(); toast(S.favPriority?'お気に入りを優先採用します':'優先採用をOFFにしました'); },
  dictMode:ds=>{ S.dictMode=ds.m; S.dictSel=null; render(); },
  bookGenre:ds=>{ S.bookGenre=ds.v; render(); },
  bookType:ds=>{ S.bookType=ds.v; render(); },
  bookCan:()=>{ S.tab='fav'; S.dictMode='book'; S.bookType='can'; S.bookGenre='all'; BOOK_Q=''; render(); setTimeout(()=>{ const h=$('#dict_top'); h&&h.scrollIntoView({block:'start'}); window.scrollBy(0,-70); },60); },
  rFav:ds=>{ const id=ds.id; if(!RECIPE[id]) return; const had=isFavRecipe(id); const keep=(S.favRecipes||[]).slice();
    S.favRecipes=had?keep.filter(x=>x!==id):[id,...keep]; render(); if(MODAL) renderModal();
    toast(had?'お気に入りから外しました':'★ お気に入りに保存しました', had?()=>{ S.favRecipes=keep; render(); if(MODAL) renderModal(); }:null); },
  rPeople:ds=>{ if(!MODAL||MODAL.kind!=='recipe') return; MODAL.n=ds.n==='orig'?'orig':+ds.n; renderModal(); },
  rCook:ds=>{ const r=RECIPE[ds.id]; if(!r||!MODAL||MODAL.kind!=='recipe') return; const can=recipeCookable(r); if(!can&&!MODAL.planRef) return; const snap=snapshot(); const k=recipeServings(r,MODAL.n);
    const pref=MODAL.planRef?toPRef(MODAL.planRef):null; if(pref) forPlanDish(pref,x=>x.done=true);
    const msg=can?r.parts.map(id=>`${PART[id].short}−${consumeStock(id,k)}`).join('、'):'献立に記録しました'; MODAL.done=true; S.cooked.unshift({key:'R:'+r.id,at:Date.now(),parts:r.parts.slice()}); S.cooked=S.cooked.slice(0,30); S.suggestions=null; render(); renderModal();
    toast(`🍽 いただきます！ ${msg}`, ()=>{ if(pref) forPlanDish(pref,x=>delete x.done); if(MODAL&&MODAL.kind==='recipe') MODAL.done=false; restore(snap); }); },
  toRecipe:ds=>{ if(RECIPE[ds.id]) openModal('R:'+ds.id); },
  dictSel:ds=>{ S.dictSel=S.dictSel===ds.id?null:ds.id; render(); },
  // shop
  chkShop:ds=>{ const p=activePlan(); p.shopChecks[ds.id]=!p.shopChecks[ds.id]; render(); },
  chkPrep:ds=>{ const p=activePlan(); p.prepChecks[ds.id]=!p.prepChecks[ds.id]; render(); },
  chkSeason:ds=>{ const p=activePlan(); p.seasonChecks[ds.n]=!p.seasonChecks[ds.n]; render(); },
  prepDone:()=>{
    const p=activePlan(); const sh=computeShopping(p); let total=0;
    sh.items.forEach(i=>{ addStock(i.id,i.produced); total+=i.produced; p.prepChecks[i.id]=true; });
    p.buySnapshot=sh; p.prepDone=true; p.prepDoneAt=todayStr(); S.suggestions=null;
    render(); toast(`🎉 ${total}食分をストックに登録しました！`);
  },
  resetPrep:()=>{ const p=activePlan(); p.prepDone=false; p.buySnapshot=null; p.prepChecks={}; render(); },
  // modal
  open:ds=>{ openModal(ds.ref); if(MODAL) pushOv(); },
  closeModal:()=>closeModalUI(),
  stepck:ds=>{ const i=+ds.i; MODAL.checked.has(i)?MODAL.checked.delete(i):MODAL.checked.add(i); renderModal(); },
  wake:async()=>{ try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } else { wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){ toast('この端末では画面点灯を維持できません'); } renderModal(); },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='backdrop'){ if(e.target!==el) return; if(el.dataset.close==='sheet') ACTIONS.closeSheet(); else closeModalUI(); return; }
  const fn=ACTIONS[a]; if(fn){ e.preventDefault(); fn(el.dataset,el,e); }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.actChange==='stockSort'){ S.stockSort=t.value; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(TOUR) endTour(); else if(MODAL) closeModalUI(); else if($('#sheet').innerHTML) closeSheetUI(); } });

// ショートカット（?tab=plan など）から開いたとき
(()=>{ const t=new URLSearchParams(location.search).get('tab'); if(['stock','plan','fav','shop'].includes(t)){ S.tab=t; try{ history.replaceState(null,'',location.pathname); }catch(e){} } })();
render();
(()=>{ let msg=null; try{ msg=sessionStorage.getItem('kakezan-msg'); sessionStorage.removeItem('kakezan-msg'); }catch(e){} if(msg) setTimeout(()=>toast(msg),300); })();
if(isStandalone()) askPersist();
const INCOMING_HASH=(()=>{ const m=location.hash.match(/^#m=([0-9A-Za-z]+)/); if(!m) return null; const href=location.href; try{ history.replaceState(null,'',location.pathname); }catch(e){} try{ return Object.assign(shortToPlan(m[1]),{link:href}); }catch(e){ setTimeout(()=>toast('献立リンクを読み取れませんでした'),300); return null; } })();
window.addEventListener('hashchange',()=>{ const m=location.hash.match(/^#m=([0-9A-Za-z]+)/); if(!m) return; const href=location.href; try{ history.replaceState(null,'',location.pathname); }catch(e){}
  try{ INCOMING=Object.assign(shortToPlan(m[1]),{link:href}); if(TOUR) endTour(true); renderIncomingSheet(); pushOv(); }catch(e){ toast('献立リンクを読み取れませんでした'); } });
if(INCOMING_HASH){ INCOMING=INCOMING_HASH; S.tutorialSeen||(tipsReady=false); renderIncomingSheet(); pushOv(); }
else if(FRESH_INSTALL && isStandalone() && isIOS() && !instState().importAsked){ renderMigrateSheet(true); pushOv(); }
else if(!S.tutorialSeen) startWelcome(); else { tipsReady=true; maybeTip(); }
setTimeout(()=>updateFlow(false),3000);
</script>
