<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>かけ算ごはん｜下処理ストック×味付け 日替わり献立</title>
<style>
:root{
  --bg:#F8F7F4; --card:#FFFFFF; --green:#2E5A44; --green-l:#E6EFE9; --green-ll:#F1F6F2;
  --orange:#D96B27; --orange-d:#B9551A; --orange-l:#FBEDE3;
  --ink:#1F2A24; --sub:#56625B; --muted:#89928C; --line:#E9E5DD; --line2:#F1EEE8;
  --wa:#3B5BA9; --wa-l:#E7ECF8; --yo:#A8750A; --yo-l:#FBF0D6; --chu:#C0392B; --chu-l:#FBE4E1; --kan:#8E44AD; --kan-l:#F3E5F8;
  --ok:#2E7D4F; --ok-l:#E3F2E8; --soon:#B7791F; --soon-l:#FCF1DC; --over:#C0392B; --over-l:#FBE4E1;
  --radius:18px; --shadow:0 1px 2px rgba(31,42,36,.05),0 4px 14px rgba(31,42,36,.06);
  --nav-h:66px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
.wrap{max-width:560px;margin:0 auto}
/* header */
#hdr{position:sticky;top:0;z-index:30;background:rgba(248,247,244,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line2)}
.hdr-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16px;letter-spacing:.02em;color:var(--green)}
.ttl small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppl{display:flex;align-items:center;gap:6px;flex:none}
.help{width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--line);color:var(--green);font-weight:800;font-size:17px;flex:none;display:grid;place-items:center}
.seg{display:inline-flex;background:#EEEBE4;border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:34px;height:32px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);padding:0 6px}
.seg button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* main */
#main{max-width:560px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.sec-t h2{font-size:16px;margin:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec-t h2 .num{background:var(--green);color:#fff;font-size:11px;border-radius:99px;padding:1px 8px}
.sec-t small{color:var(--muted);font-size:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
.hero{background:linear-gradient(135deg,#2E5A44 0%,#3C7258 100%);color:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(46,90,68,.25);position:relative;overflow:hidden}
.hero:after{content:"×";position:absolute;right:-6px;top:-34px;font-size:150px;font-weight:900;opacity:.08;line-height:1}
.hero h1{font-size:18px;margin:0 0 4px}
.hero p{margin:0;font-size:12.5px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.13);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11px;opacity:.85}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:15px;font-weight:700;font-size:15px;padding:10px 14px;transition:transform .08s ease,filter .15s;text-align:center;line-height:1.35}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 4px 14px rgba(217,107,39,.32)}
.btn.primary:active{background:var(--orange-d)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(46,90,68,.25)}
.btn.outline{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.soft{background:var(--green-l);color:var(--green)}
.btn.ghost{background:transparent;color:var(--sub);min-height:40px;font-weight:600;font-size:13px}
.btn.sm{min-height:40px;font-size:13.5px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn-col{display:grid;gap:10px;margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip .c{font-size:11px;opacity:.75}
/* stock rows */
.grp-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
.list{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:none}
.srow.zero{opacity:.55}
.emo{width:44px;height:44px;border-radius:14px;background:var(--green-ll);display:grid;place-items:center;font-size:23px;flex:none}
.sinfo{flex:1;min-width:0}
.sinfo .nm{font-weight:700;font-size:15px;line-height:1.3}
.sinfo .un{font-size:11.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.st-freeze{background:#E3EEF8;color:#2C5F8A}
.st-fridge{background:#E3F2EF;color:#2B6E62}
.st-pantry{background:#F3EDE2;color:#7A5B2E}
.fr-ok{background:var(--ok-l);color:var(--ok)}
.fr-soon{background:var(--soon-l);color:var(--soon)}
.fr-today,.fr-over{background:var(--over-l);color:var(--over)}
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:14px;flex:none}
.stepper button{width:40px;height:44px;font-size:22px;font-weight:600;color:var(--green);display:grid;place-items:center}
.stepper button:active{background:var(--green-l);border-radius:14px}
.stepper .v{min-width:30px;text-align:center;font-weight:800;font-size:17px}
.stepper .v small{display:block;font-size:9px;color:var(--muted);font-weight:600;margin-top:-3px}
.del{width:40px;height:44px;color:var(--over);font-size:13px;font-weight:700;flex:none}
.empty{text-align:center;padding:30px 18px;color:var(--sub)}
.empty .big{font-size:44px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{margin:0 0 14px;font-size:13px}
.link{color:var(--sub);font-size:12.5px;text-decoration:underline;padding:10px;display:block;margin:10px auto 0}
/* genre */
.g{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.g-wa{background:var(--wa-l);color:var(--wa)} .g-yo{background:var(--yo-l);color:var(--yo)} .g-chu{background:var(--chu-l);color:var(--chu)} .g-kan{background:var(--kan-l);color:var(--kan)}
.gb-wa{background:var(--wa)} .gb-yo{background:var(--yo)} .gb-chu{background:var(--chu)} .gb-kan{background:var(--kan)}
.typ{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--line2);padding:2px 8px;border-radius:7px}
.mth{font-size:11.5px;color:var(--muted);font-weight:600}
/* mode seg */
.mode{display:grid;grid-template-columns:1fr 1fr;background:#EEEBE4;border-radius:15px;padding:4px;gap:4px;margin-bottom:14px}
.mode button{height:44px;border-radius:12px;font-weight:700;font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.mode button.on{background:#fff;color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* dish card */
.dish{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;position:relative;border-left:5px solid transparent}
.dish+.dish{margin-top:12px}
.dish.b-wa{border-left-color:var(--wa)} .dish.b-yo{border-left-color:var(--yo)} .dish.b-chu{border-left-color:var(--chu)} .dish.b-kan{border-left-color:var(--kan)}
.dish.done{opacity:.6}
.d-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.d-top .sp{flex:1}
.star{font-size:20px;line-height:1;color:#D9D3C7;width:34px;height:30px;display:grid;place-items:center}
.star.on{color:#E8A317}
.d-name{display:block;text-align:left;width:100%;font-size:17px;font-weight:800;line-height:1.4;margin:8px 0 8px;color:var(--ink)}
.d-name:after{content:" ›";color:var(--muted);font-weight:600}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px}
.fp{display:inline-flex;align-items:center;gap:3px;background:var(--green-ll);color:var(--green);border-radius:8px;padding:3px 8px;font-weight:700}
.fp.base{background:var(--orange-l);color:var(--orange-d)}
.fp.miss{background:#fff;border:1px dashed #cfc8bb;color:var(--sub)}
.fp .s{font-size:10px;font-weight:700;opacity:.8}
.fx{color:var(--muted);font-weight:800;font-size:12px}
.d-act{margin-top:12px;display:flex;gap:8px}
.d-act .btn{min-height:44px;font-size:13.5px}
.warn{font-size:11.5px;color:var(--soon);margin-top:8px;font-weight:600}
.sub-dish{display:flex;align-items:center;gap:10px;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:10px}
.sub-dish .sdn{flex:1;min-width:0;text-align:left}
.sub-dish .sdn b{display:block;font-size:14.5px;line-height:1.4}
.sub-dish .sdn .d-top{margin-bottom:3px}
.swap{flex:none;height:36px;padding:0 10px;border-radius:10px;background:var(--bg);color:var(--green);font-size:12px;font-weight:700;white-space:nowrap}
.swap:active{background:var(--green-l)}
/* week */
.week-sum{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.wk-range{font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 10px}
.vcell{border-radius:10px;color:#fff;text-align:center;padding:5px 0 6px;font-weight:800}
.vcell small{display:block;font-size:10px;opacity:.85;font-weight:700}
.vcell span{font-size:15px}
.gcount{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.wk-meta{font-size:12px;color:var(--sub);margin-top:8px}
.day{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:0;overflow:hidden}
.day+.day{margin-top:12px}
.day-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--green-ll);font-weight:800;color:var(--green);font-size:14px}
.day-h .dot{width:10px;height:10px;border-radius:50%}
.day-b{padding:12px 14px 12px}
.day-main .d-name{font-size:16.5px;margin-top:6px}
.confirm-bar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);margin-top:16px;z-index:5}
.status{display:flex;align-items:center;gap:8px;background:var(--ok-l);color:var(--ok);font-weight:700;font-size:13px;border-radius:12px;padding:9px 12px;margin-bottom:12px}
.status.chg{background:var(--soon-l);color:var(--soon)}
/* fav / dict */
.switch-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--green-ll);border-radius:14px;margin-top:12px}
.switch-row .tx{flex:1;font-size:13px;font-weight:700;color:var(--green)}
.switch-row .tx small{display:block;font-weight:500;color:var(--sub);font-size:11.5px}
.sw{width:52px;height:30px;border-radius:99px;background:#CFCAC0;position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--green)} .sw.on:after{left:25px}
.fav-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.fav-row:last-child{border-bottom:none}
.fav-row .fx2{flex:1;min-width:0;text-align:left}
.fav-row .fx2 b{display:block;font-size:14.5px;line-height:1.4;margin-top:3px}
.x{width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:18px;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pbtn{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 6px 8px;text-align:center;position:relative;min-height:74px}
.pbtn .e{font-size:22px;display:block;line-height:1.2}
.pbtn .n{font-size:11.5px;font-weight:700;line-height:1.25;display:block;margin-top:3px}
.pbtn.on{border-color:var(--green);background:var(--green-ll)}
.pbtn .cnt{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.pbtn .cnt:empty{display:none}
.pbtn:active{transform:scale(.96)}
.gtab{display:flex;gap:6px;flex-wrap:wrap}
.bbtn{height:34px;padding:0 11px;border-radius:10px;font-size:12.5px;font-weight:700;border:1.5px solid transparent}
.bbtn.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.dict-row{padding:12px 14px;border-bottom:1px solid var(--line2)}
.dict-row:last-child{border-bottom:none}
.dict-row .dn{display:block;text-align:left;font-weight:800;font-size:14.5px;line-height:1.4;margin:5px 0 7px}
.mini{display:flex;flex-wrap:wrap;gap:5px}
.mini button{height:30px;padding:0 9px;border-radius:9px;background:var(--bg);font-size:12px;font-weight:600;color:var(--sub);border:1px solid var(--line)}
.mini button:active{background:var(--green-l)}
.mini .lbl{font-size:11px;color:var(--muted);align-self:center;margin-right:2px}
.info-box{background:var(--orange-l);border-radius:14px;padding:12px 14px;font-size:13px;color:#7a3d12}
.info-box b{color:var(--orange-d)}
/* shop */
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step-n{background:var(--orange);color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:3px 9px;flex:none}
.step-h h3{margin:0;font-size:16px;flex:1}
.prog{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.sec-name{font-size:12px;font-weight:800;color:var(--green);margin:16px 0 4px;display:flex;align-items:center;gap:6px}
.chk{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.chk:last-child{border-bottom:none}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #CBC4B7;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;margin-top:1px;transition:all .15s}
.chk.on .box{background:var(--green);border-color:var(--green)}
.chk .ct{flex:1;min-width:0}
.chk .ct b{display:block;font-size:15px;line-height:1.4}
.chk .ct small{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.chk .ct p{margin:4px 0 0;font-size:13px;color:var(--sub);line-height:1.6}
.chk.on .ct b{text-decoration:line-through;color:var(--muted)}
.chk .amt{font-weight:800;color:var(--orange-d);white-space:nowrap;font-size:14px;flex:none;margin-top:1px}
.chk.on .amt{color:var(--muted)}
.covered{font-size:12.5px;color:var(--sub);background:var(--green-ll);border-radius:12px;padding:10px 12px;margin-top:12px}
.stag{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stag button{height:32px;padding:0 11px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--sub)}
.stag button.on{background:var(--green-l);border-color:var(--green-l);color:var(--green);text-decoration:line-through}
.tip{font-size:12px;color:var(--sub);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px}
/* tutorial */
.tut-bk{position:fixed;inset:0;z-index:80;background:rgba(20,28,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
.tut{position:relative;background:#fff;border-radius:24px;width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow-y:auto;padding:18px 20px 18px;animation:up .22s ease;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.tut-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tut-top span{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.tut-top button{font-size:13px;font-weight:700;color:var(--sub);height:34px;padding:0 10px;border-radius:10px}
.tut-ill{min-height:132px;border-radius:18px;background:var(--green-ll);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding:14px;text-align:center}
.tut-ill .big{font-size:52px;line-height:1}
.tut-ill .eq{width:100%;font-weight:800;color:var(--green);font-size:15px;margin-top:4px}
.tut h2{font-size:20px;margin:0 0 8px;color:var(--green);line-height:1.4}
.tut p{margin:0;font-size:14.5px;line-height:1.8;color:var(--sub)}
.tut p b{color:var(--ink)}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0 14px}
.dots i{width:7px;height:7px;border-radius:9px;background:#D5CFC4;transition:all .2s}
.dots i.on{width:22px;background:var(--green)}
.tut-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.tut-nav.one{grid-template-columns:1fr}
.ck-row{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--sub);margin:14px auto 0;padding:6px 10px}
.ck-row .box{width:22px;height:22px;border-radius:7px;font-size:13px}
.ck-row.on .box{background:var(--green);border-color:var(--green)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;background:#fff;border-radius:14px;box-shadow:var(--shadow);font-weight:700;font-size:15px}
.menu-item+.menu-item{margin-top:8px}
.menu-item .mi{width:38px;height:38px;border-radius:12px;background:var(--green-ll);display:grid;place-items:center;font-size:19px;flex:none}
.menu-item small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.menu-item.danger{color:var(--over)}
.preset{display:block;width:100%;text-align:left;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px;border:1.5px solid transparent}
.preset+.preset{margin-top:10px}
.preset b{display:block;font-size:15.5px;color:var(--green)}
.preset small{display:block;font-size:12px;color:var(--sub);margin:2px 0 8px}
.preset .em{font-size:20px;letter-spacing:2px;line-height:1.4}
.preset:active{border-color:var(--green)}

.pk-row:last-child{border-bottom:none}

.pk-row small{display:block;font-size:12px;color:var(--muted);margin:2px 0 6px;line-height:1.5}
.tagb{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tagx{font-size:10px;font-weight:800;color:var(--orange-d);background:var(--orange-l);padding:1px 6px;border-radius:6px;margin-left:3px;white-space:nowrap}

.nav-in button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);position:relative}
.nav-in button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-in button.on{color:var(--green)}
.nav-in button.on:before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.nav-in .bdg{position:absolute;top:7px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:99px;background:var(--orange);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

.ratio{background:var(--orange-l);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;font-weight:700;color:#7a3d12}
.ratio span{display:block;font-size:11px;font-weight:700;color:var(--orange-d);letter-spacing:.06em}
.ksteps{list-style:none;margin:0;padding:0;counter-reset:s}

.ksteps li:before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800;margin-top:2px}

.kit-foot{display:grid;gap:10px;margin-top:16px}
.wake{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--sub);font-weight:700;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.wake.on{background:var(--green-l);color:var(--green);border-color:var(--green-l)}
/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%) translateY(-16px);background:#22302A;color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.mt0{margin-top:0}

// 有効な味付け一覧（BASES）を、基本＋ONの追加調味料＋自作で組み立て直す
function customToBase(c){
  const req={ protein:c.dishType==='主菜'?[1,1]:[0,1], veg:[1,2], proteinReady:c.method==='和えるだけ' };
  const seas=c.seasonings.map(x=>Object.assign({},x));
  if(c.method==='鍋' && !seas.some(x=>x.n==='水')) seas.unshift({n:'水',ml:180,k:'x',auto:true});
  return normBase({ id:c.id, name:c.name, suffix:c.name, genre:c.genre, dishType:c.dishType, method:c.method, time:CUSTOM_TIME[c.method]||'5分',
    requiredCategories:req, pOnly:c.method==='和えるだけ'?[]:PARTS.filter(p=>p.category==='protein'&&!['p_egg','p_tuna','p_saba'].includes(p.id)).map(p=>p.id), vOnly:[], seasonings:seas, finishSteps:(c.steps&&c.steps.length)?c.steps:CUSTOM_STEPS[c.method],
    mwBase:3, mwRaw:2, custom:true, hidden:!!c.hidden });
}
// 持っている調理器具で作れる味付けか
const hasEq = id=>!!(S.equip&&S.equip[id]);
function equipReq(b){ return b.equip || METHOD_EQUIP[b.method] || {all:[]}; }
function equipOK(b){ const r=equipReq(b); return r.all.every(hasEq) && (!r.any || r.any.some(hasEq)); }
function rebuildBases(){
  S.extraOn=(S.extraOn||[]).filter(id=>EXTRA_PACKS.some(p=>p.id===id));
  S.equip=Object.assign({},DEFAULT_EQUIP,S.equip||{});
  const customs=(S.customBases||[]).map(customToBase);
  BASES.length=0;
  CORE_BASES.forEach(b=>{ if(equipOK(b)) BASES.push(b); });
  EXTRA_PACKS.forEach(pk=>{ if(S.extraOn.includes(pk.id)) pk.bases.forEach(b=>{ if(equipOK(b)) BASES.push(b); }); });
  EQUIPMENT.forEach(eq=>eq.bases.forEach(b=>{ if(equipOK(b)) BASES.push(b); }));
  customs.forEach(b=>{ if(!b.hidden && equipOK(b)) BASES.push(b); });
  Object.keys(BASE).forEach(k=>delete BASE[k]);
  CORE_BASES.forEach(b=>BASE[b.id]=b);
  EXTRA_PACKS.forEach(pk=>pk.bases.forEach(b=>BASE[b.id]=b));
  EQUIPMENT.forEach(eq=>eq.bases.forEach(b=>BASE[b.id]=b));
  customs.forEach(b=>BASE[b.id]=b);
}
// 保存データの点検（存在しない食材・味付けを参照するデータを取り除き、画面が壊れないようにする）
function sanitizeState(){
  const okDish=d=>!!(d&&BASE[d.baseId]&&(!d.p||PART[d.p])&&Array.isArray(d.v)&&d.v.length&&d.v.every(v=>PART[v]));
  const okPlan=p=>!!(p&&Array.isArray(p.days)&&p.days.every(d=>d&&Array.isArray(d.dishes)&&d.dishes.every(okDish)));
  S.stock=(Array.isArray(S.stock)?S.stock:[]).filter(b=>b&&PART[b.partId]&&b.count>0&&STORAGE[b.storage]&&/^\d{4}-\d{2}-\d{2}$/.test(b.addedAt||''));
  S.favorites=(Array.isArray(S.favorites)?S.favorites:[]).filter(okDish);
  if(S.suggestions) S.suggestions=Array.isArray(S.suggestions)?S.suggestions.filter(okDish):null;
  if(S.draft&&!okPlan(S.draft)) S.draft=null;
  S.history=(Array.isArray(S.history)?S.history:[]).filter(okPlan);
  if(S.activePlanId&&!S.history.some(h=>h.id===S.activePlanId)) S.activePlanId=null;
  if(![1,2,3,4].includes(S.people)) S.people=2;
  if(![1,2,4].includes(S.addQty)) S.addQty=1;
  if(!['stock','plan','fav','shop'].includes(S.tab)) S.tab='stock';
  if(!S.addLog||typeof S.addLog!=='object') S.addLog={};
  ['seenKeys','cooked'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
}
rebuildBases();
sanitizeState();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return DEFAULT_STATE();
    return Object.assign(DEFAULT_STATE(), JSON.parse(raw));

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function weightedPick(arr, scoreFn){
  const w = arr.map(x=>Math.exp(Math.max(-6,Math.min(6,scoreFn(x)))*0.7));
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<arr.length;i++){ r-=w[i]; if(r<=0) return arr[i]; }
  return arr[arr.length-1];
}
const ymd = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayStr = ()=>ymd(new Date());
const addDays = (s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const daysSince = s=>Math.round((parseYmd(todayStr())-parseYmd(s))/864e5);
const WD = ['日','月','火','水','木','金','土'];
const fmtDate = s=>{const d=parseYmd(s);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;};
const fmtMD = s=>{const d=parseYmd(s);return `${d.getMonth()+1}/${d.getDate()}`;};
function upcomingMonday(){ const d=new Date(); d.setHours(0,0,0,0); const w=d.getDay(); d.setDate(d.getDate()+(w===1?0:(8-w)%7)); return ymd(d); }

function frac(x){
  const w=Math.floor(x+1e-9); const f=Math.round((x-w)*4)/4;
  if(f>=1) return String(w+1);
  const fs={0.25:'1/4',0.5:'1/2',0.75:'3/4'}[f];
  if(!fs) return String(w);
  return w ? `${w}と${fs}` : fs;
}
function fmtSpoon(t){
  if(t<0.2) return '少々';
  if(t<3){ const r = t<1 ? Math.round(t*4)/4 : Math.round(t*2)/2; return '小さじ'+frac(r); }
  const r=Math.round(t*2)/2, tb=Math.floor(r/3), rem=r-tb*3;
  if(rem===0) return '大さじ'+tb;
  if(rem===1.5) return '大さじ'+frac(tb+0.5);
  return `大さじ${tb}＋小さじ${frac(rem)}`;
}
function fmtSeason(s,n){
  if(s.tsp!=null) return fmtSpoon(s.tsp*n);
  if(s.ml!=null) return Math.round(s.ml*n)+'ml';
  if(s.g!=null) return Math.round(s.g*n)+'g';
  if(s.cm!=null) return frac(Math.round(s.cm*n*2)/2)+'cm';
  return s.text;
}
function goldenRatio(b){
  const it=b.seasonings.filter(s=>s.tsp!=null && s.k!=='x' && s.k!=='oil' && s.tsp>=0.5);
  if(it.length<2) return '';
  const m=Math.min(...it.map(s=>s.tsp));
  return it.map(s=>`${s.n.replace(/（.*?）/g,'')} ${frac(Math.round(s.tsp/m*2)/2)}`).join(' ： ');
}

/* ---------- stock helpers ---------- */
function lifeDays(p,st){
  if(st===p.storageType) return p.shelfLifeDays;
  if(st==='fridge') return p.fridgeDays||3;
  if(st==='freeze') return p.freezeDays||21;
  return p.storageType==='pantry' ? p.shelfLifeDays : (p.fridgeDays||3);
}
function freshness(b){
  const p=PART[b.partId], life=lifeDays(p,b.storage), el=daysSince(b.addedAt), rem=life-el;
  let cls='ok', txt=`あと${rem}日`;
  if(rem<0){cls='over';txt='消費目安超過';}
  else if(rem===0){cls='today';txt='今日中に';}
  else if(rem<=2){cls='soon';txt=`あと${rem}日・早めに`;}
  return {cls,txt,rem,el,life};
}
const stockCount = id=>S.stock.filter(b=>b.partId===id).reduce((a,b)=>a+b.count,0);
function stockMap(){ const m={}; S.stock.forEach(b=>{m[b.partId]=(m[b.partId]||0)+b.count;}); return m; }
function minRemain(id){ const r=S.stock.filter(b=>b.partId===id&&b.count>0).map(b=>freshness(b).rem); return r.length?Math.min(...r):99; }
function addStock(partId,n,storage,date){
  const st=storage||PART[partId].storageType, d=date||todayStr();
  const ex=S.stock.find(b=>b.partId===partId&&b.addedAt===d&&b.storage===st);
  if(ex) ex.count+=n; else S.stock.push({uid:uid(),partId,count:n,storage:st,addedAt:d});
}
function consumeStock(partId,n){
  let need=n;
  const bs=S.stock.filter(b=>b.partId===partId&&b.count>0).sort((a,b)=>a.addedAt<b.addedAt?-1:1);
  for(const b of bs){ const t=Math.min(b.count,need); b.count-=t; need-=t; if(need<=0) break; }
  S.stock=S.stock.filter(b=>b.count>0);
  return n-need;
}
function stockPool(){
  const m=stockMap(), ids=Object.keys(m).filter(id=>m[id]>0&&PART[id]);
  return { protein:ids.filter(id=>PART[id].category==='protein'), veg:ids.filter(id=>PART[id].category==='veg') };
}

/* =====================================================================
   6. パーツ × 味付けの掛け算エンジン
   ===================================================================== */
function compat(b,p,role){
  if(!p.compatibleTags.includes(b.genre)) return false;
  if(role==='protein'){
    if(p.category!=='protein') return false;
    if(b.requiredCategories.proteinReady && !p.ready) return false;
    return !b.pOnly.length || b.pOnly.includes(p.id);
  }
  if(p.category!=='veg') return false;
  return !b.vOnly.length || b.vOnly.includes(p.id);
}
function makeDish(b,p,vs){
  return { key:`${b.id}|${p||'-'}|${[...vs].sort().join('+')}`, baseId:b.id, p:p||null, v:[...vs], type:b.dishType, genre:b.genre };
}
const dishParts = d=>(d.p?[d.p]:[]).concat(d.v);
function dishName(d){
  const b=BASE[d.baseId]; const vn=d.v.map(id=>PART[id].short);
  const head = d.p ? `${PART[d.p].short}と${vn.join('・')}` : vn.join('と');
  return `${head}の${b.suffix}`;
}
function pickVegs(b,pool,k,sf,avoid){
  const cand=pool.filter(id=>compat(b,PART[id],'veg'));
  const chosen=[];
  for(let i=0;i<k;i++){
    const c=cand.filter(id=>!chosen.includes(id)&&!chosen.some(x=>PART[x].group===PART[id].group));
    if(!c.length) break;
    chosen.push(weightedPick(c,id=>sf(id)-(avoid&&avoid.includes(id)?2:0)));
  }
  return chosen;
}
function randomCombo(b,o){
  const rc=b.requiredCategories;
  const pc=o.pool.protein.filter(id=>compat(b,PART[id],'protein'));
  let p=null;
  if(rc.protein[0]>=1){ if(!pc.length) return null; p=weightedPick(pc,o.partScore); }
  else if(rc.protein[1]>=1 && pc.length && Math.random()<(o.sideProteinRate??ARRANGE_RULES.sideProteinRate)) p=weightedPick(pc,o.partScore);
  const k = rc.veg[1]>=2 && Math.random()<(b.twoVeg??0.35) ? 2 : rc.veg[0];
  let vs=pickVegs(b,o.pool.veg,k,o.partScore,o.avoidVeg);
  if(vs.length<rc.veg[0]) return null;
  return makeDish(b,p,vs);
}
function favKeySet(){ return new Set(S.favorites.map(f=>f.key)); }
function scoreDish(d,o,favs){
  let s=Math.random()*1.4;
  dishParts(d).forEach(id=>{ s+=o.partScore(id)*0.5; });
  if(o.genreCount) s-=(o.genreCount[d.genre]||0)*1.3;
  if(o.genreCount && (o.genreCount[d.genre]||0)>=ARRANGE_RULES.maxSameGenrePerWeek) s-=2;
  if(o.baseCount) s-=(o.baseCount[d.baseId]||0)*2;
  if(o.softKeys && o.softKeys.has(d.key)) s-=3;
  if(o.avoidVeg) s-=d.v.filter(x=>o.avoidVeg.includes(x)).length*1.2;
  if(S.favPriority && favs.has(d.key)) s+=ARRANGE_RULES.favoriteBonus;
  return s;
}
function dishAllowed(d,h){
  if(h.genres && h.genres.has(d.genre)) return false;
  if(h.bases && h.bases.has(d.baseId)) return false;
  if(h.keys && h.keys.has(d.key)) return false;
  if(h.bp && h.bp.has(d.baseId+'|'+d.p)) return false;
  if(h.must && h.must.has(d.key)) return false;
  return true;
}
function searchDish(o,h){
  const favs=favKeySet();
  let best=null, bestS=-1e9;
  for(const b of shuffle(BASES.filter(x=>x.dishType===o.type))){
    if(h.genres && h.genres.has(b.genre)) continue;
    if(h.bases && h.bases.has(b.id)) continue;
    for(let t=0;t<3;t++){
      const d=randomCombo(b,o); if(!d) break;
      if(!dishAllowed(d,h)) continue;
      const s=scoreDish(d,o,favs);
      if(s>bestS){best=d;bestS=s;}
    }
  }
  // お気に入り優先採用：条件を満たすお気に入りを候補に追加
  if(S.favPriority){
    const inPool=new Set([...o.pool.protein,...o.pool.veg]);
    S.favorites.forEach(f=>{
      const b=BASE[f.baseId]; if(!b||b.dishType!==o.type) return;
      const d=makeDish(b,f.p,f.v);
      if(!dishParts(d).every(id=>inPool.has(id))) return;
      if(!dishAllowed(d,h)) return;
      const s=scoreDish(d,o,favs)+0.5;
      if(s>bestS){best=d;bestS=s;}
    });
  }
  return best;
}
function generateDish(o){
  const h=o.hard||{};
  const tiers=[h, {keys:h.keys,must:h.must,genres:h.genres}, {must:h.must,keys:h.keys}, {must:h.must}];
  for(const t of tiers){ const d=searchDish(o,t); if(d) return d; }
  return null;
}

/* ---------- モードA：今あるストックから今日のアレンジ提案 ---------- */
function modeAScore(used){
  return id=>{
    const c=stockCount(id); let s=c>=S.people?1.5:0.3;
    const r=minRemain(id); if(r<=1) s+=2; else if(r<=3) s+=1;   // 期限が近いものを優先
    s-=(used[id]||0)*(PART[id].category==='protein'?1.6:0.6);
    return s;
  };
}
function swapSuggestion(i){
  const cur=S.suggestions[i]; if(!cur) return false;
  const others=S.suggestions.filter((_,k)=>k!==i), used={};
  others.forEach(d=>dishParts(d).forEach(id=>used[id]=(used[id]||0)+1));
  const d=generateDish({ type:cur.type, pool:stockPool(), partScore:modeAScore(used), avoidVeg:others.flatMap(x=>x.v), sideProteinRate:0.3,
    hard:{ genres: cur.type==='主菜'?new Set(others.filter(x=>x.type==='主菜').map(x=>x.genre)):null,
      bases:new Set([cur.baseId,...others.map(x=>x.baseId)]), keys:new Set(S.seenKeys), must:new Set(S.suggestions.map(x=>x.key)) } });
  if(!d) return false;
  S.suggestions[i]=d; S.seenKeys=[d.key,...S.seenKeys].slice(0,150); return true;
}
function makeSuggestions(){
  const pool=stockPool();
  if(!pool.veg.length && !pool.protein.length){ S.suggestions=[]; return; }
  const seen=new Set(S.seenKeys), cookedKeys=new Set(S.cooked.slice(0,10).map(c=>c.key));
  const res=[], used={}, genreCount={}, baseCount={};
  const partScore=modeAScore(used);
  const slots=[];
  if(pool.protein.length) slots.push('主菜','主菜','主菜');
  if(pool.veg.length){ slots.push('副菜'); slots.push(Math.random()<0.5?'汁物':'副菜'); if(!pool.protein.length) slots.push('副菜','汁物'); }
  for(const type of slots){
    const must=new Set(res.map(d=>d.key));
    const mainGenres=new Set(res.filter(d=>d.type==='主菜').map(d=>d.genre));
    const d=generateDish({ type, pool, partScore, genreCount, baseCount, softKeys:cookedKeys,
      avoidVeg: res.flatMap(x=>x.v), sideProteinRate:0.3,
      hard:{ genres: type==='主菜'?mainGenres:null, bases:new Set(res.map(x=>x.baseId)), keys:seen, must } });
    if(!d) continue;
    res.push(d); genreCount[d.genre]=(genreCount[d.genre]||0)+1; baseCount[d.baseId]=(baseCount[d.baseId]||0)+1;
    dishParts(d).forEach(id=>used[id]=(used[id]||0)+1);
  }
  S.suggestions=res;
  S.seenKeys=[...res.map(d=>d.key),...S.seenKeys].slice(0,150);
}

/* ---------- モードB：1週間の日替わり献立 ---------- */
function selectCore(stockIds, avoidParts){
  const pick=(cat,target,maxStock)=>{
    const stocked=stockIds.filter(id=>PART[id].category===cat).sort((a,b)=>stockCount(b)-stockCount(a)).slice(0,maxStock);
    const out=[...stocked];
    let others=shuffle(PARTS.filter(p=>p.category===cat&&!out.includes(p.id)).map(p=>p.id));
    if(avoidParts) others.sort((a,b)=>(avoidParts[a]||0)-(avoidParts[b]||0));
    while(out.length<target && others.length){
      // 野菜は系統（group）がばらけるように補充
      let idx=0;
      if(cat==='veg'){ const gs=new Set(out.map(x=>PART[x].group)); const j=others.findIndex(x=>!gs.has(PART[x].group)); if(j>=0) idx=j; }
      out.push(others.splice(idx,1)[0]);
    }
    return out;
  };
  const pT=ARRANGE_RULES.coreProteins+(Math.random()<0.5?1:0), vT=ARRANGE_RULES.coreVegs+(Math.random()<0.5?1:0);
  return { protein:pick('protein',pT,6), veg:pick('veg',vT,8) };
}
function generateWeek(different){
  const people=S.people, last=S.history[0];
  const histKeys=new Set(), histBP=new Set(), lastParts={};
  if(last) last.days.forEach(day=>day.dishes.forEach(d=>{ histKeys.add(d.key); histBP.add(d.baseId+'|'+d.p); dishParts(d).forEach(id=>lastParts[id]=(lastParts[id]||0)+1); }));
  const pool0=stockPool();
  const core=selectCore([...pool0.protein,...pool0.veg], different?lastParts:null);
  const virtual=stockMap(), usage={}, weekKeys=new Set(), genreCount={}, baseCount={};
  let start=upcomingMonday();
  if(different && last && last.weekStart>=start) start=addDays(last.weekStart,7);
  const days=[];
  const apply=(d,isMain)=>{
    weekKeys.add(d.key); baseCount[d.baseId]=(baseCount[d.baseId]||0)+1;
    if(isMain) genreCount[d.genre]=(genreCount[d.genre]||0)+1;
    dishParts(d).forEach(id=>{ usage[id]=(usage[id]||0)+1; virtual[id]=(virtual[id]||0)-people; });
  };
  for(let i=0;i<7;i++){
    const prev=days[i-1], prevMain=prev&&prev.dishes[0];
    const prevBases=new Set(prev?prev.dishes.map(x=>x.baseId):[]);
    const partScore=id=>{
      let s=0; const vv=virtual[id]||0;
      if(vv>=people) s+=ARRANGE_RULES.stockBonus; else if(vv>0) s+=1;
      const u=usage[id]||0;
      if(PART[id].category==='veg') s+=Math.min(u,2)*0.4-(u>=4?1:0);
      else s+= u>=2 ? -(u-1)*1.2 : 0.3*u;
      if(prevMain && prevMain.p===id) s-=2.5;
      if(different && lastParts[id]) s-=0.4;
      return s;
    };
    const hard={ genres: prevMain?new Set([prevMain.genre]):null, bases:prevBases, must:weekKeys,
      keys: different?histKeys:null, bp: different?histBP:null };
    const main=generateDish({ type:'主菜', pool:core, partScore, genreCount, baseCount, softKeys:histKeys, hard });
    const dishes=[];
    if(main){ dishes.push(main); apply(main,true); }
    const nSide = Math.random()<0.5?1:2;
    const types = nSide===1 ? [Math.random()<0.3?'汁物':'副菜'] : ['副菜', Math.random()<0.6?'汁物':'副菜'];
    for(const type of types){
      const today=new Set(dishes.map(x=>x.baseId));
      const d=generateDish({ type, pool:core, partScore, baseCount, softKeys:histKeys, avoidVeg:dishes.flatMap(x=>x.v),
        hard:{ bases:new Set([...prevBases,...today]), must:new Set([...weekKeys]), keys: different?histKeys:null, bp: different?histBP:null } });
      if(d){ dishes.push(d); apply(d,false); }
    }
    days.push({ date:addDays(start,i), dishes });
  }
  return { id:uid(), weekStart:start, people, core, days, createdAt:Date.now(), different:!!different, confirmed:false };
}
function swapDish(di,j){
  const plan=S.draft, day=plan.days[di], cur=day.dishes[j];
  const prev=plan.days[di-1], next=plan.days[di+1];
  const genres=new Set(); if(cur.type==='主菜'){ if(prev&&prev.dishes[0]) genres.add(prev.dishes[0].genre); if(next&&next.dishes[0]) genres.add(next.dishes[0].genre); }
  const bases=new Set([cur.baseId]); [prev,next,day].forEach(d=>d&&d.dishes.forEach((x,k)=>{ if(!(d===day&&k===j)) bases.add(x.baseId); }));
  const must=new Set(); plan.days.forEach(d=>d.dishes.forEach(x=>must.add(x.key)));
  const sp0=stockPool();
  const pool={ protein:[...new Set([...plan.core.protein,...sp0.protein])], veg:[...new Set([...plan.core.veg,...sp0.veg])] };
  const usage={}; plan.days.forEach(d=>d.dishes.forEach(x=>dishParts(x).forEach(id=>usage[id]=(usage[id]||0)+1)));
  const sm=stockMap();
  const partScore=id=>{ let s=(sm[id]||0)>=plan.people?1.5:0; s+=PART[id].category==='veg'?Math.min(usage[id]||0,2)*0.3:0; if(id===cur.p) s-=1.5; return s; };
  const others=day.dishes.filter((_,k)=>k!==j).flatMap(x=>x.v);
  const d=generateDish({ type:cur.type, pool, partScore, avoidVeg:others, hard:{genres:genres.size?genres:null, bases, must} });
  if(!d) return false;
  day.dishes[j]=d; plan.confirmed=false; return true;
}

/* =====================================================================
   7. 調理手順の自動合成
   ===================================================================== */
const jn = arr=>arr.map(x=>x.short).join('・');
function prepText(b,all,people){
  if(b.method==='和えるだけ'){
    const raw=b.rawOk||[];
    const heat=all.filter(x=>!x.ready&&!raw.includes(x.id));
    const thaw=all.filter(x=>x.ready&&x.storageType==='freeze');
    const out=[];
    if(heat.length){ const m=Math.min(2+(people-1)+(heat.some(x=>x.storageType==='freeze')?1:0),6); out.push(hasEq('microwave') ? `${jn(heat)}は耐熱容器に入れてふんわりラップし、レンジ600Wで${m}分加熱して粗熱を取る`
      : hasEq('pot') ? `小鍋に湯を沸かして${jn(heat)}を1〜2分茹で、ザルに上げて粗熱を取る`
      : `フライパンに${jn(heat)}と水大さじ2を入れ、ふたをして中火で2〜3分蒸し焼きにして粗熱を取る`); }
    if(thaw.length) out.push(hasEq('microwave') ? `冷凍の${jn(thaw)}はレンジ600Wで1分ずつ様子を見ながら解凍し、水気をしっかり絞る`
      : `冷凍の${jn(thaw)}は前の晩に冷蔵庫へ移して自然解凍（急ぐときは保存袋ごと流水で解凍）し、水気をしっかり絞る`);
    return out.length ? out.join('。')+'。' : '';
  }
  const fr=all.filter(x=>x.storageType==='freeze');
  return fr.length ? `冷凍ストック（${jn(fr)}）は解凍不要。凍ったまま使えます。` : '';
}
function buildSteps(d,people){
  const b=BASE[d.baseId], p=d.p?PART[d.p]:null, vs=d.v.map(id=>PART[id]), all=(p?[p]:[]).concat(vs);
  const V=jn(vs), ALL=jn(all), P=p?p.short:'';
  const mw=(b.mwBase||2)+(p&&!p.ready?(b.mwRaw||0):0)+(people-1);
  const raw=p&&!p.ready, big=people>2;
  const tok={ OVEN:12+(raw?3:0)+(big?3:0), STEAM:8+(raw?2:0)+(big?2:0), AF:12+(big?3:0), GRILL:7+(raw?1:0)+(big?1:0),
    BAKE: hasEq('toaster') ? 'トースター（1000W）で5〜6分' : 'オーブン（230℃に予熱）で8〜10分' };
  const fry = !p ? `${V}を入れて2〜3分炒める`
    : p.ready ? `${V}を入れて2〜3分炒め、火が通ったら${p.fry}`
    : `${p.fry}。続けて${V}を加え、2〜3分炒め合わせる`;
  const sim = !p ? `${V}を入れ、ふたをして3〜4分、やわらかくなるまで煮る`
    : p.ready ? `${V}を入れてふたをし3〜4分煮て、やわらかくなったら${p.simmer}`
    : `${p.simmer}。${V}も加え、ふたをして3〜4分、野菜がやわらかくなるまで煮る`;
  const prep=prepText(b,all,people);
  return b.finishSteps.map(t=>{
    if(t.includes('{PREP}')) return prep ? t.replace('{PREP}',prep) : null;
    return t.replace(/\{FRY\}/g,fry).replace(/\{SIMMER\}/g,sim).replace(/\{MW\}/g,mw).replace(/\{(OVEN|STEAM|AF|GRILL|BAKE)\}/g,(m,k)=>tok[k]).replace(/\{ALL\}/g,ALL).replace(/\{V\}/g,V).replace(/\{P\}/g,P);
  }).filter(Boolean);
}

/* =====================================================================
   8. 買い物＆下処理リストの逆算
   ===================================================================== */
function activePlan(){ return S.history.find(h=>h.id===S.activePlanId)||null; }
function computeShopping(plan){
  if(plan.prepDone && plan.buySnapshot) return plan.buySnapshot;
  const need={};
  plan.days.forEach(d=>d.dishes.forEach(x=>dishParts(x).forEach(id=>need[id]=(need[id]||0)+plan.people)));
  const sm=stockMap(); const items=[], covered=[];
  Object.keys(need).forEach(id=>{
    const p=PART[id], pu=p.purchaseUnit, have=Math.min(sm[id]||0,need[id]), buyS=need[id]-have;
    if(buyS<=0){ covered.push({id,need:need[id]}); return; }
    const units=Math.ceil(buyS*p.grams/pu.grams/pu.step-1e-9)*pu.step;
    const produced=Math.floor(units*pu.grams/p.grams+1e-9);
    items.push({ id, need:need[id], have, buyS, units, produced, section:pu.section,
      label:`${pu.item} ${frac(units)}${pu.unit}`, grams:Math.round(units*pu.grams) });
  });
  items.sort((a,b)=>SECTIONS.indexOf(a.section)-SECTIONS.indexOf(b.section));
  return { items, covered };
}
function planSeasonings(plan){
  const set=new Map();
  plan.days.forEach(d=>d.dishes.forEach(x=>BASE[x.baseId].seasonings.forEach(s=>{
    const n=s.n.replace(/（.*?）/g,''); if(n==='水') return; set.set(n,(set.get(n)||0)+1);
  })));
  return [...set.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}

function combosCount(b){
  const P=PARTS.filter(p=>compat(b,p,'protein')).length, V=PARTS.filter(p=>compat(b,p,'veg')).length;
  const vc = b.requiredCategories.veg[1]>=2 ? V+V*(V-1)/2 : V;
  const pc = b.requiredCategories.protein[0]>=1 ? P : P+1;
  return Math.round(pc*vc);
}

    const grid=cat=>`<div class="pgrid">${PARTS.filter(p=>p.category===cat).map(p=>`<button class="pbtn ${sel===p.id?'on':''}" data-act="dictSel" data-id="${p.id}"><span class="e">${p.emoji}</span><span class="n">${esc(p.short)}</span></button>`).join('')}</div>`;
    html+=`<div class="grp-h mt0">🍖 タンパク質</div>${grid('protein')}<div class="grp-h">🥕 野菜・きのこ</div>${grid('veg')}`;
    if(sel) html+=dictByPart(sel); else html+=`<p class="hint">パーツを選ぶと、そのパーツを使ったアレンジを全味付け分表示します。</p>`;
  } else {
    const sel=BASE[S.dictSel]?S.dictSel:null;
    html+=GENRES.map(g=>`<div class="grp-h mt0" style="margin-top:12px">${gBadge(g)}</div><div class="gtab">${BASES.filter(b=>b.genre===g).map(b=>`<button class="bbtn g-${GCLS[g]} ${sel===b.id?'on':''}" data-act="dictSel" data-id="${b.id}">${esc(b.name)}${b.custom?'<span class="tagx">自作</span>':b.extra?'<span class="tagx">追加</span>':''}</button>`).join('')}</div>`).join('');

  }
  return html;
}
function dictByPart(id){
  const p=PART[id], isP=p.category==='protein';
  const list=BASES.filter(b=>compat(b,p,isP?'protein':'veg'));
  let n=0;
  const rows=GENRES.map(g=>{ const bs=list.filter(b=>b.genre===g); if(!bs.length) return '';
    return `<div class="grp-h">${gBadge(g)} ${bs.length}種</div><div class="list">${bs.map(b=>{
      if(isP){
        const vs=PARTS.filter(v=>compat(b,v,'veg')); n+=vs.length;
        const ex=makeDish(b,id,[vs[0].id]);
        return `<div class="dict-row"><div class="d-top"><span class="typ">${b.dishType}</span>${mLabel(b)}</div><button class="dn" data-act="open" data-ref="X:${b.id}:${id}:${vs[0].id}">${esc(dishName(ex))}</button>
          <div class="mini"><span class="lbl">合わせる野菜→</span>${vs.map(v=>`<button data-act="open" data-ref="X:${b.id}:${id}:${v.id}">${v.emoji}${esc(v.short)}</button>`).join('')}</div></div>`;
      } else {
        const ps=PARTS.filter(q=>compat(b,q,'protein')); const opt=b.requiredCategories.protein[0]===0;
        n+=ps.length+(opt?1:0);
        const ex=makeDish(b,opt?null:(ps[0]&&ps[0].id),[id]);
        return `<div class="dict-row"><div class="d-top"><span class="typ">${b.dishType}</span>${mLabel(b)}</div><button class="dn" data-act="open" data-ref="X:${b.id}:${ex.p||'-'}:${id}">${esc(dishName(ex))}</button>
          <div class="mini"><span class="lbl">合わせる食材→</span>${opt?`<button data-act="open" data-ref="X:${b.id}:-:${id}">🥗野菜のみ</button>`:''}${ps.map(q=>`<button data-act="open" data-ref="X:${b.id}:${q.id}:${id}">${q.emoji}${esc(q.short)}</button>`).join('')}</div></div>`;
      }
    }).join('')}</div>`; }).join('');
  return `<div class="sec-t"><h2>${p.emoji} ${esc(p.name)}を使ったアレンジ一覧</h2></div>
    <div class="info-box">${list.length}種の味付けベース × 相性の良い食材で <b>${n}通り</b>（1品目のみ表示・野菜2種の組み合わせはさらに増えます）</div>${rows}`;
}
function dictByBase(bid){
  const b=BASE[bid], ps=PARTS.filter(q=>compat(b,q,'protein')), vs=PARTS.filter(v=>compat(b,v,'veg'));
  const opt=b.requiredCategories.protein[0]===0, ratio=goldenRatio(b);

    return `<div class="dict-row"><div style="font-size:12px;font-weight:800;color:var(--green)">${label}</div><button class="dn" data-act="open" data-ref="X:${b.id}:${pid||'-'}:${vs[0].id}">${esc(dishName(ex))}</button>
      <div class="mini">${vs.map(v=>`<button data-act="open" data-ref="X:${b.id}:${pid||'-'}:${v.id}">${v.emoji}${esc(v.short)}</button>`).join('')}</div></div>`; };
  return `<div class="sec-t"><h2>${esc(b.name)}の味付け一覧</h2><small>約${combosCount(b)}通り</small></div>
    <div class="card"><div class="d-top">${gBadge(b.genre)}<span class="typ">${b.dishType}</span>${mLabel(b)}</div>
      <div style="margin-top:10px;font-size:13.5px">${b.seasonings.map(s=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line2)"><span>${esc(s.n)}</span><b style="color:var(--orange-d)">${esc(fmtSeason(s,1))}</b></div>`).join('')}</div>
      ${ratio?`<div class="ratio"><span>黄金比</span>${esc(ratio)}</div>`:''}<p class="hint">※1人分。タップした組み合わせは人数に合わせて自動換算されます。</p></div>
    <div class="list" style="margin-top:12px">${opt?rowFor(null):''}${ps.map(q=>rowFor(q.id)).join('')}</div>`;
}

  const sh=computeShopping(plan);

    <div class="prog"><i style="width:${sh.items.length?done/sh.items.length*100:100}%"></i></div>
    ${plan.prepDone?`<p class="hint">※仕込み登録済みのため、確定時点のリストを表示しています。</p>`:`<p class="hint">タブ1のストック分は自動で差し引き済み。売り場ごとにまとめています。</p>`}
    ${sh.items.length?SECTIONS.map(sec=>{ const its=sh.items.filter(i=>i.section===sec); if(!its.length) return '';
      return `<div class="sec-name">${SECTION_ICON[sec]} ${sec}</div>${its.map(i=>{ const p=PART[i.id];
        return `<button class="chk ${plan.shopChecks[i.id]?'on':''}" data-act="chkShop" data-id="${i.id}"><span class="box">${plan.shopChecks[i.id]?'✓':''}</span>
          <span class="ct"><b>${esc(p.purchaseUnit.item)}</b><small>${p.emoji}${esc(p.name)}に ／ 1週間で${i.need}食分使用${i.have?`・ストック${i.have}食分を差し引き`:''}</small></span>
          <span class="amt">${frac(i.units)}${esc(p.purchaseUnit.unit)}<small style="display:block;font-size:11px;color:var(--muted);text-align:right;font-weight:600">約${i.grams}g</small></span></button>`; }).join('')}`; }).join('')
      :`<div class="empty"><b>🎉 買い足しは不要です</b><p>今のストックだけで1週間まわせます。</p></div>`}
    ${sh.covered.length?`<div class="covered">📦 ストックで足りているもの：${sh.covered.map(c=>`${PART[c.id].emoji}${esc(PART[c.id].short)}（${c.need}食分）`).join('、')}</div>`:''}
  </div>`;
  // 調味料
  const seas=planSeasonings(plan);
  html+=`<div class="card"><div class="step-h"><span class="step-n" style="background:var(--green)">確認</span><h3>今週使う調味料・常備品</h3></div><p class="hint mt0">家にあるものをタップして消し込み。残ったものだけ買い足しましょう。</p>
    <div class="stag">${seas.map(n=>`<button class="${plan.seasonChecks[n]?'on':''}" data-act="chkSeason" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`;
  // STEP2
  const prepItems=[...sh.items].sort((a,b)=>(PART[a.id].category===PART[b.id].category?0:PART[a.id].category==='veg'?-1:1));
  const pDone=prepItems.filter(i=>plan.prepChecks[i.id]).length;
  html+=`<div class="card"><div class="step-h"><span class="step-n">STEP 2</span><h3>週末のまとめ下処理ガイド</h3><small style="color:var(--muted);font-weight:700">${pDone}/${prepItems.length}</small></div>

    ${prepItems.map(i=>{ const p=PART[i.id], st=STORAGE[p.storageType];
      return `<button class="chk ${plan.prepChecks[i.id]?'on':''}" data-act="chkPrep" data-id="${i.id}"><span class="box">${plan.prepChecks[i.id]?'✓':''}</span>
        <span class="ct"><b>${esc(i.label)} → ${p.emoji}${esc(p.name)} ${i.produced}食分</b>

    <div style="margin-top:14px">${plan.prepDone?`<button class="btn soft" disabled>✓ ${fmtMD(plan.prepDoneAt)} にストックへ登録済み</button><button class="link" data-act="resetPrep">もう一度登録できるようにする</button>`
      :`<button class="btn primary" data-act="prepDone" ${prepItems.length?'':'disabled'}>🎉 仕込み完了！すべてストックに登録する</button><p class="hint" style="text-align:center">出来上がった ${prepItems.reduce((a,i)=>a+i.produced,0)}食分 がタブ1の在庫に一括追加されます</p>`}</div>
  </div>`;
  return html;
}

/* ---------- キッチンモード（詳細モーダル） ---------- */
let MODAL=null, wakeLock=null;
function resolveRef(ref){
  const [t,...r]=ref.split(':');
  if(t==='A') return S.suggestions&&S.suggestions[+r[0]];
  if(t==='W') return S.draft&&S.draft.days[+r[0]]&&S.draft.days[+r[0]].dishes[+r[1]];
  if(t==='F'){ const key=r.join(':'); const f=S.favorites.find(x=>x.key===key); return f&&makeDish(BASE[f.baseId],f.p,f.v); }
  if(t==='X'){ const b=BASE[r[0]]; return b&&makeDish(b,r[1]==='-'?null:r[1],r[2].split('+')); }
  return null;
}
function openModal(ref){ const d=resolveRef(ref); if(!d) return; MODAL={ref,dish:d,checked:new Set()}; renderModal(); }
function renderModal(){
  if(!MODAL){ $('#modal').innerHTML=''; return; }

    <div class="kit-body">
      ${equipOK(b)?'':`<div class="warn" style="font-size:13px">⚠ この料理は、OFFにしている調理器具（${equipReq(b).all.concat(equipReq(b).any||[]).filter(id=>!hasEq(id)).map(id=>EQUIPMENT.find(e=>e.id===id).name).join('・')}）を使います</div>`}

      <div class="ksec"><h3>📦 使う下処理パーツ（${n}人分）</h3>

          return `<div class="krow"><span>${p.emoji} ${esc(p.name)}<small>${STORAGE[p.storageType].icon} ${c>0?`在庫 ${c}食分${c<n?'（不足）':''}`:'在庫なし'}</small></span><span class="q">${n}食分<small>約${p.grams*n}g</small></span></div>`; }).join('')}</div>
      <div class="ksec"><h3>🧂 合わせ調味料（${n}人分）</h3>

        ${ratio?`<div class="ratio"><span>この味の黄金比</span>${esc(ratio)}</div>`:''}</div>
      <div class="ksec"><h3>🔥 平日の仕上げ手順（約${b.time}）</h3><ol class="ksteps">${steps.map((s,i)=>`<li class="${MODAL.checked.has(i)?'ck':''}" data-act="stepck" data-i="${i}">${esc(s)}</li>`).join('')}</ol>
        <p class="hint">手順をタップすると完了チェックできます。</p></div>

    </div></div></div>`;
  const k=$('#modal .kit'); if(k&&prev) k.scrollTop=top;

function seasonToRow(s){
  if(s.tsp!=null){ return s.tsp>=3&&Math.abs(s.tsp/3-Math.round(s.tsp/3*2)/2)<1e-9 ? {n:s.n,a:s.tsp/3,u:'tbsp'} : {n:s.n,a:s.tsp,u:'tsp'}; }
  if(s.ml!=null) return {n:s.n,a:s.ml,u:'ml'};
  if(s.g!=null) return {n:s.n,a:s.g,u:'g'};
  if(s.cm!=null) return {n:s.n,a:s.cm,u:'cm'};
  return {n:s.n,a:'',u:s.text==='適量'?'適量':'少々'};
}

}

function saveCustomForm(id){
  const name=$('#cf_name').value.trim().replace(/\s+/g,' ');
  if(!name){ toast('味付けの名前を入力してください'); $('#cf_name').focus(); return false; }
  const seasonings=[];
  document.querySelectorAll('#cf_rows .cf-row').forEach(r=>{
    const n=r.querySelector('.sn').value.trim(); if(!n) return;
    const a=parseFloat(r.querySelector('.sa').value), u=r.querySelector('.su').value;
    if(u==='少々'||u==='適量'){ seasonings.push({n,text:u,k:'x'}); return; }
    if(!(a>0)){ seasonings.push({n,text:'少々',k:'x'}); return; }
    if(u==='tsp') seasonings.push({n,tsp:a}); else if(u==='tbsp') seasonings.push({n,tsp:a*3});
    else if(u==='ml') seasonings.push({n,ml:a,k:'x'}); else if(u==='g') seasonings.push({n,g:a,k:'x'}); else seasonings.push({n,cm:a,k:'x'});
  });
  if(!seasonings.length){ toast('調味料を1つ以上入力してください'); return false; }
  const steps=$('#cf_steps').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const obj={ id:id||'u_'+uid(), name, genre:$('#cf_genre').value, dishType:$('#cf_type').value, method:$('#cf_method').value, seasonings, steps:steps.length?steps:null, createdAt:Date.now() };
  S.customBases=S.customBases||[];
  const i=S.customBases.findIndex(x=>x.id===obj.id);
  if(i>=0) S.customBases[i]=obj; else S.customBases.push(obj);
  rebuildBases(); S.suggestions=null; return true;
}

  genNext:()=>{ if(!S.history.length) toast('確定済みの履歴がないため、新規で作成しました'); else toast('🔄 先週と違う組み合わせで作成しました'); S.draft=generateWeek(true); render(); },
  fixEquip:()=>{ const p=S.draft; let ok=0, ng=0;
    p.days.forEach((d,di)=>d.dishes.forEach((x,j)=>{ if(!equipOK(BASE[x.baseId])){ if(swapDish(di,j)) ok++; else ng++; } }));
    render(); toast(ng?`${ok}品を差し替えました（${ng}品は代わりが見つかりませんでした）`:`↻ ${ok}品を今の器具で作れる料理に差し替えました`); },
  swap:ds=>{ if(swapDish(+ds.d,+ds.j)){ render(); toast('↻ 別のアレンジに差し替えました'); } else toast('他に条件を満たす組み合わせがありません'); },
  confirm:()=>{
    const p=S.draft; if(!p) return;
    p.people=S.people; p.confirmed=true; p.confirmedAt=Date.now();
    const old=S.history.find(h=>h.id===p.id);
    const copy=JSON.parse(JSON.stringify(p));
    copy.names=copy.days.map(d=>d.dishes.map(dishName));
    if(old){ copy.shopChecks=old.shopChecks; copy.seasonChecks=old.seasonChecks; }
    S.history=[copy,...S.history.filter(h=>h.id!==p.id)].slice(0,12);
    S.activePlanId=p.id; render(); toast('✅ 確定しました。買い物リストに反映！');
  },
  goWeek:()=>{ S.tab='plan'; S.mode='B'; render(); window.scrollTo(0,0); },
  // fav
  fav:ds=>{ const d=resolveRef(ds.ref); if(!d) return; toggleFav(d); render(); if(MODAL) renderModal(); },
  unfav:ds=>{ const keep=S.favorites.slice(); S.favorites=S.favorites.filter(f=>f.key!==ds.key); render(); toast('お気に入りから外しました', ()=>{ S.favorites=keep; render(); }); },
  favPri:()=>{ S.favPriority=!S.favPriority; render(); toast(S.favPriority?'お気に入りを優先採用します':'優先採用をOFFにしました'); },
  dictMode:ds=>{ S.dictMode=ds.m; S.dictSel=null; render(); },
  dictSel:ds=>{ S.dictSel=S.dictSel===ds.id?null:ds.id; render(); },
  // shop
  chkShop:ds=>{ const p=activePlan(); p.shopChecks[ds.id]=!p.shopChecks[ds.id]; render(); },
  chkPrep:ds=>{ const p=activePlan(); p.prepChecks[ds.id]=!p.prepChecks[ds.id]; render(); },
  chkSeason:ds=>{ const p=activePlan(); p.seasonChecks[ds.n]=!p.seasonChecks[ds.n]; render(); },
  prepDone:()=>{
    const p=activePlan(); const sh=computeShopping(p); let total=0;
    sh.items.forEach(i=>{ addStock(i.id,i.produced); total+=i.produced; p.prepChecks[i.id]=true; });
    p.buySnapshot=sh; p.prepDone=true; p.prepDoneAt=todayStr(); S.suggestions=null;
    render(); toast(`🎉 ${total}食分をストックに登録しました！`);
  },
  resetPrep:()=>{ const p=activePlan(); p.prepDone=false; p.buySnapshot=null; p.prepChecks={}; render(); },
  // modal
  open:ds=>{ openModal(ds.ref); if(MODAL) pushOv(); },
  closeModal:()=>closeModalUI(),
  stepck:ds=>{ const i=+ds.i; MODAL.checked.has(i)?MODAL.checked.delete(i):MODAL.checked.add(i); renderModal(); },
  wake:async()=>{ try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } else { wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){ toast('この端末では画面点灯を維持できません'); } renderModal(); },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='backdrop'){ if(e.target!==el) return; if(el.dataset.close==='sheet') closeSheetUI(); else closeModalUI(); return; }
  const fn=ACTIONS[a]; if(fn){ e.preventDefault(); fn(el.dataset,el,e); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(TUT) endTutorial(); else if(MODAL) closeModalUI(); else if($('#sheet').innerHTML) closeSheetUI(); } });

render();
if(!S.tutorialSeen) openTutorial();
</script>
</body>
</html>
