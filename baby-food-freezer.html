<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>冷凍パーツ離乳食</title>
<style>
:root{
  --bg:#FAF8F5;
  --card:#FFFFFF;
  --ink:#3B3530;
  --muted:#776D64;
  --line:#E9E1D6;
  --terra:#B8603F;
  --terra-soft:#F6E6DE;
  --sage:#5F7F63;
  --sage-soft:#E5EEE3;
  --butter:#FBF1D9;
  --warn:#A9472B;
  --shadow:0 2px 10px rgba(80,60,40,.07);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.6;
}
button{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* ヘッダー */
header.top{
  position:sticky;top:0;z-index:20;background:rgba(250,248,245,.96);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
}
header.top .in{max-width:560px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header.top h1{font-size:14px;margin:0;font-weight:700;color:var(--terra);flex:1 1 auto;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:700;white-space:nowrap}
.pill.t{background:var(--terra-soft);color:var(--terra)}

/* 下部タブ */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(80,60,40,.06);
}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{
  border:0;background:none;padding:8px 2px 10px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--muted);font-weight:700;cursor:pointer;
}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--terra)}
nav.tabs button.on .ic{transform:scale(1.08)}

h2.ttl{font-size:20px;margin:18px 0 4px}
p.lead{margin:0 0 12px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:16px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.mt0{margin-top:0}
.hr{height:1px;background:var(--line);margin:12px 0}

/* ボタン */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:54px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;
  background:var(--terra);color:#fff;padding:12px 16px;margin:8px 0;box-shadow:0 2px 6px rgba(184,96,63,.25);
}
.btn:active{transform:translateY(1px)}
.btn.sage{background:var(--sage);box-shadow:0 2px 6px rgba(95,127,99,.25)}
.btn.ghost{background:#fff;color:var(--terra);border:2px solid var(--terra);box-shadow:none}
.btn.ghost.sage{color:var(--sage);border-color:var(--sage);background:#fff}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;padding:8px 12px;margin:0}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* 月齢選択 */
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;
  border-radius:14px;padding:12px 14px;margin:8px 0;min-height:60px;cursor:pointer;
}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid #C9BEB1;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.opt.on{border-color:var(--terra);background:var(--terra-soft)}
.opt.on .dot{border-color:var(--terra)}
.opt.on .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--terra)}
.opt b{display:block;font-size:15px}
.opt span{font-size:12px;color:var(--muted)}

/* 目安テーブル */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:700;width:36%;padding:8px 6px;vertical-align:top;color:var(--sage)}
.tbl td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}

/* チップ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;font-size:14px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
.chip.ok.on{background:var(--sage);border-color:var(--sage)}
.chip .x{font-size:12px;opacity:.9}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--sage-soft);color:var(--sage);margin-right:4px;vertical-align:middle}
.tag.t{background:var(--terra-soft);color:var(--terra)}
.tag.y{background:var(--butter);color:#8A6A1F}
.tag.g{background:#EFEBE6;color:var(--muted)}

/* スイッチ */
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.switch .tr{width:58px;height:34px;border-radius:999px;background:#D9D0C5;position:relative;flex:0 0 auto;transition:.2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on .tr{background:var(--sage)}
.switch.on .tr::after{left:27px}

/* 在庫 */
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:42px;font-weight:700;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--sage);background:var(--sage);color:#fff}
.inv{border-bottom:1px solid var(--line);padding:12px 0}
.inv:last-child{border-bottom:0}
.inv .nm{font-weight:700}
.inv .sub{font-size:12px;color:var(--muted)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ctr{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:4px;background:#FCFBF9}
.ctr.has{border-color:var(--sage);background:var(--sage-soft)}
.ctr .lb{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.ctr .lb b{display:block;font-size:15px;color:var(--ink)}
.ctr button{width:44px;height:44px;border-radius:10px;border:0;background:#fff;font-size:22px;font-weight:700;color:var(--sage);box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.ctr.dis{opacity:.45}

/* 献立 */
.day{margin:16px 0}
.dayhd{display:flex;align-items:center;gap:8px;margin:0 2px 6px}
.dayhd .d{font-weight:800;font-size:17px}
.dayhd .w{font-size:12px;padding:2px 8px;border-radius:999px;background:#EFEBE6;color:var(--muted);font-weight:700}
.dayhd .w.we{background:var(--butter);color:#8A6A1F}
.meal{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:8px 0;box-shadow:var(--shadow)}
.meal .slot{font-size:12px;color:var(--muted);font-weight:700}
.meal .line{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.meal .k{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;margin-top:3px}
.meal .k.c{background:var(--butter);color:#8A6A1F}
.meal .k.o{background:var(--terra-soft);color:var(--terra)}
.meal .v b{font-size:16px}
.meal .parts{font-size:12px;color:var(--muted);margin-top:2px}
.newbox{margin-top:10px;border:2px dashed var(--sage);background:var(--sage-soft);border-radius:12px;padding:8px 12px;font-size:13px}
.newbox b{color:var(--sage)}
details.how{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.how summary{cursor:pointer;font-weight:700;color:var(--sage);font-size:14px;padding:8px 0;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"▶ ";font-size:11px}
details.how[open] summary::before{content:"▼ "}
.how ol{margin:4px 0 0;padding-left:20px;font-size:14px}
.how li{margin:4px 0}
.memo{background:var(--butter);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.meal .acts{display:grid;grid-template-columns:1fr;margin-top:10px}
.banner{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;background:var(--terra-soft);color:#7A3A22;border:1px solid #EBC9BA}
.banner.ok{background:var(--sage-soft);color:#35513A;border-color:#C9DBC6}

/* チェックリスト */
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .bx{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:2px solid #C9BEB1;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:18px;color:#fff;font-weight:900}
.chk.on .bx{background:var(--sage);border-color:var(--sage)}
.chk.on .ct{opacity:.5}
.chk.on .ct .nm{text-decoration:line-through}
.chk .ct{flex:1 1 auto}
.chk .nm{font-weight:700;font-size:15px}
.chk .dt{font-size:13px;color:var(--muted);margin-top:2px}
.chk .dt b{color:var(--ink)}
.progress{height:8px;border-radius:999px;background:#EFEBE6;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--sage);border-radius:999px;transition:.3s}
.step{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.step .n{flex:0 0 auto;font-size:11px;font-weight:800;background:var(--terra-soft);color:var(--terra);border-radius:6px;padding:1px 6px;margin-top:2px}

.hist{border-bottom:1px solid var(--line);padding:10px 0}
.hist:last-child{border-bottom:0}
.hist summary{cursor:pointer;font-weight:700;list-style:none;padding:4px 0}
.hist summary::-webkit-details-marker{display:none}
.hist ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#3B3530;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .big{font-size:42px}
a{color:var(--sage)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>🧊 離乳食パーツ</h1>
  <span class="pill t" id="hdAge">7〜8ヶ月</span>
  <span class="pill" id="hdMeals">1日2回食</span>
</div></header>

<main class="wrap" id="app"></main>

<nav class="tabs"><div class="in">
  <button data-tab="settings"><span class="ic">👶</span>お子さま設定</button>
  <button data-tab="stock"><span class="ic">🧊</span>在庫・ストック</button>
  <button data-tab="plan"><span class="ic">📅</span>1週間献立</button>
  <button data-tab="shop"><span class="ic">🛒</span>買い物・下処理</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   マスターデータ
   ========================================================= */

/* 月齢ステージ（目安は厚生労働省「授乳・離乳の支援ガイド」を参考にした一般的な量） */
const STAGES = [
  { label:'5〜6ヶ月', sub:'ゴックン期', meals:1,
    slots:['1回目（午前10時ごろ）'],
    carb:'10倍がゆ 小さじ1から始めて 30〜40g',
    veg:'小さじ1から始めて 15〜20g',
    pro:'豆腐 25g ／ 白身魚・しらす 5〜10g ／ 卵黄 耳かき1杯〜小さじ1',
    form:'なめらかにすりつぶした状態（ポタージュ状）',
    hard:'ヨーグルトくらい',
    cook:'解凍後さらにすりつぶし、だしや湯冷ましでのばしてなめらかなポタージュ状に。粒が残らないように。' },
  { label:'7〜8ヶ月', sub:'モグモグ期', meals:2,
    slots:['1回目（午前10時ごろ）','2回目（午後6時ごろ）'],
    carb:'全がゆ 50〜80g',
    veg:'20〜30g',
    pro:'魚・肉 10〜15g ／ 豆腐 30〜40g ／ 卵黄1個〜全卵1/3 ／ 乳製品 50〜70g',
    form:'舌でつぶせる固さ（2〜3mmの粒・粗つぶし）',
    hard:'絹ごし豆腐くらい',
    cook:'解凍後、舌でつぶせるくらいのやわらかさに。パサつく食材は水溶き片栗粉でとろみをつけると食べやすくなります。' },
  { label:'9〜11ヶ月', sub:'カミカミ期', meals:3,
    slots:['朝（7時ごろ）','昼（12時ごろ）','夕（18時ごろ）'],
    carb:'全がゆ 90g 〜 軟飯 80g',
    veg:'30〜40g',
    pro:'魚・肉 15g ／ 豆腐 45g ／ 全卵1/2 ／ 乳製品 80g',
    form:'歯ぐきでつぶせる固さ（5mm角程度）',
    hard:'熟したバナナくらい',
    cook:'解凍後、歯ぐきでつぶせる固さに。一部を小さく丸めたりスティック状にして手づかみ食べの練習にも。' },
  { label:'12〜18ヶ月', sub:'パクパク期', meals:3,
    slots:['朝（7時ごろ）','昼（12時ごろ）','夕（18時ごろ）'],
    carb:'軟飯 90g 〜 ご飯 80g',
    veg:'40〜50g',
    pro:'魚・肉 15〜20g ／ 豆腐 50〜55g ／ 全卵1/2〜2/3 ／ 乳製品 100g',
    form:'歯ぐきで噛める固さ（1cm角程度）',
    hard:'肉団子くらい',
    cook:'大人の取り分けもOK。味付けは大人の1/3〜1/4程度の薄味に。手づかみしやすい大きさ・形にすると自分で食べる練習になります。' }
];
const VEG_G = [18, 25, 35, 45]; /* 1食あたりの野菜・果物の合計g */

/* アレルギー・除外区分 */
const ALLERGENS = [
  {id:'egg',       name:'卵（卵黄・全卵）'},
  {id:'milk',      name:'乳製品'},
  {id:'wheat',     name:'小麦'},
  {id:'soy',       name:'大豆（豆腐・納豆・きなこ等）'},
  {id:'whitefish', name:'白身魚（鯛・たら・しらす）'},
  {id:'redfish',   name:'赤身魚（ツナ・まぐろ）'},
  {id:'salmon',    name:'鮭'},
  {id:'chicken',   name:'鶏肉'},
  {id:'pork',      name:'豚肉'},
  {id:'tomato',    name:'トマト'},
  {id:'horenso',   name:'ほうれん草'},
  {id:'yamaimo',   name:'山芋'},
  {id:'banana',    name:'バナナ'},
  {id:'kiwi',      name:'キウイ'},
  {id:'apple',     name:'りんご'},
  {id:'ichigo',    name:'いちご'},
  {id:'sesame',    name:'ごま'},
  {id:'corn',      name:'とうもろこし'}
];

/* 形状テンプレート（月齢ステージ別） */
const SHAPES = {
  kayu:  ['10倍がゆを裏ごししてなめらかに','7倍〜5倍がゆ（米粒を軽くつぶす）','5倍がゆ〜軟飯','軟飯〜やわらかめのご飯'],
  noodle:['くたくたに茹でてすりつぶす','くたくたに茹でて1〜2cmに刻む','やわらかく茹でて2〜3cmに切る','やわらかめに茹でて3〜4cmに切る'],
  pan:   ['—','耳を除き、ミルクで煮てパンがゆに','耳を除き小さくちぎる／スティック','トーストしてスティック状に'],
  oat:   ['—','ミルクや湯で煮てなめらかに','水分少なめで煮て粒を残す','水分少なめ・おやき状にしても◎'],
  imo:   ['なめらかにマッシュ（湯でのばす）','粗つぶし','5mm〜1cm角','1cm角・スティック状'],
  paste: ['なめらかなペースト（裏ごし）','2〜3mmのみじん切り・粗つぶし','5mm角に刻む','7mm〜1cm角に刻む'],
  leaf:  ['葉先をすりつぶしてペースト','葉先を細かいみじん切り','葉先を5mm程度に刻む','茎もやわらかく茹でて1cm程度に刻む'],
  fruit: ['すりつぶして加熱','粗つぶし（2〜3mm）','5mm角','1cm角・薄切り'],
  fish:  ['すりつぶしてとろみをつける','細かくほぐす（とろみ付け）','粗めにほぐす','一口大にほぐす'],
  meat:  ['—','茹でてすりつぶし、とろみをつける','細かくほぐす・そぼろ状','そぼろ・小さめの肉団子'],
  soft:  ['なめらかにすりつぶす','粗つぶし','5mm角','1cm角'],
  egg:   ['固ゆで卵黄をすりつぶす','固ゆでして細かくほぐす','固ゆでして刻む／しっかり加熱の炒り卵','炒り卵・薄焼き卵など'],
  asis:  ['そのまま','そのまま','そのまま','そのまま']
};

/* 冷凍方法 */
const FREEZE = {
  ice:  c=>`製氷皿（1キューブ約${c}g）に入れて冷凍 → 固まったらフリーザーバッグへ移す`,
  bag:  c=>`フリーザーバッグに薄く平らに入れ、菜箸で筋目をつけて冷凍（1ブロック約${c}g）`,
  cup:  c=>`シリコンカップや小分け容器（1個約${c}g）に入れて冷凍`,
  none: ()=>'冷凍せず冷蔵で保存し、使う分をその都度準備'
};

/* 食材マスター（45種類）
   cat: carb=炭水化物 / veg=野菜 / fruit=果物 / protein=タンパク質
   min: 解禁ステージ（0=5〜6ヶ月, 1=7〜8ヶ月, 2=9〜11ヶ月, 3=12〜18ヶ月）
   al : アレルゲン・除外区分
   unit/unitG/unitLabel: スーパーでの購入単位と、その単位で使える量（g）
   cubeG: 冷凍1キューブあたりのg数
   pg : 1食あたりの目安g（炭水化物・タンパク質のみ。野菜・果物は VEG_G を按分）
*/
const ING_LIST = [
  /* ---------- 炭水化物 ---------- */
  {id:'kayu', name:'おかゆ（米）', cat:'carb', min:0, al:[], unit:'合', unitG:[1500,900,700,450], unitLabel:'米1合（150g）', cubeG:30, pg:[40,70,90,95], sh:'kayu', freeze:'cup',

function defaultState(){
  return {
    settings:{stage:1, ng:[], challenge:false, tried:DEFAULT_TRIED.slice()},
    stock:{fresh:{}, cubes:{}},
    plan:null, history:[], checks:{}, tab:'plan',
    invFilter:'all', invOnly:false
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const d = JSON.parse(raw), base = defaultState();
    return Object.assign(base, d, {
      settings:Object.assign(base.settings, d.settings||{}),
      stock:Object.assign(base.stock, d.stock||{})
    });
  }catch(e){ return defaultState(); }
}
let S = load();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* =========================================================
   ユーティリティ
   ========================================================= */
const $ = s=>document.querySelector(s);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function mondayOf(date){ const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function md(s){ const d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function rnd(n){ return Math.random()*n; }
function fracText(x){
  if(x<=0) return '0';
  if(x<0.2) return 'ほんの少し（1/8程度）';
  let q=Math.round(x*4)/4; if(q===0) q=0.25;
  const w=Math.floor(q), r=q-w;
  const rs={0:'',0.25:'1/4',0.5:'1/2',0.75:'3/4'}[r];
  return w===0 ? rs : (rs ? `${w}と${rs}` : `${w}`);
}
function unitG(g,stage){ return Array.isArray(g.unitG) ? g.unitG[stage] : g.unitG; }
function stageNow(){ return S.settings.stage; }
function ngSet(){ return new Set(S.settings.ng); }
function dishName(c,stage){ return Array.isArray(c.name) ? c.name[stage] : c.name; }
function shapeOf(g,stage){ return (g.shape && g.shape[stage]) || SHAPES[g.sh][stage]; }
function cubeText(id,g){
  const ing=ING[id];
  if(ing.freeze==='none') return `${Math.round(g)}g`;
  const n=Math.max(0.5, Math.round(g/ing.cubeG*2)/2);
  return `${n}${cubeWord(ing)}`;
}
function cubeWord(ing){ return ing.freeze==='bag' ? 'ブロック' : (ing.freeze==='cup' ? 'カップ' : 'キューブ'); }

/* =========================================================
   判定ロジック
   ========================================================= */
function ingOK(id,stage,ng){ const g=ING[id]; if(!g) return false; if(g.min>stage) return false; return !(g.al||[]).some(a=>ng.has(a)); }
function baseOK(bid,stage,ng){ const b=BASES[bid]; return !!b && b.min<=stage && !(b.al||[]).some(a=>ng.has(a)); }
function recipeOK(r,stage,ng){ return r.parts.every(p=>ingOK(p,stage,ng)) && baseOK(r.base,stage,ng); }
function carbOK(c,stage,ng){ return (c.min||0)<=stage && ingOK(c.ing,stage,ng) && baseOK(c.base,stage,ng); }
function recipeMin(r){ return Math.max(BASES[r.base].min, ...r.parts.map(p=>ING[p].min)); }
function mainProtein(r){ return r.parts.find(p=>ING[p].cat==='protein') || r.parts[0]; }
function comboKey(r){ return r.parts.slice().sort().join('+'); }
function hasStock(id){ return (S.stock.fresh[id]||0)>0 || (S.stock.cubes[id]||0)>0; }

/* 1食分の使用量 */
function mealItems(meal, stage){
  const out=[];
  const c=CARB_DISHES.find(x=>x.id===meal.carb);
  if(c) out.push({id:c.ing, g:ING[c.ing].pg[stage], role:'carb'});
  const r=RECIPES.find(x=>x.id===meal.recipe);
  if(r){
    const vegs=r.parts.filter(p=>ING[p].cat==='veg'||ING[p].cat==='fruit');
    const pros=r.parts.filter(p=>ING[p].cat==='protein'||ING[p].cat==='carb');
    vegs.forEach(p=>out.push({id:p, g:VEG_G[stage]/vegs.length, role:'side'}));
    pros.forEach(p=>out.push({id:p, g:(ING[p].pg?ING[p].pg[stage]:15)*(pros.length>1?0.6:1), role:'side'}));
  }
  if(meal.newIng) out.push({id:meal.newIng, g:5, role:'new'});
  return out;
}

/* =========================================================
   献立生成エンジン
   ========================================================= */
function prevInfo(plans){
  const info={recipes:new Set(), combos:new Set(), mains:{}, carbs:{}, ings:new Set()};
  plans.filter(Boolean).forEach(p=>p.days.forEach(d=>d.meals.forEach(m=>{
    const r=RECIPES.find(x=>x.id===m.recipe);
    if(r){ info.recipes.add(r.id); info.combos.add(comboKey(r)); const mp=mainProtein(r); info.mains[mp]=(info.mains[mp]||0)+1; r.parts.forEach(p=>info.ings.add(p)); }
    if(m.carb) info.carbs[m.carb]=(info.carbs[m.carb]||0)+1;
  })));
  return info;
}
function toPrevJSON(info){ return {recipes:[...info.recipes], combos:[...info.combos], mains:info.mains, carbs:info.carbs, ings:[...info.ings]}; }
function fromPrevJSON(j){ return {recipes:new Set(j.recipes||[]), combos:new Set(j.combos||[]), mains:j.mains||{}, carbs:j.carbs||{}, ings:new Set(j.ings||[])}; }

function buildCtx(opts){
  const stage=stageNow(), ng=ngSet();
  const challenge=!!S.settings.challenge;
  const tried=new Set(S.settings.tried);
  return {stage, ng, challenge, tried, strong:!!opts.strong, prev:opts.prev, core:opts.core, intro:opts.intro||{}};
}
function usableOn(ctx,id,d){
  if(!ctx.challenge) return true;
  if(ctx.tried.has(id)) return true;
  return ctx.intro[id]!==undefined && ctx.intro[id] < d;
}

/* 週のコア食材（1つの食材を使い回すための選定） */
function chooseCore(ctx, introIds){
  const {stage, ng, prev} = ctx;
  const usable = id => ingOK(id,stage,ng) && (!ctx.challenge || ctx.tried.has(id) || introIds.includes(id));
  const scoreIng = id => rnd(3) + (hasStock(id)?6:0) - (prev.ings.has(id)?(ctx.strong?2.2:1):0) - (prev.mains[id]? (ctx.strong?2:0.8):0) + (introIds.includes(id)?2.5:0);
  const pick = (cats,n) => ING_LIST.filter(g=>cats.includes(g.cat)&&usable(g.id)).map(g=>({id:g.id,s:scoreIng(g.id)})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.id);
  const nVeg = stage===0?3:(stage===1?4:5), nPro = stage===0?2:(stage===1?3:4);
  const veg = pick(['veg','fruit'], nVeg);
  const pro = pick(['protein'], nPro);
  /* 炭水化物：おかゆ＋2〜3種 */
  const carbIds = ING_LIST.filter(g=>g.cat==='carb'&&usable(g.id)).map(g=>({id:g.id,s:scoreIng(g.id)+(g.id==='kayu'?100:0)})).sort((a,b)=>b.s-a.s).slice(0, stage===0?2:(stage===1?3:4)).map(x=>x.id);
  const core = new Set([...veg,...pro]);
  /* カバレッジ確保：コア内で作れるレシピが少ない場合は食材を追加 */
  const need = Math.min(9, Math.ceil(STAGES[stage].meals*7/2.5));
  const okRecipes = RECIPES.filter(r=>recipeOK(r,stage,ng) && r.parts.every(usable));
  const cover = () => okRecipes.filter(r=>r.parts.every(p=>core.has(p))).length;
  let guard=0;
  while(cover()<need && guard++<8){
    let best=null, bestN=cover();
    ING_LIST.forEach(g=>{
      if(g.cat==='carb'||core.has(g.id)||!usable(g.id)) return;
      core.add(g.id); const n=cover(); core.delete(g.id);
      if(n>bestN || (n===bestN && best && hasStock(g.id) && !hasStock(best))){ bestN=n; best=g.id; }
    });
    if(!best) break; core.add(best);
  }
  return {items:[...core], carbs:carbIds};
}

/* 週の状況（指定スロットを除く） */
function weekStats(days, skip){
  const st={rec:{}, pro:{}, ing:{}, carb:{}};
  days.forEach((d,di)=>d.meals.forEach((m,mi)=>{
    if(skip && skip[0]===di && skip[1]===mi) return;
    if(m.recipe){ const r=RECIPES.find(x=>x.id===m.recipe); if(r){ st.rec[r.id]=(st.rec[r.id]||0)+1; const mp=mainProtein(r); st.pro[mp]=(st.pro[mp]||0)+1; r.parts.forEach(p=>st.ing[p]=(st.ing[p]||0)+1); } }
    if(m.carb){ st.carb[m.carb]=(st.carb[m.carb]||0)+1; }
  }));
  return st;
}

function pickRecipe(ctx, days, d, m, exclude){
  const {stage, ng, prev} = ctx;
  const core = new Set(ctx.core.items);
  let cands = RECIPES.filter(r=>recipeOK(r,stage,ng) && r.parts.every(p=>usableOn(ctx,p,d)) && r.id!==exclude);
  if(!cands.length) cands = RECIPES.filter(r=>recipeOK(r,stage,ng) && r.id!==exclude);
  if(!cands.length) return null;
  const st = weekStats(days,[d,m]);
  const today = (days[d]?days[d].meals:[]).filter((_,i)=>i!==m).map(x=>RECIPES.find(r=>r.id===x.recipe)).filter(Boolean);
  const yday = d>0 ? days[d-1].meals.map(x=>x.recipe) : [];
  const tmr  = days[d+1] ? days[d+1].meals.map(x=>x.recipe) : [];
  const todayMains = new Set(today.map(mainProtein));
  const todayBases = new Set(today.map(r=>r.base));
  let best=null, bestS=-1e9;
  cands.forEach(r=>{
    let s = rnd(7);
    r.parts.forEach(p=>{
      s += core.has(p) ? 5 : -13;
      if(hasStock(p)) s += 5;
      if(st.ing[p]) s += Math.min(st.ing[p],3)*0.8;   /* 同じ食材の使い回し（無駄なく使い切る） */
      if(ctx.intro[p]!==undefined && ctx.intro[p]<d) s += 2; /* はじめて食材を後日おかずで再登場 */
    });
    s -= (st.rec[r.id]||0)*(stage===0?30:17);
    if(prev.recipes.has(r.id)) s -= ctx.strong?70:25;
    if(prev.combos.has(comboKey(r))) s -= ctx.strong?40:12;
    const mp = mainProtein(r);
    if(prev.mains[mp]) s -= (ctx.strong?1.5:0.5)*prev.mains[mp];
    if(todayMains.has(mp)) s -= 14;
    if((st.pro[mp]||0)>=4) s -= ((st.pro[mp]||0)-3)*5;
    if(yday.includes(r.id) || tmr.includes(r.id)) s -= 25;
    if(todayBases.has(r.base)) s -= 5;
    if(stage>=2) s += recipeMin(r)*1.2;   /* 月齢が進んだら新しい味付けを優先 */
    if(r.parts.length===3 && stage>=1) s += 1;
    if(s>bestS){ bestS=s; best=r; }
  });
  return best ? best.id : null;
}

function pickCarb(ctx, days, d, m, exclude){
  const {stage, ng} = ctx;
  const core = new Set(ctx.core.carbs);
  let cands = CARB_DISHES.filter(c=>carbOK(c,stage,ng) && usableOn(ctx,c.ing,d) && c.id!==exclude);
  if(!cands.length) cands = CARB_DISHES.filter(c=>carbOK(c,stage,ng) && c.id!==exclude);
  if(!cands.length) return null;
  const st = weekStats(days,[d,m]);
  const today = (days[d]?days[d].meals:[]).filter((_,i)=>i!==m).map(x=>x.carb);
  const yday = d>0 ? days[d-1].meals.map(x=>x.carb) : [];
  const recipe = days[d] && days[d].meals[m] ? RECIPES.find(r=>r.id===days[d].meals[m].recipe) : null;
  let best=null, bestS=-1e9;
  cands.forEach(c=>{
    let s = rnd(6);
    if(core.has(c.ing)) s += 6; else s -= 6;
    if(c.ing==='kayu') s += 2.5;
    if(hasStock(c.ing)) s += 4;
    s -= (st.carb[c.id]||0)*4;
    if(today.includes(c.id)) s -= 10;
    if(yday.includes(c.id)) s -= 4;
    if(c.base!=='plain' && recipe && recipe.base===c.base) s -= 6;  /* おかずと同じ味付けを避ける */
    if(ctx.prev.carbs[c.id] && ctx.strong) s -= 1.5;
    if(s>bestS){ bestS=s; best=c; }
  });
  return best ? best.id : null;
}

function newCandidates(ctx){
  const order={veg:0, fruit:1, carb:2, protein:3};
  return ING_LIST.filter(g=>ingOK(g.id,ctx.stage,ctx.ng) && !ctx.tried.has(g.id))
    .map(g=>({id:g.id, s:g.min*10 + order[g.cat]*2 + (g.al.length?3:0) + rnd(2)}))
    .sort((a,b)=>a.s-b.s).map(x=>x.id);
}

function generateWeek(mode){
  const strong = mode==='next';
  const latest = S.history[0] || null;
  const prevPlans = [latest];
  if(strong && S.plan && (!latest || latest.id!==S.plan.id)) prevPlans.push(S.plan);
  const prev = prevInfo(prevPlans);
  let weekStart;
  if(mode==='next'){
    const ref = (S.plan && S.plan.weekStart) || (latest && latest.weekStart) || ymd(mondayOf(new Date()));
    const ref2 = latest && latest.weekStart > ref ? latest.weekStart : ref;
    weekStart = addDays(ref2, 7);
  }else{
    weekStart = ymd(mondayOf(new Date()));
  }
  const ctx = buildCtx({strong, prev, core:{items:[],carbs:[]}});
  /* はじめて食材：平日（月〜金）の1食目のみ */
  const intro={}, introIds=[];
  if(ctx.challenge){
    newCandidates(ctx).slice(0,5).forEach((id,i)=>{ intro[id]=i; introIds.push(id); });
  }
  ctx.intro = intro;
  ctx.core = chooseCore(ctx, introIds);
  const stage = ctx.stage, nMeals = STAGES[stage].meals;
  const days = [];
  for(let d=0; d<7; d++){
    const date = addDays(weekStart,d);
    days.push({date, meals:[]});
    for(let m=0; m<nMeals; m++){
      const meal = {recipe:null, carb:null, newIng:null};
      days[d].meals.push(meal);
      meal.recipe = pickRecipe(ctx, days, d, m, null);
      meal.carb = pickCarb(ctx, days, d, m, null);
      if(ctx.challenge && d<5 && m===0){
        const nid = introIds[d];
        if(nid) meal.newIng = nid;
      }
    }
  }
  return {
    id: uid(), weekStart, stage, created: Date.now(), saved:false,
    ctx:{core:ctx.core, intro, strong, prev:toPrevJSON(prev), challenge:ctx.challenge},
    days
  };
}

function ctxFromPlan(plan){
  return buildCtx({strong:plan.ctx.strong, prev:fromPrevJSON(plan.ctx.prev), core:plan.ctx.core, intro:plan.ctx.intro});
}

function swapMeal(d,m){
  const plan=S.plan; if(!plan) return;
  const ctx=ctxFromPlan(plan);
  const meal=plan.days[d].meals[m];
  const oldR=meal.recipe, oldC=meal.carb;
  meal.recipe = pickRecipe(ctx, plan.days, d, m, oldR) || oldR;
  if(Math.random()<0.6) meal.carb = pickCarb(ctx, plan.days, d, m, oldC) || oldC;
  plan.saved=false;
  save(); render();
  toast('別のメニューに変更しました');
}

/* 設定変更時：除外食材や月齢が変わったら献立を自動修正 */
function revalidatePlan(){
  const plan=S.plan; if(!plan) return;
  const stage=stageNow(), ng=ngSet();
  if(plan.stage!==stage){
    S.plan = generateWeek('this');
    S.plan.weekStart = plan.weekStart;
    S.plan.days.forEach((d,i)=>d.date=addDays(plan.weekStart,i));
    toast('月齢が変わったので献立を作り直しました');
    return;
  }
  const ctx=ctxFromPlan(plan);
  let changed=0;
  plan.days.forEach((day,d)=>day.meals.forEach((meal,m)=>{
    const r=RECIPES.find(x=>x.id===meal.recipe);
    if(!r || !recipeOK(r,stage,ng)){ meal.recipe=pickRecipe(ctx,plan.days,d,m,meal.recipe); changed++; }
    const c=CARB_DISHES.find(x=>x.id===meal.carb);
    if(!c || !carbOK(c,stage,ng)){ meal.carb=pickCarb(ctx,plan.days,d,m,meal.carb); changed++; }
    if(meal.newIng && (!S.settings.challenge || !ingOK(meal.newIng,stage,ng) || S.settings.tried.includes(meal.newIng))){ meal.newIng=null; changed++; }
  }));
  if(changed){ plan.saved=false; toast('設定に合わせて献立の一部を差し替えました'); }
}

/* =========================================================
   集計（買い物リスト・下処理）
   ========================================================= */
function aggregate(plan){
  const stage=plan.stage, tot={}, uses={}, newOnly={}, bases={};
  plan.days.forEach(day=>day.meals.forEach(meal=>{
    mealItems(meal,stage).forEach(it=>{
      tot[it.id]=(tot[it.id]||0)+it.g;
      uses[it.id]=(uses[it.id]||0)+1;
      if(it.role==='new'){ if(newOnly[it.id]===undefined) newOnly[it.id]=true; } else newOnly[it.id]=false;
    });
    const r=RECIPES.find(x=>x.id===meal.recipe), c=CARB_DISHES.find(x=>x.id===meal.carb);
    [r&&r.base, c&&c.base].filter(Boolean).forEach(b=>bases[b]=(bases[b]||0)+1);
  }));
  return {tot, uses, newOnly, bases};
}
function shoppingList(plan){
  const stage=plan.stage, ag=aggregate(plan);
  const buy=[], have=[];
  Object.keys(ag.tot).sort((a,b)=>CAT_ORDER.indexOf(ING[a].cat)-CAT_ORDER.indexOf(ING[b].cat)).forEach(id=>{
    const ing=ING[id], total=ag.tot[id], ug=unitG(ing,stage);
    const freshG=(S.stock.fresh[id]||0)*ug, cubeGs=(S.stock.cubes[id]||0)*ing.cubeG;
    const avail=freshG+cubeGs, net=Math.max(0,total-avail);
    const item={id, ing, total, net, avail, uses:ag.uses[id], newOnly:ag.newOnly[id],
      useFrac: fracText(total/ug), netFrac: fracText(net/ug), buyN: Math.max(1, Math.ceil(net/ug - 0.05))};
    if(net<=0.5) have.push(item); else buy.push(item);
  });
  const extras=[];
  Object.keys(ag.bases).forEach(b=>{ if(BASES[b].need) extras.push({id:'base_'+b, name:BASES[b].name, need:BASES[b].need, n:ag.bases[b]}); });
  return {buy, have, extras, ag};
}
function prepList(plan){
  const stage=plan.stage, ag=aggregate(plan);
  const tasks=[], fresh=[];
  Object.keys(ag.tot).sort((a,b)=>CAT_ORDER.indexOf(ING[a].cat)-CAT_ORDER.indexOf(ING[b].cat)).forEach(id=>{
    const ing=ING[id], total=ag.tot[id], ug=unitG(ing,stage);
    if(ag.newOnly[id]){ fresh.push({id, ing, total, uses:ag.uses[id], isNew:true}); return; }
    if(ing.freeze==='none'){ fresh.push({id, ing, total, uses:ag.uses[id]}); return; }
    const haveCubes=S.stock.cubes[id]||0;
    const needG=Math.max(0, total - haveCubes*ing.cubeG);
    const cubes=Math.ceil(needG/ing.cubeG - 0.05);
    if(cubes<=0){ tasks.push({id, ing, done:true, haveCubes, total}); return; }
    const rawG=cubes*ing.cubeG;
    tasks.push({id, ing, cubes, rawG, frac:fracText(rawG/ug), haveCubes, total});
  });
  /* だし・スープなど味付けベースの仕込み */
  const baseTasks={};
  Object.keys(ag.bases).forEach(b=>{ const p=BASES[b].prep; if(p) baseTasks[p]=(baseTasks[p]||0)+ag.bases[b]*2; });
  const baseInfo={
    dashi:{name:'和風だしキューブ', how:'水500mlに昆布5cmを30分浸して弱火にかけ、沸騰直前に昆布を取り出す → かつお節10gを入れて火を止め、沈んだらこす（5〜6ヶ月は昆布だしのみでも）', unit:'キューブ（大さじ1）'},
    vegsoup:{name:'野菜スープキューブ', how:'にんじん・玉ねぎ・キャベツなどを茹でた茹で汁をこして冷ます（野菜の下処理と同時に作れます）', unit:'キューブ（大さじ1）'},
    tomato:{name:'トマトキューブ', how:'湯むきして種を除いたトマト（または食塩無添加トマト缶）を加熱して裏ごし・つぶす', unit:'キューブ（大さじ1）'}
  };
  const extra=Object.keys(baseTasks).map(k=>({key:k, n:Math.min(baseTasks[k],40), ...baseInfo[k]}));
  return {tasks, fresh, extra};
}

/* =========================================================
   画面描画
   ========================================================= */
function renderHeader(){
  const st=STAGES[stageNow()];
  $('#hdAge').textContent = `${st.label}（${st.sub}）`;
  $('#hdMeals').textContent = `1日${st.meals}回食`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===S.tab));
}

function render(){
  renderHeader();
  const el=$('#app');
  if(S.tab==='settings') el.innerHTML=viewSettings();
  else if(S.tab==='stock') el.innerHTML=viewStock();
  else if(S.tab==='shop') el.innerHTML=viewShop();
  else el.innerHTML=viewPlan();
}

/* ---------- タブ1：お子さま設定 ---------- */
function viewSettings(){
  const s=S.settings, st=STAGES[s.stage], ng=ngSet();
  let h=`<h2 class="ttl">お子さま設定・NG食材</h2><p class="lead">月齢とアレルギー・未経験食材を設定すると、献立・レシピ・買い物リストに自動で反映されます。</p>`;
  h+=`<div class="card"><h3>月齢</h3>`;
  STAGES.forEach((x,i)=>{
    h+=`<button class="opt ${i===s.stage?'on':''}" data-act="stage" data-v="${i}"><span class="dot"></span><span><b>${x.label}（${x.sub}・${x.meals}回食）</b><span>形状：${x.form}</span></span></button>`;
  });
  h+=`</div>`;
  h+=`<div class="card"><h3>1回あたりの目安量<small>${st.label}・${st.sub}</small></h3>
    <table class="tbl">
      <tr><th>🍚 炭水化物</th><td>${st.carb}</td></tr>
      <tr><th>🥕 野菜・果物</th><td>${st.veg}</td></tr>
      <tr><th>🐟 タンパク質</th><td>${st.pro}<div class="xs muted">※タンパク質は1食でいずれか1種類（2種類のときは各半量程度）</div></td></tr>
      <tr><th>🥄 形状</th><td>${st.form}</td></tr>
      <tr><th>✋ 固さの目安</th><td>${st.hard}</td></tr>
      <tr><th>⏰ 食事時間</th><td>${st.slots.join('<br>')}</td></tr>
    </table>
    <div class="memo">💡 ${st.cook}</div>
    <p class="xs muted" style="margin:8px 0 0">目安量は厚生労働省「授乳・離乳の支援ガイド」を参考にした一般的な目安です。食べる量には個人差があるので、お子さまの様子に合わせて調整してください。</p>
  </div>`;
  h+=`<div class="card"><h3>アレルギー・未経験で除外する食材<small>${s.ng.length}件除外中</small></h3>
    <p class="small muted mt0">チェックした食材は献立・レシピ・買い物リストから完全に除外されます（関連する味付けも含む）。</p><div class="chips">`;
  ALLERGENS.forEach(a=>{ const on=ng.has(a.id); h+=`<button class="chip ${on?'on':''}" data-act="ng" data-v="${a.id}">${on?'🚫 ':''}${a.name}</button>`; });
  h+=`</div></div>`;
  h+=`<div class="card"><button class="switch ${s.challenge?'on':''}" data-act="challenge"><span><b>新食材チャレンジ</b><br><span class="small muted">平日（月〜金）の1食目（午前）にだけ、まだ試していない食材を「はじめて食材（1さじ）」として配置します。土日には配置しません。</span></span><span class="tr"></span></button>`;
  if(s.challenge){
    const tried=new Set(s.tried);
    h+=`<div class="hr"></div><h3>食べたことがある食材<small>タップで切り替え</small></h3><p class="small muted mt0">✅の食材だけで普段のおかずを組み、未経験の食材は平日午前に1さじずつ試します。試した翌日以降は普段のおかずにも登場します。</p>`;
    CAT_ORDER.forEach(cat=>{
      const list=ING_LIST.filter(g=>g.cat===cat && ingOK(g.id,s.stage,ng));
      if(!list.length) return;
      h+=`<div class="small" style="font-weight:700;margin:10px 0 6px;color:var(--sage)">${CAT_LABEL[cat]}</div><div class="chips">`;
      list.forEach(g=>{ const on=tried.has(g.id); h+=`<button class="chip ok ${on?'on':''}" data-act="tried" data-v="${g.id}">${on?'✅ ':'🆕 '}${g.name}</button>`; });
      h+=`</div>`;
    });
    const untried=ING_LIST.filter(g=>ingOK(g.id,s.stage,ng)&&!tried.has(g.id)).length;
    h+=`<p class="small" style="margin-top:12px">🆕 未経験の食材：<b>${untried}品目</b>（1週間で最大5品目まで配置）</p>`;
  }
  h+=`</div>`;
  h+=`<div class="card"><h3>データ</h3><p class="small muted mt0">設定・在庫・献立・履歴はこの端末のブラウザ（localStorage）に自動保存されています。</p>
    <button class="btn line sm" data-act="resetAll">すべてのデータを初期化</button></div>`;
  return h;
}

/* ---------- タブ2：在庫 ---------- */
function viewStock(){
  const stage=stageNow(), ng=ngSet();
  const f=S.invFilter;
  const nStock=ING_LIST.filter(g=>hasStock(g.id)).length;
  let h=`<h2 class="ttl">家にある食材・冷凍ストック</h2><p class="lead">すでに家にある生鮮食材と、冷凍庫の下処理済みキューブを登録すると、献立づくりで最優先に使い切ります。</p>`;
  h+=`<div class="banner ok">🧊 登録中の在庫：<b>${nStock}品目</b>　${nStock?'次回の献立作成で優先的に使います。':'＋ボタンをタップして登録できます。'}</div>`;
  h+=`<div class="seg">`;
  [['all','すべて'],['carb','炭水化物'],['veg','野菜'],['fruit','果物'],['protein','タンパク質']].forEach(([k,l])=>{
    h+=`<button class="${f===k?'on':''}" data-act="invf" data-v="${k}">${l}</button>`;
  });
  h+=`<button class="${S.invOnly?'on':''}" data-act="invonly">在庫ありのみ</button></div>`;
  CAT_ORDER.forEach(cat=>{
    if(f!=='all' && f!==cat) return;
    const list=ING_LIST.filter(g=>g.cat===cat && ingOK(g.id,stage,ng) && (!S.invOnly || hasStock(g.id)));
    if(!list.length) return;
    h+=`<div class="card"><h3>${CAT_LABEL[cat]}</h3>`;
    list.forEach(g=>{
      const fr=S.stock.fresh[g.id]||0, cu=S.stock.cubes[g.id]||0, noF=g.freeze==='none';
      h+=`<div class="inv"><div class="row between"><div><div class="nm">${g.name}</div><div class="sub">購入単位：${g.unitLabel}</div></div>${(fr||cu)?'<span class="tag">在庫あり</span>':''}</div>
        <div class="ctrls">
          <div class="ctr ${fr?'has':''}"><button data-act="inv" data-k="fresh" data-v="${g.id}" data-d="-0.5" aria-label="${g.name}の生鮮を減らす">−</button><div class="lb">生鮮<b>${fr}${g.unit}</b></div><button data-act="inv" data-k="fresh" data-v="${g.id}" data-d="0.5" aria-label="${g.name}の生鮮を増やす">＋</button></div>
          <div class="ctr ${cu?'has':''} ${noF?'dis':''}">${noF?`<div class="lb" style="width:100%;padding:10px 0">冷凍しない食材</div>`:`<button data-act="inv" data-k="cubes" data-v="${g.id}" data-d="-1" aria-label="${g.name}の冷凍を減らす">−</button><div class="lb">冷凍${cubeWord(g)}<b>${cu}個</b></div><button data-act="inv" data-k="cubes" data-v="${g.id}" data-d="1" aria-label="${g.name}の冷凍を増やす">＋</button>`}</div>
        </div></div>`;
    });
    h+=`</div>`;
  });
  if(S.invOnly && !nStock) h+=`<div class="empty"><div class="big">🧺</div>まだ在庫が登録されていません</div>`;
  h+=`<button class="btn line" data-act="clearStock">在庫をすべてクリア</button>`;
  h+=`<button class="btn" data-act="gotoGen">📅 在庫を使って献立を作る</button>`;
  return h;
}

/* ---------- タブ3：献立 ---------- */
function mealHTML(plan, d, m){
  const stage=plan.stage, meal=plan.days[d].meals[m];
  const r=RECIPES.find(x=>x.id===meal.recipe), c=CARB_DISHES.find(x=>x.id===meal.carb);
  const st=STAGES[stage];
  const items=mealItems(meal,stage);
  const cItem=items.find(x=>x.role==='carb');
  const sItems=items.filter(x=>x.role==='side');
  let h=`<div class="meal"><div class="slot">${st.slots[m]||((m+1)+'回目')}</div>`;
  if(c){
    h+=`<div class="line"><span class="k c">主食</span><div class="v"><b>${dishName(c,stage)}</b><div class="parts">${ING[c.ing].name} 約${Math.round(cItem.g)}g（${cubeText(c.ing,cItem.g)}）${c.base!=='plain'?'・'+BASES[c.base].name:''}</div></div></div>`;
  }
  if(r){
    h+=`<div class="line"><span class="k o">おかず</span><div class="v"><b>${r.name}</b> <span class="tag t">${BASES[r.base].name}</span><div class="parts">🧊 ${sItems.map(it=>`${ING[it.id].name} ${cubeText(it.id,it.g)}`).join('　＋　')}</div></div></div>`;
  }
  if(meal.newIng){
    const n=ING[meal.newIng];
    h+=`<div class="newbox">🆕 <b>はじめて食材：${n.name}（1さじ）</b><br>おかずとは別に、加熱した${n.name}を小さじ1杯だけ。${n.al.length?'アレルギーが心配な食材なので耳かき1杯程度から。':''}食後2時間ほどは様子を見て、異変があれば受診を。</div>`;
  }
  /* 作り方 */
  h+=`<details class="how"><summary>作り方・月齢メモ</summary><ol>`;
  const all=[...(cItem?[cItem]:[]),...sItems];
  h+=`<li>冷凍庫から取り出す：${all.map(it=>`<b>${ING[it.id].name}</b> ${cubeText(it.id,it.g)}（約${Math.round(it.g)}g）`).join('、')}</li>`;
  if(c) h+=`<li>主食：${BASES[c.base].how}${c.id==='c_imomochi'?'（片栗粉少量を混ぜて丸め、フライパンで両面焼く）':''}${c.id==='c_toast'?'（パンを軽くトーストし、1cm幅のスティック状に）':''}</li>`;
  if(r) h+=`<li>おかず：${BASES[r.base].how}</li>`;
  h+=`<li>中心までしっかり温まっているか確認し、温度ムラがあれば10秒ずつ追加加熱。人肌に冷ましてから。</li></ol>`;
  const bnote = r && BASES[r.base].st && BASES[r.base].st[stage] ? `<br>🧂 ${BASES[r.base].name}：${BASES[r.base].st[stage]}` : '';
  h+=`<div class="memo">👶 <b>${st.label}の形状</b>：${sItems.map(it=>`${ING[it.id].name}は${shapeOf(ING[it.id],stage)}`).join('、')}。<br>${st.cook}${bnote}${r?`<br>💡 ${r.tip}`:''}</div>`;
  h+=`</details>`;
  h+=`<div class="acts"><button class="btn ghost sage sm" data-act="swap" data-d="${d}" data-m="${m}">🔄 別メニューに変更</button></div></div>`;
  return h;
}

function viewPlan(){
  const plan=S.plan;
  let h=`<h2 class="ttl">1週間の献立表</h2><p class="lead">週末に作った冷凍パーツを2〜3種組み合わせ、味付けを変えるだけで毎日ちがう料理に。</p>`;
  h+=`<button class="btn" data-act="genThis">✨ 今週の1週間献立を自動作成</button>`;
  h+=`<div class="btns2"><button class="btn ghost sm" data-act="genNext">➡️ 先週と違う献立で<br>来週分を作成</button><button class="btn sage sm" data-act="savePlan" ${plan?'':'disabled style="opacity:.5"'}>✅ この献立を確定<br>・履歴に保存</button></div>`;
  if(!plan){
    h+=`<div class="empty"><div class="big">🍽️</div>まだ献立がありません。<br>上のボタンから1週間分を自動作成しましょう。</div>`;
  }else{
    const st=STAGES[plan.stage];
    const end=addDays(plan.weekStart,6);
    h+=`<div class="banner ${plan.saved?'ok':''}">${plan.saved?'✅ 確定済み（履歴に保存されています）':'📝 未確定の献立です。気に入ったら「確定・履歴に保存」を押すと、次回のローテーションに使われます。'}<br><b>${md(plan.weekStart)}（月）〜 ${md(end)}（日）</b>・${st.label} ${st.meals}回食</div>`;
    const core=plan.ctx.core.items.filter(id=>ING[id]);
    h+=`<div class="card"><h3>今週の冷凍パーツ<small>このパーツを使い回します</small></h3><div class="chips">${core.map(id=>`<span class="tag ${ING[id].cat==='protein'?'t':(ING[id].cat==='fruit'?'y':'')}" style="font-size:13px;padding:4px 10px">${ING[id].name}</span>`).join('')}${plan.ctx.core.carbs.map(id=>`<span class="tag y" style="font-size:13px;padding:4px 10px">${ING[id].name}</span>`).join('')}</div></div>`;
    plan.days.forEach((day,d)=>{
      const we=d>=5;
      h+=`<div class="day"><div class="dayhd"><span class="d">${md(day.date)}（${WEEKDAYS[d]}）</span><span class="w ${we?'we':''}">${we?'週末・新食材なし':'平日'}</span></div>`;
      day.meals.forEach((_,m)=>h+=mealHTML(plan,d,m));
      h+=`</div>`;
    });
    h+=`<button class="btn sage" data-act="savePlan">✅ この献立を確定・履歴に保存</button>`;
    h+=`<button class="btn ghost" data-act="gotoShop">🛒 買い物リスト・下処理ガイドを見る</button>`;
  }
  /* 履歴 */
  h+=`<div class="card"><h3>献立の履歴<small>${S.history.length}週分</small></h3>`;
  if(!S.history.length) h+=`<p class="small muted mt0">確定した献立がここに保存され、翌週の献立づくりで組み合わせが被らないように使われます。</p>`;
  S.history.forEach((hs,i)=>{
    const names=[]; hs.days.forEach(d=>d.meals.forEach(m=>{ const r=RECIPES.find(x=>x.id===m.recipe); if(r && !names.includes(r.name)) names.push(r.name); }));
    h+=`<details class="hist"><summary>📖 ${md(hs.weekStart)}〜${md(addDays(hs.weekStart,6))} の週 <span class="tag g">${STAGES[hs.stage].label}</span>${i===0?'<span class="tag">直近</span>':''}</summary>
      <ul>${names.map(n=>`<li>${n}</li>`).join('')}</ul>
      <div class="btns2"><button class="btn line sm" data-act="loadHist" data-v="${hs.id}">この週を表示</button><button class="btn line sm" data-act="delHist" data-v="${hs.id}">削除</button></div></details>`;
  });
  h+=`</div>`;
  return h;
}

/* ---------- タブ4：買い物・下処理 ---------- */
function checkKey(k){ return S.plan ? S.plan.id+':'+k : k; }
function isChecked(k){ return !!S.checks[checkKey(k)]; }
function viewShop(){
  const plan=S.plan;
  let h=`<h2 class="ttl">週末のまとめ下処理＆買い物リスト</h2><p class="lead">1週間の献立から、買う量と週末に作る冷凍パーツを逆算しました。</p>`;
  if(!plan){ return h+`<div class="empty"><div class="big">🛒</div>まず「1週間献立」タブで献立を作成してください。</div><button class="btn" data-act="gotoPlan">📅 献立を作る</button>`; }
  const stage=plan.stage;
  const sl=shoppingList(plan), pl=prepList(plan);
  /* 買い物 */
  const shopKeys=[...sl.buy.map(x=>'s_'+x.id), ...sl.extras.map(x=>'s_'+x.id)];
  const shopDone=shopKeys.filter(isChecked).length;
  h+=`<div class="card"><h3>🛒 スーパーで買うものリスト<small>${shopDone}/${shopKeys.length}</small></h3>
    <div class="progress"><i style="width:${shopKeys.length?shopDone/shopKeys.length*100:0}%"></i></div>
    <p class="xs muted">${md(plan.weekStart)}〜${md(addDays(plan.weekStart,6))}・${STAGES[stage].label}の目安量で計算</p>`;
  if(!sl.buy.length) h+=`<p class="small">🎉 家にある食材・ストックで足りています！</p>`;
  sl.buy.forEach(x=>{
    const k='s_'+x.id, on=isChecked(k), ing=x.ing;
    const totalTxt = ing.freeze==='none' ? `約${Math.round(x.total)}g` : `約${Math.round(x.total)}g（${Math.ceil(x.total/ing.cubeG-0.05)}${cubeWord(ing)}分）`;
    h+=`<button class="chk ${on?'on':''}" data-act="chk" data-v="${k}"><span class="bx">${on?'✓':''}</span><span class="ct">
      <div class="nm">${ing.name} <span class="tag g">${CAT_LABEL[ing.cat]}</span>${x.newOnly?'<span class="tag">はじめて用</span>':''}${ing.pantry?'<span class="tag y">家にあれば不要</span>':''}</div>
      <div class="dt">赤ちゃんが1週間で使う量：<b>${totalTxt}</b>・${x.uses}回分</div>
      <div class="dt">購入目安：<b>${ing.unitLabel}</b> → ${x.newOnly?'1さじ分だけ使用（少量でOK）':`うち<b>約${x.netFrac}${ing.unit}</b>を使用`}${x.avail>0?`（在庫${Math.round(x.avail)}g分を差し引き済み）`:''}</div>
      <div class="dt">🛍 買う数：<b>${x.buyN}${ing.unit}</b>　<span class="xs">残りは${ing.adult.replace('残りは','')}</span></div>
    </span></button>`;
  });
  if(sl.extras.length){
    h+=`<div class="hr"></div><div class="small" style="font-weight:700;color:var(--sage)">調味料・その他（家になければ）</div>`;
    sl.extras.forEach(x=>{
      const k='s_'+x.id, on=isChecked(k);
      h+=`<button class="chk ${on?'on':''}" data-act="chk" data-v="${k}"><span class="bx">${on?'✓':''}</span><span class="ct"><div class="nm">${x.need}</div><div class="dt">「${x.name}」の味付けで${x.n}回使用</div></span></button>`;
    });
  }
  h+=`</div>`;
  if(sl.have.length){
    h+=`<div class="card"><h3>🏠 在庫ありで買わなくてOK</h3>`;
    sl.have.forEach(x=>{
      h+=`<div class="inv"><div class="nm">${x.ing.name} <span class="tag">在庫あり</span></div><div class="sub">1週間で約${Math.round(x.total)}g使用 ／ 在庫 約${Math.round(x.avail)}g分（生鮮${S.stock.fresh[x.id]||0}${x.ing.unit}・冷凍${S.stock.cubes[x.id]||0}個）</div></div>`;
    });
    h+=`</div>`;
  }
  /* 下処理 */
  const pTasks=pl.tasks.filter(t=>!t.done);
  const prepKeys=[...pTasks.map(t=>'p_'+t.id), ...pl.extra.map(e=>'p_base_'+e.key)];
  const prepDone=prepKeys.filter(isChecked).length;
  h+=`<div class="card"><h3>🧊 週末のまとめ下処理ガイド<small>${prepDone}/${prepKeys.length}</small></h3>
    <div class="progress"><i style="width:${prepKeys.length?prepDone/prepKeys.length*100:0}%"></i></div>
    <p class="xs muted">形状は「${STAGES[stage].label}（${STAGES[stage].sub}）」向け：${STAGES[stage].form}</p>`;
  pTasks.forEach(t=>{
    const k='p_'+t.id, on=isChecked(k), ing=t.ing;
    h+=`<button class="chk ${on?'on':''}" data-act="chk" data-v="${k}"><span class="bx">${on?'✓':''}</span><span class="ct">
      <div class="nm">${ing.name} 約${t.frac}${ing.unit}（約${t.rawG}g）→ ${t.cubes}${cubeWord(ing)}分</div>
      <div class="step"><span class="n">1</span><span class="dt">${ing.prep}</span></div>
      <div class="step"><span class="n">2</span><span class="dt">形状：<b>${shapeOf(ing,stage)}</b></span></div>
      <div class="step"><span class="n">3</span><span class="dt">${FREEZE[ing.freeze](ing.cubeG)} → <b>${t.cubes}${cubeWord(ing)}</b></span></div>
      ${t.haveCubes?`<div class="dt">（冷凍ストック${t.haveCubes}個を差し引き済み）</div>`:''}
    </span></button>`;
  });
  pl.extra.forEach(e=>{
    const k='p_base_'+e.key, on=isChecked(k);
    h+=`<button class="chk ${on?'on':''}" data-act="chk" data-v="${k}"><span class="bx">${on?'✓':''}</span><span class="ct">
      <div class="nm">${e.name} → ${e.n}キューブ分</div>
      <div class="step"><span class="n">1</span><span class="dt">${e.how}</span></div>
      <div class="step"><span class="n">2</span><span class="dt">製氷皿に${e.unit}ずつ入れて冷凍</span></div>
    </span></button>`;
  });
  const doneTasks=pl.tasks.filter(t=>t.done);
  if(doneTasks.length){
    h+=`<div class="hr"></div><div class="small muted">✅ 冷凍ストックで足りている：${doneTasks.map(t=>t.ing.name).join('、')}</div>`;
  }
  h+=`</div>`;
  if(pl.fresh.length){
    h+=`<div class="card"><h3>🥛 冷凍しないで都度準備するもの</h3>`;
    pl.fresh.forEach(f=>{
      h+=`<div class="inv"><div class="nm">${f.ing.name}${f.isNew?' <span class="tag">はじめて食材</span>':''}</div><div class="sub">${f.isNew?'はじめて食材として1さじ分。当日の朝に少量を加熱して準備。':`1週間で約${Math.round(f.total)}g・${f.uses}回分。${f.ing.prep}`}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="card"><h3>📌 冷凍ストックのコツ</h3><ul class="small" style="margin:0;padding-left:20px">
    <li>冷凍パーツは<b>1週間以内</b>に使い切りましょう。袋に食材名と日付を書いておくと安心。</li>
    <li>下処理は「野菜（色の薄いもの→濃いもの）→魚→肉」の順に同じ鍋で茹でると洗い物が減ります。</li>
    <li>粗熱をとってから素早く冷凍し、凍ったらフリーザーバッグに移して空気を抜きます。</li>
    <li>解凍は自然解凍せず、レンジや鍋で<b>中心まで再加熱</b>してください。</li>
    <li>一度解凍したものの再冷凍はしないでください。</li>
  </ul></div>`;
  h+=`<button class="btn line" data-act="resetChecks">チェックをすべて外す</button>`;
  return h;
}

/* =========================================================
   イベント
   ========================================================= */
document.querySelector('nav.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  S.tab=b.dataset.tab; save(); render(); window.scrollTo(0,0);
});
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, v=b.dataset.v;
  const s=S.settings;
  switch(act){
    case 'stage': s.stage=Number(v); revalidatePlan(); break;
    case 'ng': { const i=s.ng.indexOf(v); if(i>=0) s.ng.splice(i,1); else s.ng.push(v); revalidatePlan(); break; }
    case 'challenge': s.challenge=!s.challenge; revalidatePlan(); if(s.challenge) toast('新食材チャレンジON：献立を作り直すと反映されます'); break;
    case 'tried': { const i=s.tried.indexOf(v); if(i>=0) s.tried.splice(i,1); else s.tried.push(v); revalidatePlan(); break; }
    case 'resetAll': if(confirm('設定・在庫・献立・履歴をすべて初期化します。よろしいですか？')){ S=defaultState(); toast('初期化しました'); } break;
    case 'invf': S.invFilter=v; break;
    case 'invonly': S.invOnly=!S.invOnly; break;
    case 'inv': { const k=b.dataset.k, d=Number(b.dataset.d); const cur=S.stock[k][v]||0; const n=Math.max(0, Math.round((cur+d)*10)/10); if(n) S.stock[k][v]=n; else delete S.stock[k][v]; break; }
    case 'clearStock': if(confirm('登録した在庫をすべてクリアしますか？')){ S.stock={fresh:{},cubes:{}}; toast('在庫をクリアしました'); } break;
    case 'gotoGen': S.tab='plan'; save(); render(); window.scrollTo(0,0); return;
    case 'gotoShop': S.tab='shop'; save(); render(); window.scrollTo(0,0); return;
    case 'gotoPlan': S.tab='plan'; save(); render(); window.scrollTo(0,0); return;
    case 'genThis':
      if(S.plan && !S.plan.saved && !confirm('未確定の献立があります。新しい献立に置き換えますか？')) return;
      S.plan=generateWeek('this'); toast('今週の献立を作成しました'); break;
    case 'genNext':
      if(S.plan && !S.plan.saved && !confirm('未確定の献立があります。来週分の献立に置き換えますか？\n（現在の献立とも被らないように作ります）')) return;
      S.plan=generateWeek('next'); toast('先週と被らない来週分の献立を作成しました'); break;
    case 'savePlan': {
      if(!S.plan) return;
      const p=JSON.parse(JSON.stringify(S.plan)); p.saved=true;
      S.history=S.history.filter(h=>h.id!==p.id && h.weekStart!==p.weekStart);
      S.history.unshift({id:p.id, weekStart:p.weekStart, stage:p.stage, savedAt:Date.now(), days:p.days});
      S.history.sort((a,b)=>b.weekStart.localeCompare(a.weekStart));
      S.history=S.history.slice(0,12);
      S.plan.saved=true; toast('献立を確定し、履歴に保存しました'); break;
    }
    case 'loadHist': {
      const hs=S.history.find(x=>x.id===v); if(!hs) return;
      if(S.plan && !S.plan.saved && !confirm('未確定の献立を、履歴の献立に置き換えますか？')) return;
      const idx=S.history.indexOf(hs);
      const prev=prevInfo([S.history[idx+1]]);
      const items=new Set(), carbs=new Set();
      hs.days.forEach(d=>d.meals.forEach(m=>{ const r=RECIPES.find(x=>x.id===m.recipe); if(r) r.parts.forEach(p=>items.add(p)); const c=CARB_DISHES.find(x=>x.id===m.carb); if(c) carbs.add(c.ing); }));
      S.plan={id:hs.id, weekStart:hs.weekStart, stage:hs.stage, created:hs.savedAt, saved:true,
        ctx:{core:{items:[...items],carbs:[...carbs]}, intro:{}, strong:false, prev:toPrevJSON(prev), challenge:false},
        days:JSON.parse(JSON.stringify(hs.days))};
      revalidatePlan();
      toast('履歴の献立を表示しました'); window.scrollTo(0,0); break;
    }
    case 'delHist': if(confirm('この週の履歴を削除しますか？')){ S.history=S.history.filter(x=>x.id!==v); if(S.plan&&S.plan.id===v) S.plan.saved=false; toast('削除しました'); } break;
    case 'swap': swapMeal(Number(b.dataset.d), Number(b.dataset.m)); return;
    case 'chk': { const k=checkKey(v); if(S.checks[k]) delete S.checks[k]; else S.checks[k]=true; break; }
    case 'resetChecks': if(S.plan){ Object.keys(S.checks).forEach(k=>{ if(k.startsWith(S.plan.id+':')) delete S.checks[k]; }); } break;
    default: return;
  }
  /* 古いチェック状態の掃除 */
  if(S.plan){ const keep=S.plan.id+':'; Object.keys(S.checks).forEach(k=>{ if(!k.startsWith(keep)) delete S.checks[k]; }); }
  save(); render();
});

render();
</script>
